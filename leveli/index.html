function refreshChoiceButtons(){renderChoiceButtons(periodSelect,'school-period-buttons');renderChoiceButtons(subjectFilter,'school-filter-buttons')}
periodSelect.addEventListener('change',renderGrades);subjectFilter.addEventListener('change',renderGrades);
async function loadProfile(user){firestoreProfileName='';if(!user){updateIdentity(null);return}try{const snap=await getDocFromServer(doc(db,'profiles',user.uid));if(snap.exists()){const profile=snap.data();const value=[profile.name,profile.firstName,profile.displayName,profile.childName].find(v=>typeof v==='string'&&v.trim());if(auth.currentUser?.uid===user.uid)firestoreProfileName=value?.trim()||''}}catch(e){console.warn('Профиль Firestore недоступен:',e.code||e.message)}if(auth.currentUser?.uid===user.uid)updateIdentity(user,cachedGrades)}
function gradeCacheDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('leveli-school-cache',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('grades'))req.result.createObjectStore('grades')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function readGradeCache(uid){const db=await gradeCacheDB();try{return await new Promise((resolve,reject)=>{const tx=db.transaction('grades','readonly'),req=tx.objectStore('grades').get(uid);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}finally{db.close()}}
async function writeGradeCache(uid,value){const db=await gradeCacheDB();try{await new Promise((resolve,reject)=>{const tx=db.transaction('grades','readwrite');tx.objectStore('grades').put(value,uid);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}finally{db.close()}}
function applySchoolData(data){if(data.schemaVersion!==1||data.source!=='petersburgedu'||!Array.isArray(data.grades))throw Error('Неизвестный формат школьных данных.');cachedGrades=S.normalize(data.grades);updateIdentity(auth.currentUser,cachedGrades);const periods=[...new Set(cachedGrades.map(periodOf).filter(Boolean))].sort().reverse();const selected=periodSelect.value;const explicit=cachedGrades.filter(g=>{const q=Number(g.quarter??g.term??g.periodNumber);return q>=1&&q<=4&&gradeDate(g)}).sort((a,b)=>gradeDate(b)-gradeDate(a));const now=new Date();const schoolYear=now.getMonth()>=8?now.getFullYear():now.getFullYear()-1;const year=periods.length?Number(periods[0].slice(0,4)):schoolYear;const latestExplicit=explicit.find(g=>periodOf(g)?.startsWith(year+'-'));const fallback=periods.find(p=>p.startsWith(year+'-'));const defaultPeriod=latestExplicit?periodOf(latestExplicit):(fallback||year+'-1');periodSelect.replaceChildren(...[1,2,3,4].map(q=>new Option(q+' четверть',year+'-'+q)));periodSelect.value=[...periodSelect.options].some(o=>o.value===selected)?selected:defaultPeriod;renderGrades()}
async function load(){const user=auth.currentUser;if(!user)return;const uid=user.uid,generation=++loadGeneration;const active=()=>auth.currentUser?.uid===uid&&generation===loadGeneration;error.textContent='';let cached=null;try{cached=await readGradeCache(uid);if(!active())return;if(cached?.data){applySchoolData(cached.data);status.textContent+=' · сохранено '+new Date(cached.savedAt).toLocaleString('ru-RU')+' · проверяем обновления…'}else{status.textContent='Загрузка оценок…';subjects.replaceChildren()}}catch(e){cached=null;console.warn('Локальный кэш недоступен',e)}try{const snap=await getDocFromServer(doc(db,'schoolGrades',uid));if(!active())return;if(!snap.exists()){if(!cached){clearSchool();status.textContent='Оценки пока не загружены.'}return}const data=snap.data();if(data.schemaVersion!==1||data.source!=='petersburgedu'||!Array.isArray(data.grades))throw Error('Неизвестный формат школьных данных.');if(!cached||JSON.stringify(cached.data)!==JSON.stringify(data))applySchoolData(data);try{await writeGradeCache(uid,{data,savedAt:Date.now()})}catch(e){console.warn('Не удалось сохранить оценки локально',e)}if(active())status.textContent='Предметов: '+subjects.children.length+' · данные обновлены'}catch(e){if(!active())return;if(cached){error.textContent='Нет связи с сервером. Показаны сохранённые оценки от '+new Date(cached.savedAt).toLocaleString('ru-RU')+'.'}else{status.textContent='Не удалось загрузить оценки.';showError(e)}}}
document.getElementById('school-form').addEventListener('submit',async e=>{e.preventDefault();error.textContent='';try{await setPersistence(auth,browserLocalPersistence);await signInWithEmailAndPassword(auth,document.getElementById('school-email').value.trim(),document.getElementById('school-password').value);document.getElementById('school-password').value=''}catch(err){showError(err)}});
document.getElementById('school-refresh').addEventListener('click',load);window.addEventListener('online',load);
document.getElementById('school-logout').addEventListener('click',()=>signOut(auth).catch(showError));
onAuthStateChanged(auth,user=>{++loadGeneration;firestoreProfileName='';clearSchool();login.hidden=!!user;results.hidden=!user;error.textContent='';updateIdentity(user);if(user){loadProfile(user);load()}else {clearSchool()}},showError);
</script></body></html>
