<style>
:root{--bg:#f6efff;--tx:#33284a;--mu:#6f6489;--co:#ff8a65;--pu:#a56bff;--ln:#ece4f7;--card:#fff;--sh:0 8px 24px rgba(110,80,160,.12);--ac:#9454e8;--ok:#208568;--bad:#c53d64;--warn:#956000}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg);-webkit-text-size-adjust:100%}
button,input,textarea{font-family:inherit;touch-action:manipulation}
body{margin:0;min-height:100vh;color:var(--tx);font:18px/1.35 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;background:linear-gradient(180deg,#fff1e8 0,var(--bg) 360px,var(--bg) 100%);padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}

h1{font-size:28px;font-weight:800;margin:0;letter-spacing:-.01em}h2{font-size:21px;font-weight:800;margin:22px 0 8px}
.mu{color:var(--mu)}.sm{font-size:15px}.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 16px}.av{width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:32px;box-shadow:var(--sh);border:0;padding:0}
.card{background:var(--card);border-radius:28px;padding:16px 18px;margin:14px 0;box-shadow:var(--sh)}

.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#ff9a76,#b57bff);color:#fff;border-radius:32px;padding:18px;box-shadow:0 12px 28px rgba(165,107,255,.35)}

.task{display:flex;align-items:center;gap:14px;width:100%;min-height:80px;background:var(--card);border:0;border-radius:26px;padding:12px 16px 12px 12px;margin:10px 0;text-align:left;color:var(--tx);font-size:18px;box-shadow:var(--sh);cursor:pointer}
.task:active{transform:scale(.98)}.task .ic{width:56px;height:56px;flex:none;border-radius:18px;background:var(--b);display:grid;place-items:center;font-size:30px}

.task.on{background:var(--b);color:#33284a}.task.on small{color:#625477}.task.on .ic{background:var(--card)}.task.on .ck{background:var(--c);border-color:var(--c)}

details.school-how{margin-top:8px}details.school-how summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--mu);padding:6px 0}
/* ===== HISTORY ===== */
.months{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.months button{background:var(--ln);border:0;border-radius:16px;padding:10px 16px;font-weight:800;color:var(--tx);cursor:pointer;font-size:18px}
.months b{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.cal .wd{text-align:center;font-size:12px;color:var(--mu);font-weight:700;padding:4px 0}
.cal button{aspect-ratio:1;border:0;border-radius:12px;background:var(--ln);color:var(--tx);font-weight:700;font-size:15px;cursor:pointer;position:relative;padding:0}
.cal button.empty{background:transparent;cursor:default}
.cal button.has{background:#ffd9c9;color:#33284a}
.cal button.today{outline:3px solid var(--co)}
.cal button.future{opacity:.35}
.cal button .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--co)}
.cal button .dot.g{background:var(--pu);left:calc(50% + 5px)}
.cal button .dot.h{left:calc(50% - 5px)}
.hist-day .row{align-items:flex-start}.hist-day .tag{display:inline-block;border-radius:10px;padding:2px 8px;font-size:13px;font-weight:800;margin-left:6px}

/* Устойчивая панель: заголовок и действия вне прокрутки. */
body.sheet-open{position:fixed;left:0;right:0;top:var(--sheet-scroll-top,0px);width:100%;overflow:hidden}

.ov{position:fixed;left:0;right:0;top:var(--sheet-top,0px);height:var(--sheet-vh,100dvh);background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:10;overscroll-behavior:none}
.sh{display:flex;flex-direction:column;width:100%;max-width:560px;height:min(720px,calc(var(--sheet-vh,100dvh) * .86));max-height:calc(var(--sheet-vh,100dvh) - env(safe-area-inset-top,0px) - 8px);margin:0;overflow:hidden;background:var(--card);border:1px solid var(--ln);border-bottom:0;border-radius:24px 24px 0 0;padding:0;box-shadow:0 -12px 48px #0003;transform:none}
.sh .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;padding:16px 20px;border-bottom:1px solid var(--ln)}

.sheet-close{flex:none;width:44px;height:44px;border:1px solid var(--ln);border-radius:14px;background:var(--bg);color:var(--tx);font-family:inherit;font-size:24px;line-height:1;cursor:pointer}
.sh .sheet-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable;padding:20px;scroll-padding:16px}
.sh .sheet-body>:first-child{margin-top:0!important}
.sh .sheet-body>:last-child{margin-bottom:0!important}
.sh .sheet-footer{flex:none;display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);background:var(--card)}
.sh .sheet-footer .btn{flex:1 1 140px;width:auto!important;min-height:48px;font-size:16px;padding:12px 16px;margin:0!important}

.sh .sheet-field input{margin-top:0!important}
.sh input[type="date"]{appearance:none;-webkit-appearance:none;min-height:48px}
.sh .sheet-section{margin:0 0 24px;padding:0 0 24px;border-bottom:1px solid var(--ln)}

.sh .subject-row span{min-width:0;overflow-wrap:anywhere;font-size:16px}
.sh .subject-row small{display:block;font-size:12px;color:var(--mu);margin-top:3px}
.sh .subject-row button{flex:none;min-height:44px;padding:8px 12px;font-family:inherit;font-size:14px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);cursor:pointer}
.sh details.sheet-section summary{font-size:16px;font-weight:700;cursor:pointer;padding:4px 0 12px}
.sh .sheet-period{font-size:14px;color:var(--mu);margin:0 0 20px}
@media(min-width:700px){.ov{align-items:center;padding:16px}.sh{border-bottom:1px solid var(--ln);border-radius:24px}}

<script>
/* ===== CONFIG ===== */
const CONFIG={
  subjects:['Математика','Русский','Чтение','Окружающий мир','Английский','ОРКСЭ'],
  chores:['Убрала в комнате','Помыла посуду','Накрыла на стол','Помогала готовить','Вынесла мусор','Полила цветы','Пол или пылесос'],
  emojis:['🦊','🐱','🐶','🐼','🦄','🐰','🐻','🐯','🐸','🐨','🦉','🐬','🦋','🐙','🐧','🦁','🌸','🚀','🎨','⭐'],
  colors:['#ffd9c9','#ffe9a8','#d3f2e4','#d6ecff','#e6dcff','#ffd6ea'],
  levels:[[0,'Звёздочка'],[40,'Умница'],[120,'Мастер дня'],[250,'Чемпион']],
  gradeThresholds:[2.6,3.6,4.6],
  gradeGoal:4+1/3,
  maxPlan:9999,
};
const KEY='kid1',BAK=KEY+'_bak',DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],GD=[1,2,3,4,5,6,0];
const SCHEMA=4;


/* Четверти: выбранный период остаётся в прежних полях для совместимости копий. */
function termCopy(v){return JSON.parse(JSON.stringify(v))}
function termLabel(t){return t.year+'/'+String(t.year+1).slice(-2)+' · '+['I','II','III','IV'][t.quarter-1]+' четверть'}
function termFields(q,a){return {g:termCopy(q.g),hl:termCopy(q.hl||[]),meanHistory:termCopy(q.meanHistory||[]),end:q.end||'',n:q.n||0,[a]:termCopy(q[a]||[])}}
function syncTerm(q,a){const t=q.terms.find(t=>t.id===q.selectedTerm);if(t)Object.assign(t,termFields(q,a))}
function initTerms(q,a){
  const now=new Date(),year=now.getFullYear()-(now.getMonth()<8?1:0);
  if(!Array.isArray(q.terms)||!q.terms.length){
    const t={id:year+'-1',year,quarter:1,...termFields(q,a)};
    q.terms=[t];q.selectedTerm=t.id;q.currentTerm=t.id;
  }
  for(const t of q.terms){
    if(!t||!Number.isInteger(t.year)||!Number.isInteger(t.quarter)||t.quarter<1||t.quarter>4||!t.g||typeof t.g!=='object'||Array.isArray(t.g))throw Error('bad term');
    for(const k of Object.keys(t.g)){
      if(!Array.isArray(t.g[k]))throw Error('bad term grades');
      t.g[k]=t.g[k].filter(x=>x&&[2,3,4,5].includes(Number(x.v))).map(x=>({...x,i:Number(x.i)||0,v:Number(x.v)}));
    }
    t[a]=Array.isArray(t[a])?t[a].filter(k=>Object.hasOwn(t.g,k)):[];
    t.hl=Array.isArray(t.hl)?t.hl:[];

const schoolStore=(()=>{
  const SUBJ=CONFIG.subjects;
  function defaults(){return{
    g:Object.fromEntries(SUBJ.map(k=>[k,[]])),hl:[],n:0,end:'',archived:[],
  }}
  function validate(q){
    if(!q||typeof q!=='object')throw Error('school bad');
    if(!q.g||typeof q.g!=='object'||Array.isArray(q.g))q.g={};
    for(const k of Object.keys(q.g))if(!Array.isArray(q.g[k]))q.g[k]=[];
    for(const k of SUBJ)if(!q.g[k])q.g[k]=[];
    for(const k of Object.keys(q.g)){

    }
    if(!Array.isArray(q.hl))q.hl=[];
    if(!Array.isArray(q.archived))q.archived=[];
    q.n=Math.max(q.n||0,...Object.values(q.g).flat().map(x=>x.i||0));
    return initTerms(q,'archived');
  }
  function migrate(q){

let sheetOpener=null,sheetPageY=0;

function sheet(h,key=''){
  const s=document.getElementById('s'),old=s.querySelector('.sh');
  if(!h){
    if(!old)return;
    s.replaceChildren();
    document.querySelectorAll('main,.bar').forEach(el=>el.inert=false);
    document.body.classList.remove('sheet-open');document.body.style.removeProperty('--sheet-scroll-top');
    window.scrollTo(0,sheetPageY);
    if(sheetOpener&&sheetOpener.isConnected)sheetOpener.focus({preventScroll:true});
    sheetOpener=null;return;
  }
  const template=document.createElement('template');template.innerHTML=h;
  const heading=template.content.querySelector('h2'),title=heading?heading.textContent:'Настройки';
  const identity=key||title,same=old&&old.dataset.sheetKey===identity;
  const scroll=same?old.querySelector('.sheet-body').scrollTop:0;
  const active=same&&old.contains(document.activeElement)?document.activeElement:null;
  const focusId=active&&active.id,selection=active&&typeof active.selectionStart==='number'?[active.selectionStart,active.selectionEnd]:null;
  if(heading)heading.remove();
  const actions=template.content.querySelector('[data-sheet-footer]');
  const dialog=document.createElement('div');dialog.className='ov';dialog.dataset.close='1';
  dialog.innerHTML='<section class="sh" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><header class="sheet-head"><h2 id="sheetTitle" tabindex="-1"></h2><button type="button" class="sheet-close" data-action="closeSheet" aria-label="Закрыть окно">×</button></header><div class="sheet-body"></div><footer class="sheet-footer"></footer></section>';
  const panel=dialog.querySelector('.sh'),body=dialog.querySelector('.sheet-body'),footer=dialog.querySelector('.sheet-footer');
  panel.dataset.sheetKey=identity;dialog.querySelector('h2').textContent=title;
  if(actions){
    if(actions.matches('button'))footer.append(actions);
    else{footer.append(...actions.childNodes);actions.remove()}
  }else footer.innerHTML='<button type="button" class="btn g" data-action="closeSheet">Закрыть</button>';
  body.append(template.content);
  if(!old){
    sheetOpener=document.activeElement;sheetPageY=window.scrollY;
    document.body.style.setProperty('--sheet-scroll-top',(-sheetPageY)+'px');document.body.classList.add('sheet-open');
    document.querySelectorAll('main,.bar').forEach(el=>el.inert=true);
  }
  s.replaceChildren(dialog);sheetViewport();body.scrollTop=scroll;
  const nextFocus=focusId&&document.getElementById(focusId);
  if(nextFocus){nextFocus.focus({preventScroll:true});if(selection)nextFocus.setSelectionRange(...selection)}
  else if(!same)dialog.querySelector('h2').focus({preventScroll:true});
}

function setDone(i,on,silent){
  const d=iso(new Date()),a=S.d[d]||(S.d[d]=[]),L=tasks(d),wasAll=dn(d).length==L.length,x=a.indexOf(i);
  if(on&&x<0)a.push(i);
  if(!on&&x>=0){a.splice(x,1);if(S.x[d])delete S.x[d][i]}
  const all=dn(d).length==L.length;
  save();render();
  if(silent)return;
  if(on&&x<0)toast(all&&!wasAll?'🎉 Все дела готовы! +2 бонусные звезды':'⭐ +1 звезда');
  else if(!on&&x>=0)toast('Отметка снята',{action:'Вернуть',onAction:()=>setDone(i,true,true)});
}
function openDetails(i){

/* ===== DAY HISTORY ===== */
function dayGrades(d){
  const out=[];
  for(const t of S.school.terms){
    const q=t.id===S.school.selectedTerm?S.school:t;
    for(const k of Object.keys(q.g))for(const x of q.g[k])if(x.d===d)out.push({k,v:x.v,i:x.i});
  }
  return out;
}

function openDay(d){

  const items=L.map(t=>{const ok=done.includes(t.i),x=(S.x[d]||{})[t.i];const sub=ok&&x?esc([].concat(x.s||[],x.n?[x.n]:[]).join(', ')):'';return`<div class="row"><span>${t.e} ${esc(t.t)}${sub?`<div class="mu sm">${sub}</div>`:''}</span><span>${ok?'⭐':''}</span></div>`}).join('');

/* ===== HISTORY CALENDAR ===== */
function monthKey(y,m){return y+'-'+String(m+1).padStart(2,'0')}
function openHistory(){
  const now=new Date();
  if(!calMonth)calMonth={y:now.getFullYear(),m:now.getMonth()};
  renderHistory();
}
function renderHistory(){
  const {y,m}=calMonth;
  const first=new Date(y,m,1),startWd=(first.getDay()+6)%7,daysIn=new Date(y,m+1,0).getDate();
  const td=iso(new Date());
  const cells=[];
  for(let i=0;i<startWd;i++)cells.push('<button class="empty" disabled></button>');
  for(let d=1;d<=daysIn;d++){
    const ds=iso(new Date(y,m,d));
    const hasHab=(S.d[ds]||[]).length>0||Object.keys(S.x[ds]||{}).length>0;
    const hasGrade=dayGrades(ds).length>0;
    const fut=ds>td;
    const dots=(hasHab?'<span class="dot h"></span>':'')+(hasGrade?'<span class="dot g"></span>':'');
    cells.push(`<button class="${hasHab||hasGrade?'has':''} ${ds===td?'today':''} ${fut?'future':''}" data-action="histDay" data-id="${ds}">${d}${dots}</button>`);
  }

  sheet(`<h2 style="margin-top:0">История</h2>
    <div class="months"><button data-action="histPrev" aria-label="Предыдущий месяц">‹</button><b>${monthName}</b><button data-action="histNext" aria-label="Следующий месяц">›</button></div>
    <div class="cal">${DN.map(d=>`<div class="wd">${d}</div>`).join('')}${cells.join('')}</div>

    <p data-sheet-footer style="margin:18px 0 0"><button class="btn g" data-action="closeSheet">Закрыть</button></p>`);
}
function histPrev(){calMonth.m--;if(calMonth.m<0){calMonth.m=11;calMonth.y--}renderHistory()}
function histNext(){calMonth.m++;if(calMonth.m>11){calMonth.m=0;calMonth.y++}renderHistory()}

/* ===== SCHOOL (изолированный модуль) ===== */
const school=(()=>{
  const TH=CONFIG.gradeThresholds;
  const f2=x=>x.toFixed(2);
  const names=()=>Object.keys(S.school.g).filter(k=>!S.school.archived.includes(k));
  const ACT=()=>names().filter(k=>S.school.g[k].length);
  const vals=k=>S.school.g[k].map(x=>x.v),avg=k=>sum(vals(k))/vals(k).length;
  const fin=a=>a<TH[0]?2:a<TH[1]?3:a<TH[2]?4:5;
    const exAvg=()=>{const a=ACT().flatMap(k=>vals(k));return sum(a)/(a.length||1)};
  function plan(a){
    const n=a.length,s=sum(a),target=TH[1];
    const k=Math.max(0,Math.ceil((target*n-s)/(5-target)-1e-9));
    const x=(s+5*k)/(n+k);
    return{k,x,t:k>=CONFIG.maxPlan?'получить очень много «5» подряд':`получить ${k}× «5» подряд`};
  }
  function calc(){
    const bad=[],good=[];
    ACT().forEach(k=>{const a=vals(k),av=avg(k);
      if(av<TH[1])bad.push({k,av,p:plan(a),f:fin(av)});
      else{const x=(sum(a)+3)/(a.length+1);good.push({k,av,x:x<TH[1]?x:null})}});
    bad.sort((a,b)=>(a.f-b.f)||(a.p.k-b.p.k)||(a.av-b.av));return{bad,good};
  }
  function scen(k){
    const a=vals(k),s=sum(a),n=a.length,c=avg(k);
    return[5,4,3].map(v=>{const x=(s+v)/(n+1);return`<span>${v} → <b class="${x>=TH[1]?'ok':x>=c?'warn':'bad'}">${f2(x)}</b></span>`}).join('');
  }
  function chart(){return meanChart(S.school)}

  function gradeDonut(){
    const c=[2,3,4,5].map(v=>({v,n:ACT().filter(k=>fin(avg(k))===v).length}));
    const total=c.reduce((n,x)=>n+x.n,0);
    if(!total)return'<div class="mu sm">Диаграмма появится после добавления оценок.</div>';
    const palette={2:'#e26487',3:'#edb345',4:'#54b99a',5:'#ad7aed'};
    let start=0;
    const rings=c.filter(x=>x.n).map(x=>{const share=x.n/total*100;const seg=`<circle cx="60" cy="60" r="46" fill="none" stroke="${palette[x.v]}" stroke-width="12" stroke-dasharray="${share} ${100-share}" stroke-dashoffset="${-start}" pathLength="100" transform="rotate(-90 60 60)"></circle>`;start+=share;return seg}).join('');
    const legend=c.map(x=>`<div class="donut-item"><span class="donut-dot" style="background:${palette[x.v]}"></span><span>«${x.v}»</span><b>${x.n}</b></div>`).join('');
    return`<div class="donut-wrap"><svg viewBox="0 0 120 120" role="img" aria-label="Какая будет четвертная по предметам" class="donut"><circle cx="60" cy="60" r="46" fill="none" stroke="var(--ln)" stroke-width="12"></circle>${rings}<text x="60" y="57" text-anchor="middle" fill="var(--tx)" font-size="23" font-weight="750">${total}</text><text x="60" y="73" text-anchor="middle" fill="var(--mu)" font-size="9">предметов</text></svg><div class="donut-legend">${legend}</div></div>`;
  }
  function commit(){recordMean(S.school,'archived');save();render()}

  function viewLocal(){
    const active=ACT(),{bad,good}=calc(),frag=good.filter(g=>g.x),ordered=names().sort((a,b)=>a.localeCompare(b,'ru'));
    const end=S.school.end;let days=0;
    if(end){for(let d=new Date(iso(new Date())+'T12:00:00');iso(d)<=end;d.setDate(d.getDate()+1))if(d.getDay()>0&&d.getDay()<6)days++}
    return`<h1>Мои оценки</h1>${termControls(S.school)}<div class="card"><div class="school-summary"><div class="school-score">${active.length?f2(exAvg()):'—'}</div><div><b>Средний балл</b><div class="mu sm">все оценки равновесные</div></div></div>
    <details class="school-how"><summary>Как это считается?</summary><p class="school-info mu">Крупная цифра и график — сумма всех оценок, делённая на их количество. Учитывается выбранная четверть без архивных предметов. Прогноз по каждому предмету: от 2,6 — «3», от 3,6 — «4», от 4,6 — «5». Все оценки весят одинаково, но в школе правила могут отличаться.</p></details>
    ${end?`<div class="sm" style="margin-top:8px">${esc(end.split('-').reverse().join('.'))} · ${end<iso(new Date())?'четверть закончилась':'учебных дней до конца: '+days+' (без выходных)'}</div>`:''}</div>
    ${!active.length?'<div class="note">Добавь первую оценку — появятся график и подсказки 🌟</div>':`<div class="card"><b>Как меняется средний балл</b>${chart()}<div class="mu sm">Арифметическое среднее всех оценок выбранной четверти.</div></div><div class="card"><b>Какая будет четвертная по предметам</b>${gradeDonut()}</div>`}
    ${bad.length?`<h2>Что можно подтянуть</h2>${bad.map(b=>`<div class="card"><b>${esc(b.k)}</b><div class="sm">${b.p.t}, и средний станет ${f2(b.p.x)}</div><div class="sc"><span class="mu">Если получишь:</span>${scen(b.k)}</div></div>`).join('')}`:active.length?'<div class="note">Все предметы на четвёрке и выше. Так держать! 🌸</div>':''}
    ${frag.length?`<div class="card"><b>На что обратить внимание</b>${frag.map(g=>`<p class="sm">${esc(g.k)}: тройка снизит средний с ${f2(g.av)} до ${f2(g.x)}.</p>`).join('')}</div>`:''}
    <h2>Мои предметы</h2>${ordered.map(k=>{const n=names().indexOf(k),a=S.school.g[k];return`<div class="card school-sub"><div class="row"><div><b>${esc(k)}</b><div class="mu sm">${a.length?'средний '+f2(avg(k)):'оценок пока нет'}</div></div><div class="school-final">${a.length?fin(avg(k)):'—'}<small>выйдет</small></div></div><div class="chips">${a.map(x=>`<button class="chip c${x.v}" data-action="editGrade" data-id="${n}" data-arg="${x.i}" aria-label="Изменить оценку ${x.v}: ${esc(k)}">${x.v}</button>`).join('')}<button class="chip" data-action="addGrade" data-id="${n}" aria-label="Добавить оценку: ${esc(k)}">+</button></div>${a.length?`<div class="sc"><span class="mu">Если получишь:</span>${scen(k)}</div>`:''}</div>`}).join('')}
    <button class="btn g" data-action="subjects">Предметы и четверть</button>`;
  }
  function edit(n,id){
    const k=names()[n],x=S.school.g[k].find(x=>x.i===id);
    sheet(`<h2 style="margin-top:0">${esc(k)}</h2><p class="mu sm">${x?'Исправь оценку или удали ошибочную запись.':'Какую оценку ты получила?'}</p><div class="chips">${[2,3,4,5].map(v=>`<button class="chip c${v}" data-action="putGrade" data-id="${n}" data-arg="${v}" data-arg2="${id===undefined?'null':id}">${v}</button>`).join('')}</div><div data-sheet-footer class="school-actions">${x?`<button class="btn g" data-action="removeGrade" data-id="${n}" data-arg="${id}">Удалить оценку</button>`:''}<button class="btn g" data-action="closeSheet">Отмена</button></div>`);
  }
  function put(n,v,id){
    const k=names()[n];if(!k||![2,3,4,5].includes(v))return;
    const a=S.school.g[k];
    if(id!==null){const x=a.find(x=>x.i===id);if(!x)return;x.v=v}
    else a.push({i:++S.school.n,v,d:iso(new Date())});
    commit();cs();toast(v===5?'🌟 Пятёрка! Отличная работа!':'Оценка сохранена');
  }
  function remove(n,id){
    const k=names()[n],a=S.school.g[k],x=a.find(x=>x.i===id);
    if(!x)return;
    const idx=a.indexOf(x),saved={...x};
    a.splice(idx,1);commit();cs();
    toast('Оценка удалена',{action:'Вернуть',onAction:()=>{a.splice(idx,0,saved);commit()}});
  }
  function subjects(){
    const q=S.school;
    sheet(`<h2>Предметы и четверть</h2><p class="sheet-period">${termLabel(q.terms.find(t=>t.id===q.selectedTerm))}${q.selectedTerm!==q.currentTerm?' · архив':''}</p>
      <section class="sheet-section"><h3>Четверть</h3><label class="sheet-field" for="schoolEnd">Дата окончания<input id="schoolEnd" type="date" value="${esc(q.end||'')}" data-action="endInput"></label>${q.selectedTerm===q.currentTerm?'<button class="btn g" data-action="nextTerm">Начать следующую четверть</button>':''}</section>
      <section class="sheet-section"><h3>Новый предмет</h3><div class="sheet-inline"><input id="schoolName" maxlength="30" placeholder="Название предмета" aria-label="Название нового предмета"><button class="btn" data-action="addSubject">Добавить</button></div></section>
      <section class="sheet-section"><h3>Предметы</h3>${names().map((k,n)=>`<div class="subject-row"><span>${esc(k)}<small>Оценок: ${q.g[k].length}</small></span><button data-action="archiveSubject" data-id="${n}">В архив</button></div>`).join('')}</section>
      ${q.archived.length?`<section class="sheet-section"><h3>Архив предметов</h3><p class="mu sm">Оценки сохранены и не участвуют в текущем прогнозе.</p>${q.archived.map((k,n)=>`<div class="subject-row"><span>${esc(k)}<small>Оценок: ${q.g[k].length}</small></span><button data-action="restoreSubject" data-id="${n}">Вернуть</button></div>`).join('')}</section>`:''}
      <div data-sheet-footer><button class="btn" data-action="closeSheet">Готово</button></div>`,'subjects');
  }
  function add(){
    const k=document.getElementById('schoolName').value.replace(/\s+/g,' ').trim().slice(0,30);
    if(!k)return toast('Напиши название предмета');
    if(Object.hasOwn(S.school.g,k))return toast('Предмет уже есть — проверь архив');
    S.school.g[k]=[];commit();subjects();
  }
  function archive(n){
    const k=names()[n];if(!k)return;
    S.school.archived.push(k);commit();subjects();
    toast(`«${k}» в архиве`,{action:'Вернуть',onAction:()=>{S.school.archived.pop();commit();subjects()}});
  }
  function restore(n){S.school.archived.splice(n,1);commit();subjects()}
  function end(v){if(v&&!/^\d{4}-\d{2}-\d{2}$/.test(v))return;S.school.end=v;save();render()}
  function view(){return window.schoolCloud ? window.schoolCloud.view(viewLocal) : viewLocal()}
  return{view,edit,put,remove,subjects,add,archive,restore,end};
})();

}
function installBackup(o){
  const source=o&&o.habit?o.habit:o;
  if(!source||typeof source!=='object'||!source.d||Array.isArray(source.d)||typeof source.d!=='object'||!Object.values(source.d).every(a=>Array.isArray(a)))throw Error('bad habits');
  const candidate=store.validateAll(Object.assign(store.defaults(),JSON.parse(JSON.stringify(source))));
  const schoolRaw=o.school||source.school;
  if(schoolRaw&&(!schoolRaw.g||typeof schoolRaw.g!=='object'||Array.isArray(schoolRaw.g)||!Object.values(schoolRaw.g).every(a=>Array.isArray(a)&&a.every(x=>x&&[2,3,4,5].includes(x.v)))))throw Error('bad grades');
  candidate.school=schoolRaw?schoolStore.validate(schoolStore.migrate(JSON.parse(JSON.stringify(schoolRaw)))):JSON.parse(JSON.stringify(S.school));
  if(!confirm('Заменить данные копией? Текущее состояние будет сохранено на этом устройстве.'))return;
  const before=JSON.stringify(S),oldSchool=localStorage.getItem(KEY+'_school');
  localStorage.setItem(KEY+'_before_restore',before);
  try{localStorage.setItem(KEY+'_school',JSON.stringify(candidate.school));localStorage.setItem(KEY,JSON.stringify(candidate))}
  catch(err){if(oldSchool===null)localStorage.removeItem(KEY+'_school');else localStorage.setItem(KEY+'_school',oldSchool);throw err}
  S=candidate;render();backupStatus('Данные восстановлены. Предыдущая версия сохранена на устройстве.');
}

function backupStatus(message){const e=document.getElementById('backupStatus');if(e)e.textContent=message;else toast(message)}
async function exportBackupFile(){
  try{
    const file=new File([JSON.stringify({habit:(({school,...r})=>r)(S),school:S.school})],'iskra-backup-'+iso(new Date())+'.json',{type:'application/json'});
    if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'Копия данных'}); backupStatus('В меню «Поделиться» выбери «Сохранить в Файлы».');return}
      catch(err){if(err.name==='AbortError')return}
    }
    const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
     backupStatus('Файл подготовлен. Проверь «Загрузки» или «Файлы».');
  }catch(err){backupStatus('Не удалось создать копию. Попробуй открыть приложение в Safari.')}
}
async function importBackupFile(input){
  const file=input.files&&input.files[0];if(!file)return;
  try{if(file.size>10*1024*1024)throw Error('size');installBackup(JSON.parse(await file.text()))}
  catch(err){backupStatus('Файл не подходит или не удалось сохранить данные. Текущие записи не заменены.')}
  finally{input.value=''}
}
function importBackupText(){
  try{installBackup(JSON.parse(document.getElementById('bk').value))}
  catch(err){backupStatus('Текст копии не подходит или не удалось сохранить данные. Текущие записи не заменены.')}
}

  pickColor:(c)=>{S.av.c=c;save();openProfile()},
  editReward:()=>openReward(),
  setGoal:(n)=>{const rw=document.getElementById('rw');if(rw)S.reward=rw.value.trim()||S.reward;S.goal=+n;save();openReward()},
  saveReward:()=>{const rw=document.getElementById('rw');if(rw)S.reward=rw.value.trim()||S.reward;save();cs();render()},
  toggle:(i)=>toggleTask(i),
  details:(i)=>openDetails(i),
  detailChip:(j)=>{cur.n=document.getElementById('dn').value;const k=(cur.i=='hw'?CONFIG.subjects:CONFIG.chores)[+j],x=cur.s.indexOf(k);x<0?cur.s.push(k):cur.s.splice(x,1);renderDetails()},
  saveDetails:()=>saveDetails(),
  removeDetails:()=>removeDetails(),
  toggleDance:(g)=>{const a=S.dance,x=a.indexOf(+g);x<0?a.push(+g):a.splice(x,1);save();render()},
  closeSheet:()=>{cs();render()},
  parents:()=>openParents(),
  exportFile:()=>exportBackupFile(),
  pickBackupFile:()=>document.getElementById('backupFileInput').click(),
  importText:()=>importBackupText(),
  dayHistory:(d)=>openDay(d),
  history:()=>openHistory(),
  histPrev:()=>histPrev(),
  histNext:()=>histNext(),
  histDay:(d)=>openDay(d),
  editGrade:(n,_,el)=>school.edit(+n,+el.dataset.arg),
  addGrade:(n)=>school.edit(+n),
  putGrade:(n,_,el)=>school.put(+n,+el.dataset.arg,el.dataset.arg2==='null'?null:+el.dataset.arg2),
  removeGrade:(n,_,el)=>school.remove(+n,+el.dataset.arg),
  selectTerm:()=>{},
  nextTerm:()=>nextTermSheet(S.school),
  confirmNextTerm:()=>{if(createNextTerm(S.school,'archived')){save();cs();render();toast('Новая четверть начата, предыдущая сохранена')}},
  subjects:()=>school.subjects(),
  addSubject:()=>school.add(),
  archiveSubject:(n)=>school.archive(+n),
  restoreSubject:(n)=>school.restore(+n),
  endInput:(_,__,el)=>school.end(el.value),
};
function toggleTask(i){
  const d=iso(new Date()),done=(S.d[d]||[]).includes(i);
  setDone(i,!done);
}

/* ===== DELEGATION ===== */
document.addEventListener('click',e=>{
  const closeEl=e.target.closest('[data-close]');
  if(closeEl&&e.target===closeEl){cs();return}
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const {action,id,arg,arg2}=el.dataset;
  const fn=ACTIONS[action];
  if(fn)fn(id,arg,el,arg2);
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  if(el.dataset.action==='nameInput'){S.name=el.value.trim();save()}
  if(el.dataset.action==='endInput')school.end(el.value);
});

document.addEventListener('change',e=>{
  if(e.target.dataset.action==='selectTerm'){selectTerm(S.school,'archived',e.target.value);save();render()}
  else if(e.target.dataset.action==='importFile')importBackupFile(e.target)
});

window.addEventListener('schoolCloudUpdated',()=>{if(tab==='g')render()});

/* ===== BOOT ===== */
render();
if(!S.asked){S.asked=1;save();openProfile()}
</script><script type="module" src="./school-cloud.js?v=20261026-6" data-school-cloud="iskra"></script></body></html>
