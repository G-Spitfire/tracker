<style>
:root{--bg:#f6efff;--tx:#33284a;--mu:#857b9c;--co:#ff8a65;--pu:#a56bff;--ln:#ece4f7;--sh:0 8px 24px rgba(110,80,160,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg);-webkit-text-size-adjust:100%}
button,input,textarea{font-family:inherit;touch-action:manipulation}
body{margin:0;min-height:100vh;color:var(--tx);font:18px/1.35 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;background:linear-gradient(180deg,#fff1e8 0,#f6efff 360px,#f6efff 100%);padding-bottom:120px}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:28px;font-weight:800;margin:0;letter-spacing:-.01em}h2{font-size:21px;font-weight:800;margin:22px 0 8px}
.mu{color:var(--mu)}.sm{font-size:15px}.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 16px}.av{width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:32px;box-shadow:var(--sh);border:0;padding:0}
.card{background:#fff;border-radius:28px;padding:16px 18px;margin:14px 0;box-shadow:var(--sh)}
.note{background:#ece4ff;border-radius:20px;padding:12px 16px;font-weight:700;margin:12px 0}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#ff9a76,#b57bff);color:#fff;border-radius:32px;padding:18px;box-shadow:0 12px 28px rgba(165,107,255,.35)}
.hero .ph{font-size:21px;font-weight:800;line-height:1.2;margin-bottom:4px}
.task{display:flex;align-items:center;gap:14px;width:100%;min-height:80px;background:#fff;border:0;border-radius:26px;padding:12px 16px 12px 12px;margin:10px 0;text-align:left;color:var(--tx);font-size:18px;box-shadow:var(--sh);cursor:pointer}
.task:active{transform:scale(.98)}.task .ic{width:56px;height:56px;flex:none;border-radius:18px;background:var(--b);display:grid;place-items:center;font-size:30px}
.task .nm{flex:1;font-weight:800;min-width:0}.task small{display:block;font-weight:500;color:var(--mu);font-size:14px;line-height:1.25}
.ck{width:38px;height:38px;flex:none;border-radius:50%;border:3px solid var(--ln);display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff}
.task.on{background:var(--b)}.task.on .ic{background:#fff}.task.on .ck{background:var(--c);border-color:var(--c)}
.days{display:flex;gap:6px}.dy{flex:1;text-align:center}.dy .c{height:44px;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:var(--sh);font-weight:800;margin-bottom:4px}.dy.td .c{outline:3px solid var(--co)}.dy.fu{opacity:.45}
.gift{background:linear-gradient(135deg,#ffd76a,#ff9a76);border-radius:28px;padding:18px;margin:14px 0;box-shadow:0 12px 28px rgba(255,154,118,.35)}
.pb{height:16px;border-radius:8px;background:#ffffff80;overflow:hidden;margin:10px 0}.pb i{display:block;height:100%;border-radius:8px;background:#fff;transition:width .3s}
.btn{background:linear-gradient(135deg,#ff9a76,#ff6f91);color:#fff;border:0;border-radius:22px;font-weight:800;font-size:18px;padding:14px 22px;min-height:54px;box-shadow:0 8px 18px rgba(255,111,145,.35);cursor:pointer}.btn.g{background:#f1ebfb;color:var(--tx);box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{min-height:46px;border-radius:23px;border:0;background:#f1ebfb;color:var(--tx);font-weight:700;font-size:16px;padding:0 16px;cursor:pointer}.chip.on{background:var(--pu);color:#fff}
.eg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.eg button{height:56px;border:3px solid transparent;border-radius:18px;background:#f6f0ff;font-size:30px;padding:0}.eg button.on{border-color:var(--pu);background:#fff}
.cl{display:flex;gap:10px;margin-top:14px;justify-content:center}.cl button{width:44px;height:44px;border-radius:50%;border:4px solid #fff;padding:0;box-shadow:0 0 0 1px var(--ln)}.cl button.on{box-shadow:0 0 0 3px var(--pu)}
input,textarea{width:100%;font-size:18px;padding:13px 16px;border-radius:18px;border:2px solid var(--ln);background:#fff;color:var(--tx);margin-top:12px}textarea{height:80px}
.bar{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:452px;bottom:12px;display:flex;gap:4px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:30px;padding:6px;box-shadow:0 10px 30px rgba(110,80,160,.22)}
.bar button{flex:1;background:none;border:0;border-radius:24px;color:var(--mu);font-weight:800;font-size:13px;padding:6px 0;line-height:1.2;cursor:pointer}.bar button span{display:block;font-size:24px}.bar .on{background:#fff0e8;color:var(--co)}
#tt{width:max-content;position:fixed;left:50%;top:12px;transform:translate(-50%,-200px);background:#fff;color:var(--tx);font-weight:800;padding:12px 20px;border-radius:22px;box-shadow:var(--sh);z-index:20;max-width:90%;text-align:center;transition:transform .25s;pointer-events:none}#tt.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){#tt,.pb i{transition:none}.task:active{transform:none}}
.ov{position:fixed;inset:0;background:#33284a66;display:flex;align-items:flex-end;z-index:9}.sh{max-height:92%;overflow-y:auto;background:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:32px 32px 0 0;padding:20px 18px 24px}
</style></head><body><main id="m"></main>
<nav class="bar"><button data-t="t"><span>☀️</span>Сегодня</button><button data-t="r"><span>🏆</span>Награда</button><button data-t="y"><span>😊</span>Я</button></nav>
<div id="tt"></div><div id="s"></div>
<script>
window.onerror=(m,u,l)=>{if(!l)return;const b=document.createElement('div');b.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:30;background:#ff6f91;color:#fff;padding:10px;border-radius:14px;font-size:13px';b.textContent='Ошибка: '+m+' (строка '+l+'). Нажми, чтобы закрыть.';b.onclick=()=>b.remove();document.body.appendChild(b)};
const VER=4;
(function(){fetch(location.pathname+'?'+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/const VER=(\d+)/);if(m&&+m[1]!==VER){const n=Date.now();let l=0;try{l=+localStorage.getItem('kidr')||0}catch(e){}if(n-l>60000){try{localStorage.setItem('kidr',n)}catch(e){}location.replace(location.pathname+'?u='+n)}}}).catch(()=>{})})();
const KEY='kid1',DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],GD=[1,2,3,4,5,6,0];
const LV=[[0,'Звёздочка'],[40,'Умница'],[120,'Мастер дня'],[250,'Чемпион']];
const EM=['🦊','🐱','🐶','🐼','🦄','🐰','🐻','🐯','🐸','🐨','🦉','🐬','🦋','🐙','🐧','🦁','🌸','🚀','🎨','⭐'];
const CL=['#ffd9c9','#ffe9a8','#d3f2e4','#d6ecff','#e6dcff','#ffd6ea'];
const SUBJ=['Математика','Русский','Чтение','Окружающий мир','Английский','ОРКСЭ'];
const CH=['Убрала в комнате','Помыла посуду','Накрыла на стол','Помогала готовить','Вынесла мусор','Полила цветы','Пол или пылесос'];
let S,tab='t',cur={i:'',s:[],n:''};
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||typeof S.d!='object')S={d:{},name:'',asked:0,goal:25,reward:'Семейная награда',dance:[]};
if(!S.x)S.x={};if(!S.av)S.av={e:'🦊',c:'#ffd9c9'};S.v=2;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const sum=a=>a.reduce((x,y)=>x+y,0),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const wk=()=>{const d=new Date(),k=(d.getDay()+6)%7;return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()-k+i);return iso(x)})};
if(!S.ex){S.ex=iso(new Date());save()}
const EX={i:'ex',e:'🤸',t:'Зарядка',s:'5–10 минут',b:'#ffe9d2',c:'#ff9a3c'};
const T=[{i:'bg',e:'🎒',t:'Собрать портфель',b:'#ffe3d6',c:'#ff8a65'},{i:'cl',e:'👕',t:'Приготовить вещи на завтра',b:'#dff1ff',c:'#4fb3ff'},{i:'hw',e:'✏️',t:'Сделать уроки',s:'выбери предметы',b:'#fff0c2',c:'#f2b300'},{i:'en',e:'🇬🇧',t:'Английский',s:'10–15 минут',b:'#e6defc',c:'#8e6cf0'},{i:'ho',e:'🧹',t:'Помочь по дому',s:'расскажи, что сделала',b:'#d9f6e8',c:'#2fbf8f'}];
const RD={i:'rd',e:'📖',t:'Почитать',s:'на выходных',b:'#ffdcec',c:'#ff6fa5'};
const tasks=d=>{const w=new Date(d+'T00:00:00').getDay(),b=d>=S.ex?[EX].concat(T):T;return w==0||w==6?b.concat([RD]):b};
const dn=d=>(S.d[d]||[]).filter(i=>tasks(d).some(t=>t.i==i));
const st=d=>{const n=dn(d).length;return n+(n&&n==tasks(d).length?2:0)};
function ring(n,m){const C=251.3;return`<svg width="96" height="96" viewBox="0 0 96 96" style="flex:none"><circle cx="48" cy="48" r="40" fill="none" stroke="#ffffff55" stroke-width="10"/><circle cx="48" cy="48" r="40" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-n/m)}" transform="rotate(-90 48 48)"/><text x="48" y="56" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">${n}/${m}</text></svg>`}
const avb=()=>`<button class="av" onclick="oP()" style="background:${S.av.c}" aria-label="Мой герой">${S.av.e}</button>`;
function today(){const d=iso(new Date()),L=tasks(d),done=dn(d),n=done.length,all=n==L.length,X=S.x[d]||{};
 const ph=all?'Ура! Ты справилась!':!n?'Привет! С чего начнём?':n*2>=L.length?'Уже почти всё!':'Отлично, продолжаем!';
 return`<div class="hd">${avb()}<h1>Привет${S.name?', '+esc(S.name):''}!</h1></div>${S.dance.includes(new Date().getDay())?'<div class="note">💃 Сегодня танцы! Форма уже в портфеле?</div>':''}
<div class="hero">${ring(n,L.length)}<div><div class="ph">${ph}</div><div class="sm">⭐ сегодня: ${st(d)}</div></div></div>
${L.map(t=>{const x=X[t.i],ok=done.includes(t.i),sub=ok&&x&&(x.s.length||x.n)?esc(x.s.concat(x.n?[x.n]:[]).join(', ')):(t.s||'');return`<button class="task ${ok?'on':''}" style="--b:${t.b};--c:${t.c}" onclick="tg('${t.i}')"><span class="ic">${t.e}</span><span class="nm">${t.t}${sub?`<small>${sub}</small>`:''}</span><span class="ck">${ok?'✓':''}</span></button>`}).join('')}`}
function reward(){const W=wk(),t=sum(W.map(st)),g=S.goal,tot=sum(Object.keys(S.d).map(st)),lv=LV.filter(x=>x[0]<=tot).pop(),nx=LV.find(x=>x[0]>tot),td=iso(new Date());
 return`<h1 style="margin:4px 0 14px">Награда недели</h1><div class="gift"><div style="font-size:44px;line-height:1.1">🎁</div><div style="font-size:24px;font-weight:800;margin:6px 0">${esc(S.reward)}</div><div class="pb"><i style="width:${Math.min(100,t/g*100)}%"></i></div><div style="font-weight:700">${t>=g?'Награда заработана! Ура!':`⭐ ${t} из ${g}`}</div><p style="margin:12px 0 0"><button class="btn g" onclick="oR()">Изменить награду</button></p></div>
<h2>Эта неделя</h2><div class="days">${W.map((d,i)=>{const n=dn(d).length,f=n&&n==tasks(d).length;return`<div class="dy ${d==td?'td':''} ${d>td?'fu':''}"><div class="c">${f?'⭐':n||''}</div><div class="sm">${DN[i]}</div></div>`}).join('')}</div>
<div class="card" style="display:flex;gap:14px;align-items:center"><div class="av" style="background:${S.av.c}">${S.av.e}</div><div><b>${lv[1]}</b><div class="mu sm">Всего звёзд: ${tot}${nx?`. До «${nx[1]}» ещё ${nx[0]-tot}`:''}</div></div></div>`}
function stats(id){const all={},w={},W=wk();Object.keys(S.x).forEach(d=>{const e=S.x[d][id];if(!e)return;(e.s||[]).concat(e.n?[e.n.toLowerCase()]:[]).forEach(k=>{all[k]=(all[k]||0)+1;if(W.includes(d))w[k]=(w[k]||0)+1})});
 return Object.entries(all).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,n])=>`<div class="row"><span>${esc(k)}</span><span><b>${n}</b>${w[k]?` <span class="mu sm">+${w[k]} за неделю</span>`:''}</span></div>`).join('')||'<div class="mu sm">Пока пусто</div>'}
function me(){return`<h1 style="margin:4px 0 14px">Я</h1><div class="card" style="display:flex;gap:14px;align-items:center"><div class="av" style="background:${S.av.c}">${S.av.e}</div><div style="flex:1"><b>${S.name?esc(S.name):'Без имени'}</b></div><button class="btn g" onclick="oP()">Изменить</button></div>
<div class="card"><b>Дни танцев</b><div class="mu sm">В эти дни будет напоминание про форму.</div><div class="chips">${GD.map((g,i)=>`<button class="chip ${S.dance.includes(g)?'on':''}" onclick="td(${g})">${DN[i]}</button>`).join('')}</div></div>
<div class="card"><b>Мои уроки</b><div class="mu sm" style="margin-bottom:6px">сколько раз за всё время</div>${stats('hw')}</div>
<div class="card"><b>Помощь по дому</b><div class="mu sm" style="margin-bottom:6px">сколько раз за всё время</div>${stats('ho')}</div>
<div class="card"><b>Копия данных</b><div class="mu sm">Для взрослых: все записи хранятся на этом телефоне. Сохрани текст в заметки, если нужно перенести или восстановить.</div><textarea id="bk"></textarea><div class="chips"><button class="btn g" onclick="exp()">Сделать копию</button><button class="btn g" onclick="imp()">Восстановить</button></div></div>
<div class="mu sm">Искра · v${VER}</div>`}
function render(){document.querySelectorAll('.bar button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));document.getElementById('m').innerHTML={t:today,r:reward,y:me}[tab]()}
document.querySelector('.bar').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;render();scrollTo(0,0)}};
function sheet(h){document.getElementById('s').innerHTML=h?`<div class="ov" onclick="if(event.target==this)cs()"><div class="sh">${h}</div></div>`:''}
const cs=()=>sheet('');
function toast(m){const e=document.getElementById('tt');e.textContent=m;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2800)}
function setDone(i,on){const d=iso(new Date()),a=S.d[d]||(S.d[d]=[]),L=tasks(d),b=dn(d).length==L.length,x=a.indexOf(i);if(on&&x<0)a.push(i);if(!on&&x>=0){a.splice(x,1);if(S.x[d])delete S.x[d][i]}const all=dn(d).length==L.length;save();render();if(on&&x<0)toast(all&&!b?'🎉 Все дела готовы! +2 бонусные звезды':'⭐ +1 звезда')}
function tg(i){if(i=='hw'||i=='ho')return oD(i);setDone(i,!(S.d[iso(new Date())]||[]).includes(i))}
function oD(i){const d=iso(new Date()),e=(S.x[d]||{})[i]||{s:[],n:''};cur={i,s:(e.s||[]).slice(),n:e.n||''};rD()}
function rD(){const hw=cur.i=='hw',L=hw?SUBJ:CH,ok=(S.d[iso(new Date())]||[]).includes(cur.i);
 sheet(`<h2 style="margin-top:0">${hw?'Какие уроки делала?':'Что помогла сделать?'}</h2><div class="chips" style="margin-top:0">${L.map((k,j)=>`<button class="chip ${cur.s.includes(k)?'on':''}" onclick="tc(${j})">${k}</button>`).join('')}</div><input id="dn" maxlength="60" placeholder="${hw?'Что-то ещё? Напиши':'Что-то ещё? Напиши'}" value="${esc(cur.n)}"><div class="chips"><button class="btn" onclick="sv()">Готово</button>${ok?'<button class="btn g" onclick="rm()">Убрать отметку</button>':''}</div>`)}
function tc(j){cur.n=document.getElementById('dn').value;const k=(cur.i=='hw'?SUBJ:CH)[j],x=cur.s.indexOf(k);x<0?cur.s.push(k):cur.s.splice(x,1);rD()}

save();render();
