/* Ноутбучная компоновка: яснее прогресс, стол и визуальные примеры. */
.progress-label{font-size:11px;letter-spacing:.01em}.progress-wrap{margin-bottom:0}
.hero-table-wrap{display:grid;justify-items:center;align-content:center;min-width:0}
.table-illustration{width:100%;max-width:390px;min-height:310px;aspect-ratio:1.18;overflow:hidden;padding:20px}
.table-illustration .table-caption{position:absolute;top:17%;left:8%;right:8%;text-align:center;font-size:10px;line-height:1.3}
.table-illustration .cards{position:absolute;top:39%;left:0;right:0;margin:0;gap:7px}.table-illustration .card{width:50px;height:66px}
.table-illustration .seat{width:62px;padding:4px 3px;border-radius:99px;background:#073f2ebd;color:#fff;font-size:9px;line-height:1.2}
.table-illustration .seat.tl{top:34%;left:3%}.table-illustration .seat.tr{top:34%;right:3%}
.table-illustration .seat.bl{bottom:32%;left:3%}.table-illustration .seat.br{bottom:32%;right:3%}
.table-note{margin:-15px 0 0;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--muted);font-size:11px;font-weight:700;text-align:center;position:relative}
.combo-grid.three-up{grid-template-columns:repeat(3,minmax(0,1fr))}
.combo-grid.three-up .combo-example{padding:12px}
.combo-grid.three-up .combo-hand{gap:4px}
.combo-grid.three-up .combo-hand .playing-card{height:68px}
.combo-hand .playing-card.combo-match{box-shadow:0 0 0 2px #d1a84b,0 3px 7px #10223c24,inset 0 0 0 2px #fff}
.practice-board .board-bottom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:". you ." "matvey mama papa";align-items:end;gap:10px}.practice-board .player:nth-child(1){grid-area:mama}.practice-board .player:nth-child(2){grid-area:you}.practice-board .player:nth-child(3){grid-area:papa}.practice-board .player:nth-child(4){grid-area:matvey}
.practice-board .player{min-width:0;padding:9px 6px;border:1px solid #ffffff42;border-radius:12px;background:#073f2eaa;font-size:11px;line-height:1.35}
.practice-board .player strong{font-size:12px;letter-spacing:.02em}
.practice-board .player-role{font-size:10px;min-height:24px;display:flex;align-items:center;justify-content:center}
.practice-board .player .cards{margin:8px 0!important}
.practice-board .player .card{width:48px;height:66px}
@media(max-width:1100px){.combo-grid.three-up{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:850px){.hero-table-wrap{max-width:520px;margin:auto}.table-illustration{max-width:100%;aspect-ratio:1.8;min-height:230px}.practice-board .board-bottom{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:none}.practice-board .player:nth-child(n){grid-area:auto}.combo-grid.three-up{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body>
<div class="shell">
  <header class="topbar">
    <button class="brand" id="home-button" aria-label="На главную"><span class="brandmark">♠</span><span>Покер с нуля</span></button>
    <div class="top-meta"><span>Правила для семейной игры</span><span class="badge blue">Техасский холдем</span></div>
  </header>
  <div class="progress-overview"><div id="progress-label" class="progress-label">Инструкция · все разделы открыты</div><div class="progress-wrap" aria-label="Просмотр инструкции"><div id="progress" class="progress"></div></div></div>
  <div class="layout">
    <aside class="sidebar">
      <div class="side-label">Содержание</div>
      <div class="search-wrap"><label class="sr-only" for="rule-search">Найти правило</label><input id="rule-search" type="search" placeholder="Найти правило…" autocomplete="off"><div id="search-results" class="search-results" hidden></div></div><nav id="nav" class="nav-list" aria-label="Разделы инструкции"></nav>
      <div class="side-note">Без денег и ставок. Жетоны — только условные очки для обучения.</div>
    </aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const suitNames={'♠':'пик','♥':'червей','♦':'бубен','♣':'треф'};
const card=(v,s)=>`<div class="playing-card ${'♥♦'.includes(s)?'red':''}" role="img" aria-label="${v} ${suitNames[s]}"><span class="card-corner card-top" aria-hidden="true"><b>${v}</b><i>${s}</i></span><span class="card-center" aria-hidden="true">${s}</span><span class="card-corner card-bottom" aria-hidden="true"><b>${v}</b><i>${s}</i></span></div>`;
const hand=a=>`<div class="card-row">${a.map(c=>card(...c)).join('')}</div>`;
const box=(title,text,tone='')=>`<div class="callout ${tone}"><strong>${title}</strong><p>${text}</p></div>`;
const tiles=rows=>`<div class="two-col">${rows.map(([h,p])=>`<div class="definition"><h3>${h}</h3><p>${p}</p></div>`).join('')}</div>`;
const more=(title,text)=>`<details><summary>${title}</summary><div class="detail-body">${text}</div></details>`;
const ranks=[
['Старшая карта','Нет пары, стрита или флеша. Сравнивают карты от самой высокой к самой низкой.',[['A','♠'],['K','♦'],['9','♣'],['5','♥'],['2','♠']]],
['Пара','Две карты одного достоинства. Затем учитывают три остальные карты — кикеры.',[['Q','♠'],['Q','♥'],['10','♦'],['6','♣'],['3','♠']]],
['Две пары','Две разные пары. Сначала сравнивают старшую пару, затем младшую, затем пятую карту.',[['K','♠'],['K','♥'],['4','♦'],['4','♣'],['A','♠']]],
['Тройка','Три карты одного достоинства и две дополнительные карты.',[['9','♠'],['9','♥'],['9','♦'],['A','♣'],['K','♣']]],
['Стрит','Пять разных достоинств подряд. Масти любые. Сильнее стрит с более высокой верхней картой.',[['5','♠'],['6','♥'],['7','♦'],['8','♣'],['9','♠']]],
['Флеш','Пять карт одной масти. Последовательность не нужна. Сравнивают все пять от старшей вниз.',[['A','♥'],['J','♥'],['8','♥'],['4','♥'],['2','♥']]],
['Фулл-хаус','Тройка и пара. Сначала сравнивают достоинство троек, затем пар.',[['8','♠'],['8','♥'],['8','♦'],['K','♣'],['K','♥']]],
['Каре','Четыре карты одного достоинства. При одинаковом каре решает пятая карта.',[['J','♠'],['J','♥'],['J','♦'],['J','♣'],['5','♠']]],
['Стрит-флеш','Пять карт подряд одной масти. Сравнивают верхнюю карту.',[['5','♦'],['6','♦'],['7','♦'],['8','♦'],['9','♦']]],
['Роял-флеш','10–J–Q–K–A одной масти. Это самый высокий стрит-флеш, отдельного правила сравнения нет.',[['10','♠'],['J','♠'],['Q','♠'],['K','♠'],['A','♠']]]
];
const chapters=[
{title:'Подготовка и цель',steps:[
['Что нужно для первой игры','Играем в техасский холдем без денег. Все правила ниже относятся к безлимитному холдему, если отдельно не указано семейное соглашение.',()=>tiles([['Колода','52 карты без джокеров. Достоинства от младшего к старшему: 2–10, J (валет), Q (дама), K (король), A (туз).'],['Участники','От 2 до 10 игроков. Примеры в инструкции — для вашей семьи из четырёх человек.'],['Жетоны','Выдайте каждому по 40 условных жетонов. Можно использовать одинаковые счётные фишки; если цвета разные — заранее назначьте номиналы.'],['Маркер и блайнды','Любой небольшой предмет обозначает раздающего. Для начала: малый блайнд 1, большой 2. Суммы пока не повышайте.']])+more('Как начать и когда закончить?',`<p>Первого раздающего выберите случайно. Договоритесь о длительности игры, например 30 минут. После последней раздачи сравните количество жетонов. Можно играть до одного оставшегося участника; если жетоны закончились, в таком формате игрок выбывает.</p><p>Для спокойного знакомства можно договориться выдавать новый одинаковый запас между раздачами. Это семейное соглашение, а не обязательное правило покера. Внутри раздачи добавлять жетоны нельзя.</p>`) ],
['Как выигрывают банк','Банк — все жетоны, внесённые игроками в текущую раздачу.',()=>tiles([['Лучшая пятёрка','Если до вскрытия остались несколько игроков, сравнивают их лучшие пятикарточные руки.'],['Все остальные вышли','Если все соперники сбросили карты, оставшийся игрок сразу забирает банк. Показывать карты не нужно.']])+box('Раздача и игра — не одно и то же','Раздача — один эпизод от блайндов до передачи банка. Игра состоит из многих раздач. Проиграв раздачу, можно участвовать в следующей, если остались жетоны.')]
]},
{title:'Личные и общие карты',steps:[
['Две свои. Пять общих.','У каждого две личные карты рубашкой вверх. Пять общих карт открываются на столе постепенно и доступны всем.',()=>`<div class="visual-split"><section><div class="card-group-label">Пять общих карт</div>${hand([['A','♠'],['8','♥'],['8','♣'],['K','♦'],['5','♠']])}<div class="card-group-label">Твои две личные</div>${hand([['Q','♣'],['J','♠']])}</section>${box('Всегда сравнивают ровно пять','Из семи доступных карт выбери лучшие пять. Можно использовать две личные карты, одну или ни одной. Шестая и седьмая карты не помогают при равенстве.')}</div>`+more('Масти и туз',`<p>Пики ♠, червы ♥, бубны ♦ и трефы ♣ равны по силе. Красный цвет не объединяет червы и бубны в одну масть.</p><p>Обычно туз старше короля. В стрите A–2–3–4–5 он играет как единица: такой стрит самый младший. Ряд Q–K–A–2–3 стритом не является.</p>`) ],
['Общие карты работают для всех','Совпадения на столе входят в комбинацию каждого оставшегося игрока.',()=>hand([['9','♠'],['9','♥'],['K','♣'],['2','♦'],['7','♠']])+tiles([['У тебя 9♦ A♣','Вместе с двумя девятками на столе это тройка девяток. Лучшая пятёрка: 9–9–9–A–K.'],['У мамы K♦ J♥','На столе уже есть пара девяток. Вместе с двумя королями получается две пары: K–K–9–9–J.']])+box('Смотри на все семь карт','Нельзя определять комбинацию только по личным картам. Тройка девяток побеждает две пары мамы.','green')]
]},
{title:'Все комбинации',steps:[
['От старшей карты до стрита','Комбинации расположены от слабой к сильной. Любая комбинация следующего уровня побеждает любую предыдущего.',()=>comboCards(0,5)+more('Как читать обозначения?',`<p>J — валет, Q — дама, K — король, A — туз. «Достоинство» — число или буква карты. Пара двоек побеждает старшую карту с тузом; тройка двоек побеждает любые две пары.</p>`) ],
['От флеша до роял-флеша','Сила комбинации важнее достоинства отдельных карт.',()=>comboCards(5,10)+box('Стрит и флеш — частая путаница','Стрит — пять подряд. Флеш — пять одной масти. Флеш сильнее стрита. Стрит-флеш выполняет оба условия сразу.')],
['Как найти лучшую пятёрку','Проверяй комбинации от сильных к слабым. Затем выбери лучшие дополнительные карты.',()=>tiles([['Если общих карт пять','У тебя семь доступных карт. Мысленно перебери возможные пятёрки и оставь самую сильную.'],['Если на столе три или четыре','Сейчас можно оценить имеющуюся руку, но после следующих общих карт она может усилиться.']])+more('Частые случаи',`<p><b>Три пары:</b> отдельной комбинации нет. Берут две старшие пары и лучший оставшийся кикер.</p><p><b>Две тройки:</b> старшая тройка плюс две карты из младшей образуют фулл-хаус.</p><p><b>Шесть карт одной масти:</b> для флеша берут пять старших.</p><p><b>Флеш на столе:</b> личная карта той же масти может улучшить общую пятёрку; карта другой масти — нет.</p>`) ]
]},
{title:'Сравнение рук и ничья',steps:[
['Когда комбинации одинаковые','Сначала сравнивают категорию, затем значимые карты внутри неё. Масть победителя не определяет.',()=>tiles([['Пара и тройка','Сначала сравнивают достоинство пары или тройки, затем кикеры по убыванию.'],['Две пары','Старшая пара → младшая пара → пятая карта.'],['Стрит и стрит-флеш','Решает верхняя карта. A–2–3–4–5 заканчивается пятёркой.'],['Флеш и старшая карта','Сравнивают старшие карты; при равенстве — следующие, пока не найдётся отличие.'],['Фулл-хаус','Сначала тройка, затем пара. Три тройки и две двойки сильнее трёх двоек и двух тузов.'],['Каре','Сначала достоинство четырёх карт, затем кикер.']])],
['Посмотри, почему выигрывает рука','Выбери пример. Это объяснение правила, отвечать на вопросы не нужно.',()=>`<div class="example-tabs"><button class="secondary" data-compare="0">Кикер</button><button class="secondary" data-compare="1">Две пары</button><button class="secondary" data-compare="2">Ничья</button></div><div id="comparison" aria-live="polite"></div>`],

{title:'Маркер, блайнды и раздача',steps:[

['После каждой раздачи','Соберите все карты, передвиньте маркер на следующего участника по часовой стрелке и снова перемешайте колоду.',()=>box('Меняются роли, а не суммы','Новый малый блайнд вносит 1, новый большой — 2. Победитель не получает маркер автоматически. Каждый участник по очереди оказывается на разных позициях.')+more('Если кто-то выбыл или хочет выйти',`<p>Выходите между раздачами, не забирая уже внесённые в банк жетоны. При неизменном составе просто сдвигайте маркер на одного человека. При выбывании в игре на победителя используйте стандарт «мёртвого маркера»: большой блайнд переходит к следующему игроку по часовой стрелке, малый блайнд и маркер иногда оказываются у пустого места. Так никто не пропускает положенный большой блайнд. При переходе к двум игрокам действует особый порядок из раздела «Особые ситуации».</p>`) ]

{title:'Четыре круга и очередь хода',steps:[

['Кто и когда действует','Ходы идут по часовой стрелке. Сбросившие карты и игроки, уже поставившие всё, больше не принимают решений в этой раздаче.',()=>tiles([['До флопа','Первым действует игрок слева от большого блайнда. Большой блайнд тоже имеет право хода: если никто не повысил, он может чекнуть или повысить.'],['После флопа, тёрна и ривера','Первым действует ближайший оставшийся игрок слева от маркера, у которого ещё есть жетоны для решений. Обычно это малый блайнд.'],['Если кто-то поставил или повысил','Остальным нужно ответить: уравнять, повысить или сбросить. После повышения очередь может обойти стол повторно.'],['Когда круг завершён','Все, кто ещё может действовать, получили ход и уравняли последнюю ставку, либо все прочекали. Олл-ин может оставаться с меньшим вкладом.']])+box('Одного равенства жетонов недостаточно','В начале все внесли по 2, но большой блайнд ещё не действовал? Круг пока не закончен: у него остаётся возможность повысить.')],

{title:'Действия и размер ставок',steps:[

['Сколько нужно добавить?','Из текущей ставки вычти свой вклад в этом круге. Вклад на прошлых этапах сюда не входит.',()=>`<div class="calculator"><div><label for="current-bet">Текущая ставка</label><select id="current-bet"><option>2</option><option>4</option><option>6</option><option>10</option></select></div><div><label for="own-bet">Уже внесено в этом круге</label><select id="own-bet"><option>0</option><option>1</option><option>2</option></select></div></div><div id="call-result" class="callout green" aria-live="polite"></div>`+box('«До 6» и «ещё 6» — разные вещи','Если ты уже внёс 2, повышение до 6 требует добавить 4. Лучше сначала сказать вслух: «Повышаю до шести», а затем передвинуть жетоны одним движением.')],
['Минимальная ставка и повышение','При большом блайнде 2 минимальная обычная ставка — 2. Максимум в безлимитном холдеме — все твои оставшиеся жетоны.',()=>tiles([['Первое повышение','До флопа ставка 2. Минимальное повышение — до 4: прибавка должна быть не меньше 2.'],['Следующее повышение','Ставку подняли с 2 до 6: прибавка 4. Следующее минимальное повышение — до 10, а не до 8.']])+more('Исключение: короткий олл-ин',`<p>Если на полный колл или повышение не хватает жетонов, можно поставить всё, даже меньше обычного минимума.</p><p>Пример: А поставил 6, Б повысил до 10 (прибавка 4), В поставил всё до 12. Это неполное повышение. Для Б прибавка после его хода всего 2: он может доплатить или сбросить, но не повысить. А столкнулся с полным повышением от 6 до 10, поэтому право повысить у него сохраняется. Игрок, ещё не действовавший, тоже может сделать полное повышение до 16 или выше.</p><p>Несколько коротких олл-инов могут в сумме дать полную прибавку: тогда право повышать возвращается. Сравнивают прибавку с момента последнего действия конкретного игрока.</p>`) ]

['Олл-ин и побочный банк','Игрок не обязан сбрасывать карты, если ему не хватает на колл. Он ставит всё и претендует только на ту часть банка, которую покрывает его вклад.',()=>`<div class="pot-demo"><div><b>А · 5 жетонов</b><span>Поставил всё</span></div><div><b>Б · 12 жетонов</b><span>Внёс 12</span></div><div><b>В · 12 жетонов</b><span>Уравнял 12</span></div></div>`+tiles([['Основной банк: 15','По 5 от каждого. На него претендуют А, Б и В, если не сбросили карты.'],['Побочный банк: 14','По 7 дополнительно от Б и В. Только Б и В могут его выиграть.']])+box('Победители могут быть разными','Если у А лучшая рука, он получает только 15. Побочный банк 14 получает сильнейший из Б и В. Если Б сильнее всех, он забирает оба банка — 29.')+more('Несколько олл-инов и лишние жетоны',`<p>При нескольких разных вкладах стройте банки слоями: каждый слой покрывают игроки, внесшие не меньше его уровня. Сброшенные вклады остаются, но их владельцы не могут выиграть. Каждый банк делят между имеющими на него право.</p><p>Часть ставки, которую никто не уравнял, возвращают поставившему. Например, А поставил 12, а единственный соперник смог внести всего 5: в банке по 5 от обоих, лишние 7 возвращаются А.</p><p>Если дальнейшие ставки невозможны, откройте личные карты участников олл-ина и оставшиеся общие карты. Если двое ещё могут ставить, их решения продолжаются в побочный банк.</p>`) ],
['Спорные и бытовые моменты','До игры согласуйте семейные правила. Ни один спор не требует менять правила задним числом.',()=>tiles([['Ошиблись при сдаче','Если до действий обнаружили неверное количество личных карт или открыли карту при сдаче, для первой домашней игры проще вернуть блайнды и пересдать с тем же маркером. Это семейное упрощение.'],['Не твоя очередь','Дождись своего хода. Не показывай карты, не давай советов оставшимся игрокам, если сам уже сбросил.'],['Неясно, сколько поставили','Уточни сумму до своего действия. Жетоны текущего круга держите перед игроками до его завершения, затем собирайте в банк.'],['Игра закончилась','Доиграйте текущую раздачу, затем посчитайте жетоны. Не прерывайте раздачу посреди решений.']])+more('Граница этой инструкции',`<p>Здесь есть правила, необходимые для самостоятельной домашней игры в безлимитный холдем. Стратегия, вероятности, турнирные штрафы и все возможные ошибки дилера — отдельные темы. Сложную ошибку остановите и разберите до следующего действия; не придумывайте решение в пользу конкретной руки.</p><p>Правила сверены по <a href="https://www.pokerstars.com/poker/games/rules/" target="_blank" rel="noopener">правилам холдема PokerStars</a> и <a href="https://www.pokerstars.com/help/articles/poker-rules-master/217444/" target="_blank" rel="noopener">разбору особых случаев</a>. Семейные соглашения в тексте обозначены отдельно.</p>`) ]

{title:'Памятка за столом',steps:[['Вся раздача под рукой','Эта страница доступна в любой момент. Инструкцию и практику проходить для её открытия не нужно.',()=>`<div class="quick-grid">${[['1. Подготовить','Перемешать. Внести блайнды 1 и 2. Раздать по две личные карты.'],['2. Префлоп','Первый — слева от большого блайнда. Колл, рейз или фолд. Большой блайнд имеет право хода.'],['3. Флоп','Сжечь одну, открыть три. Первый оставшийся слева от маркера начинает новый круг.'],['4. Тёрн','Сжечь одну, открыть четвёртую. Новый круг решений.'],['5. Ривер','Сжечь одну, открыть пятую. Последний круг решений.'],['6. Вскрытие','Сравнить лучшие пять из семи. Передать или разделить банк. Сдвинуть маркер.']].map(([h,p])=>`<div class="definition"><h3>${h}</h3><p>${p}</p></div>`).join('')}</div>`+box('В свой ход','Доплата 0 → чек или ставка/повышение, если ставка уже была. Доплата больше 0 → колл, повышение или фолд. Не хватает жетонов → можно олл-ин. После полного повышения остальные снова отвечают.')+more('Комбинации — от сильной к слабой',`<p>${ranks.slice().reverse().map(r=>r[0]).join(' → ')}</p>`)+more('Словарь',`<p><b>Банк</b> — жетоны раздачи. <b>Стек</b> — оставшиеся жетоны игрока. <b>Баттон</b> — маркер позиции раздающего. <b>Блайнды</b> — обязательные начальные ставки. <b>Флоп</b> — первые три общие карты. <b>Тёрн</b> — четвёртая. <b>Ривер</b> — пятая. <b>Чек</b> — не добавлять. <b>Колл</b> — уравнять. <b>Рейз</b> — повысить. <b>Фолд</b> — сбросить. <b>Кикер</b> — дополнительная карта при сравнении. <b>Сплит</b> — раздел банка. <b>Шоудаун</b> — вскрытие.</p>`)] ]}
];
function comboCards(a,b){return `<div class="combo-grid guide-combos">${ranks.slice(a,b).map((r,i)=>`<article class="combo-example"><div class="combo-head"><span class="rank-n">${a+i+1}</span><strong>${r[0]}</strong></div><div class="combo-hand">${r[2].map(c=>card(...c)).join('')}</div><p>${r[1]}</p></article>`).join('')}</div>`}
function showdown(){return `<div class="showdown-grid">${[['Полина · тройка девяток','9–9–9–A–K',[['9','♦'],['A','♣']]],['Мама · две пары','K–K–9–9–J',[['K','♦'],['J','♥']]],['Папа · пара девяток','9–9–K–Q–10',[['Q','♣'],['10','♣']]],['Матвей · пара девяток','9–9–K–7–4',[['4','♥'],['3','♦']]]].map(([t,b,c])=>`<div class="definition"><h3>${t}</h3>${hand(c)}<p>Лучшая пятёрка: ${b}</p></div>`).join('')}</div>`}
let visited=[];try{const x=JSON.parse(localStorage.getItem('pokerGuideReadV2')||'[]');if(Array.isArray(x))visited=x.filter(n=>Number.isInteger(n)&&n>=0&&n<chapters.length)}catch{}
let chapter=-1,step=0,blind=0,practiceStep=0,mode='guide';
function persist(){try{localStorage.setItem('pokerGuideReadV2',JSON.stringify(visited))}catch{}}
function nav(){ $('#nav').innerHTML=chapters.map((c,i)=>`<button class="nav-item ${chapter===i&&mode==='guide'?'active':''} ${visited.includes(i)?'done':''}" data-chapter="${i}" ${chapter===i&&mode==='guide'?'aria-current="step"':''}><span class="nav-num">${visited.includes(i)?'✓':String(i+1).padStart(2,'0')}</span><span>${c.title}</span></button>`).join('')+`<div class="nav-divider"></div><button class="nav-item ${mode==='practice'?'active':''}" id="practice-nav"><span class="nav-num">♠</span><span>Практика · по желанию</span></button>`; document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>openChapter(+b.dataset.chapter));$('#practice-nav').onclick=()=>openPractice();$('#progress-label').textContent=`Инструкция · ${visited.length} из ${chapters.length} разделов просмотрено · все разделы открыты`;$('#progress').style.width=Math.round(100*visited.length/chapters.length)+'%';}
function focusMain(){ $('#main').focus({preventScroll:true}); window.scrollTo({top:0,behavior:'instant'}); }
function openChapter(i,s=0){chapter=i;step=s;mode='guide';render();focusMain();}
function render(){nav();if(chapter<0)return home();const c=chapters[chapter],p=c.steps[step];$('#main').innerHTML=`<div class="content"><div class="lesson-head"><span class="badge blue">${esc(c.title)}</span><span class="mini">${step+1} / ${c.steps.length}</span></div><h1 class="lesson-title">${p[0]}</h1><p class="lede">${p[1]}</p>${p[2]()}</div><div class="lesson-footer"><button class="secondary" id="previous">← Назад</button><div class="step-dots" aria-label="Страницы раздела">${c.steps.map((_,i)=>`<button aria-label="Страница ${i+1}" ${step===i?'aria-current="step"':''} class="dot ${step===i?'active':''}" data-step="${i}"></button>`).join('')}</div><button class="primary" id="next">${step<c.steps.length-1?'Дальше':chapter<chapters.length-1?'Следующий раздел':'Завершить инструкцию'} →</button></div>`;$('#previous').onclick=()=>{if(step)openChapter(chapter,step-1);else if(chapter>0)openChapter(chapter-1,chapters[chapter-1].steps.length-1);else{chapter=-1;render();focusMain()}};$('#next').onclick=()=>{if(step<c.steps.length-1)openChapter(chapter,step+1);else{if(!visited.includes(chapter)){visited.push(chapter);persist()}if(chapter<chapters.length-1)openChapter(chapter+1);else finish()}};document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>openChapter(chapter,+b.dataset.step));bindDemos();}
function home(){ $('#main').innerHTML=`<div class="content"><div class="hero-grid"><div><span class="badge">Интерактивная инструкция</span><h1 class="hero-title">Разобраться.<br>Раздать.<br>Сыграть вместе.</h1><p class="hero-copy">Все правила техасского холдема — от подготовки стола до раздела банка. Читай по порядку или открывай нужный раздел.</p><div class="hero-actions"><button class="primary" id="start-guide">Открыть инструкцию →</button><button class="secondary" id="open-reference">Памятка за столом</button></div></div><div class="hero-table-wrap"><div class="table-illustration"><div class="table-caption">Две личные · пять общих</div>${hand([['A','♠'],['K','♥'],['8','♦']])}<div class="table-chip">Техасский холдем · 2–10 игроков</div></div></div></div>${box('Как инструкция к настольной игре','Здесь нет обязательных тестов. Каждый пример можно раскрыть, посмотреть и спокойно перейти дальше. Все правила доступны сразу.')}<div class="two-col"><div class="definition"><h3>Полные правила</h3><p>Комбинации, очередь хода, ставки, ничья, игра вдвоём и побочные банки.</p></div><div class="definition"><h3>Практика по желанию</h3><p>Учебная раздача с подсказками. Можно открыть после инструкции или пропустить.</p><button class="text-button" id="home-practice">Посмотреть раздачу →</button></div></div></div>`;$('#start-guide').onclick=()=>openChapter(0);$('#open-reference').onclick=()=>openChapter(9);$('#home-practice').onclick=()=>openPractice();}
function bindDemos(){if($('#comparison')){compare(0);document.querySelectorAll('[data-compare]').forEach(b=>b.onclick=()=>compare(+b.dataset.compare))}if($('#blind-demo'))renderBlind();if($('#street-demo')){street(0);document.querySelectorAll('[data-street]').forEach(b=>b.onclick=()=>street(+b.dataset.street))}if($('#call-result')){calc();$('#current-bet').onchange=calc;$('#own-bet').onchange=calc}}
function compare(i){const rows=[['Победа по кикеру',[['K','♠'],['K','♥'],['8','♣'],['4','♦'],['2','♠']],['A♣ Q♣','J♣ 10♣'],'У первого: K–K–A–Q–8. У второго: K–K–J–10–8. Пара королей общая, но первый кикер A старше J. Побеждает первый игрок.'],['Сначала старшая пара',[['9','♠'],['9','♥'],['K','♣'],['2','♦'],['7','♠']],['K♦ J♥','7♦ A♣'],'Первый: K–K–9–9–J. Второй: 9–9–7–7–A. Короли старше девяток: первый выигрывает, хотя у второго есть туз.'],['Играет общая пятёрка',[['10','♠'],['J','♥'],['Q','♣'],['K','♦'],['A','♠']],['2♣ 2♦','9♣ 8♦'],'У обоих стрит до туза на столе. Личные карты не улучшают его. Лучшие пятёрки равны: банк делится поровну.']];const [t,c,h,p]=rows[i];$('#comparison').innerHTML=`<div class="demo-surface"><h3>${t}</h3><div class="card-group-label">Общие карты</div>${hand(c)}<div class="compare-players"><span>Первый: <b>${h[0]}</b></span><span>Второй: <b>${h[1]}</b></span></div>${box('Почему так',p,'green')}</div>`;document.querySelectorAll('[data-compare]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.compare===i)))}
function renderBlind(){const names=['Матвей','Полина','Папа','Мама'];const role=['Маркер раздающего','Малый блайнд · 1','Большой блайнд · 2','Первый ход до флопа'];$('#blind-demo').innerHTML=`<div class="blind-table-wrap"><div class="blind-table"><div class="blind-center"><strong>Раздача ${blind+1}</strong><span>Ходы по часовой стрелке</span></div>${names.map((n,i)=>{let r=(i-blind+4)%4;return `<div class="blind-seat-player ${['left','top','right','bottom'][i]} ${['button','small','big',''][r]}"><strong>${n}</strong><span>${role[r]}</span></div>`}).join('')}</div></div><div class="blind-controls"><span class="mini">Маркер → малый → большой → первый ход</span><button class="secondary" id="rotate">Следующая раздача ↻</button></div>`;$('#rotate').onclick=()=>{blind=(blind+1)%4;renderBlind()}}
function street(i){const cards=[['9','♠'],['9','♥'],['K','♣'],['2','♦'],['7','♠']];const data=[['Префлоп · 0 общих карт',0,'Блайнды уже внесены. Первым действует игрок слева от большого блайнда. Все отвечают на ставку 2; большой блайнд тоже получает ход.'],['Флоп · 3 общие карты',3,'После завершения префлопа сожги одну карту и открой три. Первый оставшийся слева от маркера начинает новый круг: чек или ставка.'],['Тёрн · 4 общие карты',4,'После полного завершения круга на флопе сожги одну карту и открой четвёртую. Начинается новый круг, вклады текущего круга снова с нуля.'],['Ривер · 5 общих карт',5,'Сожги одну и открой пятую после завершения тёрна. Теперь ещё один, последний круг решений. Сразу переходить к вскрытию рано.'],['Вскрытие',5,'После последнего круга оставшиеся показывают обе личные карты. Сравните лучшие пять из семи. Если все, кроме одного, сбросили раньше — вскрытие не нужно.']];const [t,n,p]=data[i];$('#street-demo').innerHTML=`<div class="demo-surface"><h3>${t}</h3>${n?hand(cards.slice(0,n)):'<div class="empty-cards">Пока только две личные карты у каждого</div>'}<p>${p}</p></div>`;document.querySelectorAll('[data-street]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.street===i)))}
function calc(){const current=+$('#current-bet').value,own=+$('#own-bet').value,n=current-own;$('#call-result').innerHTML=`<strong>${n>0?'Колл: добавить '+n+' '+token(n):'Доплата 0 — доступен чек'}</strong><p>Текущая ставка ${current} − уже внесено ${own} = ${n}. ${n>0?'Если жетонов меньше, можно поставить всё — олл-ин.':'Можно также повысить текущую ставку.'}</p>`}
function token(n){return n===1?'жетон':n<5?'жетона':'жетонов'}
function finish(){nav();$('#main').innerHTML=`<div class="content completion"><span class="badge">Инструкция просмотрена</span><h1 class="lesson-title">Можно собираться за столом</h1><p class="lede">Подготовьте колоду, выдайте жетоны и держите памятку рядом. К любому правилу можно вернуться.</p><div class="hero-actions"><button class="primary" id="finish-reference">Открыть памятку</button><button class="secondary" id="finish-practice">Учебная раздача · по желанию</button></div></div>`;$('#finish-reference').onclick=()=>openChapter(9);$('#finish-practice').onclick=()=>openPractice();focusMain()}
const practice=[
['Префлоп · твой ход','Ты — малый блайнд. Внесла 1 из 40. Папа внёс большой 2, мама и Матвей уже уравняли по 2. В банке 7. Колл требует добавить ещё 1.',0,7,'Колл · добавить 1'],
['Префлоп · ход папы','Все внесли по 2, в банке 8. У папы на большом блайнде остаётся право хода. Он выбирает чек. Теперь первый круг действительно завершён.',0,8,'Папа: чек → открыть флоп'],
['Флоп · твой ход','Открыты 9♠ 9♥ K♣. Ты первая после маркера. У тебя уже три девятки. В этом круге ставки пока нет; в примере выбираем чек.',3,8,'Полина: чек'],
['Флоп · остальные отвечают','После тебя по очереди чекнули папа, мама и Матвей. Все получили ход, никто не поставил. Круг закрыт; можно открыть тёрн.',3,8,'Открыть тёрн'],
['Тёрн · новый круг','Открылась 2♦. Ты чекаешь, затем по очереди чекают папа, мама и Матвей. Только после этого открывается следующая карта.',4,8,'Все чекнули → открыть ривер'],
['Ривер · последний круг','Открылась 7♠. Несмотря на пять общих карт, решения ещё не закончены. Ты, папа, мама и Матвей по очереди чекаете. Теперь можно вскрываться.',5,8,'Все чекнули → вскрытие'],
['Вскрытие · тройка выигрывает','Полина: тройка девяток. Мама: две пары — короли и девятки. У папы и Матвея пара девяток. Тройка сильнее двух пар, поэтому Полина забирает банк 8.',5,8,'Завершить раздачу']
];
function openPractice(){mode='practice';practiceStep=0;renderPractice();focusMain()}
function renderPractice(){nav();if(practiceStep===practice.length){try{localStorage.setItem('pokerPracticeDoneV2','true')}catch{} $('#main').innerHTML=`<div class="content completion"><span class="badge">Практика завершена</span><h1 class="lesson-title">Одна раздача — весь порядок</h1><p>У Полины 46 жетонов, у остальных по 38. Передвиньте маркер к Полине: она станет раздающим, папа — малым блайндом, мама — большим.</p><div class="hero-actions"><button class="primary" id="practice-reference">К памятке</button><button class="secondary" id="restart-practice">Повторить пример</button></div></div>`;$('#practice-reference').onclick=()=>openChapter(9);$('#restart-practice').onclick=()=>openPractice();return}const p=practice[practiceStep];$('#main').innerHTML=`<div class="content"><div class="lesson-head"><span class="badge blue">Практика · по желанию</span><span class="mini">${practiceStep+1} / ${practice.length}</span></div><h1 class="lesson-title">${p[0]}</h1><p class="lede">${p[1]}</p><div class="practice-board"><div class="board-top"><span>${practiceStep===6?'Полина получает банк':'Все жетоны условные'}</span><span>Банк · ${p[3]}</span></div><div class="community">${p[2]?hand([['9','♠'],['9','♥'],['K','♣'],['2','♦'],['7','♠']].slice(0,p[2])):'<span class="table-chip">Общие карты ещё не открыты</span>'}</div><div class="practice-player"><strong>Полина · твои карты</strong>${hand([['9','♦'],['A','♣']])}<span>Жетоны: ${practiceStep===0?39:practiceStep===6?46:38}</span></div></div>${practiceStep===6?showdown():box('Это разобранный пример','Действия выбраны заранее, чтобы показать порядок игры. В реальной игре на свободном ходе можно также поставить, а при необходимости доплатить — уравнять, повысить или сбросить.')}</div><div class="lesson-footer"><button class="secondary" id="practice-exit">К инструкции</button><button class="primary" id="practice-next">${p[4]} →</button></div>`;$('#practice-next').onclick=()=>{practiceStep++;renderPractice();focusMain()};$('#practice-exit').onclick=()=>openChapter(9);}
function search(){const query=$('#rule-search').value.trim().toLocaleLowerCase('ru');const panel=$('#search-results');if(!query){panel.hidden=true;return}let hits=[];chapters.forEach((c,i)=>c.steps.forEach((p,s)=>{const text=p[0]+' '+p[1]+' '+p[2]().replace(/<[^>]*>/g,' ');if(text.toLocaleLowerCase('ru').includes(query))hits.push([i,s,p[0],c.title])}));panel.hidden=false;panel.innerHTML=hits.length?hits.slice(0,12).map(([i,s,t,c])=>`<button class="search-hit" data-hit="${i},${s}"><b>${t}</b><small>${c}</small></button>`).join(''):'<p class="mini">Ничего не найдено. Попробуй «блайнд», «ничья» или «повышение».</p>';panel.querySelectorAll('[data-hit]').forEach(b=>b.onclick=()=>{const [i,s]=b.dataset.hit.split(',').map(Number);panel.hidden=true;$('#rule-search').value='';openChapter(i,s)})}
$('#rule-search').oninput=search;$('#rule-search').onkeydown=e=>{if(e.key==='Escape'){$('#search-results').hidden=true;$('#rule-search').value=''}};$('#home-button').onclick=()=>{chapter=-1;mode='guide';render();focusMain()};render();

</script>
</body>
</html>
