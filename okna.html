.nd{position:absolute;left:0;top:8px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--mu)}.nd.d{background:var(--ac);border-color:var(--ak)}.nd.c{border-color:var(--ac);box-shadow:0 0 0 4px rgba(106,186,151,.22)}

.sh.md{height:58%}.sh.lg{height:88%}

.lnk{background:none;border:0;color:var(--ak);font-size:14px;text-decoration:underline;padding:12px 8px;min-height:44px}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.sh:focus{outline:none}
.go:active,.mn:active,.sv:active,.nw:active,.ib:active{transform:scale(.98)}
.cd.pop{animation:pop .4s ease-out}.nd.pop{animation:ring .6s ease-out}.ok path{stroke-dasharray:1;stroke-dashoffset:0}.cd.pop .ok path{animation:dr .4s ease-out}.wd.pulse{animation:pls .5s}

#tt{width:max-content;max-width:90%;position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-220px);background:var(--cd);color:var(--tx);font-size:15px;font-weight:600;padding:12px 18px;border-radius:14px;z-index:20;text-align:center;transition:transform .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.28)}#tt.on{transform:translate(-50%,0);pointer-events:auto}

.hist-day{display:grid;gap:8px}.hist-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}.hist-row b{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600;font-size:15px}.hist-row .tm{font-size:12px}
.hist-check{width:44px;height:44px;border-radius:12px;border:2px solid var(--dl);background:none;cursor:pointer;display:grid;place-items:center;color:var(--tx);flex:none}

@media(prefers-color-scheme:dark){

  function migrate(s){

  }
  function validateAll(s){
    if(!s||typeof s!=='object')throw Error('bad root');
    if(!Array.isArray(s.a))s.a=[];
    s.a=s.a.filter(x=>x&&typeof x==='object'&&Number.isInteger(x.id)&&typeof x.d==='string')
      .map(x=>({id:x.id,a:String(x.a||''),d:String(x.d||''),t:/^\d{2}:\d{2}$/.test(x.t)?x.t:'19:30',r:x.r?1:0,w:Array.isArray(x.w)?x.w.filter(i=>i>=0&&i<7):[0,1,2,3,4,5,6],c:x.c||null,pu:x.pu||null}));
    if(!s.d||typeof s.d!=='object'||Array.isArray(s.d))s.d={};
    for(const k of Object.keys(s.d))if(!Array.isArray(s.d[k]))s.d[k]=[];
    if(!Array.isArray(s.wd))s.wd=[0,1,2,3,4];
    if(!s.p||typeof s.p!=='object')s.p={name:'',avatar:''};
    if(typeof s.p.name!=='string')s.p.name='';
    if(typeof s.p.avatar!=='string'||!/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(s.p.avatar))s.p.avatar='';
    if(!s.h||typeof s.h!=='object')s.h={};
    if(typeof s.ws!=='string'||!/^\d{2}:\d{2}$/.test(s.ws))s.ws='11:00';
    if(typeof s.we!=='string'||!/^\d{2}:\d{2}$/.test(s.we))s.we='19:00';
    s.n=Math.max(s.n||0,...s.a.map(x=>x.id))+1;
    return s;
  }
  let warned=false;
  function load(){
    let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
    if(!raw){const s=defaults();return validateAll(s)}
    let s;try{s=JSON.parse(raw)}catch(e){return validateAll(defaults())}
    try{s=migrate(s);return validateAll(s)}
    catch(e){try{const b=localStorage.getItem(BAK);if(b)return validateAll(JSON.parse(b))}catch(_){}return validateAll(defaults())}
  }
  function save(s){
    try{const old=localStorage.getItem(KEY);if(old)localStorage.setItem(BAK,old)}catch(e){}
    try{localStorage.setItem(KEY,JSON.stringify(s));return true}
    catch(e){if(!warned){warned=true;alert('Не удалось сохранить данные. Освободи место в браузере и попробуй снова.')}return false}
  }
  function restoreBackup(){try{const b=localStorage.getItem(BAK);if(!b)return null;return validateAll(JSON.parse(b))}catch(e){return null}}
  return{load,save,restoreBackup,validateAll,defaults};
})();

function drag(){
  const sh=document.querySelector('.sh'),g=document.querySelector('.gb');
  if(!sh||!g)return;
  let y0=0,dy=0,on=0;
  const big=()=>{sh.classList.remove('md');sh.classList.add('lg')};
  sh.addEventListener('focusin',e=>{if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)&&sh.classList.contains('md'))big()});
  g.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;on=1;dy=0;sh.style.transition='none'},{passive:true});
  g.addEventListener('touchmove',e=>{if(!on)return;dy=e.touches[0].clientY-y0;if(dy<-40&&sh.classList.contains('md')){big();on=0;sh.style.transform='';return}sh.style.transform='translateY('+Math.max(0,dy)+'px)';e.preventDefault()},{passive:false});
  g.addEventListener('touchend',()=>{on=0;if(dy>90)cs();else{sh.style.transition='transform .2s';sh.style.transform=''}});
}

function toast(m,opt){

function setAvatar(input){
  const file=input.files&&input.files[0];input.value='';if(!file)return;
  if(!file.type.startsWith('image/')||file.size>20*1024*1024){alert('Выбери изображение размером до 20 МБ.');return}
  const image=new Image(),url=URL.createObjectURL(file);
  image.onload=()=>{
    try{
      const canvas=document.createElement('canvas'),side=Math.min(image.naturalWidth,image.naturalHeight);
      if(!side)throw Error();
      canvas.width=canvas.height=160;
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#f3f8f5';ctx.fillRect(0,0,160,160);
      ctx.drawImage(image,(image.naturalWidth-side)/2,(image.naturalHeight-side)/2,side,side,0,0,160,160);
      const prev=S.p.avatar;
      S.p.avatar=canvas.toDataURL('image/jpeg',.82);
      if(save()){render();openProfile();toast('Фото сохранено')}else S.p.avatar=prev;
    }catch(e){alert('Не удалось открыть фото. Попробуй JPG или PNG.')}
    finally{URL.revokeObjectURL(url)}
  };
  image.onerror=()=>{URL.revokeObjectURL(url);alert('Не удалось открыть фото. Попробуй JPG или PNG.')};
  image.src=url;
}

let reportPeriod=0;
function openStats(){reportPeriod=0;renderStats()}
function choosePeriod(value){
  if(![0,1,2].includes(value))return;
  reportPeriod=value;renderStats();
  const body=document.querySelector('.sh .sb');if(body)body.scrollTop=0;
}
function reportDays(){
  if(reportPeriod<2)return wk(reportPeriod);
  const now=new Date();
  return Array.from({length:30},(_,i)=>{const d=new Date(now);d.setDate(now.getDate()-29+i);return iso(d)});
}
function stepWord(n){return n%10===1&&n%100!==11?'шаг':n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?'шага':'шагов'}
function weekStats(ds){
  const t=iso(new Date());
  return S.a.map(x=>{
    const plan=ds.filter(d=>d<=t&&(actv(x,d)||(S.d[d]||[]).includes(x.id)));
    const done=plan.filter(d=>(S.d[d]||[]).includes(x.id));
    return{x,plan,done};
  });
}
function dayCells(x,ds){
  const t=iso(new Date());
  return'<div class="week-days">'+ds.map(d=>{
    const planned=actv(x,d),done=(S.d[d]||[]).includes(x.id),future=d>t;
    const state=!planned&&!done?'off':future?'future':done?'done':'miss';
    const label=!planned&&!done?'не запланировано':future?'впереди':done?'сделано':'без отметки';
    return`<div class="week-day"><span>${DN[dow(d)]}</span><span class="week-mark ${state}" role="img" aria-label="${d}: ${label}">${state==='off'?'—':state==='done'?'✓':state==='future'?'·':'○'}</span></div>`;
  }).join('')+'</div>';
}
function weekCard(r,ds){
  return`<section class="week-card"><button class="week-title" data-action="editHabit" data-id="${r.x.id}" aria-label="Изменить: ${esc(r.x.d)}"><strong>${esc(r.x.d)}</strong><span class="tm">${esc(r.x.a)} · <span class="edit-word">Изменить</span></span></button>${reportPeriod<2?dayCells(r.x,ds):''}<div class="tm">${r.plan.length?'Сделано '+r.done.length+' из '+r.plan.length:'На прошедшие дни не запланировано'}</div></section>`;
}
function renderStats(){
  const ds=reportDays(),rows=weekStats(ds);
  const done=rows.reduce((n,r)=>n+r.done.length,0),plan=rows.reduce((n,r)=>n+r.plan.length,0);
  const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'});
  sheet(`<h1>Статистика</h1><div class="ch report-tabs" role="group" aria-label="Период отчёта">${['Эта неделя','Прошлая неделя','30 дней'].map((label,i)=>`<button class="${reportPeriod===i?'on':''}" aria-pressed="${reportPeriod===i}" data-action="choosePeriod" data-id="${i}">${label}</button>`).join('')}</div><p class="tm">${fmt(ds[0])} – ${fmt(ds[ds.length-1])}</p><div class="week-total"><strong>Ты сделала ${done} ${stepWord(done)}</strong><div class="tm">${plan?'Из '+plan+' запланированных'+(reportPeriod===0?' к сегодняшнему дню.':'.'):'Пока нет запланированных действий на прошедшие дни.'}</div></div>${rows.map(r=>weekCard(r,ds)).join('')||'<p class="tm">Пока нет привязок.</p><button class="sv g2" data-action="newHabit">Добавить привязку</button>'}${reportPeriod<2?'<p class="tm">✓ — сделано · ○ — без отметки · бледная точка — впереди · — нет плана</p>':''}<button class="sv g2" data-action="closeSheet">Закрыть</button>`,'lg');
}

/* ===== EDIT HABIT ===== */
let cu={};
function openHabit(id){
  const x=S.a.find(y=>y.id==id);
  cu=x?JSON.parse(JSON.stringify(x)):{id:0,a:'',d:'',t:'19:30',r:1,w:[0,1,2,3,4,5,6]};
  renderHabit();
}
function renderHabit(){
  sheet(`<h1>${cu.id?'Привязка':'Новая привязка'}</h1><div class="tm">После чего это случается у тебя?</div><input class="in" id="fa" maxlength="40" placeholder="Например: пришла с работы" value="${esc(cu.a)}" data-action="habitA"><div class="ch">${PRE.map((p,j)=>`<button class="${cu.a==p?'on':''}" data-action="habitPrefix" data-id="${j}">${p}</button>`).join('')}</div><div class="tm" style="margin-top:24px">Тогда я…</div><input class="in" id="fd" maxlength="50" placeholder="Например: велосипед 20 минут" value="${esc(cu.d)}" data-action="habitD"><div class="tm" style="margin-top:24px">По каким дням</div><div class="ch dys" style="margin-top:8px">${DN.map((n,i)=>`<button class="${cu.w.includes(i)?'on':''}" data-action="habitDay" data-id="${i}">${n}</button>`).join('')}</div><div class="rw"><span>Время</span><input type="time" class="tp" id="ft" value="${cu.t}" data-action="habitT"></div><div class="rw" style="margin-top:12px"><span>Напомнить</span><button class="sw ${cu.r?'on':''}" aria-pressed="${!!cu.r}" aria-label="Напоминание" data-action="habitR"><span></span></button></div><button class="sv" data-action="saveHabit">Сохранить</button>${cu.id?'<button class="sv g2 dg" data-action="deleteHabit">Удалить</button>':''}<button class="sv g2" data-action="closeSheet">Отмена</button>`,'md');
}
function readHabit(){
  const fa=document.getElementById('fa'),fd=document.getElementById('fd'),ft=document.getElementById('ft');
  if(fa)cu.a=fa.value;
  if(fd)cu.d=fd.value;
  if(ft)cu.t=ft.value||cu.t;
}
function saveHabit(){
  readHabit();
  cu.a=cu.a.trim();cu.d=cu.d.trim();
  if(!cu.a||!cu.d||!cu.w.length){toast('Заполни «после чего», «тогда я» и выбери дни');return}
  if(cu.id){
    const i=S.a.findIndex(y=>y.id==cu.id);
    S.a[i]=Object.assign({},S.a[i],cu);
  }else{
    cu.id=S.n++;cu.c=iso(new Date());S.a.push(cu);
  }
  commit();
}
function deleteHabit(){
  const id=cu.id,k=S.a.findIndex(y=>y.id==id);
  if(k<0){cs();return}
  const removed=S.a[k];
  S.a.splice(k,1);save();cs();render();
  toast('Привязка удалена',{action:'Вернуть',onAction:()=>{S.a.splice(k,0,removed);save();render()}});
}

/* ===== LITE (пауза) ===== */
let lt=[];
function openLite(){lt=[];renderLite()}
function renderLite(){
  sheet(`<h1>Облегчить план</h1><div class="tm">Что сейчас тяжело? Выбранное встанет на паузу на 7 дней и не попадёт в статистику как пропуск.</div><div class="ch">${S.a.map(x=>`<button class="${lt.includes(x.id)?'on':''}" data-action="liteToggle" data-id="${x.id}">${esc(x.d)}</button>`).join('')}</div><button class="sv" data-action="saveLite">Поставить на паузу</button><button class="sv g2" data-action="closeSheet">Отмена</button>`,'md');
}
function saveLite(){
  if(!lt.length){toast('Выбери хотя бы одну привязку');return}
  const u=new Date();u.setDate(u.getDate()+7);
  const k=iso(u);
  S.a.forEach(x=>{if(lt.includes(x.id))x.pu=k});
  S.h.rt=lastMark();
  commit();
  toast('Пауза до '+k.slice(8)+'.'+k.slice(5,7));
}
function unpause(){S.a.forEach(x=>{delete x.pu});commit();}

/* ===== BACKUP ===== */
function exportObj(){return{habit:(()=>{const h=Object.assign({},S);delete h.h;return h})(),schema:CONFIG.schema}}
function shareBackup(){
  S.bk=iso(new Date());save();
  const t=JSON.stringify(S);
  if(navigator.share){navigator.share({title:'Копия данных: Ритм',text:t}).then(()=>toast('Копия отправлена')).catch(()=>{})}
  else{try{navigator.clipboard.writeText(t);toast('Копия скопирована, вставь её в заметки')}catch(x){toast('Нажми «Показать текст» и скопируй вручную')}}
  render();
}
function showBackup(){
  S.bk=iso(new Date());save();
  const e=document.getElementById('bk');
  e.value=JSON.stringify(S);e.select();
  try{navigator.clipboard.writeText(e.value)}catch(x){}
}
function importBackup(){
  try{
    const o=JSON.parse(document.getElementById('bk').value);
    const validated=store.validateAll(o);
    const before=JSON.stringify(S);
    S=validated;
    save();cs();render();alert('Данные восстановлены');
    toast('Можно отменить',{action:'Вернуть',onAction:()=>{S=JSON.parse(before);save();render()}});
  }catch(e){alert('Не получилось: вставь в поле текст копии целиком')}
}
function restoreBak(){
  const b=store.restoreBackup();
  if(!b)return toast('Бэкап не найден');
  const before=JSON.stringify(S);
  S=b;save();render();
  toast('Из бэкапа восстановлено',{action:'Вернуть',onAction:()=>{S=JSON.parse(before);save();render()}});
}

/* ===== ICS ===== */
const ie=s=>String(s).replace(/([,;\\])/g,'\\$1');
function icsText(){
  const now=new Date(),st=iso(now).replace(/-/g,''),BY=['MO','TU','WE','TH','FR','SA','SU'],k=(now.getDay()+6)%7;
  const startDay=S.st||iso(now);
  const ev=S.a.filter(x=>x.r&&!(x.pu&&x.pu>=iso(now))).map(x=>{
    const base=x.c||startDay;
    const baseD=new Date(base+'T00:00:00');
    const bw=(baseD.getDay()+6)%7;
    const off=Math.min(...x.w.map(w=>(w-bw+7)%7));
    const d=new Date(baseD);d.setDate(baseD.getDate()+off);
    const s=ie(x.a+' → '+x.d);
    return['BEGIN:VEVENT','UID:a'+x.id+'@ritm','DTSTAMP:'+st+'T000000Z','DTSTART:'+iso(d).replace(/-/g,'')+'T'+x.t.replace(':','')+'00','DURATION:PT15M','RRULE:FREQ=WEEKLY;BYDAY='+x.w.map(w=>BY[w]).join(','),'SUMMARY:'+s,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+s,'TRIGGER:PT0S','END:VALARM','END:VEVENT'].join('\r\n');
  });
  return['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ritm//RU','CALSCALE:GREGORIAN'].concat(ev,['END:VCALENDAR']).join('\r\n');
}
function exportIcs(){
  if(!S.a.some(x=>x.r&&!(x.pu&&x.pu>=iso(new Date())))){toast('Включи напоминание хотя бы у одной привязки');return}
  const t=icsText(),f=new File([t],'ritm.ics',{type:'text/calendar'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});
  else location.href=URL.createObjectURL(new Blob([t],{type:'text/calendar'}));
}

/* ===== ACTIONS ===== */
const ACTIONS={
  profile:()=>openProfile(),
  stats:()=>openStats(),
  choosePeriod:(v)=>choosePeriod(+v),
  closeSheet:()=>cs(),
  newHabit:()=>openHabit(0),
  editHabit:(id)=>openHabit(+id),
  toggle:(id)=>toggleHabit(+id),
  togglePast:(id,_,el)=>togglePast(+id,el.dataset.date),
  dayHistory:(d)=>openDay(d),
  dismissHint:(k)=>{S.h[k]=1;save();render()},
  dismissRet:(l)=>{S.h.rt=l;save();render()},
  dismissBackup:()=>{S.bd=iso(new Date());save();render()},
  lite:()=>openLite(),
  liteToggle:(id)=>{const i=lt.indexOf(+id);i<0?lt.push(+id):lt.splice(i,1);renderLite()},
  saveLite:()=>saveLite(),
  unpause:()=>unpause(),
  shareBackup:()=>shareBackup(),
  showBackup:()=>showBackup(),
  importBackup:()=>importBackup(),
  restoreBak:()=>restoreBak(),
  settings:()=>openSettings(),
  pickAvatar:()=>document.getElementById('avatarFile').click(),
  toggleWorkday:(i)=>{const n=+i,x=S.wd.indexOf(n);x<0?S.wd.push(n):S.wd.splice(x,1);save();openSettings()},
  ics:()=>exportIcs(),
  habitPrefix:(j)=>{readHabit();cu.a=PRE[+j];renderHabit()},
  habitDay:(i)=>{readHabit();const n=+i,x=cu.w.indexOf(n);x<0?cu.w.push(n):cu.w.splice(x,1);cu.w.sort();renderHabit()},
  habitR:()=>{readHabit();cu.r=cu.r?0:1;renderHabit()},
  saveHabit:()=>saveHabit(),
  deleteHabit:()=>deleteHabit(),
};

/* ===== DELEGATION ===== */
document.addEventListener('click',e=>{
  const closeEl=e.target.closest('[data-close]');
  if(closeEl&&e.target===closeEl){cs();return}
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const {action,id}=el.dataset;
  const fn=ACTIONS[action];
  if(fn)fn(id,null,el);
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const {action}=el.dataset;
  if(action==='profileName'){S.p.name=el.value.trim();save();render()}
  else if(action==='avatarFile'){setAvatar(el)}
  else if(action==='ws'){if(/^\d{2}:\d{2}$/.test(el.value)){S.ws=el.value;save();render()}}
  else if(action==='we'){if(/^\d{2}:\d{2}$/.test(el.value)){S.we=el.value;save();render()}}
  else if(action==='habitA'){cu.a=el.value}
  else if(action==='habitD'){cu.d=el.value}
  else if(action==='habitT'){if(/^\d{2}:\d{2}$/.test(el.value))cu.t=el.value}
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-action]');
  if(el&&el.dataset.action==='avatarFile')setAvatar(el);
});

/* ===== TICK: точечное обновление «текущей» и «было» ===== */
let tickTimer=null;
function tick(){
  if(document.querySelector('.sh'))return;
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  render();
}
function scheduleTick(){
  clearInterval(tickTimer);
  tickTimer=setInterval(tick,60000);
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&!document.querySelector('.sh'))render();
});
scheduleTick();
window.addEventListener('pagehide',()=>save());

/* ===== BOOT ===== */
save();
render();
</script></body></html>
