function oSettings(){sheet(`<h1>Настройки</h1><div class="tm" style="margin-top:24px">Рабочие часы</div><div class="rw" style="margin-top:8px"><span>С</span><input type="time" class="tp" value="${S.ws}" onchange="S.ws=this.value||S.ws;save();render()"><span>До</span><input type="time" class="tp" value="${S.we}" onchange="S.we=this.value||S.we;save();render()"></div><div class="ch dys" style="margin-top:10px">${DN.map((n,i)=>`<button class="${S.wd.includes(i)?'on':''}" onclick="wd(${i})">${n}</button>`).join('')}</div>
<button class="sv g2" onclick="ics()">Добавить напоминания в Календарь</button><div class="tm" style="margin-top:6px">Только привязки с включённым напоминанием. Откроется Календарь: «Добавить все». Если не открылось, открой приложение в Safari.</div>
<div class="tm" style="margin-top:24px">Как давно пользуюсь</div>${useHtml()}<div class="tm" style="margin-top:24px">Копия данных</div><textarea class="in" id="bk"></textarea><div class="ch" style="margin-top:10px"><button onclick="shareBk()">Поделиться копией</button><button onclick="exp()">Показать текст</button><button onclick="imp()">Восстановить</button></div><div class="tm" style="margin-top:8px">Перенос на новый телефон: отправь копию себе, на новом телефоне вставь текст в поле выше и нажми «Восстановить».</div><button class="sv g2" onclick="cs()">Закрыть</button><div class="tm" style="margin-top:18px;text-align:center">Версия v${VER}</div>`,'lg')}
function openWeek(){wm=0;weekOffset=0;oW()}
function shiftWeek(delta){weekOffset=Math.max(0,weekOffset+delta);wm=0;oW();const b=document.querySelector('.sh .sb');if(b)b.scrollTop=0}
function stepWord(n){return n%10===1&&n%100!==11?'шаг':n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?'шага':'шагов'}
function weekStats(ds){const t=iso(new Date());return S.a.map(x=>{const plan=ds.filter(d=>d<=t&&(actv(x,d)||(S.d[d]||[]).includes(x.id))),done=plan.filter(d=>(S.d[d]||[]).includes(x.id));return {x,plan,done}})}
function dayCells(x,ds){const t=iso(new Date());return '<div class="week-days">'+ds.map(d=>{const planned=actv(x,d),done=(S.d[d]||[]).includes(x.id),future=d>t,state=!planned&&!done?'off':future?'future':done?'done':'miss',label=!planned&&!done?'не запланировано':future?'впереди':done?'сделано':'без отметки';return `<div class="week-day"><span>${DN[dow(d)]}</span><span class="week-mark ${state}" role="img" aria-label="${d}: ${label}">${state==='off'?'—':state==='done'?'✓':state==='future'?'·':'○'}</span></div>`}).join('')+'</div>'}
function weekCard(r,ds){return `<section class="week-card"><button class="week-title" onclick="oA(${r.x.id})" aria-label="Изменить: ${esc(r.x.d)}"><strong>${esc(r.x.d)}</strong><span class="tm">${esc(r.x.a)} · <span class="edit-word">Изменить</span></span></button>${dayCells(r.x,ds)}<div class="tm">${r.plan.length?'Сделано '+r.done.length+' из '+r.plan.length:'На прошедшие дни не запланировано'}</div></section>`}
function oW(){const W=wk(weekOffset),t=iso(new Date()),rows=weekStats(W),done=rows.reduce((n,r)=>n+r.done.length,0),plan=rows.reduce((n,r)=>n+r.plan.length,0),fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'}),
 pl=(x,ds)=>weekStats(ds).find(r=>r.x.id===x.id).plan,dn=(x,ds)=>weekStats(ds).find(r=>r.x.id===x.id).done.length;
 const four=[3,2,1,0].map(o=>{const ds=wk(o),rs=weekStats(ds),d=rs.reduce((n,r)=>n+r.done.length,0),p=rs.reduce((n,r)=>n+r.plan.length,0);return `<div class="wr"><strong>${fmt(ds[0])} – ${fmt(ds[6])}</strong><div class="tm">Сделано ${d} из ${p}</div>${rs.map(r=>`<div style="margin-top:12px">${esc(r.x.d)} · ${r.done.length} из ${r.plan.length}${dayCells(r.x,ds)}</div>`).join('')}</div>`}).join('');
 sheet(`<h1>${weekOffset?'Неделя':'Эта неделя'}</h1><div class="tm">${fmt(W[0])} – ${fmt(W[6])} · ${W[0].slice(0,4)}</div><div class="week-total"><strong>Ты сделала ${done} ${stepWord(done)}</strong><div class="tm">${plan?'Из '+plan+' запланированных'+(weekOffset?'.':' к сегодняшнему дню.'):'Пока нет запланированных действий на прошедшие дни.'}</div></div>${rows.map(r=>weekCard(r,W)).join('')||'<p class="tm">Пока нет привязок.</p><button class="sv g2" onclick="oA(0)">Добавить привязку</button>'}<p class="tm">✓ — сделано · ○ — без отметки · бледная точка — впереди · — нет плана</p><label class="tm" for="weekNote">Что помогало на этой неделе?</label><input id="weekNote" class="in" maxlength="80" placeholder="Например: книга лежала у кровати" value="${esc(S.wn[W[0]]||'')}" oninput="S.wn['${W[0]}']=this.value;save()"><div class="week-nav"><button onclick="shiftWeek(1)">‹ Предыдущая неделя</button>${weekOffset?'<button onclick="shiftWeek(-1)">Следующая ›</button>':''}</div>${weekOffset?'<button class="lnk" onclick="openWeek()">Вернуться к этой неделе</button>':''}${enHtml(W)}<details style="margin-top:24px" ${wm?'open':''}><summary>За более долгий срок</summary><div class="ch"><button class="${wm===1?'on':''}" onclick="wmode(1)">4 недели</button><button class="${wm===2?'on':''}" onclick="wmode(2)">Месяц</button></div>${wm===2?monthHtml(pl,dn):wm===1?four:''}</details><button class="sv g2" onclick="cs()">Закрыть</button>`,'lg')}
const ie=s=>String(s).replace(/([,;\\])/g,'\\$1');
function icsText(){const now=new Date(),st=iso(now).replace(/-/g,''),BY=['MO','TU','WE','TH','FR','SA','SU'],k=(now.getDay()+6)%7;
 const ev=S.a.filter(x=>x.r).map(x=>{const off=Math.min(...x.w.map(w=>(w-k+7)%7)),d=new Date(now);d.setDate(now.getDate()+off);const s=ie(x.a+' → '+x.d);
 return['BEGIN:VEVENT','UID:a'+x.id+'@okna','DTSTAMP:'+st+'T000000Z','DTSTART:'+iso(d).replace(/-/g,'')+'T'+x.t.replace(':','')+'00','DURATION:PT15M','RRULE:FREQ=WEEKLY;BYDAY='+x.w.map(w=>BY[w]).join(','),'SUMMARY:'+s,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+s,'TRIGGER:PT0S','END:VALARM','END:VEVENT'].join('\r\n')});
 return['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//okna//RU','CALSCALE:GREGORIAN'].concat(ev,['END:VCALENDAR']).join('\r\n')}
function ics(){if(!S.a.some(x=>x.r)){toast('Включи напоминание хотя бы у одной привязки');return}const t=icsText(),f=new File([t],'okna.ics',{type:'text/calendar'});
 if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else location.href=URL.createObjectURL(new Blob([t],{type:'text/calendar'}))}
function shareBk(){S.bk=iso(new Date());save();const t=JSON.stringify(S);if(navigator.share){navigator.share({title:'Копия данных: Мои окна',text:t}).then(()=>toast('Копия отправлена')).catch(()=>{})}else{try{navigator.clipboard.writeText(t);toast('Копия скопирована, вставь её в заметки')}catch(x){toast('Нажми «Показать текст» и скопируй вручную')}}render()}
function exp(){S.bk=iso(new Date());save();const e=document.getElementById('bk');e.value=JSON.stringify(S);e.select();try{navigator.clipboard.writeText(e.value)}catch(x){}}
function imp(){try{const o=JSON.parse(document.getElementById('bk').value);if(!o||!Array.isArray(o.a)||typeof o.d!='object')throw 0;S=o;if(!S.p)S.p={name:'',h:'',why:'',w:[],e:[]};S.h=S.h||{};S.m=S.m||{o:S.st||iso(new Date()),u:[],f:''};S.bk=iso(new Date());save();cs();render();alert('Данные восстановлены')}catch(e){alert('Не получилось: вставь в поле текст копии целиком')}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!document.querySelector('.sh'))render()});setInterval(()=>{if(!document.querySelector('.sh')&&document.activeElement.tagName!='INPUT')render()},60000);
save();render();
</script></body></html>
