.board .tick.hour{font-size:12px;font-weight:600;color:#55657a}
.board .tick.first-tick{transform:translateY(-50%);padding-top:0;z-index:9}

/* ASPECT unified action system: six roles and two control sizes. */
:root{--btn-accent:#245cc5;--btn-accent-hover:#1b4b9f;--btn-border:#d6dfeb;--btn-danger:#b4232e;--btn-danger-bg:#fff5f5}
button[class*="btn-"],summary[class*="btn-"]{box-sizing:border-box;border-radius:8px;font-size:13px;font-weight:600;line-height:1.3;transition:background .12s,border-color .12s,color .12s,box-shadow .12s}
.btn-compact{min-height:30px;padding:5px 10px}
.btn-standard{min-height:36px;padding:8px 14px}
.btn-primary{background:var(--btn-accent);border:1px solid var(--btn-accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--btn-accent-hover);border-color:var(--btn-accent-hover);color:#fff}
.btn-secondary{background:#fff;border:1px solid var(--btn-border);color:#24374f}
.btn-secondary:hover:not(:disabled){background:#edf3fc;border-color:#b9cbe4}
.btn-ghost{background:transparent;border:1px solid transparent;color:#52657e}
.btn-ghost:hover:not(:disabled){background:#edf3fc;color:#24374f}
.btn-danger{background:var(--btn-danger-bg);border:1px solid #efb9bd;color:var(--btn-danger)}
.btn-danger:hover:not(:disabled){background:#ffe5e7;border-color:#df8f96;color:#941c25}
.btn-filter{background:#f7f9fc;border:1px solid #e2e8f0;color:#65758b}
.btn-filter:hover:not(:disabled){background:#edf3fc}
.btn-filter.active,.btn-filter[aria-pressed="true"]{background:#e8f0ff;border-color:#9cb8ef;color:#1e4b9e}
.btn-list{min-height:48px;text-align:left}
button[class*="btn-"]:focus-visible,summary[class*="btn-"]:focus-visible{outline:2px solid #356bdb;outline-offset:2px}
button[class*="btn-"]:disabled{opacity:.45;cursor:not-allowed}
button[class*="btn-"]:active:not(:disabled){filter:brightness(.96)}
/* Override legacy selectors that previously assigned inconsistent button sizes. */
.top .top-actions button.btn-compact,.top .top-actions summary.btn-compact{min-height:30px;padding:5px 10px!important;font-size:12px!important;font-weight:600}
.top .add-menu-items button.btn-list{min-height:48px;padding:10px 12px!important;font-size:13px!important}
.right button.btn-standard,.right .directory-card-actions button.btn-standard{min-height:36px;padding:8px 14px;font-size:13px;font-weight:600}
.right button.btn-compact{min-height:30px;padding:5px 10px;font-size:12px;font-weight:600}
.right button.btn-ghost{background:transparent;border-color:transparent}
.right button.btn-ghost:hover{background:#edf3fc}
.right button.btn-danger{background:var(--btn-danger-bg);border-color:#efb9bd;color:var(--btn-danger)}
.right button.btn-danger:hover{background:#ffe5e7;border-color:#df8f96}
#reset-confirm-ok.btn-danger,#unsaved-discard.btn-danger{background:var(--btn-danger-bg);border-color:#efb9bd;color:var(--btn-danger)}
#reset-confirm-ok.btn-danger:hover,#unsaved-discard.btn-danger:hover{background:#ffe5e7}

/* Compact desktop density tokens: labels, fields, spacing and checkboxes. */
:root{--ui-space-1:4px;--ui-space-2:8px;--ui-space-3:12px;--ui-space-4:16px;--ui-space-5:24px;--ui-control-height:36px}
.right{padding:16px}
.right h2,
.right h3{font-size:15px;line-height:1.35;font-weight:600;margin:16px 0 8px}
.right .sub{font-size:11px;line-height:1.4}
.right label{font-size:12px;font-weight:600;line-height:1.35;margin:12px 0 5px}
.right input:not([type=checkbox]):not([type=color]),.right select,.right textarea{font-size:13px;font-weight:400;line-height:1.35;border-radius:8px}
.right input:not([type=checkbox]):not([type=color]),.right select{height:var(--ui-control-height);min-height:var(--ui-control-height);padding:6px 9px}
.right textarea{padding:8px 9px}
.right input[type=checkbox],.right input[type=radio]{width:16px;height:16px;min-width:16px;min-height:16px;margin:0;flex:none;accent-color:#245cc5}
.right .multi{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px;row-gap:8px;margin:8px 0 12px}
.right .multi label{display:flex;align-items:center;gap:8px;margin:0;font-size:12px;line-height:1.35;font-weight:500;min-height:24px;overflow-wrap:anywhere}
.right .pair{gap:8px}
.right .buttons{gap:8px;margin-top:12px}
.right .advanced-fields{padding:8px 10px;margin:12px 0;border-radius:8px}
.right .advanced-fields summary{font-size:12px;font-weight:600}
.right .box{padding:10px;margin:8px 0}
.right .notice{padding:8px 10px;margin:10px 0}
.right .teacher-head{margin-bottom:12px}
.right .teacher-identity{margin:12px 0 16px}
.right .teacher-schedule-title{padding-top:12px;margin-bottom:8px}
.right .teacher-schedule{gap:8px}
.right .teacher-day label{margin:0}
.right .settings-item.btn-list{min-height:52px;padding:8px 10px;gap:8px}

.right .settings-icon{width:30px;height:30px}
.right .settings-chevron{font-size:18px}
.right .teacher-filter{margin:8px 0}
.right .teacher-filter label{margin:0}

.right button.btn-standard,.right .directory-card-actions button.btn-standard{min-height:36px;padding:8px 14px}
.right button.btn-compact{min-height:30px;padding:5px 10px}
.right button.btn-primary{background:var(--btn-accent);border-color:var(--btn-accent);color:#fff}
.right button.btn-primary:hover:not(:disabled){background:var(--btn-accent-hover);border-color:var(--btn-accent-hover);color:#fff}
.top .top-actions button.btn-compact,.top .top-actions summary.btn-compact{min-height:30px;padding:5px 10px!important}
.top .date-picker{min-height:30px;padding:5px 10px}

/* Timetable cards: name and teacher always present; time on lessons/events. */
.lesson .card-heading{display:flex;align-items:baseline;gap:4px;min-width:0;flex-shrink:0}
.lesson .card-heading strong{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson .card-short-info{display:flex;align-items:baseline;justify-content:flex-end;gap:4px;min-width:0;max-width:58%;font-size:9px;line-height:1.1;color:#52657e}
.lesson .card-short-info .card-time{font-size:9px}
.lesson .card-short-teacher{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson.short{justify-content:center}
.lesson.short .card-heading strong{font-size:10px}
.lesson.medium .card-teacher{font-size:10px;line-height:1.15}
.lesson.medium .card-meta{font-size:9px;line-height:1.1}
.lesson.long .card-teacher{font-size:11px;line-height:1.2}
.lesson.split .card-short-info{max-width:50%;gap:2px;font-size:8px}
.lesson.split .card-short-info .card-time{font-size:8px}

/* Shared directory list item: subjects, routines, rooms, teachers. */
.right .teacher-list{border-radius:8px;overflow:hidden}
.right .teacher-list-item.btn-list{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:46px;padding:10px 12px;border-radius:0;text-align:left}
.right .teacher-list-item.btn-list>span:first-child{min-width:0;flex:1}
.right .teacher-list-item.btn-list>span:last-child{flex:none;font-size:14px;line-height:1;color:#718095}
.right .teacher-list-item.btn-list strong{display:block;font-size:13px;line-height:1.3;font-weight:600;white-space:normal;overflow-wrap:anywhere}
.right .teacher-list-item.btn-list small{display:block;font-size:11px;line-height:1.25;margin-top:2px}
.right .dir-item-title{display:flex;align-items:center;gap:10px;min-width:0}
.right .dir-item-title>span:last-child{min-width:0;flex:1}
.right .dir-swatch{width:14px;height:14px;min-width:14px;min-height:14px;border-radius:4px;flex:none}
.right #dir-search,.right #teacher-search{height:36px;min-height:36px;font-size:13px}
.right .teacher-filter{font-size:12px;gap:6px;margin:8px 0}
.right .teacher-filter label{font-size:12px;font-weight:500;gap:6px}
.right .dir-default-color{font-size:12px;margin:8px 0}



/* Two-line medium cards: avoid clipping the title when height is constrained. */
.lesson.medium{justify-content:flex-start;padding:2px 5px;gap:1px}
.lesson.medium .card-heading{flex:none;min-height:0}
.lesson.medium .card-heading strong{font-size:11px;line-height:1.15}
.lesson.medium .card-meta{display:flex;align-items:baseline;min-width:0;gap:5px;font-size:9px;line-height:1.15;flex:none;white-space:nowrap}
.lesson.medium .card-inline-teacher{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#52657e}
.lesson.medium .card-time{flex:none}
.lesson.short .card-heading{align-items:center;min-width:0}

/* Timetable card density: two readable rows within standard lesson height. */
.lesson:not(.short){justify-content:flex-start;gap:1px;padding:3px 5px}
.lesson:not(.short) .card-heading{display:flex;align-items:center;min-height:0;flex:0 0 auto;line-height:1.1}
.lesson:not(.short) .card-heading strong{font-size:11px;font-weight:600;line-height:1.1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson:not(.short) .card-meta{display:flex;align-items:baseline;min-width:0;gap:4px;flex:0 0 auto;font-size:9px;line-height:1.1;white-space:nowrap;overflow:hidden}
.lesson:not(.short) .card-meta .card-time{font-size:9px;flex:none}
.lesson:not(.short) .card-meta .card-location{font-size:9px;min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson:not(.short) .card-meta .card-inline-teacher{font-size:10px;font-weight:500;min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#52657e}
.lesson:not(.short) .card-problems{font-size:9px;line-height:1.1}
.lesson.split:not(.short){padding:2px 3px}
.lesson.split:not(.short) .card-meta{gap:2px}
.lesson.split:not(.short) .card-meta .card-inline-teacher{font-size:9px}

/* One typography scale for every timetable card, independent of duration and split. */
.lesson .card-heading strong,
.lesson.short .card-heading strong,
.lesson.medium .card-heading strong,
.lesson.long .card-heading strong,
.lesson.split .card-heading strong,
.lesson.short strong,
.lesson.medium strong,
.lesson.long strong,
.lesson.split strong{font-size:11px;font-weight:600;line-height:1.1}
.lesson .card-meta,.lesson.medium .card-meta,.lesson.split .card-meta,
.lesson .card-time,.lesson .card-location,
.lesson .card-short-info,.lesson.split .card-short-info,
.lesson .card-short-info .card-time,.lesson.split .card-short-info .card-time{font-size:9px;font-weight:400;line-height:1.1}
.lesson .card-inline-teacher,.lesson.medium .card-inline-teacher,
.lesson.split .card-inline-teacher,.lesson .card-short-teacher,
.lesson .card-teacher,.lesson.medium .card-teacher,.lesson.long .card-teacher,
.lesson.split .card-teacher{font-size:10px;font-weight:500;line-height:1.1}
.lesson .card-problems,.lesson.split .card-problems{font-size:9px;font-weight:600;line-height:1.1}
.lesson.short .card-heading{align-items:center}

/* Approved card hierarchy: title, teacher, then unobtrusive time and room. */
.lesson:not(.short){justify-content:flex-start;gap:1px;padding:3px 5px}
.lesson:not(.short) .card-heading{flex:0 0 auto;min-height:0}
.lesson .card-heading strong,.lesson.short .card-heading strong,.lesson.medium .card-heading strong,.lesson.long .card-heading strong,.lesson.split .card-heading strong{font-size:11px;font-weight:600;line-height:1.1}
.lesson:not(.short) .card-teacher,.lesson.medium .card-teacher,.lesson.long .card-teacher,.lesson.split .card-teacher,.lesson .card-short-teacher{font-size:10px;font-weight:500;line-height:1.1;color:#52657e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 0 auto}
.lesson:not(.short) .card-meta{display:flex;align-items:baseline;gap:8px;min-width:0;flex:0 0 auto;white-space:nowrap;overflow:hidden;font-size:9px;line-height:1.1}
.lesson:not(.short) .card-meta .card-time{font-size:9px;font-weight:400;color:#7b8ba2;flex:none}
.lesson:not(.short) .card-meta .card-location{font-size:9px;font-weight:600;color:#344e75;min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson:not(.short) .card-meta .card-location::before{content:none}
.lesson.short .card-short-info{min-width:0;max-width:58%}
.lesson.split:not(.short) .card-teacher{font-size:10px}

/* Split lessons: compact group marker, primary information protected from clipping. */
.lesson.split{overflow:hidden}
.lesson.split .card-heading{display:flex;align-items:baseline;gap:3px;min-width:0}
.lesson.split .card-group{font-size:9px;font-weight:600;line-height:1.1;flex:none;color:#52657e}
.lesson.split .card-heading strong{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson.split.split-wrap .card-heading strong{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.lesson.split:not(.short) .card-teacher{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson.split:not(.split-meta) .card-meta{display:none}
.lesson.split.split-meta .card-meta{gap:4px}
.lesson.split.split-meta .card-meta .card-location{min-width:0}

.archive-modal-shade{position:fixed;inset:0;background:rgba(20,31,49,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.archive-modal{width:min(520px,100%);max-height:min(85vh,720px);overflow:auto;background:#fff;border-radius:14px;box-shadow:0 20px 70px #18263c35;padding:20px;color:#24374f}
.archive-modal header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.archive-modal h2{font-size:18px;margin:0}
.archive-modal p{font-size:13px;line-height:1.5;color:#52657e}
.archive-modal .archive-close{border:0;background:transparent;font-size:24px;padding:0 6px}
.archive-field{display:flex;flex-direction:column;gap:6px;margin:14px 0;font-size:12px;font-weight:600}
.archive-field select{width:100%;min-height:36px;padding:7px 9px;border:1px solid #cbd6e6;border-radius:7px;background:white;color:#24374f;font-size:13px}
.archive-item{border-bottom:1px solid #e7eaf0;padding-bottom:10px}
.archive-item span{font-weight:500;line-height:1.4}
.archive-modal footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.archive-modal .archive-submit{background:#245cc5;color:#fff;border-color:#245cc5}
.archive-modal .archive-error{color:#b42318}
.archive-modal [hidden]{display:none!important}

/* Aspect typography audit: final shared scale, consistent with 260px editor. */
:root{--aspect-title:18px;--aspect-section:15px;--aspect-body:13px;--aspect-label:12px;--aspect-note:11px;--aspect-control:36px;--aspect-compact:30px}
.right{font-size:var(--aspect-body);line-height:1.4}
.right h2,.right .teacher-identity h2{font-size:var(--aspect-title);font-weight:600;line-height:1.25;letter-spacing:0;overflow-wrap:normal;word-break:normal}
.right h3,.right .teacher-schedule-title strong{font-size:var(--aspect-section);font-weight:600;line-height:1.3}
.right label{font-size:var(--aspect-label);font-weight:500}
.right .sub,.right .teacher-role,.right .teacher-filter,.right .teacher-filter label{font-size:var(--aspect-label);line-height:1.35}
.right .teacher-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.right .teacher-head h2{flex:1 0 100%;margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right .teacher-head #teacher-add-toggle{margin-left:auto;min-height:var(--aspect-compact);padding:5px 10px;font-size:12px;font-weight:600}
.right .teacher-list-item.btn-list{min-height:46px;padding:8px 12px}
.right .teacher-list-item.btn-list strong{font-size:var(--aspect-body);font-weight:600}
.right .teacher-identity{margin:12px 0}
.right .teacher-identity h2{margin:0 0 8px}
.right .directory-card-actions{display:flex;gap:8px;margin:8px 0 16px}
.right .directory-card-actions button.btn-standard{min-height:var(--aspect-control);padding:7px 8px;font-size:var(--aspect-body);font-weight:500;line-height:1.3}
.right .directory-card-actions .ui-icon{width:14px;height:14px}
.right .teacher-schedule-title{padding-top:12px;margin-bottom:8px}
.right .teacher-schedule-title span{font-size:var(--aspect-label);font-weight:400}
.right .teacher-schedule{gap:8px}
.right .teacher-day{align-items:center}
.right .teacher-day label{font-size:var(--aspect-body);font-weight:500}
.right .teacher-day input[type=time]{height:var(--aspect-control);min-height:var(--aspect-control);font-size:var(--aspect-body);font-weight:400;padding:6px 4px}
.right #dir-search,.right #teacher-search,.right input:not([type=checkbox]):not([type=color]),.right select{height:var(--aspect-control);min-height:var(--aspect-control);font-size:var(--aspect-body)}
.right button.btn-standard{min-height:var(--aspect-control);font-size:var(--aspect-body)}
.right button.btn-compact{min-height:var(--aspect-compact);font-size:12px}
.right .panel-back{font-size:var(--aspect-label);font-weight:400}
.right .settings-label b{font-size:var(--aspect-body);font-weight:600}
.right .settings-label small{font-size:var(--aspect-note);font-weight:400}
.archive-modal h2{font-size:var(--aspect-title);font-weight:600}
.archive-modal .archive-field{font-size:var(--aspect-label);font-weight:500}
.archive-modal .archive-field select{font-size:var(--aspect-body);min-height:var(--aspect-control)}
.archive-modal footer button{font-size:var(--aspect-body);min-height:var(--aspect-control)}

/* Responsive guardrails: 260px editor and long localized labels. */
.right .teacher-head h2{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.right .teacher-filter{display:flex;align-items:center;justify-content:space-between;gap:8px}
.right .teacher-filter label{display:inline-flex;align-items:center;white-space:nowrap}
.right .teacher-schedule-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.right .teacher-schedule-title span{white-space:nowrap}
.right .teacher-day{grid-template-columns:40px minmax(0,1fr) 9px minmax(0,1fr);gap:4px;min-width:0}
.right .teacher-day input[type=time]{width:100%;min-width:0;box-sizing:border-box}
.right .directory-card-actions button{min-width:0;white-space:nowrap}
.right .teacher-list-item.btn-list>span:first-child{min-width:0}
.right .teacher-list-item.btn-list strong{overflow-wrap:anywhere}

/* Consistent forms and directory layouts, scoped to the coordinator editor. */
.right .teacher-head{margin-bottom:12px}
.right .teacher-head h2{flex:1 1 100%;max-width:100%;font-size:var(--aspect-title);font-weight:600;white-space:nowrap}
.right .teacher-head #teacher-add-toggle{flex:none;align-self:flex-end}
.right .teacher-list-item.btn-list{height:auto;min-height:46px;padding:8px 12px}
.right .settings-item.btn-list{min-height:52px;padding:8px 10px}
.right .teacher-filter{flex-wrap:wrap;font-size:var(--aspect-label)}
.right .teacher-filter label{margin:0;font-size:var(--aspect-label)}
.right .teacher-identity h2{font-size:var(--aspect-title);font-weight:600}
.right .teacher-day{grid-template-columns:40px minmax(0,1fr) 9px minmax(0,1fr);gap:4px}
.right .teacher-day input[type=time]{width:100%;min-width:0;height:36px;min-height:36px;font-size:13px;line-height:1.2;padding:5px 2px}
.right .teacher-day .teacher-dash{font-size:12px;text-align:center}
.right .directory-card-actions button.btn-standard{flex:1 1 0;min-width:0;min-height:36px;font-size:13px;padding:6px 5px}
.right .teacher-schedule-title strong{font-size:15px;font-weight:600}
.right .teacher-schedule-title span{font-size:11px}
.right .teacher-actions button,.right .buttons button{font-size:13px}
.right input:not([type=checkbox]):not([type=color]):focus-visible,.right select:focus-visible,.right textarea:focus-visible{outline:2px solid #356bdb;outline-offset:1px}

/* Compact creation and editing forms for lessons, routines and events only. */
.right.aspect-form-editor{padding:12px 14px;font-size:12px;line-height:1.35}
.right.aspect-form-editor>.sub,.right.aspect-form-editor .sub{font-size:10px;line-height:1.3;color:#728095;margin:0 0 6px}
.right.aspect-form-editor h2{font-size:16px;font-weight:600;line-height:1.25;letter-spacing:0;margin:0 0 12px}
.right.aspect-form-editor h3{font-size:13px;font-weight:600;margin:12px 0 6px}
.right.aspect-form-editor>label{display:block;font-size:11px;font-weight:500;line-height:1.25;margin:10px 0 4px}
.right.aspect-form-editor .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}
.right.aspect-form-editor .pair label{display:block;font-size:11px;font-weight:500;margin:0 0 4px}
.right.aspect-form-editor input:not([type=checkbox]):not([type=color]),.right.aspect-form-editor select{height:32px;min-height:32px;font-size:12px;line-height:1.2;padding:5px 7px;border-radius:7px}
.right.aspect-form-editor .pair input{width:100%;min-width:0;padding:4px 3px}

function fitPdfToOnePage(){
 const frame=$('pdf-frame'),doc=frame.contentDocument;
 if(!doc||!doc.body)return;
 // A3 landscape, printable area 404 × 281 mm. Use CSS pixels at 96 dpi.
 const maxHeight=281*96/25.4-8;
 const maxWidth=404*96/25.4-8;
 doc.documentElement.style.width='404mm';
 doc.body.style.setProperty('--print-zoom','1');
 const naturalHeight=doc.body.scrollHeight;
 const naturalWidth=doc.body.scrollWidth;
 let factor=Math.min(1,maxHeight/Math.max(1,naturalHeight),maxWidth/Math.max(1,naturalWidth));
 factor=Math.max(.25,Math.floor(factor*100)/100);
 doc.body.style.setProperty('--print-zoom',String(factor));
 // Second measurement compensates for browser rounding and font metrics.
 for(let i=0;i<3;i++){
  const h=doc.body.getBoundingClientRect().height;
  const w=doc.body.getBoundingClientRect().width;
  if(h<=maxHeight&&w<=maxWidth)break;
  factor=Math.max(.2,Math.floor(factor*Math.min(maxHeight/h,maxWidth/w)*98)/100);
  doc.body.style.setProperty('--print-zoom',String(factor));
 }
}
