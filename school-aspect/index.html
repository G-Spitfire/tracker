function fitPdfToOnePage(){
 const frame=$('pdf-frame'),doc=frame.contentDocument;
 if(!doc||!doc.body)return;
 // A3 landscape, printable area 404 × 281 mm. Use CSS pixels at 96 dpi.
 const maxHeight=281*96/25.4-8;
 const maxWidth=404*96/25.4-8;
 doc.documentElement.style.width='404mm';
 doc.body.style.setProperty('--print-zoom','1');
 const naturalHeight=doc.body.scrollHeight;
 const naturalWidth=doc.body.scrollWidth;
 let factor=Math.min(1,maxHeight/Math.max(1,naturalHeight),maxWidth/Math.max(1,naturalWidth));
 factor=Math.max(.25,Math.floor(factor*100)/100);
 doc.body.style.setProperty('--print-zoom',String(factor));
 // Second measurement compensates for browser rounding and font metrics.
 for(let i=0;i<3;i++){
  const h=doc.body.getBoundingClientRect().height;
  const w=doc.body.getBoundingClientRect().width;
  if(h<=maxHeight&&w<=maxWidth)break;
  factor=Math.max(.2,Math.floor(factor*Math.min(maxHeight/h,maxWidth/w)*98)/100);
  doc.body.style.setProperty('--print-zoom',String(factor));
 }
}
