<style>

nt-weight:700;display:flex;align-items:center;gap:7px}.navbar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid #dce4ef;display:flex;justify-content:center;z-index:50;padding:7px 8px max(10px,env(safe-area-inset-bottom))}.nav-inner{width:min(100%,720px);display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.nav{border:0;background:transparent;color:#66768a;display:grid;justify-items:center;gap:3px;padding:7px 0;border-radius:10px;font-size:11px;font-weight:600}.nav.active{background:#e8eefc;color:#2456bf}.nav .sym{font-size:22px;line-height:24px}.nav.plus{color:#2456bf}.modal-cover{position:fixed;inset:0;background:#17243a88;z-index:100;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(100%,600px);max-height:94vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:20px 20px max(25px,env(safe-area-inset-bottom));box-shadow:0 -8px 30px #16243b22}.modal .modal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}.field{display:grid;gap:6px;margin:0 0 15px}.field label,.field-label{font-size:13px;color:#4a5a6e;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd7e5;border-radius:9px;padding:11px;background:white;min-height:42px;color:#17243a}.field textarea{min-height:85px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks{display:flex;flex-wrap:wrap;gap:8px}.day-label{border:1px solid #dce5f3;border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:5px;font-size:13px}.modal-foot{display:flex;gap:8px;margin-top:18px}.modal-foot .button{flex:1}.notice{border-radius:12px;padding:12px 14px;border:1px solid #f0ddae;background:#fff9e9;color:#745319;font-size:13px;line-height:1.5}.notice.info{background:#eef4ff;border-color:#d3e1ff;color:#375b95}.bar-rows{display:grid;gap:7px}.bar-row{display:grid;grid-template-columns:86px 1fr 32px;align-items:center;gap:8px;font-size:12px}.bar-track{height:12px;border-radius:6px;background:#e9eff7;overflow:hidden}.bar-fill{height:100%;background:#5e89e5;border-radius:6px}.chart{display:flex;align-items:end;height:108px;gap:9px;border-bottom:1px solid #e0e8f2;padding:0 4px 0}.barcol{flex:1;display:grid;justify-items:center;align-content:end;height:100%;gap:4px;color:#8291a5;font-size:11px}.barcol i{width:100%;max-width:45px;min-height:2px;background:#6a90dc;border-radius:5px 5px 0 0}.grade{border-radius:9px;min-width:34px;height:35px;padding:5px 7px;background:#e5f5e9;color:#216d37;font-size:20px;font-weight:800;display:grid;place-items:center}.grade.g3{background:#fff3dc;color:#9b620b}.grade.g2{background:#ffeded;color:#b63434}.grade.g4{background:#eaf0ff;color:#315dc1}.small-note{font-size:11px;color:#8291a5}.toast{position:fixed;bottom:87px;left:50%;transform:translateX(-50%);background:#193051;color:white;padding:10px 15px;border-radius:10px;z-index:150;font-size:13px;max-width:90vw}.details{display:grid;gap:14px}.link{border:0;background:none;color:#2456bf;padding:2px;font-weight:650;cursor:pointer;text-align:left}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:14px;background:#f6f9fe;border:1px solid #e3eaf5;border-radius:12px}.stat strong{display:block;font-size:24px;margin-top:4px}.datehead{margin:18px 0 8px;font-size:14px;color:#60738c}.switcharea{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.quote{background:#f4f7fc;border-left:3px solid #9ab7e8;border-radius:5px;padding:10px 12px;font-size:13px;color:#53677e}.mini-line{width:100%;height:100px}.footer-note{margin:24px 0;text-align:center;color:#92a2b6;font-size:11px}@media(max-width:560px){.app{padding:14px 12px 98px}.brand{font-size:21px}.button{padding:9px 10px}.card{padding:14px}.grid{gap:9px}.big-number{font-size:29px}.form-grid{grid-template-columns:1fr}.widget.small .card{min-height:150px}.bar-row{grid-template-columns:65px 1fr 28px}.page-title h1{font-size:24px}}

</style></head><body><div id="app" class="app"></div><div id="modal-root"></div><div id="toast-root"></div>
<script>
'use strict';
const STORE='vektor_logic_mvp_2026_10';
const $=sel=>document.querySelector(sel);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>`id_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,9)}`;
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dt=(s)=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const shift=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const niceDate=s=>s?new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(dt(s)):'Без даты';
const DOW=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const longday=d=>new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(dt(d));
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
function demo(){const now=today(),p1=uid(),p2=uid(),s1=uid(),s2=uid(),s3=uid();
let tasks=[
{ id:uid(),title:'Сделать математику',date:now,deadline:'',repeat:'none',days:[],repeatStart:'',repeatEnd:'',projectId:'',stageId:'',done:true,doneDates:{}},
{ id:uid(),title:'Зарядка 10 минут',date:'',deadline:'',repeat:'daily',days:[],repeatStart:shift(now,-9),repeatEnd:'',projectId:'',stageId:'',done:false,doneDates:{[now]:'done',[shift(now,-1)]:'done',[shift(now,-2)]:'done'}},
{ id:uid(),title:'Выучить 10 английских слов',date:now,deadline:'',repeat:'none',days:[],repeatStart:'',repeatEnd:'',projectId:'',stageId:'',done:true,doneDates:{}},
{ id:uid(),title:'Создать первый экран игры',date:now,deadline:now,repeat:'none',days:[],repeatStart:'',repeatEnd:'',projectId:p1,stageId:s2,done:false,doneDates:{}},
{ id:uid(),title:'Прочитать 20 страниц',date:'',deadline:'',repeat:'weekly',days:[1,3,5],repeatStart:shift(now,-14),repeatEnd:'',projectId:'',stageId:'',done:false,doneDates:{}},
{ id:uid(),title:'Придумать жанр игры',date:'',deadline:'',repeat:'none',days:[],repeatStart:'',repeatEnd:'',projectId:p1,stageId:s1,done:true,doneDates:{}},
{ id:uid(),title:'Написать сюжет',date:'',deadline:'',repeat:'none',days:[],repeatStart:'',repeatEnd:'',projectId:p1,stageId:s1,done:true,doneDates:{}},
{ id:uid(),title:'Добавить управление',date:shift(now,2),deadline:'',repeat:'none',days:[],repeatStart:'',repeatEnd:'',projectId:p1,stageId:s2,done:false,doneDates:{}},
{ id:uid(),title:'Сделать три уровня',date:shift(now,4),deadline:'',repeat:'none',days:[],repeatStart:'',repeatEnd:'',projectId:p1,stageId:s2,done:false,doneDates:{}},
{ id:uid(),title:'Протестировать игру',date:'',deadline:'',repeat:'none',days:[],repeatStart:'',repeatEnd:'',projectId:p1,stageId:s3,done:false,doneDates:{}},
{ id:uid(),title:'Решить олимпиадный вариант',date:shift(now,1),deadline:shift(now,4),repeat:'none',days:[],repeatStart:'',repeatEnd:'',projectId:p2,stageId:'',done:false,doneDates:{}}
];
return {tasks,projects:[{id:p1,title:'Создать свою игру',description:'Сделать небольшую игру с несколькими уровнями.',deadline:shift(now,48),status:'active',stages:[{id:s1,title:'Планирование'},{id:s2,title:'Разработка'},{id:s3,title:'Запуск'}]},{id:p2,title:'Подготовиться к олимпиаде',description:'Решать задачи и подготовиться к школьной олимпиаде.',deadline:'',status:'active',stages:[]}],widgets:[{id:'today',size:'large'},{id:'school',size:'small'},{id:'project',size:'small'},{id:'week',size:'wide'}]};
}
function load(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x && Array.isArray(x.tasks)&&Array.isArray(x.projects)&&Array.isArray(x.widgets))return {tasks:x.tasks,projects:x.projects,widgets:x.widgets};}catch(e){}return demo()}
let S=load();function save(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){toast('Браузер не сохранил данные. Проверьте настройки хранения.')}};
let UI={tab:'home',filter:'today',projectId:'',subject:'',year:'2026-2027',quarter:1,modal:null,projFilter:'active'};
const project=id=>S.projects.find(p=>p.id===id);
const task=id=>S.tasks.find(t=>t.id===id);
function activeDate(t,date){if(t.repeat==='none')return t.date===date||(!t.date&&t.deadline===date); if(t.repeatStart&&date<t.repeatStart)return false;if(t.repeatEnd&&date>t.repeatEnd)return false;const dw=dt(date).getDay();return t.repeat==='daily'||(t.repeat==='weekly'&&t.days.includes(dw===0?7:dw));}
function status(t,date){return t.repeat==='none'?(t.done?'done':'open'):(t.doneDates?.[date]||'open')}
function getDay(date){return S.tasks.filter(t=>activeDate(t,date)).sort((a,b)=>Number(status(a,date)==='done')-Number(status(b,date)==='done') || (a.deadline||'9999').localeCompare(b.deadline||'9999'))}
function summary(date){const a=getDay(date);return {done:a.filter(t=>status(t,date)==='done').length,skip:a.filter(t=>status(t,date)==='skip').length,total:a.length}}
function isOverdue(t){return t.repeat==='none'&&!t.done && (t.deadline||t.date)&& (t.deadline||t.date)<today()}
function projectTasks(p){return S.tasks.filter(t=>t.projectId===p.id&&t.repeat==='none')}
function progress(p){const list=projectTasks(p);return {done:list.filter(t=>t.done).length,total:list.length,pct:list.length?Math.round(list.filter(t=>t.done).length/list.length*100):null}}
function fmt(n){return n===null||!Number.isFinite(n)?'—':n.toFixed(2).replace('.',',')}
function cloudSnapshot(){return window.schoolCloud?.snapshot?.()||null}
function cloudRows(){const snap=cloudSnapshot();if(!snap)return [];return snap.grades.filter(g=>!g.official&&g.score!==null&&(!snap.selectedFrom||g.date>=snap.selectedFrom)&&(!snap.selectedTo||g.date<=snap.selectedTo))}
function cloudMean(rows){return rows.length?rows.reduce((n,g)=>n+g.score,0)/rows.length:null}
function cloudSubjects(){return [...new Set(cloudRows().map(g=>g.subject))].sort((a,b)=>a.localeCompare(b,'ru'))}
function nav(){return `<nav class="navbar"><div class="nav-inner">${[['home','⌂','Главная'],['tasks','☑','Задачи'],['create','＋','Создать'],['projects','▤','Проекты'],['school','▥','Школа']].map(([id,ico,label])=>`<button class="nav ${UI.tab===id?'active':''} ${id==='create'?'plus':''}" data-action="nav" data-id="${id}"><span class="sym">${ico}</span><span>${label}</span></button>`).join('')}</div></nav>`}
function header(){return `<header class="top"><div><div class="brand">↗ Вектор <span>ТЕСТ</span></div><div class="sub">Задачи · Проекты · Школа</div></div><div class="top-actions"><button class="button tiny" data-action="backup">Скачать данные</button><button class="button tiny" data-action="settings">Настройки</button></div></header>`}
function render(){document.getElementById('app').innerHTML=header()+({home:homeView,tasks:tasksView,projects:projectsView,school:schoolView}[UI.tab]||homeView)()+nav()+`<div class="footer-note">Тестовая версия · задачи и проекты хранятся в этом браузере · оценки из школы</div>`;renderModal()}
function taskRow(t,date,opts={}){const st=status(t,date||today()),rec=t.repeat!=='none',label=rec?(t.repeat==='daily'?'Каждый день':t.days.map(d=>['','Пн','Вт','Ср','Чт','Пт','Сб','Вс'][d]).join(', ')):(t.date?'План: '+niceDate(t.date):'Без даты');const p=project(t.projectId);let extra=`${label}${p?' · '+esc(p.title):''}${t.deadline?' · Срок '+niceDate(t.deadline):''}`;
return `<div class="task-row"><button title="Отметить выполнение" class="check ${st==='done'?'done':''}" data-action="toggle-task" data-id="${esc(t.id)}" data-date="${esc(date||today())}">${st==='done'?'✓':st==='skip'?'–':''}</button><div class="task-main"><div class="task-name ${st==='done'?'done':''}">${esc(t.title)}</div><div class="task-meta">${extra}${st==='skip'?' · Пропущено':''}${isOverdue(t)?' · ПРОСРОЧЕНО':''}</div></div>${rec&&opts.skip?`<button title="Пропустить" class="button tiny ghost" data-action="skip-task" data-id="${esc(t.id)}" data-date="${esc(date)}">Пропуск</button>`:''}<button title="Открыть задачу" class="button tiny ghost" data-action="open-task" data-id="${esc(t.id)}">⋯</button></div>`}
function tasksOn(date,max){return getDay(date).slice(0,max||100).map(t=>taskRow(t,date,{skip:date===today()})).join('')}
const widgetInfo={today:{name:'Мой день'},school:{name:'Успеваемость'},project:{name:'Мой проект'},week:{name:'Моя неделя'},next:{name:'Ближайшие задачи'},marks:{name:'Последние оценки'},allProjects:{name:'Все проекты'},subjects:{name:'Предметы'}};
function widgetContent(w){const size=w.size,isMini=size==='small';switch(w.id){case 'today':{const s=summary(today());return `<div class="card-head"><h2>Мой день</h2><button class="link" data-action="goto" data-id="tasks">Задачи →</button></div><div class="row between"><div><div class="big-number">${s.done}/${s.total}</div><div class="sub">Задач выполнено</div></div><div style="width:45%"><div class="progress"><i style="width:${s.total?100*s.done/s.total:0}%"></i></div><div class="small-note" style="margin-top:7px">${s.total-s.done} ещё в плане</div></div></div>${!isMini?`<div style="margin-top:15px">${tasksOn(today(),size==='wide'?2:4)||'<div class="hint">На сегодня задач нет</div>'}</div>`:''}`}
case 'school':{const stat=window.schoolCloud?.summary?.()||null;return `<div class="card-head"><h2>Школа</h2><button class="link" data-action="goto" data-id="school">→</button></div><div class="big-number">${stat&&stat.count?fmt(stat.average):'—'}</div><div class="sub">${stat&&stat.count?`Средний за ${stat.count} оценок · без итоговых`:'Откройте раздел «Школа» для входа и загрузки'}</div><p class="hint">Средний равновесный. Школьные коэффициенты не применяются; официальный итог отображается отдельно.</p>`}
case 'project':{let p=S.projects.find(p=>p.status==='active');if(!p)return `<div class="card-head"><h2>Проект</h2></div><div class="hint">Пока нет активных проектов.</div><button class="button tiny" data-action="new-project">Создать проект</button>`;const x=progress(p);return `<div class="card-head"><h2>${esc(p.title)}</h2><button class="link" data-action="open-project" data-id="${esc(p.id)}">→</button></div><div class="big-number">${x.pct===null?'—':x.pct+'%'}</div><div class="progress"><i style="width:${x.pct||0}%"></i></div><p class="sub">${x.done} из ${x.total} задач</p>${!isMini?`<button class="link" data-action="open-project" data-id="${esc(p.id)}">Открыть проект</button>`:''}`}
case 'week':{const ds=Array.from({length:7},(_,i)=>shift(today(),i-6)),a=ds.map(d=>summary(d));const completed=a.reduce((n,s)=>n+s.done,0),total=a.reduce((n,s)=>n+s.total,0);return `<div class="card-head"><h2>Моя неделя</h2><span class="pill">${completed}/${total} задач</span></div><div class="chart">${ds.map((d,i)=>`<div class="barcol"><i title="${esc(niceDate(d))}: ${a[i].done}/${a[i].total}" style="height:${a[i].total?Math.max(4,a[i].done/a[i].total*87):4}px"></i><span>${DOW[dt(d).getDay()]}</span></div>`).join('')}</div><div class="hint" style="margin-top:10px">Высота столбца — доля выполненных задач за день.</div>`}

askRow(t,t.date||today())).join(''):'<div class="hint">Задач пока нет.</div>'}<button class="button tiny" style="margin-top:12px" data-action="new-task" data-project="${esc(p.id)}" data-stage="${esc(g.id)}">+ Задача</button></div>`}).join('')}</div>`}

lass="field"><label>Повторять с</label><input type="date" name="repeatStart" value="${esc(t?.repeatStart||today())}"></div><div class="field"><label>Повторять до (необ.)</label><input type="date" name="repeatEnd" value="${esc(t?.repeatEnd||'')}"></div></div></div></div><div class="notice info" style="margin:12px 0">Задачи проектов в первой версии — только разовые. Регулярное выполнение записывается отдельно за каждую дату.</div><div class="modal-foot"><button type="submit" class="button primary">${t?'Сохранить':'Создать задачу'}</button><button type="button" class="button" data-action="close-modal">Отмена</button></div></form>${t?`<button class="button danger tiny" style="margin-top:15px" data-action="delete-task" data-id="${esc(t.id)}">Удалить задачу</button>${t.repeat!=='none'?repeatHistory(t):''}`:''}`}
if(m.type==='project'){const p=m.id?project(m.id):null;inner=`<div class="modal-head"><h2>${p?'Изменить проект':'Новый проект'}</h2><button class="button ghost" data-action="close-modal">✕</button></div><form id="project-form"><div class="field"><label>Название *</label><input name="title" maxlength="140" required placeholder="Например, создать игру" value="${esc(p?.title||'')}"></div><div class="field"><label>Описание</label><textarea name="description" maxlength="1000">${esc(p?.description||'')}</textarea></div><div class="field"><label>Крайний срок (необязательно)</label><input type="date" name="deadline" value="${esc(p?.deadline||'')}"></div><p class="hint">Задачи и этапы добавляются после создания проекта.</p><div class="modal-foot"><button type="submit" class="button primary">${p?'Сохранить':'Создать проект'}</button><button type="button" class="button" data-action="close-modal">Отмена</button></div></form>${p?`<button class="button danger tiny" data-action="delete-project" data-id="${esc(p.id)}">Удалить проект</button>`:''}`}
if(m.type==='stage'){inner=`<div class="modal-head"><h2>Новый этап</h2><button class="button ghost" data-action="close-modal">✕</button></div><form id="stage-form"><div class="field"><label>Название этапа *</label><input name="title" required maxlength="80" placeholder="Например, разработка"></div><div class="modal-foot"><button class="button primary" type="submit">Добавить этап</button><button type="button" class="button" data-action="close-modal">Отмена</button></div></form>`}
if(m.type==='settings'){inner=`<div class="modal-head"><h2>Настройки прототипа</h2><button class="button ghost" data-action="close-modal">✕</button></div><p class="hint">Данные сохраняются только в этом браузере. В основной «Вектор» ничего не записывается.</p><div class="stack"><button class="button" data-action="configure">Настроить виджеты</button><button class="button" data-action="backup">Скачать резервную копию JSON</button><button class="button" data-action="import-click">Восстановить из JSON</button><input id="import-file" type="file" accept="application/json,.json" style="display:none"><button class="button danger" data-action="reset-demo">Вернуть демоданные</button><button class="button danger" data-action="reset-empty">Начать с пустыми задачами и проектами</button></div><p class="notice" style="margin-top:14px">При очистке данные в этом браузере будут заменены. Перед этим можно скачать копию.</p>`}
if(m.type==='widgets'){inner=`<div class="modal-head"><h2>Настроить главную</h2><button class="button ghost" data-action="close-modal">Готово ✕</button></div><p class="hint">От 3 до 5 модулей. Порядок — кнопками ↑ ↓. Размер: маленький, широкий, большой.</p><div class="stack">${S.widgets.map((w,i)=>`<div class="card" style="padding:11px"><div class="row between wrap"><strong>${esc(widgetInfo[w.id]?.name||w.id)}</strong><div class="row"><button class="button tiny" data-action="widget-up" data-index="${i}" ${i===0?'disabled':''}>↑</button><button class="button tiny" data-action="widget-down" data-index="${i}" ${i===S.widgets.length-1?'disabled':''}>↓</button><button class="button tiny danger" data-action="widget-remove" data-id="${w.id}" ${S.widgets.length<=3?'disabled':''}>✕</button></div></div><div class="field" style="margin:9px 0 0"><select data-widget-size="${w.id}">${[['small','Маленький · 1×1'],['wide','Широкий · 2×1'],['large','Большой · 2×2']].map(([key,label])=>`<option value="${key}" ${w.size===key?'selected':''}>${label}</option>`).join('')}</select></div></div>`).join('')}</div><div class="field" style="margin-top:16px"><label>Добавить модуль</label><div class="row"><select id="new-widget" ${S.widgets.length>=5?'disabled':''}>${Object.entries(widgetInfo).filter(([id])=>!S.widgets.some(w=>w.id===id)).map(([id,x])=>`<option value="${id}">${esc(x.name)}</option>`).join('')}</select><button class="button primary" data-action="widget-add" ${S.widgets.length>=5?'disabled':''}>Добавить</button></div></div>`}

function syncTaskFields(){const p=$('#task-project'),s=$('#task-stage'),rep=$('#repeat-mode');if(!p)return;$('#stage-area').style.display=p.value?'grid':'none';$('#repeat-area').style.display=p.value?'none':'block';if(p.value)rep.value='none';$('#repeat-fields').style.display=rep.value==='none'?'none':'block';$('#weekdays-area').style.display=rep.value==='weekly'?'grid':'none';}
function repeatHistory(t){let list=[];for(let i=0;i<14;i++){const d=shift(today(),-i);if(activeDate(t,d))list.push(`<div class="row between" style="margin:6px 0"><span class="sub">${niceDate(d)}</span><span class="pill">${status(t,d)==='done'?'✓ Выполнено':status(t,d)==='skip'?'Пропущено':d===today()?'Ожидает':'Не выполнено'}</span></div>`)}return `<div class="card" style="margin-top:15px"><strong>Последние повторения</strong>${list.join('')||'<p class="hint">Пока нет повторений</p>'}</div>`}
function toast(t){$('#toast-root').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>{$('#toast-root').innerHTML=''},2600)}

function setTaskDone(t,date,mode){if(t.repeat==='none'){t.done=mode==='done';t.doneAt=t.done?new Date().toISOString():'';if(t.projectId&&project(t.projectId)?.status==='completed'&&!t.done){project(t.projectId).status='active'}}else{t.doneDates||={};if(t.doneDates[date]===mode)delete t.doneDates[date];else t.doneDates[date]=mode}save();render()}
function fullDeleteProject(id){const p=project(id);if(!p)return;const ts=projectTasks(p);const ok=confirm(`Удалить проект «${p.title}»? Его ${ts.length} задач останутся в общем списке без привязки к проекту.`);if(!ok)return;ts.forEach(t=>{t.projectId='';t.stageId=''});S.projects=S.projects.filter(x=>x.id!==id);UI.projectId='';UI.modal=null;save();render();toast('Проект удалён, задачи сохранены')}
function handleAction(button){const act=button.dataset.action,id=button.dataset.id;switch(act){case 'nav':if(id==='create'){openModal('create-menu');return}UI.tab=id;UI.projectId='';UI.subject='';render();return;case 'goto':UI.tab=id;UI.projectId='';UI.subject='';render();return;case 'tasks-filter':UI.filter=id;render();return;case 'project-filter':UI.projFilter=id;render();return;case 'new-task':openModal('task','',{projectId:button.dataset.project||'',stageId:button.dataset.stage||''});return;case 'new-project':openModal('project');return;case 'edit-project':openModal('project',id);return;case 'open-task':openModal('task',id);return;case 'close-modal':UI.modal=null;renderModal();return;case 'toggle-task':{const t=task(id);if(!t)return;setTaskDone(t,button.dataset.date,status(t,button.dataset.date)==='done'?'open':'done');return}case 'skip-task':{const t=task(id);if(t)setTaskDone(t,button.dataset.date,'skip');return}case 'delete-task':{const t=task(id);if(t&&confirm(`Удалить задачу «${t.title}» и историю её выполнений?`)){S.tasks=S.tasks.filter(x=>x.id!==id);UI.modal=null;save();render();toast('Задача удалена')}return}case 'open-project':UI.tab='projects';UI.projectId=id;UI.modal=null;render();return;case 'back-projects':UI.projectId='';render();return;case 'toggle-project-status':{let p=project(id),x=progress(p);if(p.status==='active'){if(x.total===0||x.done!==x.total){toast('Сначала выполните все задачи проекта');return}p.status='completed'}else p.status='active';save();render();return}case 'new-stage':openModal('stage',id);return;case 'rename-stage':{const p=project(button.dataset.project),g=p?.stages.find(s=>s.id===id);if(!g)return;const x=prompt('Новое название этапа',g.title);if(x&&x.trim()){g.title=x.trim().slice(0,80);save();render()}return}case 'delete-stage':{const p=project(button.dataset.project),g=p?.stages.find(s=>s.id===id);if(!g)return;if(!confirm(`Удалить этап «${g.title}»? Задачи останутся в проекте без этапа.`))return;p.stages=p.stages.filter(s=>s.id!==id);S.tasks.filter(t=>t.projectId===p.id&&t.stageId===id).forEach(t=>t.stageId='');save();render();return}case 'delete-project':fullDeleteProject(id);return;case 'back-school':UI.subject='';render();return;case 'open-subject':UI.subject=id;render();return;case 'configure':openModal('widgets');return;case 'settings':openModal('settings');return;case 'widget-up':case 'widget-down':{const i=Number(button.dataset.index),j=i+(act==='widget-up'?-1:1);if(j<0||j>=S.widgets.length)return;[S.widgets[i],S.widgets[j]]=[S.widgets[j],S.widgets[i]];save();render();return}case 'widget-remove':if(S.widgets.length<=3)return;S.widgets=S.widgets.filter(w=>w.id!==id);save();render();return;case 'widget-add':{if(S.widgets.length>=5)return;const x=$('#new-widget')?.value;if(!x||S.widgets.some(w=>w.id===x))return;S.widgets.push({id:x,size:'small'});save();render();return}case 'backup':{const blob=new Blob([JSON.stringify({...S,backupVersion:1,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vektor-tasks-projects-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Резервная копия подготовлена');return}case 'import-click':$('#import-file')?.click();return;case 'reset-demo':if(confirm('Заменить данные в этом браузере демоданными?')){S=demo();UI.modal=null;UI.projectId='';UI.subject='';save();render()}return;case 'reset-empty':if(confirm('Очистить задачи и проекты? Школьные оценки останутся в Firebase.')){S.tasks=[];S.projects=[];UI.modal=null;UI.projectId='';save();render()}return;}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){e.preventDefault();handleAction(b)}else if(e.target.id==='modal-cover'){UI.modal=null;renderModal()}});
document.addEventListener('change',e=>{if(e.target.id==='year-picker'){UI.year=e.target.value;UI.subject='';render()}if(e.target.id==='quarter-picker'){UI.quarter=e.target.value==='year'?'year':Number(e.target.value);UI.subject='';render()}if(e.target.id==='task-project'){const sel=$('#task-stage');if(sel)sel.innerHTML=stageOptions(e.target.value,'');syncTaskFields()}if(e.target.id==='repeat-mode')syncTaskFields();if(e.target.dataset.widgetSize){let w=S.widgets.find(w=>w.id===e.target.dataset.widgetSize);if(w){w.size=e.target.value;save();render()}}if(e.target.id==='import-file'){const f=e.target.files?.[0];if(!f)return;f.text().then(text=>{try{let o=JSON.parse(text);if(!Array.isArray(o.tasks)||!Array.isArray(o.projects)||!Array.isArray(o.widgets))throw Error('Неверный формат');if(!confirm('Заменить данные в прототипе загруженной копией?'))return;S={tasks:o.tasks,projects:o.projects,widgets:o.widgets};UI.modal=null;UI.projectId='';UI.subject='';save();render();toast('Копия восстановлена')}catch(ex){alert('Не удалось восстановить: '+ex.message)}})}});
document.addEventListener('submit',e=>{if(e.target.id==='task-form'){e.preventDefault();const f=new FormData(e.target),title=(f.get('title')||'').trim(),pid=f.get('projectId')||'',rep=pid?'none':f.get('repeat'),days=f.getAll('days').map(Number);if(!title)return;if(rep==='weekly'&&!days.length){alert('Выберите дни повторения');return}let start=rep==='none'?'':(f.get('repeatStart')||today()),end=rep==='none'?'':(f.get('repeatEnd')||'');if(end&&start>end){alert('Дата окончания повторений раньше даты начала');return}const date=rep==='none'?(f.get('date')||''):'',deadline=rep==='none'?(f.get('deadline')||''):'';if(date&&deadline&&date>deadline){alert('Дата выполнения не должна быть позже крайнего срока');return}const changes={title,date,deadline,repeat:rep,days:rep==='weekly'?days:[],repeatStart:start,repeatEnd:end,projectId:pid,stageId:pid?(f.get('stageId')||''):'',};let old=UI.modal.id?task(UI.modal.id):null;if(old){const changedRepeat=old.repeat!==rep||old.repeatStart!==start||old.repeatEnd!==end||JSON.stringify(old.days)!==JSON.stringify(changes.days);if(old.repeat!=='none'&&changedRepeat&&Object.keys(old.doneDates||{}).length&&!confirm('Изменить расписание? Старая история выполнений останется привязана к датам.'))return;Object.assign(old,changes);if(rep==='none')old.doneDates={};if(rep!=='none'){old.done=false;old.doneAt=''}}else S.tasks.push({id:uid(),...changes,done:false,doneDates:{}});UI.modal=null;save();render();toast(old?'Задача изменена':'Задача создана');return}
if(e.target.id==='project-form'){e.preventDefault();const f=new FormData(e.target),title=(f.get('title')||'').trim();if(!title)return;let p=UI.modal.id?project(UI.modal.id):null;if(p){p.title=title;p.description=f.get('description')||'';p.deadline=f.get('deadline')||''}else{p={id:uid(),title,description:f.get('description')||'',deadline:f.get('deadline')||'',status:'active',stages:[]};S.projects.push(p)}UI.modal=null;UI.tab='projects';UI.projectId=p.id;save();render();toast('Проект сохранён');return}
if(e.target.id==='stage-form'){e.preventDefault();const title=(new FormData(e.target).get('title')||'').trim();const p=project(UI.modal.id);if(p&&title){p.stages.push({id:uid(),title});UI.modal=null;save();render()}return}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.modal){UI.modal=null;renderModal()}});
render();
</script><script type="module" src="./school-cloud.js?v=20261026-mvp" data-school-cloud="vector"></script><script>window.addEventListener('schoolCloudUpdated',()=>{if(typeof render==='function')render()})</script></body></html>
