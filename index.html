/* Четверти: выбранный период остаётся в прежних полях для совместимости копий. */
function termCopy(v){return JSON.parse(JSON.stringify(v))}
function termLabel(t){return t.year+'/'+String(t.year+1).slice(-2)+' · '+['I','II','III','IV'][t.quarter-1]+' четверть'}
function termFields(q,a){return {g:termCopy(q.g),hl:termCopy(q.hl||[]),meanHistory:termCopy(q.meanHistory||[]),end:q.end||'',n:q.n||0,[a]:termCopy(q[a]||[])}}
function syncTerm(q,a){const t=q.terms.find(t=>t.id===q.selectedTerm);if(t)Object.assign(t,termFields(q,a))}
function initTerms(q,a){
  const now=new Date(),year=now.getFullYear()-(now.getMonth()<8?1:0);
  if(!Array.isArray(q.terms)||!q.terms.length){
    const t={id:year+'-1',year,quarter:1,...termFields(q,a)};
    q.terms=[t];q.selectedTerm=t.id;q.currentTerm=t.id;
  }
  for(const t of q.terms){
    if(!t||!Number.isInteger(t.year)||!Number.isInteger(t.quarter)||t.quarter<1||t.quarter>4||!t.g||typeof t.g!=='object'||Array.isArray(t.g))throw Error('bad term');
    for(const k of Object.keys(t.g)){
      if(!Array.isArray(t.g[k]))throw Error('bad term grades');
      t.g[k]=t.g[k].filter(x=>x&&[2,3,4,5].includes(Number(x.v))).map(x=>({...x,i:Number(x.i)||0,v:Number(x.v)}));
    }
    t[a]=Array.isArray(t[a])?t[a].filter(k=>Object.hasOwn(t.g,k)):[];
    t.hl=Array.isArray(t.hl)?t.hl:[];
    t.meanHistory=Array.isArray(t.meanHistory)?t.meanHistory.filter(p=>p&&typeof p.d==='string'&&(p.e===null||Number.isFinite(p.e))):[];
  }
  if(!q.terms.some(t=>t.id===q.selectedTerm))q.selectedTerm=q.terms[0].id;
  if(!q.terms.some(t=>t.id===q.currentTerm))q.currentTerm=q.terms[q.terms.length-1].id;
  q.meanHistory=Array.isArray(q.meanHistory)?q.meanHistory:[];
  recordMean(q,a);syncTerm(q,a);return q;
}
function recordMean(q,a){
  const values=Object.keys(q.g).filter(k=>!(q[a]||[]).includes(k)).flatMap(k=>q.g[k].map(x=>x.v));
  const e=values.length?values.reduce((s,v)=>s+v,0)/values.length:null;
  q.meanHistory=q.meanHistory||[];
  const last=q.meanHistory[q.meanHistory.length-1];
  if((values.length||last)&&(!last||last.e!==e))q.meanHistory.push({d:iso(new Date()),e});
}
function selectTerm(q,a,id){
  const t=q.terms.find(t=>t.id===id);if(!t)return;
  syncTerm(q,a);Object.assign(q,termCopy(termFields(t,a)));q.selectedTerm=id;
}
function termControls(q){
  return `<div class="card"><label class="sm">Учебный год и четверть<select data-action="selectTerm" aria-label="Учебный год и четверть" style="width:100%;margin-top:6px;padding:12px;border:1px solid var(--ln);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;min-height:44px">${q.terms.map(t=>`<option value="${esc(t.id)}" ${t.id===q.selectedTerm?'selected':''}>${termLabel(t)}${t.id===q.currentTerm?' · текущая':' · архив'}</option>`).join('')}</select></label>${q.selectedTerm!==q.currentTerm?'<p class="mu sm">Архив четверти. Оценки можно исправлять; текущая четверть хранится отдельно.</p>':''}</div>`;
}
function nextTermSheet(q){
  if(q.selectedTerm!==q.currentTerm)return;
  const t=q.terms.find(t=>t.id===q.currentTerm),next={year:t.year+(t.quarter===4?1:0),quarter:t.quarter===4?1:t.quarter+1};
  sheet(`<h2>Начать следующую четверть?</h2><p>${termLabel(t)} сохранится в архиве вместе с оценками и графиком.</p><p><b>${termLabel(next)}</b> начнётся с теми же предметами и без оценок.</p><label class="sheet-field" for="nextTermEnd">Дата окончания новой четверти<input id="nextTermEnd" type="date"></label><div data-sheet-footer><button class="btn" data-action="confirmNextTerm">Сохранить и начать</button><button class="btn g" data-action="closeSheet">Отмена</button></div>`);
}
function createNextTerm(q,a){
  if(q.selectedTerm!==q.currentTerm)return false;
  const end=document.getElementById('nextTermEnd').value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(end)){toast('Укажи дату окончания новой четверти');return false}
  if(q.end&&end<=q.end){toast('Новая четверть должна заканчиваться позже предыдущей');return false}
  syncTerm(q,a);
  const previous=q.terms.find(t=>t.id===q.currentTerm),year=previous.year+(previous.quarter===4?1:0),quarter=previous.quarter===4?1:previous.quarter+1,id=year+'-'+quarter;
  if(q.terms.some(t=>t.id===id))return false;
  const t={id,year,quarter,g:Object.fromEntries(Object.keys(q.g).map(k=>[k,[]])),hl:[],meanHistory:[],end,n:0,[a]:termCopy(q[a]||[])};
  q.terms.push(t);q.currentTerm=id;selectTerm(q,a,id);return true;
}
function meanChart(q){
  const L=(q.meanHistory||[]).slice(-40),n=L.length,vs=L.filter(p=>p.e!==null).map(p=>p.e);if(!vs.length)return '<p class="mu sm">График появится после первой оценки.</p>';
  const lo=Math.max(1.9,Math.min(...vs)-.15),hi=Math.min(5.1,Math.max(...vs)+.15),W=320,H=130,P=32;
  const x=i=>n>1?P+i*(W-P-8)/(n-1):W/2,y=v=>H-20-(v-lo)/(hi-lo)*(H-35),lb=p=>p.d.slice(8)+'.'+p.d.slice(5,7);
  let path='',pen=false;L.forEach((p,i)=>{if(p.e===null){pen=false;return}path+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(p.e).toFixed(1);pen=true});
  const last=L[n-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Арифметическое среднее всех оценок"><text x="0" y="${y(lo)}" font-size="11" fill="var(--mu)">${lo.toFixed(1)}</text><text x="0" y="${y(hi)+4}" font-size="11" fill="var(--mu)">${hi.toFixed(1)}</text><path d="${path}" fill="none" stroke="var(--ac)" stroke-width="3" stroke-linejoin="round"/>${last.e===null?'':`<circle cx="${x(n-1)}" cy="${y(last.e)}" r="4" fill="var(--ac)"/>`}<text x="${P}" y="${H-2}" font-size="11" fill="var(--mu)">${lb(L[0])}</text>${n>1?`<text x="${W-8}" y="${H-2}" text-anchor="end" font-size="11" fill="var(--mu)">${lb(last)}</text>`:''}</svg>${n<2?'<div class="mu sm">Линия появится после изменения среднего балла.</div>':''}`;
}

const TASKS_DEFAULT=()=>[{i:'hw',t:'Сделать уроки'},{i:'rd',t:'Прочитать главы',u:'глав',target:3},{i:'pu',t:'Отжался',u:'раз',target:50},{i:'pw',t:'Подтянулся',u:'раз',target:5},{i:'ho',t:'Помощь по дому'}];
function defaults(){
  let n=0;
  return{
    g:Object.fromEntries(NAMES_REF.map((k,i)=>[k,SEED[i].map(v=>({i:++n,v}))])),
    t:TASKS_DEFAULT(),d:{},c:{},h:{},p:{dn:[],name:'Матвей'},hl:[],x:{},todos:[],end:CONFIG.endDefault,n,v:CONFIG.schema,schema:CONFIG.schema,
  }
}
const MIGRATIONS={
  4:o=>{o.t=o.t&&Array.isArray(o.t)?o.t:TASKS_DEFAULT();o.c=o.c||{};o.h=o.h||{};o.p=o.p||{dn:[]};return o},
  5:o=>{if(!o.g['ОБЖ'])o.g['ОБЖ']=[];o.x=o.x||{};o.hl=o.hl||Object.keys(o.h||{}).sort().map(d=>({d,f:o.h[d],e:null}));o.todos=o.todos||[];return o},
  14:o=>{
    if(!Array.isArray(o.t))o.t=TASKS_DEFAULT();
    o.t.forEach(t=>{if(!t.days)t.days=[1,2,3,4,5,6,0];if(t.active===undefined)t.active=true;if(!t.target)t.target=t.i==='rd'?3:t.i==='pu'?30:t.i==='pw'?5:1});
    return o;
  },
};
function validateAll(o){
  if(!o||typeof o!=='object'||Array.isArray(o))throw Error('bad root');
  if(!o.g||typeof o.g!=='object'||Array.isArray(o.g))throw Error('bad grades');
  for(const k of Object.keys(o.g)){
    if(!Array.isArray(o.g[k]))o.g[k]=[];
    o.g[k]=o.g[k].filter(x=>x&&[2,3,4,5].includes(Number(x.v))).map(x=>({...x,i:Number(x.i)||0,v:Number(x.v)}));
  }
  o.archivedSubjects=Array.isArray(o.archivedSubjects)?o.archivedSubjects.filter(k=>Object.hasOwn(o.g,k)):[];
  if(!o.t||!Array.isArray(o.t))o.t=TASKS_DEFAULT();
  o.t=o.t.filter(t=>t&&typeof t==='object'&&typeof t.t==='string').map(t=>({i:String(t.i||('hb'+Math.random())),t:String(t.t),u:String(t.u||''),target:Math.max(1,Number(t.target)||1),days:Array.isArray(t.days)?t.days.filter(d=>d>=0&&d<7):[0,1,2,3,4,5,6],active:t.active!==false}));
  if(!o.d||typeof o.d!=='object'||Array.isArray(o.d))o.d={};
  for(const k of Object.keys(o.d))if(!Array.isArray(o.d[k]))o.d[k]=[];
  if(!o.c||typeof o.c!=='object'||Array.isArray(o.c))o.c={};
  if(!o.p||typeof o.p!=='object'||Array.isArray(o.p))o.p={dn:[],name:''};
  if(!Array.isArray(o.p.dn))o.p.dn=[];
  if(typeof o.p.name!=='string')o.p.name='';
  if(!Array.isArray(o.todos))o.todos=[];
  o.todos=o.todos.filter(x=>x&&typeof x==='object').map(x=>({id:String(x.id||('task'+Math.random())),text:String(x.text||''),due:String(x.due||''),done:x.done?String(x.done):null,deleted:!!x.deleted}));
  if(!Array.isArray(o.hl))o.hl=[];
  o.hl=o.hl.filter(x=>x&&typeof x==='object'&&Number.isFinite(x.f)).slice(-150);
  if(!o.h||typeof o.h!=='object')o.h={};
  if(o.end===undefined||(o.end&&!/^\d{4}-\d{2}-\d{2}$/.test(o.end)))o.end=CONFIG.endDefault;
  o.n=Math.max(o.n||0,...Object.values(o.g).flat().map(x=>x.i||0));
  o.schema=CONFIG.schema;o.v=CONFIG.schema;
  return initTerms(o,'archivedSubjects');
}
function migrate(o){
  let v=o.schema||o.v||4;
  while(v<CONFIG.schema){if(MIGRATIONS[v])o=MIGRATIONS[v](o);v++}
  return o;
}
function load(){
  let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
  if(!raw)return validateAll(defaults());
  let o;try{o=JSON.parse(raw)}catch(e){return validateAll(defaults())}
  try{return validateAll(migrate(o))}catch(e){try{const b=localStorage.getItem(BAK);if(b)return validateAll(JSON.parse(b))}catch(_){}return validateAll(defaults())}
}
let warned=false;
function persist(){
  syncTerm(S,'archivedSubjects');
  try{const old=localStorage.getItem(KEY);if(old)localStorage.setItem(BAK,old)}catch(e){}
  try{localStorage.setItem(KEY,JSON.stringify(S));return true}
  catch(e){if(!warned){warned=true;toast('Данные не сохраняются: нет места или приватный режим')}return false}
}
const DAILY_PREFIX='mt1_d_';
function daily(){
  const date=iso(new Date()),key=DAILY_PREFIX+date;
  try{
    let keys=Object.keys(localStorage).filter(k=>k.startsWith(DAILY_PREFIX)).sort();
    if(!localStorage.getItem(key)){
      const copy=JSON.stringify(S);let saved=false;
      try{localStorage.setItem(key,copy);saved=true}catch(e){}
      while(!saved&&keys.length){
        localStorage.removeItem(keys.shift());
        try{localStorage.setItem(key,copy);saved=true}catch(e){}
      }
      if(!saved)toast('Не удалось создать автокопию: не хватает места');
    }
    keys=Object.keys(localStorage).filter(k=>k.startsWith(DAILY_PREFIX)).sort();
    keys.slice(0,-7).forEach(k=>localStorage.removeItem(k));
    const last=localStorage.getItem('mt1_lx');
    if(!last)localStorage.setItem('mt1_lx',date);
    else if((Date.now()-new Date(last+'T12:00:00'))/864e5>=7&&localStorage.getItem('mt1_reminded')!==date){
      localStorage.setItem('mt1_reminded',date);
      setTimeout(()=>toast('Сохрани копию в файл: Профиль → Копия данных',{ms:6000}),900);
    }
  }catch(e){}
}
function dailyCopies(){
  let keys=[];try{keys=Object.keys(localStorage).filter(k=>k.startsWith(DAILY_PREFIX)).sort().reverse()}catch(e){}
  return `<h2>Автокопии на этом устройстве</h2><div class="mu sm">Приложение хранит до 7 копий. Нажми «Вернуть», чтобы восстановить данные на выбранную дату.</div>${keys.length?keys.map(k=>`<div class="card archived-habit"><span>${k.slice(-10).split('-').reverse().join('.')}</span><button type="button" class="btn g" data-action="restoreDaily" data-id="${k}">Вернуть</button></div>`).join(''):'<div class="card mu">Автокопий пока нет.</div>'}`;
}

/* ===== STREAK / ACHIEVEMENTS ===== */
function streak(){
  const hw=S.t.find(t=>t.i==='hw');if(!hw||hw.active===false)return 0;
  const today=iso(new Date()),d=new Date();let count=0;
  for(let n=0;n<400;n++,d.setDate(d.getDate()-1)){
    const key=iso(d);if(!isDue(hw,key))continue;
    if((S.d[key]||[]).includes('hw'))count++;
    else if(key!==today)break;
  }
  return count;
}
const TH={pu:50,rd:3};
function ach(d){const dn=S.d[d]||[],c=S.c[d]||{},due=S.t.filter(t=>isDue(t,d));return{all:due.length>0&&due.every(t=>t.u?(c[t.i]||0)>=Number(t.target||1):dn.includes(t.i)),ex:(c.pu||0)+(c.pw||0)>=TH.pu,rd:(c.rd||0)>=TH.rd}}

/* ===== SCHOOL MATH ===== */
function plan(a){
  const n=a.length,s=sum(a),target=THRESH[1];
  const k=Math.max(0,Math.ceil((target*n-s)/(5-target)-1e-9));
  return{k,x:(s+5*k)/(n+k),t:k>=9999?'получить очень много «5» подряд':`получить ${k}× «5» подряд`};
}
function calc(){
  const bad=[],good=[];
  ACT().forEach(k=>{
    const a=vals(k),av=avg(k);
    if(av<THRESH[1])bad.push({k,av,p:plan(a),f:fin(av)});
    else{const x=(sum(a)+3)/(a.length+1);good.push({k,av,x:x<THRESH[1]?x:null})}
  });
  bad.sort((a,b)=>(a.f-b.f)||(a.p.k-b.p.k)||(a.av-b.av));
  return{bad,good};
}

function gord(){return [...ITEMS()].sort((a,b)=>a.localeCompare(b,'ru',{sensitivity:'base'}))}
let wi={k:null,v:5,n:2};
function whatIf(){
  const subjects=ACT();
  if(!subjects.length)return '';
  if(!subjects.includes(wi.k))wi.k=[...subjects].sort((a,b)=>avg(a)-avg(b))[0];
  const a=vals(wi.k),before=avg(wi.k),after=(sum(a)+wi.v*wi.n)/(a.length+wi.n),was=fin(before),next=fin(after);
  const message=next>was?`Итоговая оценка поднимется с «${was}» до «${next}».`:next<was?`Итоговая оценка снизится с «${was}» до «${next}».`:`Итог останется «${was}», средний балл ${after>=before?'вырастет':'снизится'}.`;
  return `<div class="card wi"><div class="kicker">ЧТО ЕСЛИ?</div><label class="sm" for="wiSubject">Предмет</label><select id="wiSubject" data-action="wiSubject" aria-label="Предмет">${subjects.map(k=>`<option value="${esc(k)}" ${k===wi.k?'selected':''}>${esc(k)}</option>`).join('')}</select><div class="mu sm" style="margin-top:10px">Какая оценка и сколько раз?</div><div class="chips" role="group" aria-label="Оценка">${[5,4,3,2].map(v=>`<button class="chip c${v} ${wi.v===v?'on':''}" data-action="wiVal" data-id="${v}" aria-pressed="${wi.v===v}">${v}</button>`).join('')}</div><div class="chips" role="group" aria-label="Количество оценок">${[1,2,3,4].map(n=>`<button class="chip ${wi.n===n?'on':''}" data-action="wiN" data-id="${n}" aria-pressed="${wi.n===n}">${n}×</button>`).join('')}</div><div class="wi-result"><b>Новый средний: ${f2(after)}</b><div class="mu sm">Сейчас ${f2(before)} · ${message}</div></div></div>`;
}
function gradeOutlook(){

  if(w)b=`<div class="mu sm">Шаг ${w.n+1} из ${N} · сделан на этой неделе ✓</div><b>${STEPS[w.n][0]}</b>${w.t?`<div class="sm" style="margin-top:6px">${esc(w.t)}</div>`:''}<div class="mu sm" style="margin-top:6px">${n<N?'Следующий шаг откроется в понедельник.':'Все шаги пройдены.'}</div>`;
  else if(n>=N)b=`<b>Все ${N} шагов пройдены.</b><div class="mu sm">Можно вместе подвести итог.</div>`;
  else b=`<div class="mu sm">Шаг ${n+1} из ${N} · на эту неделю</div><b>${STEPS[n][0]}</b><div style="margin:4px 0 12px">${STEPS[n][1]}</div><button class="btn" data-action="profStep">Сделал</button>`;

  return`<h2>Будущая профессия</h2><div class="mu sm" style="margin-bottom:8px">До поступления около 3 лет. Один шаг в неделю: профессия, вуз, экзамены.</div><div class="card">${b}${h?`<div class="mu sm" style="margin-top:14px">Что я уже узнал</div>${h}`:''}</div>`;

/* ===== SHEET ===== */
let sheetOpener=null,sheetPageY=0;
function sheetViewport(){
  const v=window.visualViewport,s=document.getElementById('s');
  s.style.setProperty('--sheet-vh',(v?v.height:window.innerHeight)+'px');
  s.style.setProperty('--sheet-top',(v?v.offsetTop:0)+'px');
}
function sheet(h,key=''){
  const s=document.getElementById('s'),old=s.querySelector('.sh');
  if(!h){
    if(!old)return;
    s.replaceChildren();
    document.querySelectorAll('main,.bar').forEach(el=>el.inert=false);
    document.body.classList.remove('sheet-open');document.body.style.removeProperty('--sheet-scroll-top');
    window.scrollTo(0,sheetPageY);
    if(sheetOpener&&sheetOpener.isConnected)sheetOpener.focus({preventScroll:true});
    sheetOpener=null;return;
  }
  const template=document.createElement('template');template.innerHTML=h;
  const heading=template.content.querySelector('h2'),title=heading?heading.textContent:'Настройки';
  const identity=key||title,same=old&&old.dataset.sheetKey===identity;
  const scroll=same?old.querySelector('.sheet-body').scrollTop:0;
  const active=same&&old.contains(document.activeElement)?document.activeElement:null;
  const focusId=active&&active.id,selection=active&&typeof active.selectionStart==='number'?[active.selectionStart,active.selectionEnd]:null;
  if(heading)heading.remove();
  const actions=template.content.querySelector('[data-sheet-footer]');
  const dialog=document.createElement('div');dialog.className='ov';dialog.dataset.close='1';
  dialog.innerHTML='<section class="sh" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><header class="sheet-head"><h2 id="sheetTitle" tabindex="-1"></h2><button type="button" class="sheet-close" data-action="closeSheet" aria-label="Закрыть окно">×</button></header><div class="sheet-body"></div><footer class="sheet-footer"></footer></section>';
  const panel=dialog.querySelector('.sh'),body=dialog.querySelector('.sheet-body'),footer=dialog.querySelector('.sheet-footer');
  panel.dataset.sheetKey=identity;dialog.querySelector('h2').textContent=title;
  if(actions){
    if(actions.matches('button'))footer.append(actions);
    else{footer.append(...actions.childNodes);actions.remove()}
  }else footer.innerHTML='<button type="button" class="btn g" data-action="closeSheet">Закрыть</button>';
  body.append(template.content);
  if(!old){
    sheetOpener=document.activeElement;sheetPageY=window.scrollY;
    document.body.style.setProperty('--sheet-scroll-top',(-sheetPageY)+'px');document.body.classList.add('sheet-open');
    document.querySelectorAll('main,.bar').forEach(el=>el.inert=true);
  }
  s.replaceChildren(dialog);sheetViewport();body.scrollTop=scroll;
  const nextFocus=focusId&&document.getElementById(focusId);
  if(nextFocus){nextFocus.focus({preventScroll:true});if(selection)nextFocus.setSelectionRange(...selection)}
  else if(!same)dialog.querySelector('h2').focus({preventScroll:true});
}
function cs(){sheet('')}
window.addEventListener('resize',sheetViewport);
if(window.visualViewport){
  window.visualViewport.addEventListener('scroll',sheetViewport);
  window.visualViewport.addEventListener('resize',()=>{
    sheetViewport();
    const focused=document.activeElement;
    if(focused&&focused.matches('input,textarea,select')&&focused.closest('.sheet-body'))requestAnimationFrame(()=>focused.scrollIntoView({block:'nearest'}));
  });
}
document.addEventListener('keydown',e=>{
  const panel=document.querySelector('.sh');if(!panel)return;
  if(e.key==='Escape'){e.preventDefault();cs();render();return}
  if(e.key!=='Tab')return;
  const focusable=[...panel.querySelectorAll('button,input,select,textarea,a[href],summary,[tabindex="0"]')].filter(el=>!el.disabled&&el.getClientRects().length);
  const first=focusable[0],last=focusable[focusable.length-1];
  if(e.shiftKey&&(document.activeElement===first||document.activeElement.id==='sheetTitle')){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
});

function toast(m,opt={}){
  const e=document.getElementById('tt');
  e.innerHTML=`<span>${esc(m)}</span>`;
  e.className='on';
  clearTimeout(toast.t);
  if(opt&&opt.action){
    const b=document.createElement('button');b.textContent=opt.action;
    b.onclick=()=>{opt.onAction&&opt.onAction();e.className='';clearTimeout(toast.t)};
    e.appendChild(b);
    toast.t=setTimeout(()=>e.className='',opt.ms||5000);
  }else{
    toast.t=setTimeout(()=>e.className='',opt.ms||3000);
  }
}

function setAvatar(input){
  const f=input.files&&input.files[0];if(!f)return;
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{
    try{
      const c=document.createElement('canvas'),m=Math.min(im.width,im.height);
      c.width=c.height=160;
      c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);
      const prev=S.av;S.av=c.toDataURL('image/jpeg',.8);
      if(!persist())S.av=prev;
      cs();render();toast('Фото сохранено');
    }catch(e){alert('Не получилось открыть фото')}
    finally{URL.revokeObjectURL(u)}
  };
  im.onerror=()=>{URL.revokeObjectURL(u);alert('Не получилось открыть фото')};
  im.src=u;input.value='';
}

/* ===== BACKUP ===== */
function backupStatus(m){const e=document.getElementById('backupStatus');if(e)e.textContent=m}
function noteBackupExport(){try{localStorage.setItem('mt1_lx',iso(new Date()));localStorage.removeItem('mt1_reminded')}catch(e){}}
function validateBackup(o){
  if(!o||typeof o!=='object'||Array.isArray(o)||!o.g||typeof o.g!=='object'||Array.isArray(o.g)||!Array.isArray(o.t)||!o.p||typeof o.p!=='object'||!Object.keys(o.g).length||!Object.values(o.g).every(a=>Array.isArray(a)&&a.every(x=>x&&[2,3,4,5].includes(Number(x.v)))))throw new Error('Некорректная или неполная копия');
  return o;
}
function installBackup(o){
  validateBackup(o);
  if(!confirm('Заменить текущие данные содержимым резервной копии?'))return false;
  const previous=JSON.stringify(S),replacement=JSON.parse(JSON.stringify(o));
  try{
    const backupKey='mt_before_restore_'+iso(new Date());
    localStorage.setItem(backupKey,previous);
    const migrated=validateAll(migrate(replacement));
    localStorage.setItem(KEY,JSON.stringify(migrated));
    S=migrated;persist();render();
    alert('Все данные из файла восстановлены. Предыдущие данные сохранены в резервной копии на этом устройстве.');
    return true;
  }catch(err){
    alert('Не удалось сохранить восстановленные данные. Текущие данные не заменены. Проверь свободное место в Safari.');
    return false;
  }
}
async function exportBackupFile(){
  try{
    const json=JSON.stringify(S),name='matvey-backup-'+iso(new Date())+'.json';
    const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'Резервная копия Матвея'});noteBackupExport();backupStatus('Копия передана в меню «Поделиться».');return true}
      catch(err){if(err&&err.name==='AbortError'){backupStatus('Сохранение отменено. Напоминание останется.');return false}throw err}
    }
    const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    noteBackupExport();
    backupStatus('Файл подготовлен. Проверь «Загрузки» или приложение «Файлы».');return true;
  }catch(err){backupStatus('Не удалось создать файл. Напоминание о копии не сброшено. Попробуй Safari.');return false}
}
async function importBackupFile(input){
  const file=input.files&&input.files[0];if(!file)return;
  try{
    if(file.size>10*1024*1024)throw new Error('Файл слишком большой');
    const text=await file.text(),o=validateBackup(JSON.parse(text));
    installBackup(o);
  }catch(err){backupStatus('Файл не подходит или повреждён. Данные не изменены.')}
  finally{input.value=''}
}
function showBackup(){
  const e=document.getElementById('bk');if(!e)return;
  e.value=JSON.stringify(S);e.select();
  try{const r=navigator.clipboard&&navigator.clipboard.writeText(e.value);if(r)r.catch(()=>{})}catch(x){}
  backupStatus('Текст подготовлен. Для больших копий используй сохранение в файл.');
}
function importBackup(){
  const e=document.getElementById('bk');if(!e)return;
  try{installBackup(validateBackup(JSON.parse(e.value)))}
  catch(err){backupStatus('Текст неполный или повреждён. Данные не изменены.')}
}

/* ===== DELEGATION ===== */
document.addEventListener('click',e=>{
  const closeEl=e.target.closest('[data-close]');
  if(closeEl&&e.target===closeEl){cs();return}
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const {action,id,arg}=el.dataset;
  const fn=ACTIONS[action];
  if(fn)fn(id,arg,el);
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  if(el.dataset.action==='profileName'){S.p.name=el.value.trim();save();render()}
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  if(el.dataset.action==='selectTerm'){selectTerm(S,'archivedSubjects',el.value);save();render()}
  else if(el.dataset.action==='wiSubject'){wi.k=el.value;render()}
  else if(el.dataset.action==='endInput')ACTIONS.endInput(null,null,el);
  else if(el.dataset.action==='avatarFile')setAvatar(el);
  else if(el.dataset.action==='importFile')importBackupFile(el);
});

function render(){

  document.querySelectorAll('.bar button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
  const subtitles={d:'Дела и привычки',g:'Оценки и цели',p:'Профиль'};
  const avatar=S.av?`<img src="${S.av}" alt="">`:'М';
  const mark=`<svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="vectorMark" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8b5cff"/><stop offset=".56" stop-color="#39d8ff"/><stop offset="1" stop-color="#b7f34a"/></linearGradient></defs><path d="M7 9 20 31 33 7" fill="none" stroke="url(#vectorMark)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M33 3.5v7M29.5 7h7" stroke="#d8fbff" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  const main={g:grades,d:today,p:profile}[tab]();
  document.getElementById('m').innerHTML=`<div class="hd"><div class="brand-lockup"><div class="brand-mark" aria-hidden="true">${mark}</div><div class="brand-copy"><h1>Вектор</h1><div class="mu sm">${subtitles[tab]}</div></div></div><button class="avb" data-action="openProfile" aria-label="Профиль">${avatar}</button></div>`+main;
}

save();
daily();
let day=iso(new Date());
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&iso(new Date())!==day){day=iso(new Date());dayOffset=0;daily();render()}
});
render();
</script></body></html>
