nt-weight:700;display:flex;align-items:center;gap:7px}.navbar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid #dce4ef;display:flex;justify-content:center;z-index:50;padding:7px 8px max(10px,env(safe-area-inset-bottom))}.nav-inner{width:min(100%,720px);display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.nav{border:0;background:transparent;color:#66768a;display:grid;justify-items:center;gap:3px;padding:7px 0;border-radius:10px;font-size:11px;font-weight:600}.nav.active{background:#e8eefc;color:#2456bf}.nav .sym{font-size:22px;line-height:24px}.nav.plus{color:#2456bf}.modal-cover{position:fixed;inset:0;background:#17243a88;z-index:100;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(100%,600px);max-height:94vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:20px 20px max(25px,env(safe-area-inset-bottom));box-shadow:0 -8px 30px #16243b22}.modal .modal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}.field{display:grid;gap:6px;margin:0 0 15px}.field label,.field-label{font-size:13px;color:#4a5a6e;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd7e5;border-radius:9px;padding:11px;background:white;min-height:42px;color:#17243a}.field textarea{min-height:85px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks{display:flex;flex-wrap:wrap;gap:8px}.day-label{border:1px solid #dce5f3;border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:5px;font-size:13px}.modal-foot{display:flex;gap:8px;margin-top:18px}.modal-foot .button{flex:1}.notice{border-radius:12px;padding:12px 14px;border:1px solid #f0ddae;background:#fff9e9;color:#745319;font-size:13px;line-height:1.5}.notice.info{background:#eef4ff;border-color:#d3e1ff;color:#375b95}.bar-rows{display:grid;gap:7px}.bar-row{display:grid;grid-template-columns:86px 1fr 32px;align-items:center;gap:8px;font- </style></head><body><div id="app" class="app"></div><div id="modal-root"></div><div id="toast-root"></div>
<script>
'use strict';
const STORE='vektor_logic_mvp_2026_10';
const $=sel=>document.querySelector(sel);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>`id_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,9)}`;
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dt=(s)=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const shift=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const niceDate=s=>s?new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(dt(s)):'Без даты';
const DOW=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const longday=d=>new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(dt(d));
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
function emptyState(){return {tasks:[],projects:[],widgets:[{id:'today',size:'large'},{id:'school',size:'small'},{id:'project',size:'small'},{id:'week',size:'wide'}],schoolPeriods:{}}}
function validState(x){
 const plain=o=>o&&typeof o==='object'&&!Array.isArray(o);
 const date=d=>!d||(/^\d{4}-\d{2}-\d{2}$/.test(d)&&!Number.isNaN(Date.parse(d+'T12:00:00')));
 if(!plain(x)||!Array.isArray(x.tasks)||!Array.isArray(x.projects)||!Array.isArray(x.widgets)||x.tasks.length>20000||x.projects.length>5000||x.widgets.length<3||x.widgets.length>5)return false;
 const projIds=new Set(),taskIds=new Set();
 for(const p of x.projects){if(!plain(p)||typeof p.id!=='string'||!p.id||projIds.has(p.id)||typeof p.title!=='string'||!Array.isArray(p.stages)||!['active','completed'].includes(p.status)||!date(p.deadline)||p.stages.length>150||new Set(p.stages.map(g=>g.id)).size!==p.stages.length||p.stages.some(g=>!plain(g)||typeof g.id!=='string'||typeof g.title!=='string'))return false;projIds.add(p.id)}
 for(const t of x.tasks){if(!plain(t)||typeof t.id!=='string'||!t.id||taskIds.has(t.id)||typeof t.title!=='string'||!['none','daily','weekly'].includes(t.repeat)||typeof t.done!=='boolean'||!Array.isArray(t.days)||t.days.some(d=>!Number.isInteger(d)||d<1||d>7)||!date(t.date)||!date(t.deadline)||!date(t.repeatStart)||!date(t.repeatEnd)||!plain(t.doneDates)||Object.keys(t.doneDates).length>6000||Object.entries(t.doneDates).some(([d,v])=>!date(d)||!['done','skip'].includes(v))||t.projectId&&!projIds.has(t.projectId)||t.projectId&&t.repeat!=='none'||t.stageId&&!x.projects.find(p=>p.id===t.projectId)?.stages.some(g=>g.id===t.stageId)||t.repeatHistory&&(!Array.isArray(t.repeatHistory)||t.repeatHistory.length>150||t.repeatHistory.some(h=>!plain(h)||!date(h.repeatStart)||!date(h.repeatEnd)||!date(h.until)||!['daily','weekly'].includes(h.repeat)||!Array.isArray(h.days))))return false;taskIds.add(t.id)}
 const keys=new Set();for(const w of x.widgets){if(!plain(w)||!['today','school','project','week','next','marks','allProjects','subjects'].includes(w.id)||!['small','wide','large'].includes(w.size)||keys.has(w.id))return false;keys.add(w.id)}
 if(x.schoolPeriods!==undefined&&(!plain(x.schoolPeriods)||Object.values(x.schoolPeriods).some(year=>!plain(year)||Object.keys(year).some(q=>!['1','2','3','4'].includes(q))||Object.values(year).some(t=>!plain(t)||!date(t.from)||!date(t.to)||!t.from||!t.to||t.from>t.to))))return false;
 return true;
}
function load(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(validState(x))return {...x,schoolPeriods:x.schoolPeriods||{}};if(x)window.__vectorBadStore=true;}catch(e){}return emptyState()}
let S=load();function save(){if(window.__vectorBadStore){toast('Сохранение отключено: восстанови резервную копию');return}try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){toast('Браузер не сохранил данные. Проверьте настройки хранения.')}};
let UI={tab:'home',filter:'today',projectId:'',subject:'',year:schoolYearFor(today()),quarter:'year',modal:null,projFilter:'active'};
const project=id=>S.projects.find(p=>p.id===id);
const task=id=>S.tasks.find(t=>t.id===id);
function versionActive(v,date){if(v.repeat==='none')return false;if(v.repeatStart&&date<v.repeatStart)return false;if(v.repeatEnd&&date>v.repeatEnd)return false;const dow=dt(date).getDay();return v.repeat==='daily'||(v.repeat==='weekly'&&v.days.includes(dow===0?7:dow));}
function activeDate(t,date){
 if(t.previousOneOff?.date===date)return true;if(t.repeatHistory?.some(v=>date<=v.until&&versionActive(v,date)))return true;
 if(t.repeat==='none'){
   if(t.done){const actual=t.doneAt?iso(new Date(t.doneAt)):null;return (actual||t.date||t.deadline)===date;}
   return t.date===date||(!t.date&&t.deadline===date);
 }
 if(t.repeatEffectiveFrom&&date<t.repeatEffectiveFrom)return false;
 return versionActive(t,date);
}
function status(t,date){if(t.previousOneOff?.done&&t.previousOneOff.date===date)return 'done';if(t.repeatHistory?.some(v=>date<=v.until&&versionActive(v,date)))return t.doneDates?.[date]||'open';return t.repeat==='none'?(t.done&&(!t.doneAt||iso(new Date(t.doneAt))===date)?'done':'open'):(t.doneDates?.[date]||'open')}
function getDay(date){return S.tasks.filter(t=>activeDate(t,date)).sort((a,b)=>Number(status(a,date)==='done')-Number(status(b,date)==='done') || (a.deadline||'9999').localeCompare(b.deadline||'9999'))}
function summary(date){const a=getDay(date);return {done:a.filter(t=>status(t,date)==='done').length,skip:a.filter(t=>status(t,date)==='skip').length,total:a.length}}
function isOverdue(t){return t.repeat==='none'&&!t.done && (t.deadline||t.date)&& (t.deadline||t.date)<today()}
function projectTasks(p){return S.tasks.filter(t=>t.projectId===p.id&&t.repeat==='none')}
function progress(p){const list=projectTasks(p);return {done:list.filter(t=>t.done).length,total:list.length,pct:list.length?Math.round(list.filter(t=>t.done).length/list.length*100):null}}
function fmt(n){return n===null||!Number.isFinite(n)?'—':n.toFixed(2).replace('.',',')}
function cloudSnapshot(){return window.schoolCloud?.snapshot?.()||null}
function schoolYearFor(date){const y=Number(date.slice(0,4)),m=Number(date.slice(5,7));const start=m>=9?y:y-1;return `${start}-${start+1}`}
function schoolYearBounds(year){const start=Number(year.slice(0,4));return {from:`${start}-09-01`,to:`${start+1}-08-31`}}
function schoolRange(){const year=UI.year||cloudSnapshot()?.schoolYear||schoolYearFor(today());if(UI.quarter==='year')return schoolYearBounds(year);return S.schoolPeriods?.[year]?.[String(UI.quarter)]||null}
function selectedSchoolRows(){const snap=cloudSnapshot(),range=schoolRange();return !snap||!range?[]:snap.grades.filter(g=>g.date>=range.from&&g.date<=range.to)}
function cloudRows(){return selectedSchoolRows().filter(g=>!g.official&&g.score!==null)}
function cloudMean(rows){return rows.length?rows.reduce((n,g)=>n+g.score,0)/rows.length:null}
function cloudSubjects(){return [...new Set(selectedSchoolRows().map(g=>g.subject))].sort((a,b)=>a.localeCompare(b,'ru'))}
function gradePrediction(mean){return mean===null?null:Math.max(2,Math.min(5,Math.floor(mean)+((mean-Math.floor(mean))>=.6-1e-9?1:0)))}
function fdate(date){return date?date.split('-').reverse().join('.'):''}
function gradeTrend(rows){const vals=rows.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));let sum=0;const points=vals.map((g,i)=>{sum+=g.score;return sum/(i+1)});if(points.length<2)return '<p class="hint">График появится после второй оценки.</p>';const lo=2,hi=5,coords=points.map((v,i)=>`${14+i*290/(points.length-1)},${98-(v-lo)/(hi-lo)*80}`).join(' ');return `<svg viewBox="0 0 320 113" width="100%" role="img" aria-label="Динамика среднего балла"><line x1="12" x2="304" y1="98" y2="98" stroke="#d2dce9"/><polyline points="${coords}" fill="none" stroke="#2456bf" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
function nav(){return `<nav class="navbar"><div class="nav-inner">${[['home','⌂','Главная'],['tasks','☑','Задачи'],['create','＋','Создать'],['projects','▤','Проекты'],['school','▥','Школа']].map(([id,ico,label])=>`<button class="nav ${UI.tab===id?'active':''} ${id==='create'?'plus':''}" data-action="nav" data-id="${id}"><span class="sym">${ico}</span><span>${label}</span></button>`).join('')}</div></nav>`}
function header(){return `<header class="top"><div><div class="brand">↗ Вектор <span>MVP</span></div><div class="sub">Задачи · Проекты · Школа</div></div><div class="top-actions"><button class="button tiny" data-action="backup">Скачать данные</button><button class="button tiny" data-action="settings">Настройки</button></div></header>`}
function render(){document.getElementById('app').innerHTML=header()+({home:homeView,tasks:tasksView,projects:projectsView,school:schoolView}[UI.tab]||homeView)()+nav()+`<div class="footer-note">Основная версия · задачи и проекты на этом устройстве · оценки из школы</div>`;renderModal()}
function taskRow(t,date,opts={}){const st=status(t,date||today()),rec=t.repeat!=='none',label=rec?(t.repeat==='daily'?'Каждый день':t.days.map(d=>['','Пн','Вт','Ср','Чт','Пт','Сб','Вс'][d]).join(', ')):(t.date?'План: '+niceDate(t.date):'Без даты');const p=project(t.projectId);const canTick=opts.noToggle!==true && (t.repeat==='none'||(activeDate(t,date||today())&&(date||today())<=today()));let extra=`${label}${p?' · '+esc(p.title):''}${t.deadline?' · Срок '+niceDate(t.deadline):''}`;
return `<div class="task-row">${canTick?`<button title="Отметить выполнение" class="check ${st==='done'?'done':''}" data-action="toggle-task" data-id="${esc(t.id)}" data-date="${esc(date||today())}">${st==='done'?'✓':st==='skip'?'–':''}</button>`:`<span class="check" aria-label="Не запланировано на сегодня" style="opacity:.35"></span>`}<div class="task-main"><div class="task-name ${st==='done'?'done':''}">${esc(t.title)}</div><div class="task-meta">${extra}${st==='skip'?' · Пропущено':''}${isOverdue(t)?' · ПРОСРОЧЕНО':''}</div></div>${rec&&opts.skip&&activeDate(t,date)?`<button title="Пропустить" class="button tiny ghost" data-action="skip-task" data-id="${esc(t.id)}" data-date="${esc(date)}">Пропуск</button>`:''}<button title="Открыть задачу" class="button tiny ghost" data-action="open-task" data-id="${esc(t.id)}">⋯</button></div>`}
function tasksOn(date,max){return getDay(date).slice(0,max||100).map(t=>taskRow(t,date,{skip:date===today()})).join('')}
const widgetInfo={today:{name:'Мой день'},school:{name:'Успеваемость'},project:{name:'Мой проект'},week:{name:'Моя неделя'},next:{name:'Ближайшие задачи'},marks:{name:'Последние оценки'},allProjects:{name:'Все проекты'},subjects:{name:'Предметы'}};

function renderModal(){const root=$('#modal-root');if(!UI.modal){root.innerHTML='';return};const m=UI.modal;let inner='';if(m.type==='create-menu')inner=`<div class="modal-head"><h2>Что создать?</h2><button class="button ghost" data-action="close-modal">✕</button></div><div class="stack"><button class="button block" data-action="new-task">☑ Новая задача</button><button class="button block" data-action="new-project">▤ Новый проект</button></div>`;
if(m.type==='task'){const t=m.id?task(m.id):null;const projectId=m.projectId??t?.projectId??'',stageId=m.stageId??t?.stageId??'',rep=t?.repeat||'none';inner=`<div class="modal-head"><h2>${t?'Изменить задачу':'Новая задача'}</h2><button class="button ghost" data-action="close-modal">✕</button></div><form id="task-form"><div class="field"><label for="t-title">Название *</label><input id="t-title" name="title" placeholder="Что нужно сделать?" maxlength="140" required value="${esc(t?.title||'')}"></div><div class="field"><label for="t-date">Дата выполнения (необязательно)</label><input id="t-date" type="date" name="date" value="${esc(t?.date||'')}"></div><details class="card soft" style="margin:12px 0" ${t?.deadline||t?.repeat!=='none'||projectId?'open':''}><summary style="cursor:pointer;font-weight:700">Дополнительно: срок, повторение, проект</summary><div class="field" style="margin-top:12px"><label for="t-deadline">Крайний срок</label><input id="t-deadline" type="date" name="deadline" value="${esc(t?.deadline||'')}"></div><div class="field"><label>Проект (необязательно)</label><select id="task-project" name="projectId"><option value="">Без проекта</option>${S.projects.filter(p=>p.status==='active'||p.id===projectId).map(p=>`<option value="${esc(p.id)}" ${p.id===projectId?'selected':''}>${esc(p.title)}</option>`).join('')}</select></div><div class="field" id="stage-area"><label>Этап</label><select id="task-stage" name="stageId">${stageOptions(projectId,stageId)}</select></div><div id="repeat-area"><div class="field"><label>Повторение</label><select name="repeat" id="repeat-mode"><option value="none" ${rep==='none'?'selected':''}>Не повторять</option><option value="daily" ${rep==='daily'?'selected':''}>Каждый день</option><option value="weekly" ${rep==='weekly'?'selected':''}>По дням недели</option></select></div><div id="repeat-fields"><div class="field" id="weekdays-area"><div class="field-label">Дни недели</div><div class="checks">${[1,2,3,4,5,6,7].map((d,i)=>`<label class="day-label"><input type="checkbox" name="days" value="${d}" ${(t?.days||[]).includes(d)?'checked':''}>${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i]}</label>`).join('')}</div></div><div class="form-grid"><div class="field"><label>Повторять с</label><input type="date" name="repeatStart" value="${esc(t?.repeatStart||today())}"></div><div class="field"><label>Повторять до (необ.)</label><input type="date" name="repeatEnd" value="${esc(t?.repeatEnd||'')}"></div></div></div></div></details><div class="notice info" style="margin:12px 0">Задачи проектов в первой версии — только разовые. Регулярное выполнение записывается отдельно за каждую дату.</div><div class="modal-foot"><button type="submit" class="button primary">${t?'Сохранить':'Создать задачу'}</button><button type="button" class="button" data-action="close-modal">Отмена</button></div></form>${t?`<button class="button danger tiny" style="margin-top:15px" data-action="delete-task" data-id="${esc(t.id)}">Удалить задачу</button>${t.repeat!=='none'?repeatHistory(t):''}`:''}`}
if(m.type==='project'){const p=m.id?project(m.id):null;inner=`<div class="modal-head"><h2>${p?'Изменить проект':'Новый проект'}</h2><button class="button ghost" data-action="close-modal">✕</button></div><form id="project-form"><div class="field"><label>Название *</label><input name="title" maxlength="140" required placeholder="Например, создать игру" value="${esc(p?.title||'')}"></div><div class="field"><label>Описание</label><textarea name="description" maxlength="1000">${esc(p?.description||'')}</textarea></div><div class="field"><label>Крайний срок (необязательно)</label><input type="date" name="deadline" value="${esc(p?.deadline||'')}"></div><p class="hint">Задачи и этапы добавляются после создания проекта.</p><div class="modal-foot"><button type="submit" class="button primary">${p?'Сохранить':'Создать проект'}</button><button type="button" class="button" data-action="close-modal">Отмена</button></div></form>${p?`<button class="button danger tiny" data-action="delete-project" data-id="${esc(p.id)}">Удалить проект</button>`:''}`}
if(m.type==='stage'){inner=`<div class="modal-head"><h2>Новый этап</h2><button class="button ghost" data-action="close-modal">✕</button></div><form id="stage-form"><div class="field"><label>Название этапа *</label><input name="title" required maxlength="80" placeholder="Например, разработка"></div><div class="modal-foot"><button class="button primary" type="submit">Добавить этап</button><button type="button" class="button" data-action="close-modal">Отмена</button></div></form>`}
if(m.type==='settings'){inner=`<div class="modal-head"><h2>Настройки Вектора</h2><button class="button ghost" data-action="close-modal">✕</button></div><p class="hint">Данные сохраняются только в этом браузере. Это основная версия «Вектора». Исторические данные прежней версии сохранены отдельно; изменения задач не синхронизируются между устройствами.</p><div class="stack"><button class="button" data-action="configure">Настроить виджеты</button><button class="button" data-action="backup">Скачать резервную копию JSON</button><button class="button" data-action="import-click">Восстановить из JSON</button><input id="import-file" type="file" accept="application/json,.json" style="display:none"><button class="button danger" data-action="reset-empty">Начать с пустыми задачами и проектами</button></div><p class="notice" style="margin-top:14px">При очистке данные в этом браузере будут заменены. Перед этим можно скачать копию.</p>`}
if(m.type==='widgets'){inner=`<div class="modal-head"><h2>Настроить главную</h2><button class="button ghost" data-action="close-modal">Готово ✕</button></div><p class="hint">От 3 до 5 модулей. Порядок — кнопками ↑ ↓. Размер: маленький, широкий, большой.</p><div class="stack">${S.widgets.map((w,i)=>`<div class="card" style="padding:11px"><div class="row between wrap"><strong>${esc(widgetInfo[w.id]?.name||w.id)}</strong><div class="row"><button class="button tiny" data-action="widget-up" data-index="${i}" ${i===0?'disabled':''}>↑</button><button class="button tiny" data-action="widget-down" data-index="${i}" ${i===S.widgets.length-1?'disabled':''}>↓</button><button class="button tiny danger" data-action="widget-remove" data-id="${w.id}" ${S.widgets.length<=3?'disabled':''}>✕</button></div></div><div class="field" style="margin:9px 0 0"><select data-widget-size="${w.id}">${[['small','Маленький · 1×1'],['wide','Широкий · 2×1'],['large','Большой · 2×2']].map(([key,label])=>`<option value="${key}" ${w.size===key?'selected':''}>${label}</option>`).join('')}</select>${w.id==='project'&&S.projects.length?`<label style="margin-top:8px">Какой проект показывать</label><select data-widget-project="project"><option value="">Первый активный</option>${S.projects.map(p=>`<option value="${esc(p.id)}" ${w.projectId===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select>`:''}</div></div>`).join('')}</div><div class="field" style="margin-top:16px"><label>Добавить модуль</label><div class="row"><select id="new-widget" ${S.widgets.length>=5?'disabled':''}>${Object.entries(widgetInfo).filter(([id])=>!S.widgets.some(w=>w.id===id)).map(([id,x])=>`<option value="${id}">${esc(x.name)}</option>`).join('')}</select><button class="button primary" data-action="widget-add" ${S.widgets.length>=5?'disabled':''}>Добавить</button></div></div>`}
root.innerHTML=`<div class="modal-cover" id="modal-cover"><div role="dialog" aria-modal="true" aria-label="Настройки или редактирование" class="modal">${inner}</div></div>`;if(m.type==='task')syncTaskFields()}
function stageOptions(pid,sid){const p=project(pid);return `<option value="">Без этапа</option>${(p?.stages||[]).map(s=>`<option value="${esc(s.id)}" ${sid===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}`}
function syncTaskFields(){const p=$('#task-project'),s=$('#task-stage'),rep=$('#repeat-mode');if(!p)return;$('#stage-area').style.display=p.value?'grid':'none';$('#repeat-area').style.display=p.value?'none':'block';if(p.value)rep.value='none';$('#repeat-fields').style.display=rep.value==='none'?'none':'block';$('#weekdays-area').style.display=rep.value==='weekly'?'grid':'none';}
function repeatHistory(t){let list=[];for(let i=0;i<14;i++){const d=shift(today(),-i);if(activeDate(t,d))list.push(`<div class="row between" style="margin:6px 0"><span class="sub">${niceDate(d)}</span><span class="pill">${status(t,d)==='done'?'✓ Выполнено':status(t,d)==='skip'?'Пропущено':d===today()?'Ожидает':'Не выполнено'}</span></div>`)}return `<div class="card" style="margin-top:15px"><strong>Последние повторения</strong>${list.join('')||'<p class="hint">Пока нет повторений</p>'}</div>`}
function toast(t){$('#toast-root').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>{$('#toast-root').innerHTML=''},2600)}
function openModal(type,id='',extra={}){UI.modal={type,id,...extra};renderModal()}
function setTaskDone(t,date,mode){if(project(t.projectId)?.status==='completed'&&mode==='done'){toast('Сначала верните проект в активные');return}if(t.repeat!=='none'&&(!activeDate(t,date)||date>today())){toast('Можно отмечать только прошедшее или сегодняшнее запланированное выполнение');return}if(t.repeat==='none'){t.done=mode==='done';t.doneAt=t.done?new Date().toISOString():'';if(t.projectId&&project(t.projectId)?.status==='completed'&&!t.done){project(t.projectId).status='active'}}else{t.doneDates||={};if(t.doneDates[date]===mode)delete t.doneDates[date];else t.doneDates[date]=mode}save();render()}
function fullDeleteProject(id){const p=project(id);if(!p)return;const ts=projectTasks(p);const ok=confirm(`Удалить проект «${p.title}»? Его ${ts.length} задач останутся в общем списке без привязки к проекту.`);if(!ok)return;ts.forEach(t=>{t.projectId='';t.stageId=''});S.projects=S.projects.filter(x=>x.id!==id);UI.projectId='';UI.modal=null;save();render();toast('Проект удалён, задачи сохранены')}
function handleAction(button){const act=button.dataset.action,id=button.dataset.id;switch(act){case 'nav':if(id==='create'){openModal('create-menu');return}UI.tab=id;UI.projectId='';UI.subject='';render();return;case 'goto':UI.tab=id;UI.projectId='';UI.subject='';render();return;case 'tasks-filter':UI.filter=id;render();return;case 'project-filter':UI.projFilter=id;render();return;case 'new-task':if(project(button.dataset.project)?.status==='completed'){toast('Сначала верните проект в активные');return}openModal('task','',{projectId:button.dataset.project||'',stageId:button.dataset.stage||''});return;case 'new-project':openModal('project');return;case 'edit-project':openModal('project',id);return;case 'open-task':openModal('task',id);return;case 'close-modal':UI.modal=null;renderModal();return;case 'toggle-task':{const t=task(id);if(!t)return;setTaskDone(t,button.dataset.date,status(t,button.dataset.date)==='done'?'open':'done');return}case 'skip-task':{const t=task(id);if(t)setTaskDone(t,button.dataset.date,'skip');return}case 'delete-task':{const t=task(id);if(t&&confirm(`Удалить задачу «${t.title}» и историю её выполнений?`)){S.tasks=S.tasks.filter(x=>x.id!==id);UI.modal=null;save();render();toast('Задача удалена')}return}case 'open-project':UI.tab='projects';UI.projectId=id;UI.modal=null;render();return;case 'back-projects':UI.projectId='';render();return;case 'toggle-project-status':{let p=project(id),x=progress(p);if(p.status==='active'){if(x.total===0||x.done!==x.total){toast('Сначала выполните все задачи проекта');return}p.status='completed'}else p.status='active';save();render();return}case 'new-stage':if(project(id)?.status==='completed'){toast('Сначала верните проект в активные');return}openModal('stage',id);return;case 'rename-stage':{const p=project(button.dataset.project);if(p?.status==='completed'){toast('Сначала верните проект в активные');return}const g=p?.stages.find(s=>s.id===id);if(!g)return;const x=prompt('Новое название этапа',g.title);if(x&&x.trim()){g.title=x.trim().slice(0,80);save();render()}return}case 'delete-stage':{const p=project(button.dataset.project);if(p?.status==='completed'){toast('Сначала верните проект в активные');return}const g=p?.stages.find(s=>s.id===id);if(!g)return;if(!confirm(`Удалить этап «${g.title}»? Задачи останутся в проекте без этапа.`))return;p.stages=p.stages.filter(s=>s.id!==id);S.tasks.filter(t=>t.projectId===p.id&&t.stageId===id).forEach(t=>t.stageId='');save();render();return}case 'delete-project':fullDeleteProject(id);return;case 'back-school':UI.subject='';render();return;case 'edit-term':UI.editTerm=true;render();return;case 'cancel-term-edit':UI.editTerm=false;render();return;case 'open-subject':UI.subject=id;render();return;case 'configure':openModal('widgets');return;case 'settings':openModal('settings');return;case 'widget-up':case 'widget-down':{const i=Number(button.dataset.index),j=i+(act==='widget-up'?-1:1);if(j<0||j>=S.widgets.length)return;[S.widgets[i],S.widgets[j]]=[S.widgets[j],S.widgets[i]];save();render();return}case 'widget-remove':if(S.widgets.length<=3)return;S.widgets=S.widgets.filter(w=>w.id!==id);save();render();return;case 'widget-add':{if(S.widgets.length>=5)return;const x=$('#new-widget')?.value;if(!x||S.widgets.some(w=>w.id===x))return;S.widgets.push({id:x,size:'small'});save();render();return}case 'backup':{const blob=new Blob([JSON.stringify({...S,backupVersion:1,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vektor-tasks-projects-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Резервная копия подготовлена');return}case 'import-click':$('#import-file')?.click();return;case 'reset-empty':if(confirm('Очистить задачи и проекты? Школьные оценки останутся в Firebase.')){window.__vectorBadStore=false;S.tasks=[];S.projects=[];UI.modal=null;UI.projectId='';save();render()}return;}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){e.preventDefault();handleAction(b)}else if(e.target.id==='modal-cover'){UI.modal=null;renderModal()}});
document.addEventListener('change',e=>{if(e.target.id==='year-picker'){UI.year=e.target.value;UI.subject='';UI.editTerm=false;render()}if(e.target.id==='quarter-picker'){UI.quarter=e.target.value==='year'?'year':Number(e.target.value);UI.subject='';UI.editTerm=false;render()}if(e.target.id==='task-project'){const sel=$('#task-stage');if(sel)sel.innerHTML=stageOptions(e.target.value,'');syncTaskFields()}if(e.target.id==='repeat-mode')syncTaskFields();if(e.target.dataset.widgetProject){let w=S.widgets.find(w=>w.id==='project');if(w){w.projectId=e.target.value;save();render()}return}if(e.target.dataset.widgetSize){let w=S.widgets.find(w=>w.id===e.target.dataset.widgetSize);if(w){w.size=e.target.value;save();render()}}if(e.target.id==='import-file'){const f=e.target.files?.[0];if(!f)return;f.text().then(text=>{try{let o=JSON.parse(text);if(!validState(o))throw Error('Неверная структура или повреждённые связи в копии');if(!confirm('Заменить все задачи и проекты данными из резервной копии?'))return;S={...o,schoolPeriods:o.schoolPeriods||{}};window.__vectorBadStore=false;UI.modal=null;UI.projectId='';UI.subject='';save();render();toast('Копия восстановлена')}catch(ex){alert('Не удалось восстановить: '+ex.message)}})}});
document.addEventListener('submit',e=>{if(e.target.id==='school-term-form'){e.preventDefault();const f=new FormData(e.target),from=f.get('from'),to=f.get('to'),bounds=schoolYearBounds(UI.year);if(!from||!to||from>to||from<bounds.from||to>bounds.to){alert('Укажите корректный период внутри учебного года');return}const other=Object.entries(S.schoolPeriods[UI.year]||{}).filter(([q])=>q!==String(UI.quarter));if(other.some(([q,p])=>from<=p.to&&to>=p.from)){alert('Четверти не должны пересекаться');return}S.schoolPeriods[UI.year]||={};S.schoolPeriods[UI.year][String(UI.quarter)]={from,to};UI.editTerm=false;save();render();toast('Даты четверти сохранены');return}if(e.target.id==='task-form'){e.preventDefault();const f=new FormData(e.target),title=(f.get('title')||'').trim(),pid=f.get('projectId')||'',rep=pid?'none':f.get('repeat'),days=f.getAll('days').map(Number);if(!title)return;if(rep==='weekly'&&!days.length){alert('Выберите дни повторения');return}let start=rep==='none'?'':(f.get('repeatStart')||today()),end=rep==='none'?'':(f.get('repeatEnd')||'');if(end&&start>end){alert('Дата окончания повторений раньше даты начала');return}const date=rep==='none'?(f.get('date')||''):'',deadline=rep==='none'?(f.get('deadline')||''):'';if(date&&deadline&&date>deadline){alert('Дата выполнения не должна быть позже крайнего срока');return}if(pid&&project(pid)?.status==='completed'){alert('Завершённый проект сначала нужно вернуть в активные');return}const changes={title,date,deadline,repeat:rep,days:rep==='weekly'?days:[],repeatStart:start,repeatEnd:end,projectId:pid,stageId:pid?(f.get('stageId')||''):'',};let old=UI.modal.id?task(UI.modal.id):null;if(old){const changedRepeat=old.repeat!==rep||old.repeatStart!==start||old.repeatEnd!==end||JSON.stringify(old.days)!==JSON.stringify(changes.days);if(old.repeat!=='none'&&changedRepeat&&Object.keys(old.doneDates||{}).length&&!confirm('Изменить расписание? Старая история выполнений останется привязана к датам.'))return;old._priorRepeat=old.repeat;old._priorDays=(old.days||[]).slice();old._priorStart=old.repeatStart;old._priorEnd=old.repeatEnd;Object.assign(old,changes);if(changedRepeat){old.repeatHistory||=[];if(old._priorRepeat!=='none')old.repeatHistory.push({repeat:old._priorRepeat,days:old._priorDays,repeatStart:old._priorStart,repeatEnd:old._priorEnd,until:shift(today(),-1)});old.repeatEffectiveFrom=rep==='none'?'':today();if(rep!=='none'&&old._priorRepeat==='none'&&old.done){old.previousOneOff={date:(old.doneAt?iso(new Date(old.doneAt)):null)||old.date||today(),done:true};old.done=false;old.doneAt=''}}delete old._priorRepeat;delete old._priorDays;delete old._priorStart;delete old._priorEnd;}else S.tasks.push({id:uid(),...changes,done:false,doneDates:{}});UI.modal=null;save();render();toast(old?'Задача изменена':'Задача создана');return}
if(e.target.id==='project-form'){e.preventDefault();const f=new FormData(e.target),title=(f.get('title')||'').trim();if(!title)return;let p=UI.modal.id?project(UI.modal.id):null;if(p){p.title=title;p.description=f.get('description')||'';p.deadline=f.get('deadline')||''}else{p={id:uid(),title,description:f.get('description')||'',deadline:f.get('deadline')||'',status:'active',stages:[]};S.projects.push(p)}UI.modal=null;UI.tab='projects';UI.projectId=p.id;save();render();toast('Проект сохранён');return}
if(e.target.id==='stage-form'){e.preventDefault();const title=(new FormData(e.target).get('title')||'').trim();const p=project(UI.modal.id);if(p&&title&&p.status==='active'){p.stages.push({id:uid(),title});UI.modal=null;save();render()}return}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.modal){UI.modal=null;renderModal()}});
render();
