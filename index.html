<style>
:root{--bg:#080f18;--card:#101d2a;--ln:#274052;--tx:#e4f5fb;--mu:#8ba9b9;--ac:#63ddfa;--bad:#ff6878;--ok:#49cfbd;--warn:#ffb75e;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;touch-action:manipulation}
html,body{height:100%;overflow:hidden}
body{margin:0;background:radial-gradient(ellipse 120% 45% at 50% -20%,#15354d 0%,transparent 90%),var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
#sc{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
main{max-width:560px;margin:0 auto;padding:17px 16px 30px}
h1,h2{font-weight:800;letter-spacing:.008em;margin:0}h2{font-size:20px;margin:17px 0 8px}
.big{font-weight:800;margin:0;letter-spacing:-.03em;font-variant-numeric:tabular-nums;font-size:70px;line-height:.9;color:var(--ac);text-shadow:0 0 22px #49d8ff2b}
.mu{color:var(--mu)}.sm,.hero .mu{font-size:14px;line-height:1.45}
.hero{display:flex;align-items:flex-end;gap:12px;margin-top:14px}
.card{background:linear-gradient(145deg,#142434,#101b29);border:1px solid #294355;border-radius:21px;padding:14px 16px;margin:10px 0;box-shadow:0 8px 22px #01081244}
.card.hint{color:var(--tx);border:1px solid #3c829a;background:linear-gradient(105deg,#164056,#112633);box-shadow:0 0 16px #36cafa12}
.hint .lb{font-weight:800;font-size:14px;margin-bottom:6px;color:var(--ac)}.hint .tx{font-size:17px;line-height:1.35;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.badge{font-size:22px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{min-width:40px;height:40px;border-radius:15px;border:1px solid var(--ln);background:none;color:var(--tx);font-weight:700;font-size:18px;line-height:1;cursor:pointer}
.c5{color:#62d9ff;border-color:#317893}.c4{color:#49cfbd;border-color:#377d75}.c3{border-color:var(--warn);color:var(--warn)}.c2{border-color:var(--bad);color:var(--bad)}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.btn{background:var(--ac);color:#111;border:0;border-radius:19px;font-weight:700;font-size:16px;padding:12px 16px;min-height:43px;cursor:pointer}.btn:not(.g){box-shadow:0 0 10px #63ddfa20}
.btn.g{background:none;color:var(--tx);border:1px solid var(--ln);box-shadow:none}
.chk{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.box{width:28px;height:28px;border-radius:6px;border:2px solid var(--mu);flex:none;display:grid;place-items:center;font-weight:700}

</style></head><body><div id="app"><div id="sc"><main id="m"></main></div><nav class="bar" aria-label="Разделы приложения"><button data-t="d"><span class="nav-icon">☑</span><span>Дела</span></button><button data-t="g"><span class="nav-icon">▤</span><span>Оценки</span></button><button data-t="r"><span class="nav-icon">◎</span><span>Цели</span></button><button data-t="p"><span class="nav-icon">◇</span><span>Профиль</span></button></nav></div>
<input type="file" accept="image/*" id="af" hidden data-action="avatarFile"><div id="tt"></div><div id="s"></div>
<script>
const CONFIG={
  schema:15,
  names:['Английский','Литература','География','История','Информатика','Биология','Физра','Алгебра','Химия','Русский','Физика','Труд','Геометрия','ОБЖ'],
  seed:[[2,4,2,5],[5,2,3,5,3,3],[5,5,2],[4],[4,5],[5],[5,5],[3,3,3,5,3,3,3],[5,4],[3,2],[3,3],[4,5],[5,4,4],[]],
  goal:4+1/3,
  endDefault:'2026-10-26',
  thresholds:[2.6,3.6,4.6],
};
const KEY='mt1',BAK=KEY+'_bak',THRESH=CONFIG.thresholds,GOAL=CONFIG.goal;
const NAMES_REF=CONFIG.names,SEED=CONFIG.seed;
let S,tab='d',dayOffset=0,profilePage='home';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const f2=x=>x.toFixed(2),sum=a=>a.reduce((x,y)=>x+y,0);
const fin=a=>a<THRESH[0]?2:a<THRESH[1]?3:a<THRESH[2]?4:5;
const pl=n=>{const a=n%100,b=n%10;return a>10&&a<15?'дней':b==1?'день':b>1&&b<5?'дня':'дней'};
const plw=n=>{const a=n%100,b=n%10;return a>10&&a<15?'учебных дней':b==1?'учебный день':b>1&&b<5?'учебных дня':'учебных дней'};

/* ===== STORE ===== */
const TASKS_DEFAULT=()=>[{i:'hw',t:'Сделать уроки'},{i:'rd',t:'Прочитать главы',u:'глав',target:3},{i:'pu',t:'Отжался',u:'раз',target:50},{i:'pw',t:'Подтянулся',u:'раз',target:5},{i:'ho',t:'Помощь по дому'}];
function defaults(){
  let n=0;
  return{
    g:Object.fromEntries(NAMES_REF.map((k,i)=>[k,SEED[i].map(v=>({i:++n,v}))])),
    t:TASKS_DEFAULT(),d:{},c:{},h:{},p:{dn:[],name:'Матвей'},hl:[],x:{},todos:[],end:CONFIG.endDefault,n,v:CONFIG.schema,schema:CONFIG.schema,
  }
}
const MIGRATIONS={
  4:o=>{o.t=o.t&&Array.isArray(o.t)?o.t:TASKS_DEFAULT();o.c=o.c||{};o.h=o.h||{};o.p=o.p||{dn:[]};return o},
  5:o=>{if(!o.g['ОБЖ'])o.g['ОБЖ']=[];o.x=o.x||{};o.hl=o.hl||Object.keys(o.h||{}).sort().map(d=>({d,f:o.h[d],e:null}));o.todos=o.todos||[];return o},
  14:o=>{
    if(!Array.isArray(o.t))o.t=TASKS_DEFAULT();
    o.t.forEach(t=>{if(!t.days)t.days=[1,2,3,4,5,6,0];if(t.active===undefined)t.active=true;if(!t.target)t.target=t.i==='rd'?3:t.i==='pu'?30:t.i==='pw'?5:1});
    return o;
  },
};
function validateAll(o){
  if(!o||typeof o!=='object'||Array.isArray(o))throw Error('bad root');
  if(!o.g||typeof o.g!=='object'||Array.isArray(o.g))throw Error('bad grades');
  for(const k of Object.keys(o.g)){
    if(!Array.isArray(o.g[k]))o.g[k]=[];
    o.g[k]=o.g[k].filter(x=>x&&[2,3,4,5].includes(Number(x.v))).map(x=>({i:Number(x.i)||0,v:Number(x.v)}));
  }
  o.archivedSubjects=Array.isArray(o.archivedSubjects)?o.archivedSubjects.filter(k=>Object.hasOwn(o.g,k)):[];
  if(!o.t||!Array.isArray(o.t))o.t=TASKS_DEFAULT();
  o.t=o.t.filter(t=>t&&typeof t==='object'&&typeof t.t==='string').map(t=>({i:String(t.i||('hb'+Math.random())),t:String(t.t),u:String(t.u||''),target:Math.max(1,Number(t.target)||1),days:Array.isArray(t.days)?t.days.filter(d=>d>=0&&d<7):[0,1,2,3,4,5,6],active:t.active!==false}));
  if(!o.d||typeof o.d!=='object'||Array.isArray(o.d))o.d={};
  for(const k of Object.keys(o.d))if(!Array.isArray(o.d[k]))o.d[k]=[];
  if(!o.c||typeof o.c!=='object'||Array.isArray(o.c))o.c={};
  if(!o.p||typeof o.p!=='object'||Array.isArray(o.p))o.p={dn:[],name:''};
  if(!Array.isArray(o.p.dn))o.p.dn=[];
  if(typeof o.p.name!=='string')o.p.name='';
  if(!Array.isArray(o.todos))o.todos=[];
  o.todos=o.todos.filter(x=>x&&typeof x==='object').map(x=>({id:String(x.id||('task'+Math.random())),text:String(x.text||''),due:String(x.due||''),done:x.done?String(x.done):null,deleted:!!x.deleted}));
  if(!Array.isArray(o.hl))o.hl=[];
  o.hl=o.hl.filter(x=>x&&typeof x==='object'&&Number.isFinite(x.f)).slice(-150);
  if(!o.h||typeof o.h!=='object')o.h={};
  if(!o.end||!/^\d{4}-\d{2}-\d{2}$/.test(o.end))o.end=CONFIG.endDefault;
  o.n=Math.max(o.n||0,...Object.values(o.g).flat().map(x=>x.i||0));
  o.schema=CONFIG.schema;o.v=CONFIG.schema;
  return o;
}
function migrate(o){
  let v=o.schema||o.v||4;
  while(v<CONFIG.schema){if(MIGRATIONS[v])o=MIGRATIONS[v](o);v++}
  return o;
}
function load(){
  let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
  if(!raw)return validateAll(defaults());
  let o;try{o=JSON.parse(raw)}catch(e){return validateAll(defaults())}
  try{return validateAll(migrate(o))}catch(e){try{const b=localStorage.getItem(BAK);if(b)return validateAll(JSON.parse(b))}catch(_){}return validateAll(defaults())}
}
let warned=false;
function persist(){
  try{const old=localStorage.getItem(KEY);if(old)localStorage.setItem(BAK,old)}catch(e){}
  try{localStorage.setItem(KEY,JSON.stringify(S))}
  catch(e){if(!warned){warned=true;toast('Данные не сохраняются — приватный режим?')}}
}
/* Keep an untouched backup of the old installed app's data before first migration. */
try{const original=localStorage.getItem(KEY);if(original&&!localStorage.getItem('mt1_backup_before_v16_3'))localStorage.setItem('mt1_backup_before_v16_3',original)}catch(e){}

S=load();
const ITEMS=()=>Object.keys(S.g).filter(k=>!S.archivedSubjects.includes(k));
const ACT=()=>ITEMS().filter(k=>S.g[k].length);
const vals=k=>S.g[k].map(x=>x.v),avg=k=>sum(vals(k))/vals(k).length;
const finAvg=()=>sum(ACT().map(k=>fin(avg(k))))/(ACT().length||1);
const exAvg=()=>sum(ACT().map(k=>avg(k)))/(ACT().length||1);

/* snapshot среднего — только при изменении оценок */
function snapshot(){
  const f=+finAvg().toFixed(3),e=+exAvg().toFixed(3),l=S.hl[S.hl.length-1];
  if(!l||l.f!==f||l.e!==e){
    S.hl.push({d:iso(new Date()),f,e});
    if(S.hl.length>150)S.hl.shift();
  }
}
const save=()=>persist();
const commit=(fn)=>{if(fn)fn();save();cs();render()};
const commitGrades=(fn)=>{if(fn)fn();snapshot();save();cs();render()};

const endD=()=>new Date((S.end||CONFIG.endDefault)+'T00:00:00'),fd=()=>endD().toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const chosenDate=()=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+dayOffset);return iso(d)};
const isDue=(t,date)=>t.active!==false&&(t.days||[0,1,2,3,4,5,6]).includes(new Date(date+'T12:00:00').getDay());
const cnt=(d,i)=>(S.c[d]||{})[i]||0;
const wk=()=>{const d=new Date(),k=(d.getDay()+6)%7,r=[];for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()-k+i);r.push(x)}return r};

/* ===== STREAK / ACHIEVEMENTS ===== */
function streak(){let c=0,d=new Date();if(!(S.d[iso(d)]||[]).includes('hw'))d.setDate(d.getDate()-1);while((S.d[iso(d)]||[]).includes('hw')){c++;d.setDate(d.getDate()-1)}return c}
const TH={pu:50,rd:3};
function ach(d){const dn=S.d[d]||[],c=S.c[d]||{};return{all:S.t.every(t=>t.u?(c[t.i]||0)>=Number(t.target||1):dn.includes(t.i)),ex:(c.pu||0)+(c.pw||0)>=TH.pu,rd:(c.rd||0)>=TH.rd}}

/* ===== SCHOOL MATH ===== */
function plan(a){
  const n=a.length,s=sum(a),target=THRESH[1];
  const k=Math.max(0,Math.ceil((target*n-s)/(5-target)-1e-9));
  return{k,x:(s+5*k)/(n+k),t:k>=9999?'получить очень много «5» подряд':`получить ${k}× «5» подряд`};
}
function calc(){
  const bad=[],good=[];
  ACT().forEach(k=>{
    const a=vals(k),av=avg(k);
    if(av<THRESH[1])bad.push({k,av,p:plan(a),f:fin(av)});
    else{const x=(sum(a)+3)/(a.length+1);good.push({k,av,x:x<THRESH[1]?x:null})}
  });
  bad.sort((a,b)=>(a.f-b.f)||(a.p.k-b.p.k)||(a.av-b.av));
  return{bad,good};
}
function scen(k){const a=vals(k),s=sum(a),n=a.length,c=avg(k);return[5,4,3].map(v=>{const x=(s+v)/(n+1);return`<span>${v} → <b class="${x>=THRESH[1]?'ok':x>=c?'warn':'bad'}">${f2(x)}</b></span>`}).join('')}

/* ===== CHARTS ===== */
function chart(){
  const L=S.hl.slice(-40),n=L.length;if(!n)return'';
  const vs=L.map(p=>p.f).concat(L.filter(p=>p.e!=null).map(p=>p.e),GOAL),lo=Math.floor((Math.min(...vs)-.1)*10)/10,hi=Math.ceil((Math.max(...vs)+.1)*10)/10,W=320,H=130,P=28;
  const x=i=>n>1?P+i*(W-P-8)/(n-1):W/2,y=v=>H-18-(v-lo)/(hi-lo)*(H-30),lb=p=>p.d.slice(8)+'.'+p.d.slice(5,7);
  const path=k=>{let d='',pen=0;L.forEach((p,i)=>{if(p[k]==null){pen=0;return}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(p[k]).toFixed(1);pen=1});return d};
  const dot=(k,c,r)=>{let i=-1;for(let q=n-1;q>=0;q--)if(L[q][k]!=null){i=q;break}return i<0?'':`<circle cx="${x(i).toFixed(1)}" cy="${y(L[i][k]).toFixed(1)}" r="${r}" fill="${c}"/>`};
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="График среднего балла"><line x1="${P}" x2="${W-8}" y1="${y(GOAL)}" y2="${y(GOAL)}" stroke="var(--ac)" stroke-dasharray="4 4"/><text x="0" y="${y(GOAL)+4}" font-size="11" fill="var(--ac)">${f2(GOAL)}</text><text x="0" y="${y(lo)+4}" font-size="11" fill="var(--mu)">${lo.toFixed(1)}</text>${n>1?`<path d="${path('e')}" fill="none" stroke="var(--tx)" stroke-width="2" stroke-linejoin="round"/><path d="${path('f')}" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linejoin="round"/>`:''}${dot('e','var(--tx)',4)}${dot('f','var(--ok)',5)}${n>1?`<text x="${P}" y="${H-2}" font-size="11" fill="var(--mu)">${lb(L[0])}</text>`:''}<text x="${W-8}" y="${H-2}" font-size="11" text-anchor="end" fill="var(--mu)">${lb(L[n-1])}</text></svg>${n<2?'<div class="mu sm">Линия появится после следующей оценки.</div>':''}`;
}
function gradeDonut(){
  const c=[2,3,4,5].map(v=>({v,n:ACT().filter(k=>fin(avg(k))===v).length}));
  const total=c.reduce((n,x)=>n+x.n,0);
  if(!total)return '<div class="mu sm">Диаграмма появится после добавления оценок.</div>';
  const palette={2:'#ff6878',3:'#ffb75e',4:'#49cfbd',5:'#62d9ff'};
  let start=0;

function prof(ds){

  else if(n>=N)b=`<b>Все ${N} шагов пройдены.</b><div class="mu sm">Можно вместе подвести итог.</div>`;
  else b=`<div class="mu sm">Шаг ${n+1} из ${N} · на эту неделю</div><b>${STEPS[n][0]}</b><div style="margin:4px 0 12px">${STEPS[n][1]}</div><button class="btn" data-action="profStep">Сделал</button>`;
  const h=dn.filter(x=>x!==w).reverse().map(x=>`<div style="padding:8px 0;border-top:1px solid var(--ln)"><div class="row"><b class="sm">${STEPS[x.n][0]}</b><span class="mu sm">${x.d.slice(8)}.${x.d.slice(5,7)}</span></div>${x.t?`<div class="sm mu">${esc(x.t)}</div>`:''}</div>`).join('');
  return`<h2>Будущая профессия</h2><div class="mu sm" style="margin-bottom:8px">До поступления около 3 лет. Один шаг в неделю: профессия, вуз, экзамены.</div><div class="card">${b}${h?`<div class="mu sm" style="margin-top:14px">Что я уже узнал</div>${h}`:''}</div>`;
}
function openProfStep(){
  const n=S.p.dn.length;
  sheet(`<h2 style="margin-top:0">Шаг ${n+1}: ${STEPS[n][0]}</h2><div class="mu sm">Что узнал или решил? Одно-два предложения (можно пропустить).</div><textarea id="pn" maxlength="300"></textarea><div class="row" style="gap:8px"><button class="btn" data-action="saveProfStep">Готово</button><button class="btn g" data-action="closeSheet">Отмена</button></div>`);
}
function saveProfStep(){
  const n=S.p.dn.length,t=document.getElementById('pn').value.trim();
  S.p.dn.push({n,d:iso(new Date()),t});
  save();cs();render();toast('★ Шаг по профессии сделан');
}

/* ===== PROFILE ===== */
function profileIcon(name){
  const icons={
    compass:'<circle cx="12" cy="12" r="9"/><path d="m16.2 7.8-2.8 5.6-5.6 2.8 2.8-5.6z"/>',
    chart:'<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/><path d="M17 7h3v3"/>',
    backup:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 3v6h8V3M8 16h8M12 12v8"/>',
    archive:'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v11h14V9M10 13h4"/>',
  };
  return '<svg aria-hidden="true" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">'+icons[name]+'</svg>';
}
function profile(){
  const W=wk(),dates=W.map(iso);
  const weekly=S.t.filter(t=>t.active!==false).map(t=>{
    const n=t.u?sum(dates.map(d=>cnt(d,t.i))):dates.filter(d=>(S.d[d]||[]).includes(t.i)).length;
    return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--ln)"><span>${esc(t.t)}</span><b>${n} ${t.u||'дн.'}</b></div>`;
  }).join('');
  if(profilePage==='archive'){
    const a=S.t.filter(t=>t.active===false);
    const dt=S.todos.filter(t=>t.deleted);
    return `<button class="btn g" data-action="profileHome">← Профиль</button><h2>Архив привычек</h2><div class="mu sm">Привычки сохранены вместе с историей. Их можно вернуть.</div>${a.length?a.map(t=>`<div class="card archived-habit"><span>${esc(t.t)}</span><button type="button" class="btn g" data-action="restoreHabit" data-id="${t.i}">Вернуть</button></div>`).join(''):'<div class="card mu">Пока нет привычек в архиве.</div>'}
    <h2>Удалённые задачи</h2><div class="mu sm">Мягко удалены — можно вернуть.</div>${dt.length?dt.map(t=>`<div class="card archived-habit"><span>${esc(t.text)}</span><button type="button" class="btn g" data-action="restoreTodo" data-id="${t.id}">Вернуть</button></div>`).join(''):'<div class="card mu">Удалённых задач нет.</div>'}`;
  }
  if(profilePage==='profession')return `<button class="btn g" data-action="profileHome">← Профиль</button>${prof(dates)}`;
  if(profilePage==='stats')return `<button class="btn g" data-action="profileHome">← Профиль</button><h2>Прогресс за неделю</h2><div class="card">${weekly||'Пока нет привычек'}</div><div class="card">Выполненные задачи: <b>${S.todos.filter(t=>t.done&&dates.includes(t.done)).length}</b></div><h2>Достижения</h2><div class="card">Уроки подряд: <b>${streak()} дн.</b><div class="mu sm">Старые результаты упражнений и чтения сохранены в истории.</div></div>`;
  if(profilePage==='backup')return `<button class="btn g" data-action="profileHome">← Профиль</button><h2>Резервная копия</h2><div class="card"><b>Копия в файл</b><div class="mu sm" style="margin:8px 0 12px">Сохрани файл в «Файлы» на iPhone или в iCloud Drive. Это надёжнее, чем длинный текст в Заметках.</div><div class="mini-actions"><button type="button" class="btn" data-action="exportFile">Сохранить копию .json</button><button type="button" class="btn g" data-action="pickBackupFile">Восстановить из файла</button></div><input id="backupFileInput" type="file" accept=".json,application/json" data-action="importFile" style="display:none"></div><h2>Старый способ: текст</h2><div class="mu sm">Для небольших копий. Длинный текст при вставке может обрезаться.</div><textarea id="bk" placeholder="Вставь текст резервной копии целиком"></textarea><div class="mini-actions"><button type="button" class="btn g" data-action="showBackup">Скопировать текст</button><button type="button" class="btn g" data-action="importBackup">Восстановить из текста</button></div><div id="backupStatus" class="mu sm" role="status" aria-live="polite" style="margin-top:10px"></div>`;
  const archivedCount=S.t.filter(t=>t.active===false).length;
  const tiles=[
    ['profession','compass','Профессия','1 шаг в неделю'],
    ['stats','chart','Прогресс','Статистика и награды'],
    ['backup','backup','Копия данных','Сохранить и восстановить'],
    ['archive','archive','Архив','Привычки: '+archivedCount],
  ];
  const name=S.p.name||'Матвей';
  return `<button type="button" class="profile-identity" data-action="avatar"><span class="profile-avatar">${S.av?'<img alt="" src="'+S.av+'">':'Mt'}</span><span class="profile-identity-text"><strong>${esc(name)}</strong><small>Личный прогресс · изменить фото</small></span><span class="profile-chevron" aria-hidden="true">›</span></button>
<div class="profile-grid">${tiles.map(x=>`<button type="button" class="profile-tile" data-action="profilePage" data-id="${x[0]}"><span class="profile-tile-icon">${profileIcon(x[1])}</span><span class="profile-tile-name">${x[2]}</span><span class="profile-tile-desc">${x[3]}</span></button>`).join('')}</div>
<div class="profile-version">Вектор · схема v${CONFIG.schema}</div>`;
}
function setProfilePage(p){profilePage=p;render();document.getElementById('sc').scrollTop=0}

/* ===== SHEET ===== */
function sheet(h){document.getElementById('s').innerHTML=h?`<div class="ov" data-close="1"><div class="sh">${h}</div></div>`:''}
const cs=()=>sheet('');
function toast(m,opt){
  const e=document.getElementById('tt');
  e.innerHTML=`<span>${esc(m)}</span>`;
  e.className='on';
  clearTimeout(toast.t);
  if(opt&&opt.action){
    const b=document.createElement('button');b.textContent=opt.action;
    b.onclick=()=>{opt.onAction&&opt.onAction();e.className='';clearTimeout(toast.t)};
    e.appendChild(b);
    toast.t=setTimeout(()=>e.className='',opt.ms||5000);
  }else{
    toast.t=setTimeout(()=>e.className='',opt.ms||3000);
  }
}

/* ===== AVATAR ===== */
function openAvatar(){
  sheet(`<h2 style="margin-top:0">Профиль</h2><label class="mu sm" for="pname">Имя</label><input id="pname" maxlength="20" value="${esc(S.p.name||'')}" data-action="profileName"><div class="mu sm" style="margin-top:14px">Аватар</div><div class="mini-actions" style="margin-top:8px"><button class="btn" data-action="pickAvatar">Выбрать фото</button><button class="btn g" data-action="clearAvatar">Вернуть значок</button></div><button class="btn g" style="margin-top:16px;width:100%" data-action="closeSheet">Готово</button>`);
}
function setAvatar(input){
  const f=input.files&&input.files[0];if(!f)return;
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{
    try{
      const c=document.createElement('canvas'),m=Math.min(im.width,im.height);
      c.width=c.height=160;
      c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);
      const prev=S.av;S.av=c.toDataURL('image/jpeg',.8);
      if(!persist())S.av=prev;
      cs();render();toast('Фото сохранено');
    }catch(e){alert('Не получилось открыть фото')}
    finally{URL.revokeObjectURL(u)}
  };
  im.onerror=()=>{URL.revokeObjectURL(u);alert('Не получилось открыть фото')};
  im.src=u;input.value='';
}

/* ===== BACKUP ===== */
function backupStatus(m){const e=document.getElementById('backupStatus');if(e)e.textContent=m}
function validateBackup(o){
  if(!o||typeof o!=='object'||Array.isArray(o)||!o.g||typeof o.g!=='object'||Array.isArray(o.g)||!Array.isArray(o.t)||!o.p||typeof o.p!=='object'||!Object.keys(o.g).length||!Object.values(o.g).every(a=>Array.isArray(a)&&a.every(x=>x&&[2,3,4,5].includes(Number(x.v)))))throw new Error('Некорректная или неполная копия');
  return o;
}
function installBackup(o){
  validateBackup(o);
  if(!confirm('Заменить текущие данные содержимым резервной копии?'))return false;
  const previous=JSON.stringify(S),replacement=JSON.parse(JSON.stringify(o));
  try{
    const backupKey='mt_before_restore_'+iso(new Date());
    localStorage.setItem(backupKey,previous);
    const migrated=validateAll(migrate(replacement));
    localStorage.setItem(KEY,JSON.stringify(migrated));
    S=migrated;persist();render();
    alert('Все данные из файла восстановлены. Предыдущие данные сохранены в резервной копии на этом устройстве.');
    return true;
  }catch(err){
    alert('Не удалось сохранить восстановленные данные. Текущие данные не заменены. Проверь свободное место в Safari.');
    return false;
  }
}
async function exportBackupFile(){
  try{
    const json=JSON.stringify(S),name='matvey-backup-'+iso(new Date())+'.json';
    const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'Резервная копия Матвея'});backupStatus('В меню «Поделиться» выбери «Сохранить в Файлы».');return}
      catch(err){if(err&&err.name==='AbortError')return}
    }
    const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    backupStatus('Файл подготовлен. Проверь «Загрузки» или приложение «Файлы».');
  }catch(err){backupStatus('Не удалось создать файл. Попробуй открыть приложение в Safari.')}
}
async function importBackupFile(input){
  const file=input.files&&input.files[0];if(!file)return;
  try{
    if(file.size>10*1024*1024)throw new Error('Файл слишком большой');
    const text=await file.text(),o=validateBackup(JSON.parse(text));
    installBackup(o);
  }catch(err){backupStatus('Файл не подходит или повреждён. Данные не изменены.')}
  finally{input.value=''}
}
function showBackup(){
  const e=document.getElementById('bk');if(!e)return;
  e.value=JSON.stringify(S);e.select();
  try{const r=navigator.clipboard&&navigator.clipboard.writeText(e.value);if(r)r.catch(()=>{})}catch(x){}
  backupStatus('Текст подготовлен. Для больших копий используй сохранение в файл.');
}
function importBackup(){
  const e=document.getElementById('bk');if(!e)return;
  try{installBackup(validateBackup(JSON.parse(e.value)))}
  catch(err){backupStatus('Текст неполный или повреждён. Данные не изменены.')}
}

/* ===== ACTIONS ===== */
const ACTIONS={
  closeSheet:()=>cs(),
  shiftDay:(n)=>shiftDay(n),
  habitClick:(id)=>habitClick(id),
  addCount:(id,arg,el)=>{
    const custom=el.dataset.custom,zero=el.dataset.zero;
    if(custom){const v=Number(document.getElementById('cn').value)||0;addCount(id,v,false)}
    else addCount(id,Number(arg||0),!!zero);
  },
  newTodo:()=>editTodo(''),
  editTodo:(id)=>editTodo(id),
  saveTodo:(id)=>saveTodo(id),
  removeTodo:(id)=>removeTodo(id),
  toggleTodo:(id)=>toggleTodo(id),
  restoreTodo:(id)=>restoreTodo(id),
  newHabit:()=>editHabit(''),
  editHabit:(id)=>editHabit(id),
  saveHabit:(id)=>saveHabit(id),
  archiveHabit:(id)=>archiveHabit(id),
  restoreHabit:(id)=>tRestore(id),
  homeworkToggle:(j)=>homeworkToggle(Number(j)),
  homeworkSave:()=>homeworkSave(),
  homeworkRemove:()=>homeworkRemove(),
  subjects:()=>openSubjects(),
  addSubject:()=>addSubject(),
  removeSubject:(k)=>removeSubject(k),
  restoreSubject:(k)=>restoreSubject(k),
  endInput:(_,__,el)=>{if(/^\d{4}-\d{2}-\d{2}$/.test(el.value)){S.end=el.value;save();render()}},
  addGrade:(k)=>addGrade(k),
  editGrade:(k,_,el)=>editGrade(k,Number(el.dataset.arg)),
  putGrade:(k,v,el)=>putGrade(k,Number(v),el.dataset.arg2,el.dataset.new==='1'),
  deleteGrade:(k,_,el)=>deleteGrade(k,Number(el.dataset.arg)),
  profStep:()=>openProfStep(),
  saveProfStep:()=>saveProfStep(),
  profileHome:()=>setProfilePage('home'),
  profilePage:(p)=>setProfilePage(p),
  avatar:()=>openAvatar(),
  pickAvatar:()=>document.getElementById('af').click(),
  clearAvatar:()=>{S.av=null;save();cs();render()},
  exportFile:()=>exportBackupFile(),
  pickBackupFile:()=>document.getElementById('backupFileInput').click(),
  importFile:()=>{},
  showBackup:()=>showBackup(),
  importBackup:()=>importBackup(),
};

/* ===== DELEGATION ===== */
document.addEventListener('click',e=>{
  const closeEl=e.target.closest('[data-close]');
  if(closeEl&&e.target===closeEl){cs();return}
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const {action,id,arg}=el.dataset;
  const fn=ACTIONS[action];
  if(fn)fn(id,arg,el);
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  if(el.dataset.action==='profileName'){S.p.name=el.value.trim();save();render()}
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  if(el.dataset.action==='avatarFile')setAvatar(el);
  else if(el.dataset.action==='importFile')importBackupFile(el);
});

/* ===== TABS ===== */
function switchTab(t){
  if(!['d','g','r','p'].includes(t))return;
  tab=t;
  if(t==='p')profilePage='home';
  document.getElementById('sc').scrollTop=0;
  render();
}
document.querySelectorAll('.bar button[data-t]').forEach(button=>{
  button.addEventListener('click',()=>switchTab(button.dataset.t),{passive:true});
});

/* ===== RENDER ===== */
function render(){
  document.body.classList.toggle('grades-view',tab==='g');
  document.querySelectorAll('.bar button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
  const subtitles={d:'Дела и привычки',g:'Учёба и оценки',r:'Учебные цели',p:'Профиль'};
  const avatar=S.av?`<img src="${S.av}" alt="">`:'Mt';
  const main={r:road,g:grades,d:today,p:profile}[tab]();
  document.getElementById('m').innerHTML=`<div class="hd"><button class="avb" data-action="profilePage" data-id="home" aria-label="Профиль">${avatar}</button><div><h1 style="font-size:22px">Вектор · личный прогресс</h1><div class="mu sm">${subtitles[tab]}</div></div></div>`+main;
}

/* ===== BOOT ===== */
save();
render();
