<script>
'use strict';
const STORE='vektor_logic_mvp_2026_10';
const LEGACY_STORE='vektor_logic_before_simple_tasks_2026_10';
const $=sel=>document.querySelector(sel);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>`id_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,9)}`;
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dt=(s)=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const shift=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const niceDate=s=>s?new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(dt(s)):'Без даты';
const DOW=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const longday=d=>new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(dt(d));
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
function emptyState(){return {tasks:[],projects:[],widgets:[{id:'today',size:'large'},{id:'school',size:'small'},{id:'project',size:'small'},{id:'week',size:'wide'}],schoolPeriods:{},archivedRepeats:[]}}
function validState(x){
 const plain=o=>o&&typeof o==='object'&&!Array.isArray(o);
 const date=d=>!d||(/^\d{4}-\d{2}-\d{2}$/.test(d)&&!Number.isNaN(Date.parse(d+'T12:00:00')));
 if(!plain(x)||!Array.isArray(x.tasks)||!Array.isArray(x.projects)||!Array.isArray(x.widgets)||x.tasks.length>20000||x.projects.length>5000||x.widgets.length<3||x.widgets.length>5)return false;
 const projIds=new Set(),taskIds=new Set();
 for(const p of x.projects){if(!plain(p)||typeof p.id!=='string'||!p.id||projIds.has(p.id)||typeof p.title!=='string'||!Array.isArray(p.stages)||!['active','completed'].includes(p.status)||!date(p.deadline)||p.stages.length>150||new Set(p.stages.map(g=>g.id)).size!==p.stages.length||p.stages.some(g=>!plain(g)||typeof g.id!=='string'||typeof g.title!=='string'))return false;projIds.add(p.id)}
 for(const t of x.tasks){if(!plain(t)||typeof t.id!=='string'||!t.id||taskIds.has(t.id)||typeof t.title!=='string'||!['none','daily','weekly'].includes(t.repeat)||typeof t.done!=='boolean'||!Array.isArray(t.days)||t.days.some(d=>!Number.isInteger(d)||d<1||d>7)||!date(t.date)||!date(t.deadline)||!date(t.repeatStart)||!date(t.repeatEnd)||!plain(t.doneDates)||Object.keys(t.doneDates).length>6000||Object.entries(t.doneDates).some(([d,v])=>!date(d)||!['done','skip'].includes(v))||t.projectId&&!projIds.has(t.projectId)||t.projectId&&t.repeat!=='none'||t.stageId&&!x.projects.find(p=>p.id===t.projectId)?.stages.some(g=>g.id===t.stageId)||t.repeatHistory&&(!Array.isArray(t.repeatHistory)||t.repeatHistory.length>150||t.repeatHistory.some(h=>!plain(h)||!date(h.repeatStart)||!date(h.repeatEnd)||!date(h.until)||!['daily','weekly'].includes(h.repeat)||!Array.isArray(h.days))))return false;taskIds.add(t.id)}
 const keys=new Set();for(const w of x.widgets){if(!plain(w)||!['today','school','project','week','next','marks','allProjects','subjects'].includes(w.id)||!['small','wide','large'].includes(w.size)||keys.has(w.id))return false;keys.add(w.id)}
 if(x.archivedRepeats!==undefined&&(!Array.isArray(x.archivedRepeats)||x.archivedRepeats.length>20000||x.archivedRepeats.some(r=>!plain(r)||typeof r.id!=='string')))return false;
 if(x.schoolPeriods!==undefined&&(!plain(x.schoolPeriods)||Object.values(x.schoolPeriods).some(year=>!plain(year)||Object.keys(year).some(q=>!['1','2','3','4'].includes(q))||Object.values(year).some(t=>!plain(t)||!date(t.from)||!date(t.to)||!t.from||!t.to||t.from>t.to))))return false;
 return true;
}
function normalizeState(x,protectOriginal=false){
 const out={...x,schoolPeriods:x.schoolPeriods||{},archivedRepeats:Array.isArray(x.archivedRepeats)?x.archivedRepeats.slice():[]};
 let changed=false;
 out.tasks=x.tasks.map(original=>{
   const t={...original},wasRepeated=t.repeat&&t.repeat!=='none';
   const hadHistory=Object.keys(t.doneDates||{}).length>0||(t.repeatHistory||[]).length>0||!!t.previousOneOff;
   if(wasRepeated||hadHistory){out.archivedRepeats.push({id:t.id,title:t.title,archivedAt:new Date().toISOString(),original});changed=true}
   if(wasRepeated){t.date='';t.done=false;t.doneAt=''}
   if(t.deadline){if(!t.date)t.date=t.deadline;if(t.date!==t.deadline)t.legacyDeadline=t.deadline;changed=true}
   if(t.deadline!==undefined){delete t.deadline;changed=true}
   for(const key of ['repeatHistory','repeatEffectiveFrom','previousOneOff'])if(t[key]!==undefined){delete t[key];changed=true}
   if(t.repeat!=='none'||(t.days||[]).length||t.repeatStart||t.repeatEnd||Object.keys(t.doneDates||{}).length)changed=true;
   // Legacy neutral fields are retained only for compatibility with earlier JSON backups.
   t.repeat='none';t.days=[];t.repeatStart='';t.repeatEnd='';t.doneDates={};t.date=t.date||'';
   return t;
 });
 if(changed&&protectOriginal){
   try{
     if(!localStorage.getItem(LEGACY_STORE))localStorage.setItem(LEGACY_STORE,JSON.stringify(x));
     localStorage.setItem(STORE,JSON.stringify(out));
   }catch(e){window.__vectorBadStore=true;window.__vectorMigrationError=true}
 }

}
function load(){
 try{
   const x=JSON.parse(localStorage.getItem(STORE)||'null');
   if(validState(x))return normalizeState(x,true);
   if(x)window.__vectorBadStore=true;
 }catch(e){}

}
let S=load();
function save(){
 if(window.__vectorBadStore){toast('Сохранение отключено: восстанови резервную копию');return}
 try{localStorage.setItem(STORE,JSON.stringify(S))}
 catch(e){toast('Браузер не сохранил данные. Проверь настройки хранения.')}
}

let UI={tab:'home',filter:'today',projectId:'',subject:'',year:schoolYearFor(today()),quarter:defaultSchoolQuarter(today(),schoolYearFor(today()),S.schoolPeriods),schoolSettingsQuarter:1,schoolScreen:'overview',schoolChartMode:'overall',schoolPeriodTouched:false,modal:null,projFilter:'active'};
/* Prefer real, saved quarter dates. For the 2026/27 school year,
   the user confirmed that quarter II began by 27 October 2026.
   This chooses only the displayed period; it never fabricates
   grade date boundaries or changes saved school periods. */
function defaultSchoolQuarter(date,year,periods={}) {
 const quarters=periods?.[year]||{};
 const matched=[1,2,3,4].find(q=>quarters[String(q)]&&date>=quarters[String(q)].from&&date<=quarters[String(q)].to);
 if(year==='2026-2027'&&date>='2026-10-27'&&date<'2027-01-01'&&(!matched||matched===1))return 2;
 if(matched)return matched;
 if(schoolYearFor(date)!==year)return 'year';
 const month=Number(date.slice(5,7));
 if(month===9||month===10)return 1;
 if(month===11||month===12)return 2;
 if(month>=1&&month<=3)return 3;
 if(month>=4&&month<=6)return 4;
 return 'year';
}
const project=id=>S.projects.find(p=>p.id===id);
const task=id=>S.tasks.find(t=>t.id===id);
function activeDate(t,day){
 if(t.done)return ((t.doneAt?iso(new Date(t.doneAt)):null)||t.date||'')===day;
 return !!t.date&&t.date===day;
}
function status(t,day){
 return t.done&&((t.doneAt?iso(new Date(t.doneAt)):null)||t.date||'')===day?'done':'open';
}
function getDay(date){return S.tasks.filter(t=>activeDate(t,date)).sort((a,b)=>Number(status(a,date)==='done')-Number(status(b,date)==='done') || (a.deadline||'9999').localeCompare(b.deadline||'9999'))}
function summary(date){const a=getDay(date);return {done:a.filter(t=>status(t,date)==='done').length,total:a.length}}
function isOverdue(t){return !t.done&&!!t.date&&t.date<today()}
function projectTasks(p){return S.tasks.filter(t=>t.projectId===p.id&&t.repeat==='none')}
function progress(p){const list=projectTasks(p);return {done:list.filter(t=>t.done).length,total:list.length,pct:list.length?Math.round(list.filter(t=>t.done).length/list.length*100):null}}
function fmt(n){return n===null||!Number.isFinite(n)?'—':n.toFixed(2).replace('.',',')}
function cloudSnapshot(){return window.schoolCloud?.snapshot?.()||null}
function schoolYearFor(date){const y=Number(date.slice(0,4)),m=Number(date.slice(5,7));const start=m>=9?y:y-1;return `${start}-${start+1}`}
function schoolYearBounds(year){const start=Number(year.slice(0,4));return {from:`${start}-09-01`,to:`${start+1}-08-31`}}
function schoolRange(){const year=UI.year||cloudSnapshot()?.schoolYear||schoolYearFor(today());if(UI.quarter==='year')return schoolYearBounds(year);return S.schoolPeriods?.[year]?.[String(UI.quarter)]||null}
function selectedSchoolRows(){const snap=cloudSnapshot(),range=schoolRange();return !snap||!range?[]:snap.grades.filter(g=>g.date>=range.from&&g.date<=range.to)}
function cloudRows(){return selectedSchoolRows().filter(g=>!g.official&&g.score!==null)}
function cloudMean(rows){return rows.length?rows.reduce((n,g)=>n+g.score,0)/rows.length:null}
function cloudSubjects(){return [...new Set(selectedSchoolRows().map(g=>g.subject))].sort((a,b)=>a.localeCompare(b,'ru'))}
function gradePrediction(mean){return mean===null?null:Math.max(2,Math.min(5,Math.floor(mean)+((mean-Math.floor(mean))>=.6-1e-9?1:0)))}
function fdate(date){return date?date.split('-').reverse().join('.'):''}
function gradeTrend(rows){const vals=rows.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));let sum=0;const points=vals.map((g,i)=>{sum+=g.score;return sum/(i+1)});if(points.length<2)return '<p class="hint">График появится после второй оценки.</p>';const lo=2,hi=5,coords=points.map((v,i)=>`${14+i*290/(points.length-1)},${98-(v-lo)/(hi-lo)*80}`).join(' ');return `<svg viewBox="0 0 320 113" width="100%" role="img" aria-label="Динамика среднего балла"><line x1="12" x2="304" y1="98" y2="98" stroke="#d2dce9"/><polyline points="${coords}" fill="none" stroke="#2456bf" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`}

function taskRow(t,day,opts={}){
 const p=project(t.projectId),st=opts.overall?(t.done?'done':'open'):status(t,day||today());
 const canTick=!opts.noToggle&&!(p&&p.status==='completed'),label=t.date?'Дата: '+niceDate(t.date):'Без даты';
 const extra=label+(p?' · '+esc(p.title):'')+(isOverdue(t)?' · ПРОСРОЧЕНО':'');
 return '<div class="task-row">'+(canTick?
  '<button title="'+(t.done?'Отменить выполнение':'Отметить выполнение')+'" class="check '+(st==='done'?'done':'')+'" data-action="toggle-task" data-id="'+esc(t.id)+'" data-date="'+esc(day||today())+'">'+(st==='done'?'✓':'')+'</button>':
  '<span class="check" style="opacity:.35" aria-label="Только просмотр"></span>')+
  '<div class="task-main"><div class="task-name '+(st==='done'?'done':'')+'">'+esc(t.title)+'</div><div class="task-meta">'+extra+'</div></div>'+

}

case 'next':{const x=S.tasks.filter(t=>!t.done&&t.date&&t.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,isMini?2:4);return `<div class="card-head"><h2>Ближайшие дела</h2><button class="link" data-action="goto" data-id="tasks">→</button></div>${x.length?x.map(t=>taskRow(t,today(),{noToggle:true})).join(''):'<div class="hint">Предстоящих задач нет.</div>'}`}

 '<p class="hint">Учебный год '+esc(year)+'. Эти даты задаются один раз и используются при расчёте оценок. На школьном экране они больше не редактируются.</p>'+
 '<div class="field"><label for="school-settings-quarter">Четверть</label><select id="school-settings-quarter">'+
 [1,2,3,4].map(n=>'<option value="'+n+'" '+(n===q?'selected':'')+'>'+n+'-я четверть'+
 (S.schoolPeriods?.[year]?.[String(n)]?' · настроена':'')+'</option>').join('')+'</select></div>'+
 '<form id="school-term-form"><div class="form-grid"><div class="field"><label>Начало</label><input type="date" name="from" required value="'+esc(saved?.from||'')+'"></div>'+
 '<div class="field"><label>Окончание</label><input type="date" name="to" required value="'+esc(saved?.to||'')+'"></div></div>'+
 '<div class="modal-foot"><button class="button primary" type="submit">Сохранить даты</button>'+
 '<button class="button" type="button" data-action="close-modal">Закрыть</button></div></form>';
}
if(m.type==='widgets'){
 const coreIds=['today','school','project'];
 const core=coreIds.map(id=>S.widgets.find(w=>w.id===id)||{id});
 inner=`<div class="modal-head"><h2>Главная и размеры блоков</h2><button class="button ghost" data-action="close-modal">Готово ✕</button></div><p class="hint">На главной оставлены задачи, школа и проекты. Сейчас доступен только размер 1×2.</p><div class="stack">${core.map(w=>`<div class="card widget-size-card"><strong>${esc(widgetInfo[w.id]?.name||w.id)}</strong><div class="widget-size-options"><button type="button" class="widget-size-option active" aria-pressed="true">1×2 <span>Активен</span></button><button type="button" class="widget-size-option" disabled aria-disabled="true">1×1</button><button type="button" class="widget-size-option" disabled aria-disabled="true">2×1</button><button type="button" class="widget-size-option" disabled aria-disabled="true">2×2</button></div>${w.id==='project'&&S.projects.length?`<div class="field" style="margin:10px 0 0"><label>Показывать проект</label><select data-widget-project="project"><option value="">Первый активный</option>${S.projects.map(p=>`<option value="${esc(p.id)}" ${w.projectId===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select></div>`:''}</div>`).join('')}</div><p class="hint widget-size-note">Остальные размеры пока недоступны.</p>`
}
root.innerHTML=`<div class="modal-cover" id="modal-cover"><div role="dialog" aria-modal="true" aria-label="Настройки или редактирование" class="modal">${inner}</div></div>`;if(m.type==='task')syncTaskFields()}
function stageOptions(pid,sid){const p=project(pid);return `<option value="">Без этапа</option>${(p?.stages||[]).map(s=>`<option value="${esc(s.id)}" ${sid===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}`}
function syncTaskFields(){
 const p=$('#task-project'),stageArea=$('#stage-area');
 if(!p||!stageArea)return;
 stageArea.style.display=p.value?'grid':'none';
}
function toast(t){$('#toast-root').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>{$('#toast-root').innerHTML=''},2600)}
function openModal(type,id='',extra={}){UI.modal={type,id,...extra};renderModal()}
function setTaskDone(t,day,mode){
 if(project(t.projectId)?.status==='completed'){toast('Сначала верните проект в активные');return}
 t.done=mode==='done';t.doneAt=t.done?new Date().toISOString():'';
 save();render();
}
function fullDeleteProject(id){const p=project(id);if(!p)return;const ts=projectTasks(p);const ok=confirm(`Удалить проект «${p.title}»? Его ${ts.length} задач останутся в общем списке без привязки к проекту.`);if(!ok)return;ts.forEach(t=>{t.projectId='';t.stageId=''});S.projects=S.projects.filter(x=>x.id!==id);UI.projectId='';UI.modal=null;save();render();toast('Проект удалён, задачи сохранены')}
function handleAction(button){const act=button.dataset.action,id=button.dataset.id;if(window.VectorSchool?.handleAction?.(button,{ui:UI,render}))return;switch(act){case 'nav':UI.tab=id;UI.projectId='';UI.subject='';render();return;case 'goto':UI.tab=id;UI.projectId='';UI.subject='';render();return;case 'tasks-filter':UI.filter=id;render();return;case 'project-filter':UI.projFilter=id;render();return;case 'new-task':if(project(button.dataset.project)?.status==='completed'){toast('Сначала верните проект в активные');return}if(project(button.dataset.project)&&!project(button.dataset.project).deadline){toast('Сначала укажи срок проекта');return}openModal('task','',{projectId:button.dataset.project||'',stageId:button.dataset.stage||''});return;case 'new-project':openModal('project');return;case 'edit-project':openModal('project',id);return;case 'open-task':openModal('task',id);return;case 'close-modal':UI.modal=null;renderModal();return;case 'toggle-task':{const t=task(id);if(!t)return;setTaskDone(t,button.dataset.date,t.done?'open':'done');return}case 'delete-task':{const t=task(id);if(t&&project(t.projectId)?.status==='completed'){toast('Сначала верните проект в активные');return}if(t&&confirm(`Удалить задачу «${t.title}»?`)){S.tasks=S.tasks.filter(x=>x.id!==id);UI.modal=null;save();render();toast('Задача удалена')}return}case 'open-project':UI.tab='projects';UI.projectId=id;UI.modal=null;render();return;case 'back-projects':UI.projectId='';render();return;case 'toggle-project-status':{let p=project(id),x=progress(p);if(p.status==='active'){if(!p.deadline){toast('Сначала укажите срок проекта');return}if(x.total===0||x.done!==x.total){toast('Сначала выполните все задачи проекта');return}p.status='completed'}else p.status='active';save();render();return}case 'new-stage':if(project(id)?.status==='completed'){toast('Сначала верните проект в активные');return}if(!project(id)?.deadline){toast('Сначала укажите срок проекта');return}openModal('stage',id);return;case 'rename-stage':{const p=project(button.dataset.project);if(p?.status==='completed'){toast('Сначала верните проект в активные');return}const g=p?.stages.find(s=>s.id===id);if(!g)return;const x=prompt('Новое название этапа',g.title);if(x&&x.trim()){g.title=x.trim().slice(0,80);save();render()}return}case 'delete-stage':{const p=project(button.dataset.project);if(p?.status==='completed'){toast('Сначала верните проект в активные');return}const g=p?.stages.find(s=>s.id===id);if(!g)return;if(!confirm(`Удалить этап «${g.title}»? Задачи останутся в проекте без этапа.`))return;p.stages=p.stages.filter(s=>s.id!==id);S.tasks.filter(t=>t.projectId===p.id&&t.stageId===id).forEach(t=>t.stageId='');save();render();return}case 'delete-project':fullDeleteProject(id);return;case 'back-school':UI.subject='';render();return;case 'school-period-settings':UI.schoolSettingsQuarter=['1','2','3','4'].includes(String(UI.quarter))?Number(UI.quarter):1;openModal('school-periods');return;case 'open-subject':{const fromFinals=UI.schoolScreen==='finals';UI.subject=id;UI.schoolScreen='overview';if(fromFinals)UI.quarter='year';render();return;}case 'configure':openModal('widgets');return;case 'settings':openModal('settings');return;case 'widget-up':case 'widget-down':{const i=Number(button.dataset.index),j=i+(act==='widget-up'?-1:1);if(j<0||j>=S.widgets.length)return;[S.widgets[i],S.widgets[j]]=[S.widgets[j],S.widgets[i]];save();render();return}case 'widget-remove':if(S.widgets.length<=3)return;S.widgets=S.widgets.filter(w=>w.id!==id);save();render();return;case 'widget-add':{if(S.widgets.length>=5)return;const x=$('#new-widget')?.value;if(!x||S.widgets.some(w=>w.id===x))return;S.widgets.push({id:x,size:'small'});save();render();return}case 'backup':{const blob=new Blob([JSON.stringify({...S,backupVersion:1,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vektor-tasks-projects-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Резервная копия подготовлена');return}case 'import-click':$('#import-file')?.click();return;case 'reset-empty':if(confirm('Очистить задачи и проекты? Школьные оценки останутся в Firebase.')){window.__vectorBadStore=false;S.tasks=[];S.projects=[];UI.modal=null;UI.projectId='';save();render()}return;}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){e.preventDefault();handleAction(b)}else if(e.target.id==='modal-cover'){UI.modal=null;renderModal()}});
document.addEventListener('change',e=>{if(e.target.id==='school-settings-quarter'){UI.schoolSettingsQuarter=Number(e.target.value);renderModal();return}if(e.target.id==='quarter-picker'){UI.quarter=e.target.value==='year'?'year':Number(e.target.value);UI.subject='';UI.editTerm=false;UI.schoolPeriodTouched=true;render()}if(e.target.id==='task-project'){const sel=$('#task-stage');if(sel)sel.innerHTML=stageOptions(e.target.value,'');syncTaskFields()}if(e.target.dataset.widgetProject){let w=S.widgets.find(w=>w.id==='project');if(w){w.projectId=e.target.value;save();render()}return}if(e.target.dataset.widgetSize){let w=S.widgets.find(w=>w.id===e.target.dataset.widgetSize);if(w){w.size=e.target.value;save();render()}}if(e.target.id==='import-file'){const f=e.target.files?.[0];if(!f)return;f.text().then(text=>{try{let o=JSON.parse(text);if(!validState(o))throw Error('Неверная структура или повреждённые связи в копии');if(!confirm('Заменить все задачи и проекты данными из резервной копии?'))return;S=normalizeState(o,false);window.__vectorBadStore=false;UI.modal=null;UI.projectId='';UI.subject='';save();render();toast('Копия восстановлена')}catch(ex){alert('Не удалось восстановить: '+ex.message)}})}});
document.addEventListener('submit',e=>{if(e.target.id==='school-term-form'){e.preventDefault();const f=new FormData(e.target),from=f.get('from'),to=f.get('to'),q=String(UI.schoolSettingsQuarter),bounds=schoolYearBounds(UI.year);if(!from||!to||from>to||from<bounds.from||to>bounds.to){alert('Укажите корректный период внутри учебного года');return}const other=Object.entries(S.schoolPeriods[UI.year]||{}).filter(([otherQ])=>otherQ!==q);if(other.some(([q,p])=>from<=p.to&&to>=p.from)){alert('Четверти не должны пересекаться');return}S.schoolPeriods[UI.year]||={};S.schoolPeriods[UI.year][q]={from,to};UI.modal=null;UI.schoolPeriodTouched=false;save();render();toast('Даты четверти сохранены');return}if(e.target.id==='task-form'){
 e.preventDefault();
 const f=new FormData(e.target),title=String(f.get('title')||'').trim(),day=String(f.get('date')||''),pid=String(f.get('projectId')||''),sid=String(f.get('stageId')||'');
 if(!title)return;
 const old=UI.modal.id?task(UI.modal.id):null;
 const sourceProject=old&&project(old.projectId),dest=pid?project(pid):null;
 if(sourceProject?.status==='completed'||dest?.status==='completed'){alert('Сначала верните завершённый проект в активные');return}
 if(pid&&!dest){alert('Выберите существующий проект');return}
 if(dest&&!dest.deadline){alert('Сначала укажите срок проекта');return}
 if(dest&&day&&day>dest.deadline){alert('Дата задачи не может быть позже срока проекта ('+niceDate(dest.deadline)+').');return}
 if(sid&&(!dest||!dest.stages.some(x=>x.id===sid))){alert('Выберите правильный этап проекта');return}
 const changes={title,date:day,projectId:pid,stageId:pid?sid:'',repeat:'none',days:[],repeatStart:'',repeatEnd:'',doneDates:{}};
 if(old)Object.assign(old,changes);
 else S.tasks.push({id:uid(),...changes,done:false,doneAt:''});
 UI.modal=null;save();render();toast(old?'Задача изменена':'Задача создана');return;
}
if(e.target.id==='project-form'){
 e.preventDefault();
 const f=new FormData(e.target),title=String(f.get('title')||'').trim(),deadline=String(f.get('deadline')||''),description=String(f.get('description')||'');
 if(!title)return;
 if(!deadline){alert('Укажите срок проекта');return}
 let p=UI.modal.id?project(UI.modal.id):null;
 if(p){
   const conflicts=projectTasks(p).filter(t=>t.date&&t.date>deadline);
   if(conflicts.length){alert('Нельзя установить срок раньше даты задач: '+conflicts.slice(0,4).map(t=>t.title).join(', ')+(conflicts.length>4?' и ещё '+(conflicts.length-4):''));return}
   p.title=title;p.description=description;p.deadline=deadline;
 }else{
   p={id:uid(),title,description,deadline,status:'active',stages:[]};S.projects.push(p)
 }
 UI.modal=null;UI.tab='projects';UI.projectId=p.id;save();render();toast('Проект сохранён');return;
}
if(e.target.id==='stage-form'){e.preventDefault();const title=(new FormData(e.target).get('title')||'').trim();const p=project(UI.modal.id);if(p&&title&&p.status==='active'&&p.deadline){p.stages.push({id:uid(),title});UI.modal=null;save();render()}return}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.modal){UI.modal=null;renderModal()}});
render();
</script><script src="./vector-school-ui.js?v=20261027-7"></script><script type="module" src="./school-cloud.js?v=20261026-mvp" data-school-cloud="vector"></script><script>window.addEventListener('schoolCloudUpdated',()=>{if(!UI.modal)render()})</script></body></html>
