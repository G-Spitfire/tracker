/* V0.6 — immersive header and consistently sized widgets */
:root{--widget-height:330px}
.workspace{position:relative}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch;grid-auto-flow:row}
.widget,.widget.wide{height:var(--widget-height);min-height:var(--widget-height);grid-column:auto;display:flex;flex-direction:column}
.widget-content{height:100%;min-height:0;width:100%;display:flex;flex-direction:column;overflow:hidden}
.widget-head{flex:none}
.widget-main{min-height:0;flex:1;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#3974ad6b transparent;padding:0 1px 2px}
.widget-main::-webkit-scrollbar{width:3px}.widget-main::-webkit-scrollbar-thumb{background:#3974ad9a;border-radius:9px}
.hero-mark{display:none!important}
.hero-title{text-shadow:0 4px 22px #04142b,0 1px 4px #000}
.hero-sub{text-shadow:0 3px 15px #03132a}
.hero:before{filter:saturate(1.28) contrast(1.06);}
.control-row{justify-content:flex-end;margin:0 0 11px}
.section-title{display:none}
.widget-link{font-size:12px}
/* The common width/height remains the same when changing each widget's layout */
@media(max-width:900px){
  .workspace{position:relative;padding-top:0}
  .topbar{position:absolute;top:0;left:0;right:0;z-index:22;height:calc(65px + env(safe-area-inset-top, 0px));padding:calc(12px + env(safe-area-inset-top, 0px)) 22px 0;justify-content:space-between;margin:0;background:transparent;border:0}
  .content{position:relative}
  .hero{height:430px;margin:0 0 -24px;border-radius:0;isolation:isolate}
  .hero:before{inset:0 -15px 0;border-radius:0 0 24px 24px;background-position:center 63%;box-shadow:none}
  .hero-border{inset:125px 7px 33px;border-radius:22px;border-color:#81a5f638}
  .hero-title{top:calc(122px + env(safe-area-inset-top, 0px));left:23px;font-size:36px}
  .hero-sub{top:calc(167px + env(safe-area-inset-top, 0px));left:24px;font-size:17px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .widget,.widget.wide{grid-column:auto}
  .topbar .mobile-brand{display:flex}
  .control-row{position:relative;margin-top:0;z-index:3}
  .settings-btn{background:#0a1c37b2;backdrop-filter:blur(8px)}
}
@media(max-width:700px){
  :root{--widget-height:316px}
  .workspace{padding:0 10px 100px}
  .topbar{padding:calc(11px + env(safe-area-inset-top, 0px)) 10px 0;height:calc(61px + env(safe-area-inset-top, 0px));margin-top:0}
  .hero{height:calc(360px + env(safe-area-inset-top, 0px));margin:0 0 -32px;border-radius:0}
  .hero:before{inset:0 -10px 0;border-radius:0 0 20px 20px;background-position:center 66%;background-size:cover}
  .hero-border{inset:105px 5px 27px}
  .hero-title{top:calc(107px + env(safe-area-inset-top,0px));left:20px;font-size:32px}
  .hero-sub{top:calc(149px + env(safe-area-inset-top,0px));left:21px;font-size:16px}
  .grid{grid-template-columns:1fr;gap:13px}
  .widget,.widget.wide{height:var(--widget-height);min-height:var(--widget-height)}
  .widget-content{padding:16px}
  .topbar .brand{font-size:19px;text-shadow:0 2px 14px #0009}
  .ring{max-width:155px}
  .day-focus{grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:7px}
  .bottom-nav{background:#061126ed}
  .control-row .action{font-size:12px;padding:9px 11px}
  .goal-image{height:147px}
}
@media(max-width:375px){
  :root{--widget-height:312px}
  .hero{height:calc(337px + env(safe-area-inset-top,0px))}
  .hero-title{top:calc(102px + env(safe-area-inset-top,0px));font-size:30px}
  .hero-sub{top:calc(141px + env(safe-area-inset-top,0px));font-size:15px}
  .widget-content{padding:13px}
  .ring{max-width:122px}
  .day-focus{grid-template-columns:minmax(0,36%) minmax(0,1fr)}
}

const layoutKey='vector2_widget_layout_v05',taskKey='vector2_design_v02';let layout=defaultsLayout.map(x=>({...x}));let tasks=defaultTasks.map(x=>({...x}));try{const v=JSON.parse(localStorage.getItem(layoutKey));if(Array.isArray(v)){const ids=new Set();const sanitized=v.filter(x=>x&&specs.some(s=>s.id===x.id)&&!ids.has(x.id)&&ids.add(x.id)).map(x=>({id:x.id,enabled:!!x.enabled,variant:Number.isInteger(x.variant)?Math.max(0,Math.min((specs.find(s=>s.id===x.id).variants.length-1),x.variant)):0,wide:!!x.wide}));layout=[...sanitized,...defaultsLayout.filter(x=>!ids.has(x.id)).map(x=>({...x}))]}}catch(e){}try{const v=JSON.parse(localStorage.getItem(taskKey));if(v&&Array.isArray(v.tasks)&&v.tasks.every(t=>t&&typeof t.title==='string'))tasks=v.tasks.map(t=>({id:String(t.id),title:t.title.slice(0,100),time:String(t.time||''),done:!!t.done,priority:['high','mid','low'].includes(t.priority)?t.priority:''}))}catch(e){}let tab='home',profilePage='home',timer;
function persistLayout(){try{localStorage.setItem(layoutKey,JSON.stringify(layout))}catch(e){notify('Не удалось сохранить настройки')}}function persistTasks(){try{localStorage.setItem(taskKey,JSON.stringify({tasks}))}catch(e){notify('Не удалось сохранить задачи')}}function notify(s){const x=document.getElementById('toast');x.textContent=s;x.classList.add('on');clearTimeout(timer);timer=setTimeout(()=>x.classList.remove('on'),2400)}const todayLabel=new Date().toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'});const grades=[4.8,4.5,4.2,4.7,4.6],gradeLabels=['Мат','Рус','Англ','Ист','Инф'];const gradeFull=['Математика','Русский язык','Английский','История','Информатика'];const demoGoalPct=50;
function ring(){const n=tasks.filter(x=>x.done).length,tot=tasks.length,p=tot?Math.round(n/tot*100):0,r=77,per=2*Math.PI*r;return `<div class="ring" aria-label="Выполнено ${n} из ${tot}"><svg viewBox="0 0 200 200"><defs><linearGradient id="neonring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0cecff"/><stop offset=".52" stop-color="#2197ff"/><stop offset="1" stop-color="#c54cf6"/></linearGradient></defs><circle cx="100" cy="100" r="77" stroke="#1b335c" stroke-width="20" fill="none"/><circle cx="100" cy="100" r="77" stroke="url(#neonring)" stroke-width="20" fill="none" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="${per.toFixed(2)}" stroke-dashoffset="${(per*(1-p/100)).toFixed(2)}" style="filter:drop-shadow(0 0 7px #32b5ff88)"/></svg><div class="ring-center"><span>♛</span><strong>${n}/${tot}</strong><small>задач<br/>сделано</small></div></div>`}
function tasksList(priority=false){return `<ul class="task-list">${tasks.slice(0,priority?6:5).map((t,i)=>`<li class="task-line"><button class="task-check ${t.done?'checked':''}" data-toggle="${esc(t.id)}" aria-label="${t.done?'Снять отметку':'Отметить выполнение'}: ${esc(t.title)}">${t.done?svg('check'):''}</button><span class="task-text ${t.done?'done':''}">${esc(t.title)}</span>${priority&&['high','mid','low'].includes(t.priority)?`<span class="priority ${t.priority}">${({high:'Важно',mid:'Обычно',low:'Позже'})[t.priority]}</span>`:''}<span class="task-time">${esc(t.time||'—')}</span></li>`).join('')}</ul>`}
function widgetShell(id,title,html,opts={}){return `<section class="widget" data-widget="${id}"><div class="widget-content">${!opts.noHead?`<div class="widget-head"><h2>${svg(specs.find(x=>x.id===id)?.icon||'goal')}${title}</h2><button class="widget-link" data-details="${id}">${opts.link||'Подробнее'} ${svg('chevron')}</button></div>`:''}<div class="widget-main">${html}</div></div></section>`}
function dayWidget(v){const n=tasks.filter(t=>t.done).length,tot=tasks.length,p=tot?Math.round(n/tot*100):0;let html='';if(v===0){html=`<div class="day-focus">${ring()}<div>${tasksList()}<button class="addbtn" data-add>${svg('plus')} Добавить задачу</button></div></div>`}if(v===1){html=`<div class="day-list"><div class="progress-top"><div class="gradient-track" style="flex:1"><div class="gradient-fill" style="width:${p}%"></div></div><b>${n}/${tot}</b></div>${tasksList(true)}<button class="addbtn" data-add>${svg('plus')} Добавить задачу</button></div>`}if(v===2){const pending=tasks.find(t=>!t.done);html=`<div class="day-compact"><div class="compact-summary"><div><strong>${n}/${tot}</strong><p class="school-label">задач сделано</p></div><div class="compact-bars">${tasks.slice(0,5).map((t,i)=>`<span style="--h:${[96,72,54,78,42][i]}%;--op:${t.done?1:.2}"></span>`).join('')}</div></div><div class="next-label">Следующая задача</div><div class="next-task">${svg('list')}<span>${pending?esc(pending.title):'На сегодня всё выполнено'}</span><span style="margin-left:auto;color:#a5cbed">${pending?esc(pending.time||'—'): '✓'}</span></div><button class="addbtn" data-add>${svg('plus')} Добавить задачу</button></div>`}return widgetShell('day','Мой день',html,{link:'Все задачи'})}
function gradeBars(){return `<div class="grades">${grades.map((g,i)=>`<div class="grade"><div class="grade-well"><div class="grade-bar" style="--h:${Math.round((g-3)/2*100)}%;--tone:${['#18edfb','#6198ff','#2bd8fe','#17ddf5','#e15ef8'][i]}"></div></div><strong>${g.toFixed(1)}</strong><small>${gradeLabels[i]}</small></div>`).join('')}</div>`}
function schoolWidget(v){let html='';if(v===0)html=`<p class="school-label">Средний балл за четверть</p><div class="school-header"><strong class="school-number">4.6</strong><span class="school-up">↗ +0.3</span></div>${gradeBars()}`;if(v===1)html=`<div class="subject-list">${grades.map((g,i)=>`<div class="subject-row"><span class="subject-ico">${['∑','Я','Aa','⌛','⌘'][i]}</span><div style="min-width:0;flex:1">${gradeFull[i]}<br/><small>Предмет</small></div><b>${g.toFixed(1)}</b></div>`).join('')}</div>`;if(v===2)html=`<p class="school-label">Динамика среднего балла</p><div class="school-header"><strong class="school-number">4.6</strong><span class="school-up">↗ +0.3</span></div><div class="spark-chart"><svg viewBox="0 0 350 145" preserveAspectRatio="none"><defs><linearGradient id="sparkStroke" x1="0" x2="1"><stop stop-color="#10d8f7"/><stop offset="1" stop-color="#de58fa"/></linearGradient><linearGradient id="sparkfill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#268bff" stop-opacity=".32"/><stop offset="1" stop-color="#268bff" stop-opacity="0"/></linearGradient></defs><path d="M7 120 L68 100 L134 88 L200 73 L270 49 L342 22 L342 145 L7 145Z" fill="url(#sparkfill)"/><path d="M7 120 L68 100 L134 88 L200 73 L270 49 L342 22" fill="none" stroke="url(#sparkStroke)" stroke-width="4" stroke-linecap="round"/>${[[7,120],[68,100],[134,88],[200,73],[270,49],[342,22]].map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="#51dcfe" stroke="#ffffff" stroke-width="1.3"/>`).join('')}</svg></div><div class="chart-legend"><span>Сентябрь</span><span>Октябрь</span><span>Ноябрь</span></div>`;return widgetShell('school','Школа',html,{link:'Все предметы'})}
function goalTrack(p){return `<div class="gradient-track" style="flex:1"><div class="gradient-fill" style="width:${p}%"></div></div>`}function goalWidget(v){let html='';if(v===0)html=`<div class="goal-image"><h3 class="overlay-title">Поступить в IT-вуз</h3></div><div class="goal-progress">${goalTrack(demoGoalPct)}<b>${demoGoalPct}%</b></div><div class="milestones">${['Определить направление','Подготовить базу','Поступить','Развиваться'].map((s,i)=>`<div class="milestone ${i<2?'done':''}"><div class="bullet">${i<2?'✓':i+1}</div>${s}</div>`).join('')}</div>`;if(v===1)html=`<div class="school-header" style="justify-content:space-between"><div><div class="goal-title">Поступить в IT-вуз</div><p class="microcaption">Этап 2 из 4</p></div>${ringMini(demoGoalPct)}</div>${['Выбрать направление','Подготовить базу','Сдать экзамены','Поступить'].map((s,i)=>`<div class="goal-step-row"><span class="step-bubble ${i===1?'active':''}">${i<2?'✓':i+1}</span><div class="label">${s}<p class="small">${i<2?'Завершено':'Впереди'}</p></div>${i===1?'→':''}</div>`).join('')}`;if(v===2)html=`${[['Поступить в IT-вуз',50],['Английский до B2',70],['Спорт и форма',60]].map(([n,p])=>`<div class="goal-multi-row"><div class="line"><span>${n}</span><small>${p}%</small></div>${goalTrack(p)}</div>`).join('')}`;return widgetShell('goals',v===2?'Мои цели':'Моя цель',html,{link:'Все цели'})}function ringMini(p){return `<div style="height:69px;width:69px;flex:none;display:grid;place-items:center;border-radius:50%;background:radial-gradient(closest-side,#0d1e3d 71%,transparent 74%),conic-gradient(#18e6fa ${p/2}%,#bb50f2 ${p}%,#1a335d ${p}%);box-shadow:0 0 15px #0b94ff47;font-size:19px;font-weight:800">${p}%</div>`}
function extraWidget(id){if(id==='deadlines')return widgetShell(id,'Дедлайны',`<div class="extra-list">${[['Математика','Контрольная работа','29 окт'],['Русский язык','Сочинение','30 окт'],['История','Доклад','2 ноя']].map(([a,b,c])=>`<div class="extra-row">${svg('clock')}<div><b>${a}</b><br/><small>${b}</small></div><span class="right">${c}</span></div>`).join('')}</div>`,{link:'Все'});if(id==='habits')return widgetShell(id,'Привычки',`<div class="extra-list">${[['Чтение',5],['Английский',6],['Спорт',3]].map(([a,n])=>`<div class="extra-row">${svg('flame')}<div style="flex:1"><b>${a}</b><div class="habit-dots">${Array.from({length:7},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div></div><span class="right">${n}/7</span></div>`).join('')}</div>`,{link:'Все'});if(id==='week')return widgetShell(id,'План недели',`<div class="extra-list">${[['Пн','Математика · Английский'],['Вт','Тренировка · Чтение'],['Ср','Подготовка к контрольной']].map(([d,t])=>`<div class="extra-row"><b style="color:#59dfff">${d}</b><span>${t}</span></div>`).join('')}</div>`,{link:'Неделя'});return widgetShell(id,'Мой прогресс',`<div class="stats-row"><div class="stat-mini"><strong>${tasks.filter(t=>t.done).length}/${tasks.length}</strong><small>Задачи</small></div><div class="stat-mini"><strong>4.6</strong><small>Учёба</small></div><div class="stat-mini"><strong>50%</strong><small>Цель</small></div></div><p class="microcaption">В дальнейшем — сравнение недель и личные результаты</p>`,{link:'Подробнее'})}
function hero(){return `<section class="hero" aria-label="Ночной Петербург"><div class="hero-border" aria-hidden="true"></div><h1 class="hero-title">Матвей</h1><div class="hero-sub hero-shine">Твой вектор роста</div></section>`}
function mainPage(){const active=layout.filter(x=>x.enabled);return `${hero()}<div class="grid" id="widgetGrid">${active.length?active.map(w=>w.id==='day'?dayWidget(w.variant):w.id==='school'?schoolWidget(w.variant):w.id==='goals'?goalWidget(w.variant):extraWidget(w.id)).join(''):`<div class="empty">Пока нет блоков. Открой «Профиль → Настройки → Главная», чтобы выбрать карточки.</div>`}</div><div class="footer-notice">Вектор 2.0 · Демонстрационные оценки и цели · Настройки блоков сохраняются на этом устройстве</div>`}
function renderNav(){const links=[['home','Главная','home'],['plan','План','plan'],['study','Учёба','study'],['goals','Цели','goal'],['profile','Профиль','person']];const html=(type)=>links.map(([id,label,ic])=>`<button class="${type==='side'?'navbtn':'navitem'} ${tab===id?'selected active':''}" data-tab="${id}" ${tab===id?'aria-current="page"':''}>${svg(ic)}<span>${label}</span></button>`).join('');document.getElementById('sidenav').innerHTML=html('side');document.getElementById('bottomnav').innerHTML=html('bottom')}
function secondaryPage(){if(tab==='profile')return profilePage==='settings'?`<section class="profile-page"><button class="profile-back" data-profilepage="home">← Профиль</button><h1>Настройки</h1><p class="muted">Персонализация приложения</p><div class="profile-card"><h2>Главная</h2><p class="muted">Какие блоки показывать, их порядок и оформление</p><button class="profile-settings-action" data-edit>${svg('plan')} Настроить главную ${svg('chevron')}</button></div></section>`:`<section class="profile-page"><h1>Матвей</h1><p class="muted">Твой вектор роста</p><div class="profile-card"><h2>Настройки</h2><p class="muted">Внешний вид и персонализация</p><button class="profile-settings-action" data-profilepage="settings">${svg('person')} Настройки ${svg('chevron')}</button></div></section>`;const map={plan:['План','Здесь будет полноценное расписание и планирование недели. Сейчас можно добавлять задачи и отмечать их.'],study:['Учёба','В этом разделе появятся реальные оценки и школьная статистика из действующего «Вектора».'],goals:['Цели','Здесь будут настраиваемые стратегические цели, этапы и конкретные действия.'],profile:['Профиль','Здесь будет личный прогресс, достижения и настройки приложения.']};const [title,description]=map[tab]||map.plan;return `${hero()}<section class="placeholder"><h1>${title}</h1><p>${description}</p>${tab==='plan'?`<div class="preview-card">${tasksList(true)}<button class="addbtn" data-add>${svg('plus')} Добавить задачу</button></div>`:''}<div style="margin-top:15px"><button class="pill is-accent" data-tab="home">Вернуться на главную</button></div></section>`}
function render(){renderNav();document.getElementById('page').innerHTML=tab==='home'?mainPage():secondaryPage();}
function editorHTML(){return `<p class="drawer-note">Все блоки одного размера. Выбирай нужные, меняй порядок и оформление — настройки сохраняются автоматически.</p>${layout.map((x,i)=>{const spec=specs.find(s=>s.id===x.id);return `<div class="editor-item"><div class="editor-top"><button class="smallbtn" data-move="${x.id}" data-dir="-1" ${i===0?'disabled':''} aria-label="Выше">${svg('up')}</button><button class="smallbtn" data-move="${x.id}" data-dir="1" ${i===layout.length-1?'disabled':''} aria-label="Ниже">${svg('down')}</button><span class="editor-label">${spec.name}</span><button class="toggle ${x.enabled?'on':''}" data-switch="${x.id}" role="switch" aria-label="Показать ${spec.name}" aria-checked="${x.enabled}"></button></div>${x.enabled?`<div class="editor-options"><div class="option-title">Вариант блока</div><div class="variant-row">${spec.variants.map((v,j)=>`<button class="variant-button ${x.variant===j?'selected':''}" data-variant="${x.id}" data-value="${j}" aria-pressed="${x.variant===j}">${v}</button>`).join('')}</div></div>`:''}</div>`}).join('')}`}
function openEditor(){document.getElementById('editorBody').innerHTML=editorHTML();const el=document.getElementById('editor');el.classList.add('open');el.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}function updateEditor(){const body=document.getElementById('editorBody'),y=body.scrollTop;body.innerHTML=editorHTML();body.scrollTop=y;render()}function closeEditor(){const el=document.getElementById('editor');el.classList.remove('open');el.setAttribute('aria-hidden','true');document.body.style.overflow='';render()}function openTask(){const el=document.getElementById('taskmodal');el.classList.add('open');el.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';setTimeout(()=>document.getElementById('taskInput').focus(),50)}function closeTask(){const el=document.getElementById('taskmodal');el.classList.remove('open');el.setAttribute('aria-hidden','true');document.body.style.overflow='';document.getElementById('taskForm').reset()}
document.addEventListener('click',e=>{let el=e.target.closest('[data-tab]');if(el){tab=el.dataset.tab;if(tab==='profile')profilePage='home';render();scrollTo({top:0,behavior:'smooth'});return}el=e.target.closest('[data-profilepage]');if(el){profilePage=el.dataset.profilepage;render();scrollTo({top:0,behavior:'smooth'});return}if(e.target.closest('[data-edit]')){openEditor();return}if(e.target.closest('[data-close-editor],[data-done]')){closeEditor();return}if(e.target.closest('[data-close-task]')){closeTask();return}if(e.target.closest('[data-add]')){openTask();return}el=e.target.closest('[data-toggle]');if(el){const t=tasks.find(x=>x.id===el.dataset.toggle);if(t){t.done=!t.done;persistTasks();render()}return}el=e.target.closest('[data-switch]');if(el){const x=layout.find(w=>w.id===el.dataset.switch);if(x){x.enabled=!x.enabled;persistLayout();updateEditor()}return}el=e.target.closest('[data-variant]');if(el){const x=layout.find(w=>w.id===el.dataset.variant);if(x){x.variant=Number(el.dataset.value);persistLayout();updateEditor()}return}el=e.target.closest('[data-move]');if(el){const i=layout.findIndex(w=>w.id===el.dataset.move),d=Number(el.dataset.dir),j=i+d;if(i>=0&&j>=0&&j<layout.length){[layout[i],layout[j]]=[layout[j],layout[i]];persistLayout();updateEditor()}return}if(e.target.closest('[data-reset]')){layout=defaultsLayout.map(x=>({...x}));persistLayout();updateEditor();notify('Настройки восстановлены');return}el=e.target.closest('[data-details]');if(el){const s=specs.find(x=>x.id===el.dataset.details);if(['day','school','goals'].includes(el.dataset.details)){tab={day:'plan',school:'study',goals:'goals'}[el.dataset.details];render();window.scrollTo(0,0)}else notify(`${s?.name||'Раздел'} — пример блока`);return}});
document.getElementById('taskForm').addEventListener('submit',e=>{e.preventDefault();const title=document.getElementById('taskInput').value.trim(),time=document.getElementById('taskTime').value,priority=document.getElementById('taskPriority').value;if(!title)return;tasks.push({id:`task${Date.now()}${Math.random().toString(36).slice(2,5)}`,title:title.slice(0,100),time,done:false,priority});persistTasks();closeTask();render();notify('Задача добавлена')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('editor').classList.contains('open'))closeEditor();if(document.getElementById('taskmodal').classList.contains('open'))closeTask()}});document.getElementById('editor').addEventListener('click',e=>{if(e.target.id==='editor')closeEditor()});document.getElementById('taskmodal').addEventListener('click',e=>{if(e.target.id==='taskmodal')closeTask()});render();
</script></body></html>
