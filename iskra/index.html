<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="apple-touch-icon" sizes="180x180" href="./assets/touch-icon.png"><link rel="icon" type="image/png" href="./assets/touch-icon.png"><title>Искра</title>
<style>
:root{--bg:#f6efff;--tx:#33284a;--mu:#6f6489;--co:#ff8a65;--pu:#a56bff;--ln:#ece4f7;--card:#fff;--sh:0 8px 24px rgba(110,80,160,.12);--ac:#9454e8;--ok:#208568;--bad:#c53d64;--warn:#956000}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg);-webkit-text-size-adjust:100%}
button,input,textarea{font-family:inherit;touch-action:manipulation}
body{margin:0;min-height:100vh;color:var(--tx);font:18px/1.35 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;background:linear-gradient(180deg,#fff1e8 0,var(--bg) 360px,var(--bg) 100%);padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}

main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:28px;font-weight:800;margin:0;letter-spacing:-.01em}h2{font-size:21px;font-weight:800;margin:22px 0 8px}
.mu{color:var(--mu)}.sm{font-size:15px}.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 16px}.av{width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:32px;box-shadow:var(--sh);border:0;padding:0}
.card{background:var(--card);border-radius:28px;padding:16px 18px;margin:14px 0;box-shadow:var(--sh)}
.note{background:#ece4ff;border-radius:20px;padding:12px 16px;font-weight:700;margin:12px 0}

.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#ff9a76,#b57bff);color:#fff;border-radius:32px;padding:18px;box-shadow:0 12px 28px rgba(165,107,255,.35)}
.hero .ph{font-size:21px;font-weight:800;line-height:1.2;margin-bottom:4px}
.task{display:flex;align-items:center;gap:14px;width:100%;min-height:80px;background:var(--card);border:0;border-radius:26px;padding:12px 16px 12px 12px;margin:10px 0;text-align:left;color:var(--tx);font-size:18px;box-shadow:var(--sh);cursor:pointer}
.task:active{transform:scale(.98)}.task .ic{width:56px;height:56px;flex:none;border-radius:18px;background:var(--b);display:grid;place-items:center;font-size:30px}
.task .nm{flex:1;font-weight:800;min-width:0}.task small{display:block;font-weight:500;color:var(--mu);font-size:14px;line-height:1.25}
.ck{width:38px;height:38px;flex:none;border-radius:50%;border:3px solid var(--ln);display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff}
.task.on{background:var(--b);color:#33284a}.task.on small{color:#625477}.task.on .ic{background:var(--card)}.task.on .ck{background:var(--c);border-color:var(--c)}
.task .ed{width:38px;height:38px;flex:none;border-radius:50%;border:0;background:var(--ln);font-size:18px;display:grid;place-items:center;cursor:pointer;color:var(--tx)}
.days{display:flex;gap:6px}.dy{flex:1;text-align:center}.dy .c{height:44px;display:grid;place-items:center;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-weight:800;margin-bottom:4px;border:0;width:100%;cursor:pointer;color:var(--tx)}.dy.td .c{outline:3px solid var(--co)}.dy.fu{opacity:.45}
.gift{background:linear-gradient(135deg,#ffd76a,#ff9a76);border-radius:28px;padding:18px;margin:14px 0;box-shadow:0 12px 28px rgba(255,154,118,.35);color:#33284a}
.pb{height:16px;border-radius:8px;background:#ffffff80;overflow:hidden;margin:10px 0}.pb i{display:block;height:100%;border-radius:8px;background:#fff;transition:width .3s}
.btn{background:linear-gradient(135deg,#ff9a76,#ff6f91);color:#fff;border:0;border-radius:22px;font-weight:800;font-size:18px;padding:14px 22px;min-height:54px;box-shadow:0 8px 18px rgba(255,111,145,.35);cursor:pointer}.btn.g{background:var(--ln);color:var(--tx);box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{min-height:46px;border-radius:23px;border:0;background:var(--ln);color:var(--tx);font-weight:700;font-size:16px;padding:0 16px;cursor:pointer}.chip.on{background:var(--pu);color:#fff}
.eg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.eg button{height:56px;border:3px solid transparent;border-radius:18px;background:var(--ln);font-size:30px;padding:0;cursor:pointer}.eg button.on{border-color:var(--pu);background:var(--card)}
.cl{display:flex;gap:10px;margin-top:14px;justify-content:center}.cl button{width:44px;height:44px;border-radius:50%;border:4px solid var(--card);padding:0;box-shadow:0 0 0 1px var(--ln);cursor:pointer}.cl button.on{box-shadow:0 0 0 3px var(--pu)}
input,textarea{width:100%;font-size:18px;padding:13px 16px;border-radius:18px;border:2px solid var(--ln);background:var(--card);color:var(--tx);margin-top:12px}
textarea{height:80px}
.bar{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:452px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:30px;padding:6px;box-shadow:0 10px 30px rgba(110,80,160,.22);z-index:8}

.bar button{flex:1;background:none;border:0;border-radius:24px;color:var(--mu);font-weight:800;font-size:13px;padding:6px 0;line-height:1.2;cursor:pointer}.bar button span{display:block;font-size:24px}.bar .on{background:#fff0e8;color:var(--co)}

#tt{width:max-content;max-width:90%;position:fixed;left:50%;top:12px;transform:translate(-50%,-200px);background:var(--card);color:var(--tx);font-weight:800;padding:12px 20px;border-radius:22px;box-shadow:var(--sh);z-index:20;text-align:center;transition:transform .25s;pointer-events:none;display:flex;align-items:center;gap:12px}
#tt.on{transform:translate(-50%,0);pointer-events:auto}
#tt button{background:var(--ln);border:0;border-radius:14px;padding:8px 14px;font-weight:800;color:var(--tx);cursor:pointer;font-size:15px}
@media(prefers-reduced-motion:reduce){#tt,.pb i,.sh{transition:none}.task:active{transform:none}}
/* ===== SCHOOL MODULE (изолированный слой) ===== */
.school-summary{display:flex;align-items:center;gap:18px}.school-score{font-size:52px;font-weight:800;color:var(--pu);line-height:1.1}
.school-sub{border-left:4px solid var(--pu)}.school-sub .row{align-items:center}.school-sub b{overflow-wrap:anywhere}
.school-final{font-size:32px;font-weight:800;text-align:center;flex:none}.school-final small{display:block;font-size:12px;color:var(--mu)}
.school-sub .chip{min-width:44px;padding:0 12px}.c2{color:var(--bad);background:#ffe6ed}.c3{color:var(--warn);background:#fff0ce}.c4{color:var(--ok);background:#e0f5eb}.c5{color:#8243cf;background:#eee2ff}

.sc{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin-top:8px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.donut-wrap{display:flex;align-items:center;gap:20px;margin:16px 0}.donut{width:140px;height:140px;flex:none}.donut-legend{flex:1}.donut-item{display:flex;align-items:center;gap:8px;margin:8px 0}.donut-item b{margin-left:auto}.donut-dot{width:10px;height:10px;border-radius:50%}
.school-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.school-actions .btn{font-size:16px;padding:12px 16px}
.school-info{font-size:14px;line-height:1.5}.school-empty{padding:12px 0}.school-sub .chips{gap:6px}
details.school-how{margin-top:8px}details.school-how summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--mu);padding:6px 0}
/* ===== HISTORY ===== */
.months{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.months button{background:var(--ln);border:0;border-radius:16px;padding:10px 16px;font-weight:800;color:var(--tx);cursor:pointer;font-size:18px}
.months b{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.cal .wd{text-align:center;font-size:12px;color:var(--mu);font-weight:700;padding:4px 0}
.cal button{aspect-ratio:1;border:0;border-radius:12px;background:var(--ln);color:var(--tx);font-weight:700;font-size:15px;cursor:pointer;position:relative;padding:0}
.cal button.empty{background:transparent;cursor:default}
.cal button.has{background:#ffd9c9;color:#33284a}
.cal button.today{outline:3px solid var(--co)}
.cal button.future{opacity:.35}
.cal button .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--co)}
.cal button .dot.g{background:var(--pu);left:calc(50% + 5px)}
.cal button .dot.h{left:calc(50% - 5px)}
.hist-day .row{align-items:flex-start}.hist-day .tag{display:inline-block;border-radius:10px;padding:2px 8px;font-size:13px;font-weight:800;margin-left:6px}
.hist-grade{background:#eee2ff;color:#8243cf}

@media(max-width:355px){.donut{width:115px;height:115px}.donut-wrap{gap:12px}.school-score{font-size:44px}}
/* Устойчивая панель: заголовок и действия вне прокрутки. */
body.sheet-open{position:fixed;left:0;right:0;top:var(--sheet-scroll-top,0px);width:100%;overflow:hidden}
body.sheet-open #sc{overflow:hidden}
.ov{position:fixed;left:0;right:0;top:var(--sheet-top,0px);height:var(--sheet-vh,100dvh);background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:10;overscroll-behavior:none}
.sh{display:flex;flex-direction:column;width:100%;max-width:560px;height:min(720px,calc(var(--sheet-vh,100dvh) * .86));max-height:calc(var(--sheet-vh,100dvh) - env(safe-area-inset-top,0px) - 8px);margin:0;overflow:hidden;background:var(--card);border:1px solid var(--ln);border-bottom:0;border-radius:24px 24px 0 0;padding:0;box-shadow:0 -12px 48px #0003;transform:none}
.sh .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;padding:16px 20px;border-bottom:1px solid var(--ln)}
.sh .sheet-head h2{margin:0!important;font-size:20px;line-height:1.25;overflow-wrap:anywhere}
.sheet-close{flex:none;width:44px;height:44px;border:1px solid var(--ln);border-radius:14px;background:var(--bg);color:var(--tx);font-family:inherit;font-size:24px;line-height:1;cursor:pointer}
.sh .sheet-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable;padding:20px;scroll-padding:16px}
.sh .sheet-body>:first-child{margin-top:0!important}
.sh .sheet-body>:last-child{margin-bottom:0!important}
.sh .sheet-footer{flex:none;display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);background:var(--card)}
.sh .sheet-footer .btn{flex:1 1 140px;width:auto!important;min-height:48px;font-size:16px;padding:12px 16px;margin:0!important}
.sh .sheet-field{display:flex;flex-direction:column;align-items:stretch;gap:8px;font-size:14px;color:var(--mu);margin:0}
.sh input:not([type="checkbox"]):not([type="file"]),.sh select,.sh textarea{display:block;width:100%;min-width:0;max-width:100%;min-height:48px;box-sizing:border-box;margin:8px 0 0;padding:12px 14px;border:1px solid var(--ln);border-radius:14px;font-family:inherit;font-size:16px;line-height:1.35;background:var(--bg);color:var(--tx)}
.sh .sheet-field input{margin-top:0!important}
.sh input[type="date"]{appearance:none;-webkit-appearance:none;min-height:48px}
.sh .sheet-section{margin:0 0 24px;padding:0 0 24px;border-bottom:1px solid var(--ln)}
.sh .sheet-section:last-child{margin-bottom:0;padding-bottom:0;border-bottom:0}
.sh .sheet-section h3{margin:0 0 12px;font-size:16px;line-height:1.3}
.sh .sheet-section>.btn{width:100%;margin-top:12px;min-height:48px;font-size:15px}
.sh .sheet-inline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:stretch}
.sh .sheet-inline input{margin:0!important}
.sh .sheet-inline .btn{min-height:48px;font-size:15px;margin:0;padding:10px 14px;box-shadow:none}
.sh .subject-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 0;border-bottom:1px solid var(--ln)}
.sh .subject-row:last-child{border-bottom:0}
.sh .subject-row span{min-width:0;overflow-wrap:anywhere;font-size:16px}
.sh .subject-row small{display:block;font-size:12px;color:var(--mu);margin-top:3px}
.sh .subject-row button{flex:none;min-height:44px;padding:8px 12px;font-family:inherit;font-size:14px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);cursor:pointer}
.sh details.sheet-section summary{font-size:16px;font-weight:700;cursor:pointer;padding:4px 0 12px}
.sh .sheet-period{font-size:14px;color:var(--mu);margin:0 0 20px}
@media(min-width:700px){.ov{align-items:center;padding:16px}.sh{border-bottom:1px solid var(--ln);border-radius:24px}}
@media(max-width:355px){.sh .sheet-head,.sh .sheet-body,.sh .sheet-footer{padding-left:16px;padding-right:16px}.sh .sheet-inline{grid-template-columns:minmax(0,1fr)}.sh .sheet-inline .btn{width:100%}}
</style><link rel="stylesheet" href="./iskra-ui.css?v=20261029-2"><link rel="stylesheet" href="./iskra-joy.css?v=20261029-1"></head><body><main id="m"></main>
<nav class="bar"><button data-t="t"><span>☀️</span>Сегодня</button><button data-t="g"><span>📚</span>Оценки</button><button data-t="r"><span>⭐</span>Звёзды</button><button data-t="y"><span>😊</span>Профиль</button></nav>
<div id="tt"></div><div id="s"></div>
<script>
/* ===== CONFIG ===== */
const CONFIG={
  subjects:['Математика','Русский','Чтение','Окружающий мир','Английский','ОРКСЭ'],
  chores:['Убрала в комнате','Помыла посуду','Накрыла на стол','Помогала готовить','Вынесла мусор','Полила цветы','Пол или пылесос'],
  emojis:['🦊','🐱','🐶','🐼','🦄','🐰','🐻','🐯','🐸','🐨','🦉','🐬','🦋','🐙','🐧','🦁','🌸','🚀','🎨','⭐'],
  colors:['#ffd9c9','#ffe9a8','#d3f2e4','#d6ecff','#e6dcff','#ffd6ea'],
  levels:[[0,'Звёздочка'],[40,'Умница'],[120,'Мастер дня'],[250,'Чемпион'],[400,'Исследователь'],[600,'Смельчак'],[850,'Хранитель искр'],[1150,'Звёздный капитан'],[1500,'Создатель чудес'],[1900,'Повелитель созвездий'],[2350,'Легенда Искры'],[2850,'Хранитель галактики'],[3400,'Звёздная легенда']],
};
const KEY='kid1',BAK=KEY+'_bak',DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const SCHEMA=4;


/* Ручные оценки сохранены только как резервный архив данных. */
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const store=(()=>{
  let recoveredFromBackup=false;
  function defaults(){return{
    d:{},name:'',asked:0,goal:25,reward:'Семейная награда',x:{},starBonusHistory:{},starBonusTargets:{},
    av:{e:'🦊',c:'#ffd9c9'},schema:SCHEMA,
  }}
  function validateAll(s){
    if(!s||typeof s!=='object'||typeof s.d!=='object'||Array.isArray(s.d))throw Error('bad root');
    if(!s.x||typeof s.x!=='object')s.x={};
    if(!s.av||typeof s.av!=='object')s.av={e:'🦊',c:'#ffd9c9'};
    if(!CONFIG.emojis.includes(s.av.e))s.av.e='🦊';
    if(!CONFIG.colors.includes(s.av.c))s.av.c='#ffd9c9';
    if(!Array.isArray(s.customTasks))s.customTasks=[];
    s.customTasks=s.customTasks.filter(t=>t&&typeof t==='object'&&
      typeof t.i==='string'&&/^[a-zA-Z0-9_-]{1,70}$/.test(t.i)&&
      typeof t.t==='string'&&t.t.trim().length>0&&t.t.length<=60&&
      typeof t.e==='string'&&t.e.length<=8);
    if(s.customTasks.length>30)s.customTasks=s.customTasks.slice(0,30);
    if(!s.ex)s.ex=iso(new Date());
    if(!s.planHistory||typeof s.planHistory!=='object'||Array.isArray(s.planHistory))s.planHistory={};
    if(!s.taskDays||typeof s.taskDays!=='object'||Array.isArray(s.taskDays))s.taskDays={};
    if(!s.habitScheduleHistory||typeof s.habitScheduleHistory!=='object'||Array.isArray(s.habitScheduleHistory))s.habitScheduleHistory={};
    for(const [id,events] of Object.entries(s.habitScheduleHistory)){
      if(!/^[a-zA-Z0-9_-]{1,70}$/.test(id)||!Array.isArray(events)){delete s.habitScheduleHistory[id];continue}
      s.habitScheduleHistory[id]=events.filter(e=>e&&/^\d{4}-\d{2}-\d{2}$/.test(e.from)&&Array.isArray(e.days)&&e.days.every(d=>Number.isInteger(d)&&d>=0&&d<=6))
        .map(e=>({from:e.from,days:[...new Set(e.days)]})).sort((a,b)=>a.from.localeCompare(b.from));
    }
    if(!Array.isArray(s.hiddenTasks))s.hiddenTasks=[];
    if(!Array.isArray(s.customTasks))s.customTasks=[];
    if(!s.rewardHistory||typeof s.rewardHistory!=='object'||Array.isArray(s.rewardHistory))s.rewardHistory={};
    if(!s.starBonusHistory||typeof s.starBonusHistory!=='object'||Array.isArray(s.starBonusHistory))s.starBonusHistory={};
    for(const [date,bonus] of Object.entries(s.starBonusHistory))
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||bonus!==true)delete s.starBonusHistory[date];
    if(!s.starBonusTargets||typeof s.starBonusTargets!=='object'||Array.isArray(s.starBonusTargets))s.starBonusTargets={};
    for(const [date,target] of Object.entries(s.starBonusTargets))
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isInteger(target)||target<0||target>100)delete s.starBonusTargets[date];
    if(!s.weekPlans||typeof s.weekPlans!=='object'||Array.isArray(s.weekPlans))s.weekPlans={};
    if(!s.taskCategories||typeof s.taskCategories!=='object'||Array.isArray(s.taskCategories))s.taskCategories={};
    if(!['all','30','7'].includes(s.profileStatsWindow))s.profileStatsWindow='all';
    if(!s.earnedAchievements||typeof s.earnedAchievements!=='object')s.earnedAchievements={};
    if(!s.times||typeof s.times!=='object')s.times={};
    if(typeof s.interests!=='string')s.interests='';
    if(!s.joyChoices||typeof s.joyChoices!=='object'||Array.isArray(s.joyChoices))s.joyChoices={};
    if(!s.joyDone||typeof s.joyDone!=='object'||Array.isArray(s.joyDone))s.joyDone={};
    if(!s.joyWeekNotes||typeof s.joyWeekNotes!=='object'||Array.isArray(s.joyWeekNotes))s.joyWeekNotes={};
    if(!s.habitRecall||typeof s.habitRecall!=='object'||Array.isArray(s.habitRecall))s.habitRecall={};
    for(const [week,value] of Object.entries(s.habitRecall))if(!/^\d{4}-\d{2}-\d{2}$/.test(week)||!['easy','sometimes','hard'].includes(value))delete s.habitRecall[week];
    if(!s.skipped||typeof s.skipped!=='object'||Array.isArray(s.skipped))s.skipped={};
    for(const [date,ids] of Object.entries(s.skipped)){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Array.isArray(ids)){delete s.skipped[date];continue}
      s.skipped[date]=[...new Set(ids.filter(id=>typeof id==='string'&&/^[a-zA-Z0-9_-]{1,70}$/.test(id)))];
    }
    if(typeof s.joyIntroSeen!=='boolean')s.joyIntroSeen=false;
    if(!Array.isArray(s.rewardChoices))s.rewardChoices=[];
    s.rewardChoices=s.rewardChoices.filter(x=>typeof x==='string'&&x.trim()&&x.length<=50).slice(0,3);
    if(!['pink','lavender','mint'].includes(s.joyTheme))s.joyTheme='pink';
    return s;
  }
  function migrate(s){
    let v=s.schema||1;
    if(v<2){s.ex=s.ex||iso(new Date());v=2}
    if(v<3){s.schema=3;v=3}
    return s;
  }
  function load(){
    let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
    if(raw){
      try{const s=validateAll(Object.assign(migrate(JSON.parse(raw)),{schema:SCHEMA}));return s}
      catch(e){window.__iskraBadStore=true}
    }
    // A truncated primary record must not hide a valid last-known-good copy.
    try{
      const backup=localStorage.getItem(BAK);
      if(backup){
        const restored=validateAll(Object.assign(migrate(JSON.parse(backup)),{schema:SCHEMA}));
        recoveredFromBackup=true;
        window.__iskraBadStore=false;
        try{localStorage.setItem(KEY,JSON.stringify(restored))}catch(_){}
        return restored;
      }
    }catch(_){}
    return defaults();
  }
  let warned=false;
  function save(s){
    if(window.__iskraBadStore){toast('Сохранение приостановлено. Восстанови данные из файла.');return}
    const json=JSON.stringify(s);
    try{const old=localStorage.getItem(KEY);if(old)localStorage.setItem(BAK,old)}catch(e){}

const schoolStore=(()=>{
  const SUBJ=CONFIG.subjects;
  function defaults(){return{
    g:Object.fromEntries(SUBJ.map(k=>[k,[]])),hl:[],n:0,end:'',archived:[],
  }}
  function validate(q){
    if(!q||typeof q!=='object')throw Error('school bad');
    if(!q.g||typeof q.g!=='object'||Array.isArray(q.g))q.g={};
    for(const k of Object.keys(q.g))if(!Array.isArray(q.g[k]))q.g[k]=[];
    for(const k of SUBJ)if(!q.g[k])q.g[k]=[];
    for(const k of Object.keys(q.g)){

    if(!Array.isArray(q.hl))q.hl=[];
    if(!Array.isArray(q.archived))q.archived=[];
    q.n=Math.max(q.n||0,...Object.values(q.g).flat().map(x=>x.i||0));
    return q;
  }
  function migrate(q){
    // схема 3 -> 4: у оценок появляется дата d

  }
  function load(){
    const raw=S._schoolRaw;
    if(!raw)return validate(defaults());
    try{return validate(migrate(raw))}catch(e){return validate(defaults())}
  }
  return {defaults,validate,migrate,load,SUBJ};
})();

function openDay(d){
  const done=dn(d),L=tasks(d),now=iso(new Date()),y=new Date();
  y.setDate(y.getDate()-1);
  const canEdit=d===iso(y);
  const items=L.map(t=>{const ok=done.includes(t.i),isSkipped=skipped(d).includes(t.i),x=(S.x[d]||{})[t.i];const sub=ok&&x?esc([].concat(x.s||[],x.n?[x.n]:[]).join(', ')):'';return`<div class="row"><span>${t.e} ${esc(t.t)}${isSkipped?'<div class="mu sm">Пропущено</div>':''}${sub?`<div class="mu sm">${sub}</div>`:''}</span>${canEdit?`<button type="button" class="ik-btn-small" data-action="historyToggle" data-id="${esc(d)}" data-arg="${esc(t.i)}" aria-label="${ok?'Снять':'Отметить'} выполнение">${ok?'✓ Готово':'Отметить'}</button>`:`<span>${ok?'⭐':isSkipped?'–':''}</span>`}</div>`}).join('');
  sheet(`<div class="hist-day"><h2 style="margin-top:0">${d.split('-').reverse().join('.')}</h2><div class="mu sm" style="margin-bottom:10px">⭐ ${st(d)} звёзд</div>${items||'<div class="mu sm">Дел нет</div>'}${canEdit?'<p class="mu sm">Вчерашние отметки можно исправить после подтверждения взрослого.</p>':''}<p data-sheet-footer style="margin:18px 0 0"><button class="btn g" data-action="closeSheet">Закрыть</button></p></div>`);
}

/* ===== HISTORY CALENDAR ===== */
function monthKey(y,m){return y+'-'+String(m+1).padStart(2,'0')}
function openHistory(){
  const now=new Date();
  if(!calMonth)calMonth={y:now.getFullYear(),m:now.getMonth()};
  renderHistory();
}
function renderHistory(){
  const {y,m}=calMonth;
  const first=new Date(y,m,1),startWd=(first.getDay()+6)%7,daysIn=new Date(y,m+1,0).getDate();
  const td=iso(new Date());
  const cells=[];
  for(let i=0;i<startWd;i++)cells.push('<button class="empty" disabled></button>');
  for(let d=1;d<=daysIn;d++){
    const ds=iso(new Date(y,m,d));
    const hasHab=dn(ds).length>0;
    const fut=ds>td;
    const dots=hasHab?'<span class="dot h"></span>':'';
    cells.push(`<button class="${hasHab?'has':''} ${ds===td?'today':''} ${fut?'future':''}" ${fut?'disabled aria-disabled="true"':''} data-action="histDay" data-id="${ds}">${d}${dots}</button>`);
  }
  const monthName=first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  sheet(`<h2 style="margin-top:0">История привычек</h2>
    <div class="months"><button data-action="histPrev" aria-label="Предыдущий месяц">‹</button><b>${monthName}</b><button data-action="histNext" aria-label="Следующий месяц">›</button></div>
    <div class="cal">${DN.map(d=>`<div class="wd">${d}</div>`).join('')}${cells.join('')}</div>
    <div class="sm mu">Кружок — сегодня. Оранжевая точка — выполненные привычки.</div>
    <p data-sheet-footer style="margin:18px 0 0"><button class="btn g" data-action="closeSheet">Закрыть</button></p>`);
}
function histPrev(){calMonth.m--;if(calMonth.m<0){calMonth.m=11;calMonth.y--}renderHistory()}
function histNext(){calMonth.m++;if(calMonth.m>11){calMonth.m=0;calMonth.y++}renderHistory()}

function openParents(){
  sheet(`<h2>Для родителей</h2><p class="mu sm">Звёзды теперь помогают открывать уровни и достижения, а не покупать награды. Дела и звёзды хранятся на этом устройстве — сохраните копию для переноса.</p><h2>Копия данных</h2><div class="chips"><button class="btn g" data-action="exportFile">Сохранить копию файлом</button><button class="btn g" data-action="pickBackupFile">Восстановить из файла</button><input type="file" id="backupFileInput" accept=".json,application/json" data-action="importFile" hidden><div id="backupStatus" class="mu sm" role="status" aria-live="polite"></div><details><summary class="mu sm" style="padding:16px 0">Восстановить старую текстовую копию</summary><textarea id="bk" aria-label="Текст старой копии"></textarea><button class="btn g" data-action="importText">Восстановить из текста</button></details></div><button data-sheet-footer class="btn g" data-action="closeSheet">Закрыть</button>`);

function validateBackupPayload(source){
  const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
  const problem=()=>{throw Error('invalid-backup-structure')};
  let scanned=0;
  const scan=(v,depth=0)=>{
    if(++scanned>90000||depth>15)problem();
    if(v===null||typeof v!=='object')return;
    if(Array.isArray(v)){if(v.length>10000)problem();v.forEach(x=>scan(x,depth+1));return}
    for(const [k,value] of Object.entries(v)){
      if(k==='__proto__'||k==='prototype'||k==='constructor'||k.length>120)problem();
      scan(value,depth+1);
    }
  };
  scan(source);
  if(!isObj(source)||!isObj(source.d))problem();
  const idOk=s=>typeof s==='string'&&/^[a-zA-Z0-9_-]{1,70}$/.test(s);
  const dateOk=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
  if(Object.keys(source.d).length>10000)problem();
  for(const [date,entries] of Object.entries(source.d)){
    if(!dateOk(date)||!Array.isArray(entries)||entries.length>60||entries.some(v=>!idOk(v)))problem();
  }
  if(source.skipped!==undefined){
    if(!isObj(source.skipped))problem();
    for(const [date,ids] of Object.entries(source.skipped))
      if(!dateOk(date)||!Array.isArray(ids)||ids.length>60||ids.some(id=>!idOk(id)))problem();
  }
  if(source.x!==undefined){
    if(!isObj(source.x))problem();
    for(const [date,entries] of Object.entries(source.x)){
      if(!dateOk(date)||!isObj(entries))problem();
      for(const [id,detail] of Object.entries(entries)){
        if(!idOk(id)||!isObj(detail)||(!Array.isArray(detail.s)&&detail.s!==undefined)||
          (detail.s||[]).some(x=>typeof x!=='string'||x.length>100)||
          (detail.n!==undefined&&(typeof detail.n!=='string'||detail.n.length>150)))problem();
      }
    }
  }
  if(source.av!==undefined){
    if(!isObj(source.av)||!CONFIG.emojis.includes(source.av.e)||!CONFIG.colors.includes(source.av.c))problem();
  }
  if(source.name!==undefined&&(typeof source.name!=='string'||source.name.length>80))problem();
  if(source.goal!==undefined&&(!Number.isInteger(source.goal)||source.goal<1||source.goal>1000))problem();
  if(source.reward!==undefined&&(typeof source.reward!=='string'||source.reward.length>100))problem();
  if(source.interests!==undefined&&(typeof source.interests!=='string'||source.interests.length>300))problem();
  if(source.profileStatsWindow!==undefined&&!['all','30','7'].includes(source.profileStatsWindow))problem();
  const validateTask=t=>isObj(t)&&idOk(t.i)&&typeof t.t==='string'&&t.t.length>0&&t.t.length<=70&&
    typeof t.e==='string'&&t.e.length<=8&&
    (t.category===undefined||['school','personal'].includes(t.category))&&
    (t.s===undefined||(typeof t.s==='string'&&t.s.length<=150));
  if(source.customTasks!==undefined&&(!Array.isArray(source.customTasks)||source.customTasks.length>30||
    source.customTasks.some(t=>!validateTask(t))))problem();
  if(source.planHistory!==undefined){
    if(!isObj(source.planHistory))problem();
    for(const [date,entries] of Object.entries(source.planHistory))
      if(!dateOk(date)||!Array.isArray(entries)||entries.length>60||entries.some(t=>!validateTask(t)))problem();
  }
  if(source.hiddenTasks!==undefined&&(!Array.isArray(source.hiddenTasks)||source.hiddenTasks.some(v=>!idOk(v))))problem();
  if(source.taskDays!==undefined){
    if(!isObj(source.taskDays))problem();
    for(const [id,days] of Object.entries(source.taskDays))
      if(!idOk(id)||!Array.isArray(days)||days.some(v=>!Number.isInteger(v)||v<0||v>6))problem();
  }
  if(source.habitScheduleHistory!==undefined){
    if(!isObj(source.habitScheduleHistory))problem();
    for(const [id,events] of Object.entries(source.habitScheduleHistory))
      if(!idOk(id)||!Array.isArray(events)||events.length>500||events.some(e=>!isObj(e)||!dateOk(e.from)||!Array.isArray(e.days)||e.days.length>7||e.days.some(d=>!Number.isInteger(d)||d<0||d>6)))problem();
  }
  if(source.taskCategories!==undefined){
    if(!isObj(source.taskCategories))problem();
    for(const [id,cat] of Object.entries(source.taskCategories))
      if(!idOk(id)||!['school','personal'].includes(cat))problem();
  }
  if(source.starBonusHistory!==undefined){
    if(!isObj(source.starBonusHistory))problem();
    for(const [date,bonus] of Object.entries(source.starBonusHistory))
      if(!dateOk(date)||bonus!==true)problem();
  }
  if(source.starBonusTargets!==undefined){
    if(!isObj(source.starBonusTargets))problem();
    for(const [date,target] of Object.entries(source.starBonusTargets))
      if(!dateOk(date)||!Number.isInteger(target)||target<0||target>100)problem();
  }
  if(source.times!==undefined){
    if(!isObj(source.times))problem();
    for(const [id,time] of Object.entries(source.times))
      if(!idOk(id)||typeof time!=='string'||(time!==''&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)))problem();
  }
  if(source.weekPlans!==undefined){
    if(!isObj(source.weekPlans))problem();
    for(const [date,p] of Object.entries(source.weekPlans))
      if(!dateOk(date)||!isObj(p)||typeof p.name!=='string'||p.name.length>100||
        !Number.isInteger(p.goal)||p.goal<1||p.goal>1000)problem();
  }
  if(source.rewardHistory!==undefined){
    if(!isObj(source.rewardHistory))problem();
    for(const [date,p] of Object.entries(source.rewardHistory))
      if(!dateOk(date)||!isObj(p)||typeof p.name!=='string'||p.name.length>100||
        !Number.isInteger(p.goal)||p.goal<1||p.goal>1000||
        !['earned','received'].includes(p.status))problem();
  }
  if(source.joyTheme!==undefined&&!['pink','lavender','mint'].includes(source.joyTheme))problem();
  if(source.rewardChoices!==undefined&&(!Array.isArray(source.rewardChoices)||source.rewardChoices.length>3||
    source.rewardChoices.some(v=>typeof v!=='string'||!v.trim()||v.length>50)))problem();
  if(source.joyChoices!==undefined){
    if(!isObj(source.joyChoices))problem();
    for(const [date,choice] of Object.entries(source.joyChoices))
      if(!dateOk(date)||!['draw','walk','story'].includes(choice))problem();
  }
  if(source.joyDone!==undefined){
    if(!isObj(source.joyDone))problem();
    for(const [date,done] of Object.entries(source.joyDone))
      if(!dateOk(date)||typeof done!=='boolean')problem();
  }
  if(source.joyIntroSeen!==undefined&&typeof source.joyIntroSeen!=='boolean')problem();
  if(source.joyWeekNotes!==undefined){
    if(!isObj(source.joyWeekNotes))problem();
    for(const [date,note] of Object.entries(source.joyWeekNotes))
      if(!dateOk(date)||!['Я горжусь собой','Было непросто','Хочу попробовать ещё'].includes(note))problem();
  }
  if(source.habitRecall!==undefined){
    if(!isObj(source.habitRecall))problem();
    for(const [week,value] of Object.entries(source.habitRecall))if(!dateOk(week)||!['easy','sometimes','hard'].includes(value))problem();
  }
  if(source.earnedAchievements!==undefined){
    if(!isObj(source.earnedAchievements))problem();
    for(const [name,date] of Object.entries(source.earnedAchievements))
      if(name.length>100||typeof date!=='string'||date.length>40)problem();
  }
}
function installBackup(o){
  const source=o&&o.habit?o.habit:o;
  if(!source||typeof source!=='object'||!source.d||Array.isArray(source.d)||typeof source.d!=='object'||!Object.values(source.d).every(a=>Array.isArray(a)))throw Error('bad habits');
  validateBackupPayload(source);
  const candidate=store.validateAll(Object.assign(store.defaults(),JSON.parse(JSON.stringify(source))));
  const schoolRaw=o.school||source.school;
  if(schoolRaw&&(!schoolRaw.g||typeof schoolRaw.g!=='object'||Array.isArray(schoolRaw.g)||!Object.values(schoolRaw.g).every(a=>Array.isArray(a)&&a.every(x=>x&&[2,3,4,5].includes(x.v)))))throw Error('bad grades');
  candidate.school=schoolRaw?schoolStore.validate(schoolStore.migrate(JSON.parse(JSON.stringify(schoolRaw)))):JSON.parse(JSON.stringify(S.school));
  for(const date of Object.keys(candidate.d))if(!Array.isArray(candidate.planHistory[date]))
    candidate.planHistory[date]=legacyTasks(date,candidate).map(t=>({...t}));
  if(!confirm('Заменить данные копией? Текущее состояние будет сохранено на этом устройстве.'))return;
  const before=JSON.stringify(S),oldSchool=localStorage.getItem(KEY+'_school');
  localStorage.setItem(KEY+'_before_restore',before);
  try{localStorage.setItem(KEY+'_school',JSON.stringify(candidate.school));localStorage.setItem(KEY,JSON.stringify(candidate))}
  catch(err){if(oldSchool===null)localStorage.removeItem(KEY+'_school');else localStorage.setItem(KEY+'_school',oldSchool);throw err}
  window.__iskraBadStore=false;S=candidate;render();backupStatus('Данные восстановлены. Предыдущая версия сохранена на устройстве.');
}

function backupStatus(message){const e=document.getElementById('backupStatus');if(e)e.textContent=message;else toast(message)}
async function exportBackupFile(){
  try{
    const file=new File([JSON.stringify({habit:(({school,...r})=>r)(S),school:S.school})],'iskra-backup-'+iso(new Date())+'.json',{type:'application/json'});
    if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'Копия данных'}); backupStatus('В меню «Поделиться» выбери «Сохранить в Файлы».');return}
      catch(err){if(err.name==='AbortError')return}
    }
    const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
     backupStatus('Файл подготовлен. Проверь «Загрузки» или «Файлы».');
  }catch(err){backupStatus('Не удалось создать копию. Попробуй открыть приложение в Safari.')}
}
async function importBackupFile(input){
  const file=input.files&&input.files[0];if(!file)return;
  try{if(file.size>10*1024*1024)throw Error('size');installBackup(JSON.parse(await file.text()))}
  catch(err){backupStatus('Файл не подходит или не удалось сохранить данные. Текущие записи не заменены.')}
  finally{input.value=''}
}
function importBackupText(){
  try{const input=document.getElementById('bk').value;if(input.length>10*1024*1024)throw Error('size');installBackup(JSON.parse(input))}
  catch(err){backupStatus('Текст копии не подходит или не удалось сохранить данные. Текущие записи не заменены.')}
}

/* ===== ACTIONS ===== */
const ACTIONS={
  profile:()=>openProfile(),
  closeProfile:()=>{cs();render()},
  pickEmoji:(e)=>{S.av.e=e;save();openProfile()},
  pickColor:(c)=>{S.av.c=c;save();openProfile()},
  toggle:(i)=>toggleTask(i),
  details:(i)=>openDetails(i),
  detailChip:(j)=>{cur.n=document.getElementById('dn').value;const list=cur.i==='hw'?(window.schoolCloud?.subjects?.()||[]):CONFIG.chores;const k=list[+j];if(!k)return;const x=cur.s.indexOf(k);x<0?cur.s.push(k):cur.s.splice(x,1);renderDetails()},
  saveDetails:()=>saveDetails(),
  removeDetails:()=>removeDetails(),
  closeSheet:()=>{if(window.ikHabitCanCloseSheet&&!window.ikHabitCanCloseSheet())return;cs();render()},
  parents:()=>openParents(),
  exportFile:()=>exportBackupFile(),
  pickBackupFile:()=>document.getElementById('backupFileInput').click(),
  importText:()=>importBackupText(),
  dayHistory:(d)=>openDay(d),
  history:()=>openHistory(),
  histPrev:()=>histPrev(),
  histNext:()=>histNext(),
  histDay:(d)=>openDay(d),
  historyToggle:(d,i)=>{
    const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
    if(d!==iso(yesterday)||!tasks(d).some(t=>t.i===i))return;
    if(!confirm('Взрослый подтверждает исправление вчерашней отметки?'))return;
    setDone(i,!(S.d[d]||[]).includes(i),true,d);
    openDay(d);
  },
};
function toggleTask(i){
  const d=iso(new Date()),done=(S.d[d]||[]).includes(i);
  setDone(i,!done);
}

/* ===== DELEGATION ===== */
document.addEventListener('click',e=>{
  const closeEl=e.target.closest('[data-close]');
  if(closeEl&&e.target===closeEl){if(window.ikHabitCanCloseSheet&&!window.ikHabitCanCloseSheet()){e.preventDefault();e.stopImmediatePropagation();return}cs();return}
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const {action,id,arg,arg2}=el.dataset;
  const fn=ACTIONS[action];
  if(fn)fn(id,arg,el,arg2);
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  if(el.dataset.action==='nameInput'){S.name=el.value.trim();save()}
});

document.addEventListener('change',e=>{
  if(e.target.dataset.action==='importFile')importBackupFile(e.target)
});
