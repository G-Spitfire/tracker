<style>

.donut-wrap{display:flex;align-items:center;gap:20px;margin:16px 0}.donut{width:140px;height:140px;flex:none}.donut-legend{flex:1}.donut-item{display:flex;align-items:center;gap:8px;margin:8px 0}.donut-item b{margin-left:auto}.donut-dot{width:10px;height:10px;border-radius:50%}
.school-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.school-actions .btn{font-size:16px;padding:12px 16px}
.school-info{font-size:14px;line-height:1.5}.school-empty{padding:12px 0}.school-sub .chips{gap:6px}
details.school-how{margin-top:8px}details.school-how summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--mu);padding:6px 0}
/* ===== HISTORY ===== */
.months{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.months button{background:var(--ln);border:0;border-radius:16px;padding:10px 16px;font-weight:800;color:var(--tx);cursor:pointer;font-size:18px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.cal .wd{text-align:center;font-size:12px;color:var(--mu);font-weight:700;padding:4px 0}
.cal button{aspect-ratio:1;border:0;border-radius:12px;background:var(--ln);color:var(--tx);font-weight:700;font-size:15px;cursor:pointer;position:relative;padding:0}
.cal button.empty{background:transparent;cursor:default}
.cal button.has{background:#ffd9c9;color:#33284a}

.cal button .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--co)}
.cal button .dot.g{background:var(--pu);left:calc(50% + 5px)}
.cal button .dot.h{left:calc(50% - 5px)}
.hist-day .row{align-items:flex-start}.hist-day .tag{display:inline-block;border-radius:10px;padding:2px 8px;font-size:13px;font-weight:800;margin-left:6px}
.hist-grade{background:#eee2ff;color:#8243cf}

@media(max-width:355px){.donut{width:115px;height:115px}.donut-wrap{gap:12px}.school-score{font-size:44px}}

<script>
/* ===== CONFIG ===== */
const CONFIG={
  subjects:['Математика','Русский','Чтение','Окружающий мир','Английский','ОРКСЭ'],
  chores:['Убрала в комнате','Помыла посуду','Накрыла на стол','Помогала готовить','Вынесла мусор','Полила цветы','Пол или пылесос'],
  emojis:['🦊','🐱','🐶','🐼','🦄','🐰','🐻','🐯','🐸','🐨','🦉','🐬','🦋','🐙','🐧','🦁','🌸','🚀','🎨','⭐'],
  colors:['#ffd9c9','#ffe9a8','#d3f2e4','#d6ecff','#e6dcff','#ffd6ea'],
  levels:[[0,'Звёздочка'],[40,'Умница'],[120,'Мастер дня'],[250,'Чемпион']],
  gradeThresholds:[2.6,3.6,4.6],
  gradeGoal:4+1/3,
  maxPlan:9999,
};
const KEY='qa20261020_kid1',BAK=KEY+'_bak',DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],GD=[1,2,3,4,5,6,0];
const SCHEMA=4;

/* ===== STORE (привычки) ===== */
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const store=(()=>{
  function defaults(){return{
    d:{},name:'',asked:0,goal:25,reward:'Семейная награда',dance:[],x:{},
    av:{e:'🦊',c:'#ffd9c9'},schema:SCHEMA,
  }}
  function validateAll(s){
    if(!s||typeof s!=='object'||typeof s.d!=='object'||Array.isArray(s.d))throw Error('bad root');
    if(!s.x||typeof s.x!=='object')s.x={};
    if(!s.av||typeof s.av!=='object')s.av={e:'🦊',c:'#ffd9c9'};
    if(!Array.isArray(s.dance))s.dance=[];
    return s;
  }
  function migrate(s){
    let v=s.schema||1;
    if(v<2){s.ex=s.ex||iso(new Date());s.dance=s.dance||[];v=2}
    if(v<3){s.schema=3;v=3}
    return s;
  }
  function load(){
    let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
    if(!raw)return defaults();
    let s;try{s=JSON.parse(raw)}catch(e){return defaults()}
    try{s=migrate(s);s.schema=SCHEMA;return validateAll(s)}
    catch(e){try{const b=localStorage.getItem(BAK);if(b)return validateAll(JSON.parse(b))}catch(_){}return defaults()}
  }
  let warned=false;
  function save(s){
    const json=JSON.stringify(s);
    try{const old=localStorage.getItem(KEY);if(old)localStorage.setItem(BAK,old)}catch(e){}
    try{localStorage.setItem(KEY,json)}
    catch(e){if(!warned){warned=true;toast('Данные не сохраняются — приватный режим?')}}
  }
  function restoreBackup(){try{const b=localStorage.getItem(BAK);if(!b)return null;return validateAll(JSON.parse(b))}catch(e){return null}}
  return {load,save,restoreBackup,defaults,validateAll};
})();

/* ===== SCHOOL STORE (изолированный слой) ===== */
const schoolStore=(()=>{
  const SUBJ=CONFIG.subjects;
  function defaults(){return{
    g:Object.fromEntries(SUBJ.map(k=>[k,[]])),hl:[],n:0,end:'',archived:[],
  }}
  function validate(q){
    if(!q||typeof q!=='object')throw Error('school bad');
    if(!q.g||typeof q.g!=='object'||Array.isArray(q.g))q.g={};
    for(const k of Object.keys(q.g))if(!Array.isArray(q.g[k]))q.g[k]=[];
    for(const k of SUBJ)if(!q.g[k])q.g[k]=[];
    for(const k of Object.keys(q.g)){
      q.g[k]=q.g[k].filter(x=>x&&Number.isInteger(x.i)&&[2,3,4,5].includes(x.v))
        .map(x=>({i:x.i,v:x.v,d:x.d||null}));
    }
    if(!Array.isArray(q.hl))q.hl=[];
    if(!Array.isArray(q.archived))q.archived=[];
    q.n=Math.max(q.n||0,...Object.values(q.g).flat().map(x=>x.i||0));
    return q;
  }
  function migrate(q){
    // схема 3 -> 4: у оценок появляется дата d
    for(const k of Object.keys(q.g||{})){
      q.g[k]=(q.g[k]||[]).map(x=>({i:x.i,v:x.v,d:x.d||null}));
    }
    return q;
  }
  function load(){
    const raw=S._schoolRaw;
    if(!raw)return defaults();
    try{return validate(migrate(raw))}catch(e){return defaults()}
  }
  return {defaults,validate,migrate,load,SUBJ};
})();

let S=store.load();
// старые данные школы могли лежать в корне S.school — переносим в отдельный ключ
(function(){
  let legacy=null;
  try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);legacy=o.school||null}}catch(e){}
  let schoolRaw=null;
  try{schoolRaw=JSON.parse(localStorage.getItem(KEY+'_school')||'null')}catch(e){}
  if(!schoolRaw&&legacy)schoolRaw=legacy;
  S._schoolRaw=schoolRaw;
  S.school=schoolStore.load();
  try{localStorage.setItem(KEY+'_school',JSON.stringify(S.school))}catch(e){}
})();
delete S._schoolRaw;

let tab='t',cur={i:'',s:[],n:''},calMonth=null;

const save=()=>{store.save(S);try{localStorage.setItem(KEY+'_school',JSON.stringify(S.school))}catch(e){}};
const sum=a=>a.reduce((x,y)=>x+y,0),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const wk=()=>{const d=new Date(),k=(d.getDay()+6)%7;return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()-k+i);return iso(x)})};
const EX={i:'ex',e:'🤸',t:'Зарядка',s:'5–10 минут',b:'#ffe9d2',c:'#ff9a3c'};
const T=[{i:'bg',e:'🎒',t:'Собрать портфель',b:'#ffe3d6',c:'#ff8a65'},{i:'cl',e:'👕',t:'Приготовить вещи на завтра',b:'#dff1ff',c:'#4fb3ff'},{i:'hw',e:'✏️',t:'Сделать уроки',s:'нажми ✎, чтобы выбрать предметы',b:'#fff0c2',c:'#f2b300'},{i:'en',e:'🇬🇧',t:'Английский',s:'10–15 минут',b:'#e6defc',c:'#8e6cf0'},{i:'ho',e:'🧹',t:'Помочь по дому',s:'нажми ✎, чтобы рассказать',b:'#d9f6e8',c:'#2fbf8f'}];
const RD={i:'rd',e:'📖',t:'Почитать',s:'на выходных',b:'#ffdcec',c:'#ff6fa5'};
const tasks=d=>{const w=new Date(d+'T00:00:00').getDay(),b=d>=S.ex?[EX].concat(T):T;return w==0||w==6?b.concat([RD]):b};
const dn=d=>(S.d[d]||[]).filter(i=>tasks(d).some(t=>t.i==i));
const st=d=>{const n=dn(d).length;return n+(n&&n==tasks(d).length?2:0)};
const ring=(n,m)=>{const C=2*Math.PI*40;return`<svg width="96" height="96" viewBox="0 0 96 96" style="flex:none"><circle cx="48" cy="48" r="40" fill="none" stroke="#ffffff55" stroke-width="10"/><circle cx="48" cy="48" r="40" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-n/m)}" transform="rotate(-90 48 48)"/><text x="48" y="56" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">${n}/${m}</text></svg>`};
const avb=()=>`<button class="av" data-action="profile" style="background:${S.av.c}" aria-label="Мой герой">${S.av.e}</button>`;

/* ===== VIEWS ===== */

  const d=iso(new Date()),L=tasks(d),done=dn(d),n=done.length,all=n==L.length,X=S.x[d]||{};
  const ph=all?'Ура! Ты справилась!':!n?'Привет! С чего начнём?':n*2>=L.length?'Уже почти всё!':'Отлично, продолжаем!';

  <div class="hero">${ring(n,L.length)}<div><div class="ph">${ph}</div><div class="sm">⭐ сегодня: ${st(d)}</div></div></div>
  ${L.map(t=>{
    const x=X[t.i],ok=done.includes(t.i);
    const sub=ok&&x&&((x.s&&x.s.length)||x.n)?esc([].concat(x.s||[],x.n?[x.n]:[]).join(', ')):(t.s||'');
    const editable=(t.i=='hw'||t.i=='ho');
    return`<div class="task ${ok?'on':''}" style="--b:${t.b};--c:${t.c}">

      <button class="nm" data-action="toggle" data-id="${t.i}" style="background:none;border:0;text-align:left;color:inherit;font:inherit;padding:0;cursor:pointer">${t.t}${sub?`<small>${sub}</small>`:''}</button>

      <button class="ck" data-action="toggle" data-id="${t.i}" aria-label="Отметить">${ok?'✓':''}</button>
    </div>`}).join('')}`;
}

}
function stats(id){
  const all={},w={},W=wk();
  Object.keys(S.x).forEach(d=>{const e=S.x[d][id];if(!e)return;(e.s||[]).concat(e.n?[e.n.toLowerCase()]:[]).forEach(k=>{all[k]=(all[k]||0)+1;if(W.includes(d))w[k]=(w[k]||0)+1})});

/* ===== SHEET ===== */
function sheet(h){
  const s=document.getElementById('s');
  if(!h){const ov=s.querySelector('.ov');if(ov){ov.classList.add('closing');setTimeout(()=>s.innerHTML='',250)}return}
  s.innerHTML=`<div class="ov" data-close="1"><div class="sh">${h}</div></div>`;
  const ov=s.querySelector('.ov'),sh=s.querySelector('.sh');
  let sy=0,dy=0,dragging=false;
  sh.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;dragging=true},{passive:true});
  sh.addEventListener('touchmove',e=>{if(!dragging)return;dy=e.touches[0].clientY-sy;if(dy>0){sh.style.transform=`translateY(${dy}px)`}},{passive:true});
  sh.addEventListener('touchend',()=>{dragging=false;if(dy>80){cs()}else{sh.style.transform='';dy=0}},{passive:true});
}
function cs(){sheet('')}
function toast(m,opt){
  const e=document.getElementById('tt');
  e.innerHTML=`<span>${esc(m)}</span>`;
  e.className='on';
  clearTimeout(toast.t);
  if(opt&&opt.action){
    const b=document.createElement('button');b.textContent=opt.action;
    b.onclick=()=>{opt.onAction&&opt.onAction();e.className='';clearTimeout(toast.t)};
    e.appendChild(b);
    toast.t=setTimeout(()=>e.className='',opt.ms||5000);
  }else{
    toast.t=setTimeout(()=>e.className='',2800);
  }
}

/* ===== LOGIC ===== */
function setDone(i,on,silent){
  const d=iso(new Date()),a=S.d[d]||(S.d[d]=[]),L=tasks(d),wasAll=dn(d).length==L.length,x=a.indexOf(i);
  if(on&&x<0)a.push(i);
  if(!on&&x>=0){a.splice(x,1);if(S.x[d])delete S.x[d][i]}
  const all=dn(d).length==L.length;
  save();render();
  if(silent)return;
  if(on&&x<0)toast(all&&!wasAll?'🎉 Все дела готовы! +2 бонусные звезды':'⭐ +1 звезда');
  else if(!on&&x>=0)toast('Отметка снята',{action:'Вернуть',onAction:()=>setDone(i,true,true)});
}
function openDetails(i){
  const d=iso(new Date()),e=(S.x[d]||{})[i]||{s:[],n:''};
  cur={i,s:(e.s||[]).slice(),n:e.n||''};
  renderDetails();
}
function renderDetails(){
  const hw=cur.i=='hw',L=hw?CONFIG.subjects:CONFIG.chores,ok=(S.d[iso(new Date())]||[]).includes(cur.i);
  sheet(`<h2 style="margin-top:0">${hw?'Какие уроки делала?':'Что помогла сделать?'}</h2><div class="chips" style="margin-top:0">${L.map((k,j)=>`<button class="chip ${cur.s.includes(k)?'on':''}" data-action="detailChip" data-id="${j}">${esc(k)}</button>`).join('')}</div><input id="dn" maxlength="60" placeholder="Что-то ещё? Напиши" value="${esc(cur.n)}"><div class="chips"><button class="btn" data-action="saveDetails">Готово</button>${ok?'<button class="btn g" data-action="removeDetails">Убрать отметку</button>':''}</div>`);
}
function saveDetails(){
  const d=iso(new Date());cur.n=document.getElementById('dn').value.trim().slice(0,60);
  (S.x[d]||(S.x[d]={}))[cur.i]={s:cur.s,n:cur.n};

}

/* ===== DAY HISTORY ===== */
function dayGrades(d){
  const out=[];
  for(const k of Object.keys(S.school.g)){
    if(S.school.archived.includes(k))continue;
    for(const x of S.school.g[k])if(x.d===d)out.push({k,v:x.v,i:x.i});
  }
  return out;
}
function openDay(d){
  const done=dn(d),L=tasks(d),grades=dayGrades(d);
  const items=L.map(t=>{const ok=done.includes(t.i),x=(S.x[d]||{})[t.i];const sub=ok&&x?esc([].concat(x.s||[],x.n?[x.n]:[]).join(', ')):'';return`<div class="row"><span>${t.e} ${esc(t.t)}${sub?`<div class="mu sm">${sub}</div>`:''}</span><span>${ok?'⭐':''}</span></div>`}).join('');
  const ghtml=grades.length?`<h2>Оценки</h2>${grades.map(g=>`<div class="row"><span>${esc(g.k)}</span><span class="tag hist-grade">${g.v}</span></div>`).join('')}`:'';
  sheet(`<div class="hist-day"><h2 style="margin-top:0">${d.split('-').reverse().join('.')}</h2><div class="mu sm" style="margin-bottom:10px">⭐ ${st(d)} звёзд</div>${items||'<div class="mu sm">Привычек нет</div>'}${ghtml}<p style="margin:18px 0 0"><button class="btn g" data-action="closeSheet">Закрыть</button></p></div>`);
}

/* ===== HISTORY CALENDAR ===== */
function monthKey(y,m){return y+'-'+String(m+1).padStart(2,'0')}
function openHistory(){
  const now=new Date();
  if(!calMonth)calMonth={y:now.getFullYear(),m:now.getMonth()};
  renderHistory();
}
function renderHistory(){
  const {y,m}=calMonth;
  const first=new Date(y,m,1),startWd=(first.getDay()+6)%7,daysIn=new Date(y,m+1,0).getDate();
  const td=iso(new Date());
  const cells=[];
  for(let i=0;i<startWd;i++)cells.push('<button class="empty" disabled></button>');
  for(let d=1;d<=daysIn;d++){
    const ds=iso(new Date(y,m,d));
    const hasHab=(S.d[ds]||[]).length>0||Object.keys(S.x[ds]||{}).length>0;
    const hasGrade=dayGrades(ds).length>0;
    const fut=ds>td;
    const dots=(hasHab?'<span class="dot h"></span>':'')+(hasGrade?'<span class="dot g"></span>':'');
    cells.push(`<button class="${hasHab||hasGrade?'has':''} ${ds===td?'today':''} ${fut?'future':''}" data-action="histDay" data-id="${ds}">${d}${dots}</button>`);
  }
  const monthName=first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  sheet(`<h2 style="margin-top:0">История</h2>
    <div class="months"><button data-action="histPrev" aria-label="Предыдущий месяц">‹</button><b>${monthName}</b><button data-action="histNext" aria-label="Следующий месяц">›</button></div>
    <div class="cal">${DN.map(d=>`<div class="wd">${d}</div>`).join('')}${cells.join('')}</div>
    <div class="sm mu">Кружок — сегодня. Оранжевая точка — привычки, фиолетовая — оценки.</div>
    <p style="margin:18px 0 0"><button class="btn g" data-action="closeSheet">Закрыть</button></p>`);
}
function histPrev(){calMonth.m--;if(calMonth.m<0){calMonth.m=11;calMonth.y--}renderHistory()}
function histNext(){calMonth.m++;if(calMonth.m>11){calMonth.m=0;calMonth.y++}renderHistory()}

/* ===== SCHOOL (изолированный модуль) ===== */
const school=(()=>{
  const TH=CONFIG.gradeThresholds,GOAL=CONFIG.gradeGoal,SS=schoolStore;
  const f2=x=>x.toFixed(2);
  const names=()=>Object.keys(S.school.g).filter(k=>!S.school.archived.includes(k));
  const ACT=()=>names().filter(k=>S.school.g[k].length);
  const vals=k=>S.school.g[k].map(x=>x.v),avg=k=>sum(vals(k))/vals(k).length;
  const fin=a=>a<TH[0]?2:a<TH[1]?3:a<TH[2]?4:5;
  const finAvg=()=>sum(ACT().map(k=>fin(avg(k))))/(ACT().length||1);
  const exAvg=()=>sum(ACT().map(k=>avg(k)))/(ACT().length||1);
  function plan(a){
    const n=a.length,s=sum(a),target=TH[1];
    const k=Math.max(0,Math.ceil((target*n-s)/(5-target)-1e-9));
    const x=(s+5*k)/(n+k);
    return{k,x,t:k>=CONFIG.maxPlan?'получить очень много «5» подряд':`получить ${k}× «5» подряд`};
  }
  function calc(){
    const bad=[],good=[];
    ACT().forEach(k=>{const a=vals(k),av=avg(k);
      if(av<TH[1])bad.push({k,av,p:plan(a),f:fin(av)});
      else{const x=(sum(a)+3)/(a.length+1);good.push({k,av,x:x<TH[1]?x:null})}});
    bad.sort((a,b)=>(a.f-b.f)||(a.p.k-b.p.k)||(a.av-b.av));return{bad,good};
  }
  function scen(k){
    const a=vals(k),s=sum(a),n=a.length,c=avg(k);
    return[5,4,3].map(v=>{const x=(s+v)/(n+1);return`<span>${v} → <b class="${x>=TH[1]?'ok':x>=c?'warn':'bad'}">${f2(x)}</b></span>`}).join('');
  }
  function chart(){
    const L=S.school.hl.slice(-40),n=L.length;if(!n)return'';
    const vs=L.map(p=>p.f).concat(L.filter(p=>p.e!=null).map(p=>p.e),GOAL),lo=Math.floor((Math.min(...vs)-.1)*10)/10,hi=Math.ceil((Math.max(...vs)+.1)*10)/10,W=320,H=130,P=28;
    const x=i=>n>1?P+i*(W-P-8)/(n-1):W/2,y=v=>H-18-(v-lo)/(hi-lo)*(H-30),lb=p=>p.d.slice(8)+'.'+p.d.slice(5,7);
    const path=k=>{let d='',pen=0;L.forEach((p,i)=>{if(p[k]==null){pen=0;return}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(p[k]).toFixed(1);pen=1});return d};
    const dot=(k,c,r)=>{let i=-1;for(let q=n-1;q>=0;q--)if(L[q][k]!=null){i=q;break}return i<0?'':`<circle cx="${x(i).toFixed(1)}" cy="${y(L[i][k]).toFixed(1)}" r="${r}" fill="${c}"/>`};
    return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="График среднего балла"><line x1="${P}" x2="${W-8}" y1="${y(GOAL)}" y2="${y(GOAL)}" stroke="var(--ac)" stroke-dasharray="4 4"/><text x="0" y="${y(GOAL)+4}" font-size="11" fill="var(--ac)">${f2(GOAL)}</text><text x="0" y="${y(lo)+4}" font-size="11" fill="var(--mu)">${lo.toFixed(1)}</text>${n>1?`<path d="${path('e')}" fill="none" stroke="var(--tx)" stroke-width="2" stroke-linejoin="round"/><path d="${path('f')}" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linejoin="round"/>`:''}${dot('e','var(--tx)',4)}${dot('f','var(--ok)',5)}${n>1?`<text x="${P}" y="${H-2}" font-size="11" fill="var(--mu)">${lb(L[0])}</text>`:''}<text x="${W-8}" y="${H-2}" font-size="11" text-anchor="end" fill="var(--mu)">${lb(L[n-1])}</text></svg>${n<2?'<div class="mu sm">Линия появится после следующей оценки.</div>':''}`;
  }
  function gradeDonut(){
    const c=[2,3,4,5].map(v=>({v,n:ACT().filter(k=>fin(avg(k))===v).length}));
    const total=c.reduce((n,x)=>n+x.n,0);
    if(!total)return'<div class="mu sm">Диаграмма появится после добавления оценок.</div>';
    const palette={2:'#e26487',3:'#edb345',4:'#54b99a',5:'#ad7aed'};
    let start=0;
    const rings=c.filter(x=>x.n).map(x=>{const share=x.n/total*100;const seg=`<circle cx="60" cy="60" r="46" fill="none" stroke="${palette[x.v]}" stroke-width="12" stroke-dasharray="${share} ${100-share}" stroke-dashoffset="${-start}" pathLength="100" transform="rotate(-90 60 60)"></circle>`;start+=share;return seg}).join('');
    const legend=c.map(x=>`<div class="donut-item"><span class="donut-dot" style="background:${palette[x.v]}"></span><span>«${x.v}»</span><b>${x.n}</b></div>`).join('');
    return`<div class="donut-wrap"><svg viewBox="0 0 120 120" role="img" aria-label="Какая будет четвертная по предметам" class="donut"><circle cx="60" cy="60" r="46" fill="none" stroke="var(--ln)" stroke-width="12"></circle>${rings}<text x="60" y="57" text-anchor="middle" fill="var(--tx)" font-size="23" font-weight="750">${total}</text><text x="60" y="73" text-anchor="middle" fill="var(--mu)" font-size="9">предметов</text></svg><div class="donut-legend">${legend}</div></div>`;
  }
  function commit(){
    if(ACT().length){const f=+finAvg().toFixed(3),e=+exAvg().toFixed(3),l=S.school.hl[S.school.hl.length-1];
      if(!l||l.f!==f||l.e!==e)S.school.hl.push({d:iso(new Date()),f,e})}
    save();render();
  }
  function view(){
    const active=ACT(),{bad,good}=calc(),frag=good.filter(g=>g.x),ordered=names().sort((a,b)=>a.localeCompare(b,'ru'));
    const end=S.school.end;let days=0;
    if(end){for(let d=new Date(iso(new Date())+'T12:00:00');iso(d)<=end;d.setDate(d.getDate()+1))if(d.getDay()>0&&d.getDay()<6)days++}
    return`<h1>Мои оценки</h1><div class="card"><div class="school-summary"><div class="school-score">${active.length?f2(finAvg()):'—'}</div><div><b>Какая будет четвертная</b><div class="mu sm">по итоговым оценкам</div><div class="sm">Средний сейчас: ${active.length?f2(exAvg()):'—'}</div></div></div>
    <details class="school-how"><summary>Как это считается?</summary><p class="school-info mu">Средний балл превращается в четвертную так: от 2,6 — «3», от 3,6 — «4», от 4,6 — «5». Все оценки весят одинаково, но в школе правила могут отличаться. «Средний сейчас» — это обычное среднее арифметическое.</p></details>
    ${end?`<div class="sm" style="margin-top:8px">${esc(end.split('-').reverse().join('.'))} · ${end<iso(new Date())?'четверть закончилась':'учебных дней до конца: '+days+' (без выходных)'}</div>`:''}</div>
    ${!active.length?'<div class="note">Добавь первую оценку — появятся график и подсказки 🌟</div>':`<div class="card"><b>Как меняется средний балл</b>${chart()}<div class="sm"><span class="ok">●</span> четвертная · ● средний сейчас</div><div class="sm">Цель ${f2(GOAL)}: треть предметов на «5», остальные на «4»</div><div class="mu sm">${finAvg()>=GOAL-1e-9?'Цель достигнута! 🌟':'До цели +'+f2(GOAL-finAvg())}</div></div><div class="card"><b>Какая будет четвертная по предметам</b>${gradeDonut()}</div>`}
    ${bad.length?`<h2>Что можно подтянуть</h2>${bad.map(b=>`<div class="card"><b>${esc(b.k)}</b><div class="sm">${b.p.t}, и средний станет ${f2(b.p.x)}</div><div class="sc"><span class="mu">Если получишь:</span>${scen(b.k)}</div></div>`).join('')}`:active.length?'<div class="note">Все предметы на четвёрке и выше. Так держать! 🌸</div>':''}
    ${frag.length?`<div class="card"><b>На что обратить внимание</b>${frag.map(g=>`<p class="sm">${esc(g.k)}: тройка снизит средний с ${f2(g.av)} до ${f2(g.x)}.</p>`).join('')}</div>`:''}
    <h2>Мои предметы</h2>${ordered.map(k=>{const n=names().indexOf(k),a=S.school.g[k];return`<div class="card school-sub"><div class="row"><div><b>${esc(k)}</b><div class="mu sm">${a.length?'средний '+f2(avg(k)):'оценок пока нет'}</div></div><div class="school-final">${a.length?fin(avg(k)):'—'}<small>выйдет</small></div></div><div class="chips">${a.map(x=>`<button class="chip c${x.v}" data-action="editGrade" data-id="${n}" data-arg="${x.i}" aria-label="Изменить оценку ${x.v}: ${esc(k)}">${x.v}</button>`).join('')}<button class="chip" data-action="addGrade" data-id="${n}" aria-label="Добавить оценку: ${esc(k)}">+</button></div>${a.length?`<div class="sc"><span class="mu">Если получишь:</span>${scen(k)}</div>`:''}</div>`}).join('')}
    <button class="btn g" data-action="subjects">Предметы и четверть</button>`;
  }
  function edit(n,id){
    const k=names()[n],x=S.school.g[k].find(x=>x.i===id);
    sheet(`<h2 style="margin-top:0">${esc(k)}</h2><p class="mu sm">${x?'Исправь оценку или удали ошибочную запись.':'Какую оценку ты получила?'}</p><div class="chips">${[2,3,4,5].map(v=>`<button class="chip c${v}" data-action="putGrade" data-id="${n}" data-arg="${v}" data-arg2="${id===undefined?'null':id}">${v}</button>`).join('')}</div><div class="school-actions">${x?`<button class="btn g" data-action="removeGrade" data-id="${n}" data-arg="${id}">Удалить оценку</button>`:''}<button class="btn g" data-action="closeSheet">Отмена</button></div>`);
  }
  function put(n,v,id){
    const k=names()[n];if(!k||![2,3,4,5].includes(v))return;
    const a=S.school.g[k];
    if(id!==null){const x=a.find(x=>x.i===id);if(!x)return;x.v=v}
    else a.push({i:++S.school.n,v,d:iso(new Date())});
    commit();cs();toast(v===5?'🌟 Пятёрка! Отличная работа!':'Оценка сохранена');
  }
  function remove(n,id){
    const k=names()[n],a=S.school.g[k],x=a.find(x=>x.i===id);
    if(!x)return;
    const idx=a.indexOf(x),saved={...x};
    a.splice(idx,1);commit();cs();
    toast('Оценка удалена',{action:'Вернуть',onAction:()=>{a.splice(idx,0,saved);commit()}});
  }
  function subjects(){
    sheet(`<h2 style="margin-top:0">Предметы и четверть</h2>${names().map((k,n)=>`<div class="row" style="align-items:center"><span>${esc(k)}</span><button class="chip" data-action="archiveSubject" data-id="${n}">В архив</button></div>`).join('')}<label class="sm">Новый предмет<input id="schoolName" maxlength="30" placeholder="Название предмета"></label><div class="school-actions"><button class="btn" data-action="addSubject">Добавить</button></div>${S.school.archived.length?'<h2>Архив</h2>'+S.school.archived.map((k,n)=>`<div class="row" style="align-items:center"><span>${esc(k)}</span><button class="chip" data-action="restoreSubject" data-id="${n}">Вернуть</button></div>`).join(''):''}<p class="sm mu">В архиве оценки сохраняются и не участвуют в текущем прогнозе.</p><label class="sm">Конец четверти<input id="schoolEnd" type="date" value="${esc(S.school.end||'')}" data-action="endInput"></label><div class="school-actions"><button class="btn g" data-action="closeSheet">Готово</button></div>`);
  }
  function add(){
    const k=document.getElementById('schoolName').value.replace(/\s+/g,' ').trim().slice(0,30);
    if(!k)return toast('Напиши название предмета');
    if(Object.hasOwn(S.school.g,k))return toast('Предмет уже есть — проверь архив');
    S.school.g[k]=[];commit();subjects();
  }
  function archive(n){
    const k=names()[n];if(!k)return;
    S.school.archived.push(k);commit();subjects();
    toast(`«${k}» в архиве`,{action:'Вернуть',onAction:()=>{S.school.archived.pop();commit();subjects()}});
  }
  function restore(n){S.school.archived.splice(n,1);commit();subjects()}
  function end(v){if(v&&!/^\d{4}-\d{2}-\d{2}$/.test(v))return;S.school.end=v;save();render()}
  return{view,edit,put,remove,subjects,add,archive,restore,end};
})();

function openParents(){
  sheet(`<h2>Для родителей</h2><p class="mu sm">Настройте награду вместе с ребёнком. Данные хранятся на этом устройстве — сохраните копию для переноса.</p><button class="btn g" data-action="editReward">Награда и цель по звёздам</button><h2>Копия данных</h2><div class="chips"><button class="btn g" data-action="exportFile">Сохранить копию файлом</button><button class="btn g" data-action="pickBackupFile">Восстановить из файла</button><input type="file" id="backupFileInput" accept=".json,application/json" data-action="importFile" hidden><div id="backupStatus" class="mu sm" role="status" aria-live="polite"></div><details><summary class="mu sm" style="padding:16px 0">Восстановить старую текстовую копию</summary><textarea id="bk" aria-label="Текст старой копии"></textarea><button class="btn g" data-action="importText">Восстановить из текста</button></details></div><button class="btn g" data-action="closeSheet">Закрыть</button>`);
}
function installBackup(o){
  const source=o&&o.habit?o.habit:o;
  if(!source||typeof source!=='object'||!source.d||Array.isArray(source.d)||typeof source.d!=='object'||!Object.values(source.d).every(a=>Array.isArray(a)))throw Error('bad habits');
  const candidate=store.validateAll(Object.assign(store.defaults(),JSON.parse(JSON.stringify(source))));
  const schoolRaw=o.school||source.school;
  if(schoolRaw&&(!schoolRaw.g||typeof schoolRaw.g!=='object'||Array.isArray(schoolRaw.g)||!Object.values(schoolRaw.g).every(a=>Array.isArray(a)&&a.every(x=>x&&[2,3,4,5].includes(x.v)))))throw Error('bad grades');
  candidate.school=schoolRaw?schoolStore.validate(schoolStore.migrate(JSON.parse(JSON.stringify(schoolRaw)))):JSON.parse(JSON.stringify(S.school));
  if(!confirm('Заменить данные копией? Текущее состояние будет сохранено на этом устройстве.'))return;
  const before=JSON.stringify(S),oldSchool=localStorage.getItem(KEY+'_school');
  localStorage.setItem(KEY+'_before_restore',before);
  try{localStorage.setItem(KEY+'_school',JSON.stringify(candidate.school));localStorage.setItem(KEY,JSON.stringify(candidate))}
  catch(err){if(oldSchool===null)localStorage.removeItem(KEY+'_school');else localStorage.setItem(KEY+'_school',oldSchool);throw err}
  S=candidate;render();backupStatus('Данные восстановлены. Предыдущая версия сохранена на устройстве.');
}

function backupStatus(message){const e=document.getElementById('backupStatus');if(e)e.textContent=message;else toast(message)}
async function exportBackupFile(){
  try{
    const file=new File([JSON.stringify({habit:(({school,...r})=>r)(S),school:S.school})],'iskra-backup-'+iso(new Date())+'.json',{type:'application/json'});
    if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'Копия данных'}); backupStatus('В меню «Поделиться» выбери «Сохранить в Файлы».');return}
      catch(err){if(err.name==='AbortError')return}
    }
    const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
     backupStatus('Файл подготовлен. Проверь «Загрузки» или «Файлы».');
  }catch(err){backupStatus('Не удалось создать копию. Попробуй открыть приложение в Safari.')}
}
async function importBackupFile(input){
  const file=input.files&&input.files[0];if(!file)return;
  try{if(file.size>10*1024*1024)throw Error('size');installBackup(JSON.parse(await file.text()))}
  catch(err){backupStatus('Файл не подходит или не удалось сохранить данные. Текущие записи не заменены.')}
  finally{input.value=''}
}
function importBackupText(){
  try{installBackup(JSON.parse(document.getElementById('bk').value))}
  catch(err){backupStatus('Текст копии не подходит или не удалось сохранить данные. Текущие записи не заменены.')}
}

/* ===== ACTIONS ===== */
const ACTIONS={
  profile:()=>openProfile(),
  closeProfile:()=>{cs();render()},
  pickEmoji:(e)=>{S.av.e=e;save();openProfile()},
  pickColor:(c)=>{S.av.c=c;save();openProfile()},
  editReward:()=>openReward(),
  setGoal:(n)=>{const rw=document.getElementById('rw');if(rw)S.reward=rw.value.trim()||S.reward;S.goal=+n;save();openReward()},
  saveReward:()=>{const rw=document.getElementById('rw');if(rw)S.reward=rw.value.trim()||S.reward;save();cs();render()},
  toggle:(i)=>toggleTask(i),
  details:(i)=>openDetails(i),
  detailChip:(j)=>{cur.n=document.getElementById('dn').value;const k=(cur.i=='hw'?CONFIG.subjects:CONFIG.chores)[+j],x=cur.s.indexOf(k);x<0?cur.s.push(k):cur.s.splice(x,1);renderDetails()},
  saveDetails:()=>saveDetails(),
  removeDetails:()=>removeDetails(),
  toggleDance:(g)=>{const a=S.dance,x=a.indexOf(+g);x<0?a.push(+g):a.splice(x,1);save();render()},
  closeSheet:()=>cs(),
  parents:()=>openParents(),
  exportFile:()=>exportBackupFile(),
  pickBackupFile:()=>document.getElementById('backupFileInput').click(),
  importText:()=>importBackupText(),
  dayHistory:(d)=>openDay(d),
  history:()=>openHistory(),
  histPrev:()=>histPrev(),
  histNext:()=>histNext(),
  histDay:(d)=>openDay(d),
  editGrade:(n,_,el)=>school.edit(+n,+el.dataset.arg),
  addGrade:(n)=>school.edit(+n),
  putGrade:(n,_,el)=>school.put(+n,+el.dataset.arg,el.dataset.arg2==='null'?null:+el.dataset.arg2),
  removeGrade:(n,_,el)=>school.remove(+n,+el.dataset.arg),
  subjects:()=>school.subjects(),
  addSubject:()=>school.add(),
  archiveSubject:(n)=>school.archive(+n),
  restoreSubject:(n)=>school.restore(+n),
  endInput:(_,__,el)=>school.end(el.value),
};
function toggleTask(i){
  const d=iso(new Date()),done=(S.d[d]||[]).includes(i);
  setDone(i,!done);
}

/* ===== DELEGATION ===== */
document.addEventListener('click',e=>{
  const closeEl=e.target.closest('[data-close]');
  if(closeEl&&e.target===closeEl){cs();return}
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const {action,id,arg,arg2}=el.dataset;
  const fn=ACTIONS[action];
  if(fn)fn(id,arg,el,arg2);
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  if(el.dataset.action==='nameInput'){S.name=el.value.trim();save()}
  if(el.dataset.action==='endInput')school.end(el.value);
});

document.addEventListener('change',e=>{if(e.target.dataset.action==='importFile')importBackupFile(e.target)});

/* ===== BOOT ===== */
render();
if(!S.asked){S.asked=1;save();openProfile()}

try{let count=0;const assert=(ok,label)=>{if(!ok)throw Error(label);count++};

S.asked=1;S.d={};S.x={};S.school={g:{Тест:[{i:1,v:5,d:'2026-01-01'}]},hl:[],n:1,end:'',archived:[]};
const d=iso(new Date());setDone('bg',true,true);assert(S.d[d].includes('bg'),'mark');assert(today().includes('task on'),'completed rendering');setDone('bg',false,true);assert(!S.d[d].includes('bg'),'undo');
assert(!today().includes('clearToday')&&!('clearToday' in ACTIONS),'no bulk reset');assert(!reward().includes('editReward'),'reward controls moved');assert(me().includes('parents')&&!me().includes('id="bk"'),'parents entry');
const before=JSON.stringify(S);try{installBackup({foo:1})}catch(e){}assert(JSON.stringify(S)===before,'invalid import unchanged');
const oldConfirm=window.confirm;window.confirm=()=>true;
installBackup({habit:{d:{'2026-01-01':['bg']},x:{},asked:1},school:{g:{Тест:[{i:2,v:4,d:'2026-01-01'}]},hl:[],n:2,archived:[]}});assert(S.school.g.Тест[0].v===4,'grades restored');assert(localStorage.getItem(KEY+'_before_restore')===before,'restore safeguard');
installBackup({d:{'2026-01-02':['cl']},x:{},asked:1});assert(S.school.g.Тест[0].v===4,'legacy copy retains school');window.confirm=oldConfirm;
setDone('en',true,true);setDone('bg',true,true);tab='t';cs();render();

const result=document.createElement('div');result.id='qa-result';result.textContent='Проверки пройдены: '+count;result.style='position:fixed;top:0;left:0;z-index:99;background:#173c2d;color:white;padding:4px;font:12px sans-serif';document.body.appendChild(result);
}catch(err){const result=document.createElement('pre');result.id='qa-result';result.textContent='FAIL: '+err.stack;document.body.prepend(result)}
