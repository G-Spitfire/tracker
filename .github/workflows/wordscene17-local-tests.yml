name: Application checks
on:
  push:
    branches: [main]
    paths:
      - 'wordscene/**'
      - 'leveli/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'wordscene/**'
      - 'leveli/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax checks
        run: |
          node --check wordscene/app.js
          node --check wordscene/engine.js
          node --check wordscene/accounts.js
          node --check wordscene/sw.js
          node --check leveli/school-model.js
          node --check leveli/sw.js
      - name: WordScene and Leveli unit tests
        run: node --test wordscene/*.test.cjs leveli/tests/*.test.cjs

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright and browsers
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Test WordScene and Leveli desktop/mobile browser flows
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/wordscene-http.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/wordscene/index.html >/dev/null; then break; fi
            sleep 1
          done
          node wordscene/browser-acceptance.cjs
          node leveli/tests/browser.cjs
      - name: Save mobile browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordscene-mobile-ux-screenshots
          path: wordscene/audit-screenshots/*.png
          if-no-files-found: warn

