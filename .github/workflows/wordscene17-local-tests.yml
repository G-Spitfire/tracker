name: Family applications checks
on:
  push:
    branches: [main]
    paths:
      - 'wordscene/**'
      - '.github/workflows/wordscene17-local-tests.yml'
  pull_request:
    paths:
      - 'wordscene/**'
      - 'index.html'
      - 'README.md'
      - '.github/workflows/wordscene17-local-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax checks
        run: |
          node --check wordscene/app.js
          node --check wordscene/engine.js
          node --check wordscene/accounts.js
          node --check wordscene/sw.js
      - name: WordScene unit tests
        run: node --test wordscene/*.test.cjs

  browser-acceptance:
    runs-on: ubuntu-latest
    # Browsers and OS libraries are preinstalled; no runtime apt/DNS dependency.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install matching Playwright package
        run: |
          npm install --no-save playwright@1.64.1
      - name: Test WordScene desktop/mobile browser flows
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/wordscene-http.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/wordscene/index.html >/dev/null; then break; fi
            sleep 1
          done
          node wordscene/browser-acceptance.cjs
      - name: Save mobile browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordscene-mobile-ux-screenshots
          path: wordscene/audit-screenshots/*.png
          if-no-files-found: warn

  live-site-acceptance:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # Browsers and OS libraries are preinstalled; no runtime apt/DNS dependency.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install matching Playwright package
        run: |
          npm install --no-save playwright@1.64.1
      - name: Test deployed GitHub Pages in desktop/mobile browsers and offline
        env:
          WS17_TEST_ORIGIN: https://g-spitfire.github.io/tracker
        run: node wordscene/browser-acceptance.cjs
