name: School - UI stability check
on:
  pull_request:
    paths:
      - 'school-simple/**'
      - '.github/workflows/school-ui-stability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/school-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/school-simple/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test scroll and navigation
        run: node school-simple/tests/ui-stability.cjs
      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-ui-screenshots
          path: school-ui-screenshots/
          if-no-files-found: warn
          retention-days: 7
