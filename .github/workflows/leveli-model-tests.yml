name: Leveli model checks
on:
  pull_request:
    paths:
      - 'leveli/**'
      - 'firestore.rules'
      - 'firebase.emulator.json'
      - '.github/workflows/leveli-model-tests.yml'
  push:
    branches:
      - main
      - 'feature/leveli-grade-model-audit-1'
    paths:
      - 'leveli/**'
      - 'firestore.rules'
      - 'firebase.emulator.json'
      - '.github/workflows/leveli-model-tests.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check leveli/school-model.js
      - run: node --test leveli/tests/*.test.cjs
      - run: python3 -m unittest discover -s leveli/tools/school-export -p "test*.py"
  browser:
    runs-on: ubuntu-latest
    # Browsers and OS libraries are preinstalled; no runtime apt/DNS dependency.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - name: Run Leveli browser acceptance with synthetic data
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/leveli-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/leveli/index.html >/dev/null; then break; fi
            sleep 1
          done
          node leveli/tests/browser.cjs
          node leveli/tests/homework-sync-browser.cjs

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save firebase-tools@15.35.0 firebase@13.2.0 @firebase/rules-unit-testing@6.0.0
      - run: python3 -m pip install google-cloud-firestore==2.34.1
      - run: npx firebase emulators:exec --only firestore --project demo-leveli-release-check --config firebase.emulator.json 'python3 leveli/tests/homework-emulator.py'
      # Historical backup transport test imports modules removed before this PR.
      - run: npx firebase emulators:exec --only firestore --project demo-leveli-release-check --config firebase.emulator.json 'node --test --test-skip-pattern=real.backup.transport leveli/tests/firestore-rules.cjs'
