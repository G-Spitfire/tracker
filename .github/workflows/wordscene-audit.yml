name: WordScene audit regression
on:
  pull_request:
    paths:
      - 'wordscene-17-lab/**'
      - '.github/workflows/wordscene-audit.yml'
  push:
    branches:
      - 'wordscene/audit-approved-batch-1'
    paths:
      - 'wordscene-17-lab/**'
      - '.github/workflows/wordscene-audit.yml'
permissions:
  contents: read
jobs:
  node-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check wordscene-17-lab/app.js
          node --check wordscene-17-lab/engine.js
      - name: WordScene audit regression
        run: node --test wordscene-17-lab/audit-regression.test.cjs
