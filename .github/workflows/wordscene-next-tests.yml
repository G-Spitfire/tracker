name: WordScene Next checks

on:
  push:
    paths:
      - 'wordscene-next/**'
      - '.github/workflows/wordscene-next-tests.yml'
  pull_request:
    paths:
      - 'wordscene-next/**'
      - '.github/workflows/wordscene-next-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          for file in wordscene-next/*.js; do node --check "$file"; done
      - name: Run WordScene Next tests
        run: node --test wordscene-next/tests/*.test.cjs
