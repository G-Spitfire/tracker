name: Calendar browser audit
on:
  workflow_dispatch:
  push:
    branches: [calendar-playwright-audit]
    paths:
      - 'календарь/**'
      - '.github/workflows/calendar-browser-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Run browser audit
        run: node календарь/tests/browser-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-audit
          path: календарь/tests/artifacts/
          if-no-files-found: ignore
