name: WordScene backup tests
on:
  push:
    branches: [feature/wordscene-cloud-sync, feature/wordscene-auto-backup]
    paths:
      - 'wordscene/**'
      - '.github/workflows/wordscene-cloud-tests.yml'
  pull_request:
    paths:
      - 'wordscene/**'
      - '.github/workflows/wordscene-cloud-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install free Firebase test tools
        run: npm install --no-save --package-lock=false firebase@12 @firebase/rules-unit-testing@5 firebase-tools@15
      - name: Syntax check
        run: |
          node --check wordscene/profile-store.js
          node --check wordscene/cloud-firestore.js
          node --check wordscene/cloud-sync.js
          node --check wordscene/state-guard.js
          node --check wordscene/cloud-ui.js
      - name: Unit tests
        run: node --test wordscene/tests/*.test.cjs
      - name: Firestore Emulator rules tests
        run: npx firebase emulators:exec --only firestore --project demo-wordscene-backup-rules --config wordscene/firebase.emulator.json "node --test wordscene/tests/emulator/*.test.cjs"
