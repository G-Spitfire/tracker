<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WordScene — Clean Modern pilot</title><style>
*{box-sizing:border-box}body{margin:0;background:#F5F7FB;color:#172033;font:16px/1.375 system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;border:0;color:inherit}button:focus-visible{outline:2px solid #2563EB;outline-offset:2px}button:disabled{background:#E2E8F0;color:#475569;cursor:default}.shell{max-width:480px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:8px 16px max(8px,env(safe-area-inset-bottom));gap:8px}.tabs{display:flex;gap:4px}.tabs button{flex:1;min-height:44px;font-size:13px;border-radius:12px;background:transparent}.tabs button[aria-pressed=true]{background:#E8EFFD;color:#1D4ED8;font-weight:600}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:22px;line-height:28px;margin:0}small,.muted{color:#64748B;font-size:14px;line-height:20px}.track{height:6px;border-radius:9px;background:#E2E8F0;overflow:hidden}.track span{display:block;background:#2563EB;height:100%}.card{background:white;border-radius:20px;min-height:132px;flex:0 0 clamp(132px,25dvh,210px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px;position:relative;gap:4px;text-align:center}.word{font-size:40px;line-height:1.15;font-weight:700;overflow-wrap:anywhere}.word.ru{font-size:28px;font-weight:600}.flip{position:absolute;inset:0;background:transparent;border-radius:20px}.sound{position:relative;z-index:1;background:#E8EFFD;color:#1D4ED8;border-radius:50%;width:44px;height:44px;display:grid;place-items:center}.hint{font-size:13px;color:#64748B}.dream{flex:1;min-height:0;overflow:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}.dream p{margin:0;font-size:14px;line-height:20px}.art{width:100%;min-height:0;flex:1;display:flex;justify-content:center}.art svg{width:100%;height:100%;max-height:240px;min-height:72px}.quiet{min-height:44px;background:transparent;color:#475569;font-size:14px}.actions{display:flex;gap:8px}.actions button,.primary,.se const words=WordSceneCatalog.words;let mode='learn',i=0,face=false,help=true,failed=false,known=0,unknown=0;const $=id=>document.getElementById(id);const btn=(label,cls,fn)=>{const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b};function reset(m){mode=m;i=0;face=false;help=m==='learn';failed=false;known=unknown=0;render()}function next(){i=(i+1)%words.length;face=false;help=mode==='learn';failed=false;render()}function render(){const w=words[i],reverse=mode==='recall'&&i%2===1,ru=reverse!==face;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));$('heading').textContent={select:'Подбор слов',learn:'Запоминание',recall:'Проверка'}[mode];$('counter').textContent=mode==='select'?'Не знаю '+unknown+'/10 · '+(known+unknown)+'/50':(i+1)+' / '+words.length;$('progress').style.visibility=mode==='select'?'hidden':'visible';$('progress').firstElementChild.style.width=((i+1)/words.length*100)+'%';$('card').replaceChildren();const word=document.createElement('div');word.className='word'+(ru?' ru':'');word.textContent=ru?w.ru:w.en;$('card').append(word);if(!ru){const ipa=document.createElement('small');ipa.textContent=w.ipa;$('card').append(ipa)}const flip=btn('','flip',()=>{if(failed)return;face=!face;if(mode==='recall')help=false;render()});flip.setAttribute('aria-label','Перевернуть карточку');flip.disabled=failed;$('card').append(flip);if(!ru){const sound=btn('','sound',()=>{if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(w.en);u.lang='en-GB';speechSynthesis.speak(u)}});sound.setAttribute('aria-label','Озвучить слово');sound.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9h4l5-4v14l-5-4H3z M16 9a4 4 0 0 1 0 6 M19 6a8 8 0 0 1 0 12"/></svg>';$('card').append(sound)}const hint=document.createElement('span');hint.className='hint';hint.textContent=failed?'Правильный ответ':'Нажми, чтобы перевернуть';$('card').append(hint);$('dream').replaceChildren();if(mode==='select'){$('dream').append(Object.assign(document.createElement('p'),{textContent:'Знаешь это слово?'}))}else{if(failed)$('dream').append(Object.assign(document.createElement('p'),{className:'error',textContent:'Не вспомнил'}));if(mode==='learn'||face){$('dream').append(btn(help?'Скрыть образ':'Показать образ','quiet',()=>{help=!help;render()}))}else{$('dream').append(Object.assign(document.createElement('p'),{className:'muted',textContent:'Попробуй вспомнить слово.'}))}if(help){const art=document.createElement('div');art.className='art';art.innerHTML=WordSceneIllustrations.render(w);$('dream').append(art,Object.assign(document.createElement('p'),{textContent:w.scene}))}}$('actions').replaceChildren();if(mode==='select'){$('actions').append(btn('Знаю','secondary',()=>{known++;next()}),btn('Не знаю','primary',()=>{unknown++;next()}))}else if(mode==='learn'){$('actions').append(btn(i===words.length-1?'Начать проверку':'Дальше','primary',()=>i===words.length-1?reset('recall'):next()))}else if(failed){$('actions').append(btn('Дальше','primary',next))}else{$('actions').append(btn('Не вспомнил','secondary',()=>{failed=true;face=true;help=false;render()}),btn('Вспомнил','primary',next))}}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>reset(b.dataset.mode));$('cancel').onclick=()=>$('dialog').showModal();$('stay').onclick=()=>$('dialog').close();$('exit').onclick=()=>{$('dialog').close();reset('select')};render();
</script></html>
