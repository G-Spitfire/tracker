function endApproach(){if(s&&!['result','between'].includes(s.phase)){pause();return}s=null;save();home()}

function startSelected(intent='auto'){
 if(s&&!['result','between'].includes(s.phase)){render();return}
 const fresh=freshIds(),due=requiredIds(),reviews=due.length?due.slice(0,15):intent==='review'||!fresh.length?reviewIds():[];
 if(!reviews.length&&!fresh.length){s=null;home();return}
 s={id:Date.now()+'-'+Math.random().toString(36).slice(2,8),schedulerVersion:1,mode:reviews.length?'review':'new',part:reviews.length?'review':'new',ids:reviews.length?reviews:fresh,newIds:reviews.length?[]:fresh,learnIndex:0,completed:[],errors:[],partErrors:[],reviewProgress:{},queueKind:due.length?'required':'optional'};

 const token='review:'+i;if(s.completed.includes(token))return;

function result(){const trained=trainedIds().length,newCount=s.completed.filter(t=>t.startsWith('new:')).length,reviewCount=s.completed.filter(t=>t.startsWith('review:')).length,due=requiredIds(),fresh=freshIds();frame('Подход завершён',100,`<div class="interlude center result-body"><div class="mental-symbol">✓</div><h2>${newCount?'Новая подборка отработана!':due.length?'Часть слов повторили!':'Повторение закончено!'}</h2><p>${reviewCount?`Проверили знакомых слов: <b>${reviewCount}</b>.<br>`:''}${newCount?`Новых слов отработано: <b>${newCount}</b>.<br>`:''}${s.errors.length?`Восстанавливали ассоциации: ${s.errors.length}.`:'В этом подходе всё получилось без ошибок.'}</p><div class="focus-card small"><b>${due.length?`Осталось повторить: ${due.length}`:newCount?'Вернёмся к этим словам завтра':'Обязательное повторение на сегодня закончено'}</b><p class="note">${due.length?'Можно продолжить или отдохнуть. Проверенные слова уже сохранены.':newCount?'Если захочешь, повтори их ещё раз через полчаса.':'Можно закончить или взять новые слова.'}</p></div><div class="bottom-actions">${due.length?btn('Повторить следующие '+Math.min(15,due.length)+' →',"continueWith('auto')") :fresh.length?btn('Выучить '+fresh.length+' новых →',"continueWith('auto')"):''}${btn('На сегодня всё','endApproach()','secondary')}${!due.length&&trained?btn('Повторить ещё',"continueWith('review')",'soft'):''}</div></div>`)}

function continueWith(intent){if(s&&!['result','between'].includes(s.phase)){render();return}s=null;save();startSelected(intent==='review'?'review':'auto')}

function myWords(){screen='words';shell(`<section class="app-screen"><div class="topline">${btn('← Главная','home()','quiet')}<span class="pill">${words.length} слов</span></div><h1 class="page-title">Мои слова</h1><p class="note">Подходы — законченные проверки слова или изучение подборки. Закрепление считаем по разным дням, а не по числу нажатий.</p><label class="search-label">Найти слово<input id="word-search" type="search" placeholder="Слово или перевод" value="" oninput="wordQuery=this.value;updateList()"></label><div class="filters">${[['all','Все'],['trained','Учили'],['learning','Учим'],['fresh','Не учили']].map(([key,name])=>btn(name,`filterWords('${key}')`,wordFilter===key?'selected':'')).join('')}</div><p class="note" id="word-count"></p><div id="word-list" class="word-list"></div><p class="note">Время не включает паузы, чтение ответа и сцен. Ребёнок сам оценивает правильность. Старые занятия сохранены без выдуманной статистики.</p></section>`);$('word-search').value=wordQuery;updateList()}
function filterWords(filter){wordFilter=filter;myWords()}
function updateList(){const q=wordQuery.toLowerCase().trim();const list=words.map((w,i)=>({w,i,p:record(i)})).filter(({w,p})=>(!q||w.en.toLowerCase().includes(q)||w.ru.toLowerCase().includes(q))&&(wordFilter==='all'||wordFilter==='trained'&&p.trained||wordFilter==='learning'&&p.started&&!p.trained||wordFilter==='fresh'&&!p.started));$('word-count').textContent=`Показано: ${list.length} из ${words.length}`;$('word-list').innerHTML=list.length?list.map(({w,i,p})=>`<button class="word-row" onclick="openWord(${i})"><span class="row-heading"><span><strong>${w.en}</strong><span class="row-translation">${w.ru}</span></span><span class="status ${p.trained?'studied':''}">${R.label(p)}</span></span><span class="metrics"><span><b>${p.sessions||'—'}</b>подходы${p.legacy?'*':''}</span><span><b>${p.attempts||'—'}</b>ответы</span><span><b>${p.attempts?p.errors:'—'}</b>ошибки</span><span><b>${timeText(p)}</b>обычно</span></span></button>`).join(''):'<p class="empty">Таких слов нет. Попробуй другой запрос.</p>'}
function openWord(i){screen='word';const w=words[i],p=record(i);shell(`<section class="app-screen"><div class="topline">${btn('← Мои слова','myWords()','quiet')}<span class="pill">${R.label(p)}</span></div><div class="word-heading"><div><h1>${w.en}</h1><p class="translation">${w.ru} <small class="phonetic">${w.ipa}</small></p></div></div><div class="scene-box">${illustration(w.en)}<p>${w.scene}</p><span class="cue">Созвучие: ${w.cue}</span></div><h2>Как получается</h2>${p.trained?`<p class="note">${R.label(p)} · Дней проверок: ${p.schedule.days.length}. ${R.due(p)?'Нужна проверка.':'На сегодня обязательная проверка не нужна.'}</p>`:''}<div class="stats-detail"><p>Завершённых подходов <b>${p.sessions}</b></p><p>Ответов <b>${p.attempts}</b></p><p>Ошибок <b>${p.errors}</b></p><p>Обычно: русский → английский <b>${timeText(p,1)}</b></p><p>Обычно: английский → русский <b>${timeText(p,0)}</b></p></div>${p.legacy?'<p class="note">Слово учили в предыдущей версии. Точное число тех подходов и ошибок неизвестно; выше — статистика новой версии.</p>':''}<p class="note">Здесь можно посмотреть карточку. Просмотр не засчитывается как обучение.</p></section>`)}
function parents(){screen='parents';shell(`<section class="app-screen"><div class="topline">${btn('← Главная','home()','quiet')}</div><h1 class="page-title">Для родителей</h1><div class="prose"><h2>Знакомство с новым словом</h2><p>Ребёнок рассматривает готовую ассоциацию, представляет сцену и в этот момент произносит английское слово три раза. Затем скрывает рисунок и восстанавливает сцену самостоятельно.</p><h2>Отработка пятёрки</h2><p>Сначала вспоминаем с русского на английский, затем обратно. В каждом направлении — минимум три прохода; два последних должны быть без ошибок. Скорость ответа не влияет на число проходов. Если после пяти проходов ещё есть ошибки, можно передохнуть и продолжить с сохранённого места. Это правила тренажёра, а не заявленный норматив автора методики.</p><h2>Повторение</h2><p>За подход берём до 15 знакомых слов и спрашиваем их в обе стороны. После ошибки показываем сцену и возвращаем карточку ещё раз. Дальше можно начать следующий подход. Число подходов не ограничено.</p><p>Приложение само составляет обязательную очередь: недавние ошибки, ежедневное закрепление, затем знакомые слова с наступившей проверкой. Очередь выдаётся по 15 слов. Новые открываются только после неё. Закончить и отдохнуть можно после любой порции или на паузе.</p><h2>Закрепление в разные дни</h2><p>Первое изучение не заменяет завтрашнюю проверку. Нужны семь отдельных дней повторения и два последних дня без ошибок в обе стороны. Потом интервалы растут: 3, 7, 14, 30 дней. Ошибка у знакомого слова возвращает ежедневные проверки до двух дней без ошибок; затем снова начинаем с трёх дней. Пропуски не обнуляют результат. Дополнительное повторение в день изучения предлагается через полчаса и не блокирует новые слова.</p><p>Старые слова и статистика сохранены. Если точной истории по дням раньше не было, учёт начинается с первой новой проверки; прошлые дни не придумываются. Интервалы — правила нашего тренажёра на основе обсуждённого подхода, а не точная авторская схема.</p><h2>Статистика</h2><p>Каждый оценённый ответ и ошибка сохраняются сразу. Повторение засчитывается отдельно каждому слову после проверки в обе стороны и возврата карточек с ошибками. Незавершённая часть подхода сохраняется. Для обычного времени берём медиану последних 60 успешных ответов в каждом направлении. Паузы и время после открытия ответа не учитываются. Таймер не показываем.</p><p>После открытия ответа ребёнок выбирает «Верно» или «Не получилось». Микрофон не используется. Созвучия приблизительные и не заменяют правильного произношения. Проверку написания пока не включали.</p><p>Прогресс хранится в этом браузере. На другом устройстве он не появится автоматически. Старые отметки изученных слов переносятся; недоступную старую статистику не придумываем.</p><p>Независимый тренажёр с ассоциациями и активным вспоминанием по описанию подхода Николая Ягодкина. Готовые истории всё равно нужно представить самой.</p></div></section>`)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&screen==='home'){home();return}if(s?.phase==='test'&&!s.revealed){s.ignoreTiming=true;s.roundValid=false;save()}});
save();updateSoundButton();home();

if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
