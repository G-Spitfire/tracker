.app-screen,.training-body,.home-content,.recall-screen,.learning,.writing-card,.interlude{min-width:0}
.app-screen{overflow-wrap:break-word}

.row-heading{flex-wrap:wrap}

.achievement-bar-col{text-align:center;min-width:0;font-size:11px;color:var(--muted)}
.achievement-bar-track{height:100px;display:flex;align-items:flex-end;justify-content:center;background:var(--primary-soft);border-radius:8px;margin:5px auto;width:100%;max-width:38px;overflow:hidden}
.achievement-bar-fill{width:100%;background:var(--success);border-radius:7px 7px 0 0}
.achievement-bar-col b{color:var(--ink);font-size:12px}
.achievement-note{font-size:12px;color:var(--muted);line-height:1.5}
/* Compact home layout only: leave learning, settings and achievements untouched. */
.home-screen .home-content>h1{font-size:clamp(23px,5vw,29px);margin:4px 0 9px;text-align:left}
.home-screen .habit-card{padding:11px 13px;margin:0 0 9px;border-radius:16px}
.home-screen .habit-card h2{font-size:16px;margin:0 0 7px}
.home-screen .habit-card p{font-size:11px;margin:6px 0 0;line-height:1.3}
.home-screen .habit-card p.note{display:none}
.home-screen .habit-ring-day svg{width:33px;height:33px}
.home-screen .habit-ring-day small{font-size:10px}
.home-screen .habit-ring-legend{font-size:10px;margin-top:4px}
.home-screen .today-card{padding:10px 13px;min-height:0;border-radius:15px}
.home-screen .today-card h2{font-size:16px;margin:0 0 3px}
.home-screen .today-card p{font-size:12px;line-height:1.35}
.home-screen .achievement-preview{margin:9px 0 4px;padding:10px 12px;border-radius:16px}
.home-screen .achievement-heading{display:flex;justify-content:space-between;align-items:center;width:100%;padding:0;background:none;color:var(--ink);font-size:16px;font-weight:800;text-align:left}
.home-screen .achievement-heading span{color:var(--primary);font-size:22px;line-height:1}
.home-screen .achievement-mini{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:7px}
.home-screen .achievement-metric{padding:4px 2px;text-align:center;border:0;background:transparent}
.home-screen .achievement-metric+.achievement-metric{border-left:1px solid var(--border);border-radius:0}
.home-screen .achievement-metric b{font-size:23px;line-height:1.2;color:var(--primary)}
.home-screen .achievement-metric span{font-size:10px;white-space:nowrap}
.home-screen .home-actions{padding-top:4px}
.home-screen .home-actions>.primary{min-height:46px}
.home-screen .habit-praise>.berry-art{height:54px;width:90px}
.home-screen .habit-praise h2{font-size:19px;margin:2px 0}
.home-screen .habit-praise p{font-size:12px;margin:2px 0}
.home-screen .return-hero>.berry-art{height:64px}
.home-screen .return-hero p{font-size:12px;margin:0 0 6px}
.home-screen .habit-totals{padding:8px;border-radius:14px}
.home-screen .habit-totals b{font-size:24px}
@media(max-height:740px){.home-screen .home-content>h1{margin:1px 0 6px}.home-screen .habit-card{padding:8px 11px}.home-screen .achievement-preview{padding:8px 10px;margin:6px 0 3px}.home-screen .today-card{padding:8px 11px}}
.home-screen .achievement-delta{display:inline-block;margin-left:3px;font-size:10px;font-weight:800;color:var(--muted)}.home-screen .achievement-metric:last-child span{white-space:normal}.home-screen .achievement-metric:last-child b{color:var(--primary)}
/* While typing on iPhone, give the answer field priority over large action buttons. The keyboard's Done key submits the form. */
body.is-writing.writing-keyboard .action-dock{display:block;padding:4px 1px 2px;border-top:0}
body.is-writing.writing-keyboard .action-dock .bottom-actions{gap:0}
body.is-writing.writing-keyboard .action-dock .bottom-actions .secondary{display:none}
body.is-writing.writing-keyboard .action-dock .primary{display:block;width:100%;min-height:42px;padding:8px 12px;font-size:15px}
body.is-writing.writing-keyboard .writing-card{padding:0 4px;min-height:0}
body.is-writing.writing-keyboard .writing-card>.eyebrow{font-size:11px;margin:0}
body.is-writing.writing-keyboard .writing-prompt{font-size:clamp(23px,6vw,31px);margin:0 0 4px;padding:2px}
body.is-writing.writing-keyboard .writing-card form .note{display:none}
body.is-writing.writing-keyboard #writing-answer{min-height:44px;font-size:20px}
/* Unified lilac progress indicators with a restrained static glow. */
.training-screen .line{background:#e9e1f3;overflow:visible;border-radius:999px}
.training-screen .line i{background:linear-gradient(90deg,#b7a5dc,#6554b8);border-radius:999px;box-shadow:0 0 7px 1px rgba(101,84,184,.32),0 0 13px rgba(156,130,200,.18)}
.achievement-bar-fill{background:linear-gradient(0deg,#6554b8,#b7a5dc);box-shadow:0 0 7px rgba(101,84,184,.24)}
.topic-grid progress{accent-color:var(--primary)}
@media(prefers-reduced-motion:reduce){.training-screen .line i{transition:none}}

 if(current!==null){const loaded=JSON.parse(current);if(!WordSceneState.valid(loaded,words.length))throw new Error("Invalid saved state");data=loaded;}
 else{
  const old=JSON.parse(localStorage.getItem('word-scenes-v3')||'null');
  if(old){for(const [en,p]of Object.entries(old.words||{}))if(p.seen)data.words[en]={started:true,trained:true,legacy:true};
   const pending=old.session?.fresh?.filter(i=>words[i]&&!data.words[words[i].en]?.trained)||[];

 }
}catch(e){storageOK=false;storageBlock='read'}

const EMPTY_RECORD=Object.freeze({started:false,trained:false,sessions:0,attempts:0,errors:0,hesitations:0,lastAt:0,needsWork:false});
function normalizeRecord(p){return Object.assign(p,{started:!!p.started,trained:!!p.trained,sessions:p.sessions||0,attempts:p.attempts||0,errors:p.errors||0,hesitations:p.hesitations||0,times:p.times||{0:[],1:[]},lastAt:p.lastAt||0,needsWork:!!p.needsWork})}
function progress(i){return data.words[words[i].en]||EMPTY_RECORD}
function record(i){const key=words[i].en;return data.words[key]??=(normalizeRecord({}))}
if(!storageBlock&&data.reviewVersion!==1){try{const previous=localStorage.getItem(KEY);if(previous&&!localStorage.getItem(KEY+'-before-review-v1'))localStorage.setItem(KEY+'-before-review-v1',previous)}catch(e){storageOK=false}data.reviewVersion=1}

function save(){if(storageBlock)return false;data.session=s;try{if(localStorage.getItem(KEY)!==savedRaw){blockStorage('conflict');return false}const raw=JSON.stringify(data);if(raw===savedRaw){storageOK=true;return true}localStorage.setItem(KEY,raw);savedRaw=raw;storageOK=true;if(window.WordSceneCloudBackup?.enabled)window.WordSceneCloudBackup.schedule({immediate:s?.phase==='result'});return true}catch(e){storageOK=false;toast('Не удалось сохранить прогресс. Оставь вкладку открытой.');return false}}

function sound(kind='correct'){
 if(data.soundEnabled===false)return;
 try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;soundContext??=new Audio();
 const play=()=>{const start=soundContext.currentTime,notes=kind==='finish'?[523.25,659.25,783.99]:[659.25,880];
 notes.forEach((hz,i)=>{const o=soundContext.createOscillator(),g=soundContext.createGain(),t=start+i*.095;o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.055,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(soundContext.destination);o.start(t);o.stop(t+.18)})};
 if(soundContext.state==='suspended')soundContext.resume().then(play).catch(()=>{});else play();
 }catch(e){} }

function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// Selection is independent of the array order: stored word indices stay unchanged.
const WORD_GROUPS={bucket:['whale'],blanket:['whale'],sheep:['spike'],ship:['spike'],mug:['vessel'],cup:['vessel'],book:['tree'],tree:['tree']};
function conflictTags(w){return [...(WORD_GROUPS[w.en]||[]),...(w.props||[]).map(p=>'image:'+p),'cue:'+w.cue.toLocaleLowerCase('ru').trim()]}
function conflicts(a,b){const tags=conflictTags(b);return a.en[0].toLowerCase()===b.en[0].toLowerCase()||conflictTags(a).some(t=>tags.includes(t))}
function freshIds(){const pending=words.map((_,i)=>i).filter(i=>!progress(i).trained),picked=[];
 // Balance the remaining initials so a rare initial is not exhausted too early.
 const counts={};for(const i of pending)counts[words[i].en[0]]=(counts[words[i].en[0]]||0)+1;
 pending.sort((a,b)=>counts[words[b].en[0]]-counts[words[a].en[0]]||a-b);
 for(const i of pending){if(picked.every(j=>!conflicts(words[i],words[j])))picked.push(i);if(picked.length===5)break}return picked}

function trainedIds(){return words.map((_,i)=>i).filter(i=>progress(i).trained)}
function requiredIds(){return R.queue(words.map((_,i)=>progress(i)))}
function optionalIds(){return words.map((_,i)=>i).filter(i=>R.optional(progress(i)))}
function reviewIds(exclude=[]){const seen=new Set(exclude),limit=30;const due=requiredIds().filter(i=>!seen.has(i));const optional=optionalIds().filter(i=>!seen.has(i)&&!due.includes(i));const remaining=trainedIds().filter(i=>!seen.has(i)&&!due.includes(i)&&!optional.includes(i)).sort((a,b)=>(progress(a).schedule?.checks?.at(-1)?.at||0)-(progress(b).schedule?.checks?.at(-1)?.at||0)||a-b);return [...due,...optional,...remaining].slice(0,limit)}

/* Counts use saved word records. Old migrated words without a first date are not placed on a timeline. */
function achievementData(){
 const today=H.day(),yesterday=H.shift(today,-1),monday=H.shift(today,-((new Date().getDay()+6)%7)),lastMonday=H.shift(monday,-7),lastSunday=H.shift(monday,-1);
 const dated=[],unknown=[],origins={known:0,learned:0,unknown:0};let mastered=0;
 for(const w of words){const p=data.words[w.en];if(!p?.trained)continue;
  if(Number.isFinite(p.schedule?.masteredAt)&&p.schedule.masteredAt>0)mastered++;
  const origin=p.learningOrigin==='known'||p.learningOrigin==='learned'?p.learningOrigin:'unknown';origins[origin]++;
  const at=p.schedule?.firstLearnedAt;
  if(Number.isFinite(at)&&at>0){const date=H.day(at);if(date<=today)dated.push({date,origin})}
  else unknown.push(w.en);
 }
 const count=(from,to)=>dated.filter(x=>x.origin!=='known'&&x.date>=from&&x.date<=to).length;
 const days=Array.from({length:7},(_,i)=>H.shift(monday,i));
 return {total:origins.known+origins.learned+origins.unknown,mastered,origins,dated,unknown:unknown.length,today,yesterday,monday,lastMonday,lastSunday,todayCount:count(today,today),week:count(monday,today),yesterdayCount:count(yesterday,yesterday),lastWeek:count(lastMonday,lastSunday),days,counts:days.map(d=>count(d,d))};
}

function achievementLine(a){

 const max=Math.max(1,...values),w=320,h=130,left=12,right=12,top=12,bottom=24;
 const points=values.map((v,i)=>[left+i*(w-left-right)/27,top+(max-v)*(h-top-bottom)/max]);
 const line=points.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const labels=[0,7,14,21,27].map(i=>`<text x="${points[i][0]}" y="124" text-anchor="middle" font-size="10" fill="#786588">${days[i].slice(5).replace('-','.')}</text>`).join('');

function home(){screen='home';const fresh=freshIds(),trained=trainedIds(),due=requiredIds(),active=s&&!['result','between'].includes(s.phase),st=H.stats(data.habit),praise=H.takePraise(data.habit);if(praise)save();

function filterIssue(issue){wordIssue=issue;for(const b of document.querySelectorAll('button[onclick^="filterIssue("]'))b.classList.toggle('selected',b.getAttribute('onclick')===`filterIssue('${issue}')`);updateList()}
function updateList(){const q=wordQuery.toLowerCase().trim();const list=words.map((w,i)=>({w,i,p:progress(i)})).filter(({w,i,p})=>inTopic(w)&&(!q||wordSearch[i].includes(q))&&(wordIssue==='all'||wordIssue==='writing'&&W.needs(p)||wordIssue==='oral'&&oralNeeds(p))&&(wordFilter==='all'||wordFilter==='trained'&&p.trained||wordFilter==='learning'&&p.started&&!p.trained||wordFilter==='fresh'&&!p.started&&!p.trained));const total=words.filter(w=>inTopic(w)).length;$('word-count').textContent=`Показано: ${list.length} из ${total}${wordTopic==='all'?' слов':' слов темы'}`;$('writing-practice').innerHTML=wordIssue==='writing'&&list.length?btn('Повторить написание · '+Math.min(15,list.length),`startWritingPractice([${list.map(x=>x.i).join(',')}])`,'secondary wide'):'';const container=$('word-list');
 const rows=list.map(({w,i,p})=>{let row=wordRows.get(i);if(!row){const holder=document.createElement('div');holder.innerHTML=`<button class="word-row" onclick="openWord(${i})"><span class="row-heading"><span><strong>${w.en}</strong><span class="row-translation">${w.ru}</span></span><span class="status ${p.trained?'studied':''}">${R.label(p)}</span></span><span class="metrics"><span><b>${p.attempts||'—'}</b>Ответы</span><span><b>${p.attempts?p.errors:'—'}</b>Ошибки</span><span class="writing-metric"><b>${writingLabel(p)}</b>Написание</span></span></button>`;row=holder.firstElementChild;wordRows.set(i,row)}return row});
 if(!rows.length){if(!container.querySelector('.empty'))container.innerHTML='<p class="empty">По этим фильтрам слов нет.</p>';return}
 let cursor=container.firstChild;
 for(const row of rows){if(row===cursor)cursor=cursor.nextSibling;else container.insertBefore(row,cursor)}
 while(cursor){const next=cursor.nextSibling;cursor.remove();cursor=next}
}

function openWord(i){screen='word';const w=words[i],p=progress(i);shell(`<section class="app-screen"><div class="topline">${btn('← Мои слова','myWords()','quiet')}<span class="pill">${R.label(p)}</span></div><div class="word-heading"><div><h1>${w.en}</h1><p class="translation">${w.ru} <small class="phonetic">${w.ipa}</small></p></div></div><div class="scene-box">${illustration(w.en)}<p>${w.scene}</p><span class="cue">Созвучие: ${w.cue}</span></div><div class="word-themes">${T.forWord(w.en).map(id=>`<button onclick="openTopic('${id}')">${T.topics.find(t=>t.id===id).name}</button>`).join('')}</div>${W.needs(p)?btn('Повторить написание',`startWritingPractice([${i}])`,'secondary wide'):''}<h2>Статистика слова</h2><div class="stats-detail"><p>Статус <b>${R.label(p)}</b></p><p>Ответы · устные <b>${p.attempts}</b></p><p>Ошибки · устные <b>${p.errors}</b></p><p>Написание <b>${writingLabel(p)}</b></p></div><p class="note">После ошибки написание проверяется ещё два раза. Если оба дополнительных ответа правильные, отметка «Нужно повторить» снимается. Письменные проверки не меняют устные ошибки и интервалы. Введённый текст не сохраняется.</p>${p.legacy?'<p class="note">Слово учили в старой версии; устные счётчики показывают только известные результаты.</p>':''}<p class="note">Просмотр карточки не засчитывается как обучение.</p></section>`)}
function help(){screen='help';shell(`<section class="app-screen"><div class="topline">${btn('← Главная','home()','quiet')}</div><h1>Как заниматься</h1><div class="prose"><h2>1. Представь</h2><p>Рассмотри историю. Представь сцену и произнеси английское слово три раза. Спрячь картинку и вспомни сцену.</p><h2>2. Вспомни и сравни</h2><p>Ответь вслух, затем открой ответ. Честно выбери «Верно» или «Не получилось».</p><h2>3. Напиши</h2><p>В конце новой подборки напиши слова. Если забыл — нажми «Не помню». Ошибки можно повторить в словаре.</p><h2>Отдыхай</h2><p>Нажми «Паузу»: место сохранится. В другой день начинай с предложенного повторения. Перед первым занятием попроси взрослого помочь с произношением.</p></div></section>`)}

function escapeName(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function settings(){screen='parents';shell(`<section class="app-screen ios-settings"><div class="topline">${btn('← Главная','home()','quiet')}</div><h1>Настройки</h1><div class="ios-settings-group"><button class="ios-settings-row" onclick="achievements()"><span class="ios-settings-label">Мои достижения<small>Слова, недели и графики</small></span><span class="ios-chevron" aria-hidden="true">›</span></button><button class="ios-settings-row" onclick="profileSettings()"><span class="ios-settings-label">Профиль и данные<small>Имя, аккаунт, сохранение</small></span><span class="ios-chevron" aria-hidden="true">›</span></button><label class="ios-settings-row ios-toggle-row"><span>Звуковые сигналы</span><input id="sound-toggle" type="checkbox" role="switch" onchange="toggleSound()" aria-label="Звуковые сигналы"><span class="ios-switch" aria-hidden="true"></span></label><button class="ios-settings-row" onclick="parents()"><span>Помощь родителю</span><span class="ios-chevron" aria-hidden="true">›</span></button></div></section>`);updateSoundButton()}
function profileSettings(){screen='parents';shell(`<section class="app-screen ios-settings"><div class="topline">${btn('← Настройки','settings()','quiet')}</div><h1>Профиль и данные</h1><div class="ios-settings-group"><button class="ios-settings-row" onclick="editProfileName()"><span>Имя</span><span class="ios-settings-value">${data.profileName?escapeName(data.profileName):'Не указано'} <span class="ios-chevron" aria-hidden="true">›</span></span></button><button class="ios-settings-row" onclick="window.dispatchEvent(new Event('wordscene-open-settings'))"><span>Аккаунт и сохранение</span><span class="ios-chevron" aria-hidden="true">›</span></button></div></section>`)}
function editProfileName(){screen='parents';shell(`<section class="app-screen ios-settings"><div class="topline">${btn('← Профиль','profileSettings()','quiet')}</div><h1>Имя</h1><form class="ios-name-form" onsubmit="event.preventDefault();saveProfileName()"><label for="profile-name">Как тебя зовут?</label><input id="profile-name" type="text" maxlength="25" autocomplete="nickname" placeholder="Твоё имя" value="${escapeName(data.profileName||'')}"><p class="note">Имя можно указать без аккаунта. Оно сохранится на этом устройстве.</p><button class="primary" type="submit">Готово</button></form></section>`)}
function saveProfileName(){const value=$('profile-name')?.value.trim().replace(/\\s+/g,' ').slice(0,25)||'';data.profileName=value;if(save())profileSettings()}

function parents(){screen='parents';shell(`<section class="app-screen"><div class="topline">${btn('← Главная','home()','quiet')}</div><h1 class="page-title">Помощь родителю</h1><div class="prose"><p>Помогите ребёнку с произношением. Начинайте с предложенного повторения. Для отдыха нажмите «Паузу»: место сохранится. Резервные копии доступны в настройках «Аккаунт и сохранение».</p><details><summary>Подробнее о занятиях и статистике</summary><h2>Знакомство с новым словом</h2><p>Ребёнок рассматривает готовую ассоциацию, представляет сцену и в этот момент произносит английское слово три раза. Затем скрывает рисунок и восстанавливает сцену самостоятельно.</p><h2>Отработка пятёрки</h2><p>Сначала вспоминаем с русского на английский, затем обратно. В каждом направлении — минимум три прохода; два последних должны быть без ошибок. Скорость ответа не влияет на число проходов. Если после пяти проходов ещё есть ошибки, можно передохнуть и продолжить с сохранённого места. Это правила тренажёра, а не заявленный норматив автора методики.</p><h2>Повторение</h2><p>За подход берём до 15 знакомых слов и спрашиваем их в обе стороны. После ошибки показываем сцену и возвращаем карточку ещё раз. Дальше можно начать следующий подход. Число подходов не ограничено.</p><p>Приложение само составляет обязательную очередь: недавние ошибки, ежедневное закрепление, затем знакомые слова с наступившей проверкой. Очередь выдаётся порциями до 30 слов. Новые открываются только после неё. Закончить и отдохнуть можно после любой порции или на паузе.</p><h2>Закрепление в разные дни</h2><p>Первое изучение не заменяет завтрашнюю проверку. Нужны семь отдельных дней повторения и два последних дня без ошибок в обе стороны. Потом интервалы растут: 3, 7, 14, 30 дней. Ошибка у знакомого слова возвращает ежедневные проверки до двух дней без ошибок; затем снова начинаем с трёх дней. Пропуски не обнуляют результат. Дополнительное повторение в день изучения предлагается через полчаса и не блокирует новые слова.</p><p>Старые слова и статистика сохранены. Если точной истории по дням раньше не было, учёт начинается с первой новой проверки; прошлые дни не придумываются. Интервалы — правила нашего тренажёра на основе обсуждённого подхода, а не точная авторская схема.</p><h2>Словарь</h2><p>500 слов с историями и иллюстрациями. 364 слова входят в нашу рабочую базу Spotlight 2–4, 124 добавлены из «1000 английских слов», ещё 12 сохранены из первоначального набора. Это подборка для обучения через ассоциации; фразы, особые формы и слова без готовой ассоциации оставлены для следующего этапа.</p><h2>Регулярность</h2><p>День засчитывается после завершённой новой подборки или повторения пяти разных слов в обе стороны, включая возвраты после ошибок. Если изученных слов меньше пяти, достаточно повторить все. Ошибки не мешают засчитать день. Можно заниматься частями. Отметка даётся один раз за календарный день на телефоне. После пропуска текущая серия начинается заново, лучшая серия и общее число дней сохраняются. Учёт регулярности начинается с этой версии, прошлые дни не придумываются.</p><h2>Статистика</h2><p>Каждый оценённый ответ и ошибка сохраняются сразу. Повторение засчитывается отдельно каждому слову после проверки в обе стороны и возврата карточек с ошибками. Незавершённая часть подхода сохраняется. В списке слов показываем статус, число устных ответов и ошибок, и состояние написания: правильно или нужно повторить. Подходы и время из отображения убраны; прежние данные сохранены.</p><p>После открытия ответа ребёнок выбирает «Верно» или «Не получилось». Микрофон не используется. Созвучия приблизительные и не заменяют правильного произношения. После устных проходов новой подборки ребёнок пишет каждое английское слово по русскому переводу. Приложение проверяет ответ и показывает правильное написание. Можно нажать «Не помню». После первого прохода каждое ошибочное слово проверяется ещё два раза. Для снятия отметки ошибки нужны оба правильных ответа. Бесконечных проходов нет; незакреплённые слова доступны для отдельного повторения из словаря. Устные интервалы не меняются. Сохраняются отметка необходимости повторения и последний результат слова: «Правильно», «Неправильно», «Не помню», «Не проверяли». Введённый текст не сохраняется. Результаты двух дополнительных проверок хранятся в текущем занятии. В обычном устном повторении ввод текста не нужен. Отдельный повтор написания доступен из словаря.</p><p>Прогресс хранится в этом браузере. В аккаунте дополнительно создаётся облачная копия; её восстановление на другом устройстве требует выбора взрослого. Старые отметки изученных слов переносятся; недоступную старую статистику не придумываем.</p><p>Независимый тренажёр с ассоциациями и активным вспоминанием по описанию подхода Николая Ягодкина. Готовые истории всё равно нужно представить самостоятельно.</p><p class="note">Новые векторные сцены составлены из объектов Twemoji (Twitter и участники проекта), CC BY 4.0. <a href="./ATTRIBUTION.md">Источники и лицензии</a>.</p></details></div></section>`)}
