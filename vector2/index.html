.hero-footer{bottom:42px;right:23px;background:linear-gradient(110deg,#061a35c5,#1d2553bd);border-color:#91bfff6e}
.cards-grid{position:relative;z-index:2;gap:13px}
.card{border:1px solid #5c83c888;background:radial-gradient(ellipse at 80% -15%,#5365c72e,transparent 55%),radial-gradient(ellipse at 0% 100%,#0066a316,transparent 55%),linear-gradient(145deg,#10294bcc,#091a37f3 50%,#07132cf5);box-shadow:inset 0 1px #ecf7ff23,0 18px 39px #0008,0 0 30px #1c85fe0c;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.card:after{content:'';position:absolute;inset:1px;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 27px #58a7ff0a,inset 0 -10px 27px #020c2377}
.card-body{padding:21px 23px 22px}
.card-heading h2{font-size:24px}
.card-heading h2 .ic{filter:drop-shadow(0 0 7px #26bfff88)}
.go-link{color:#c7dcff}
.today-inner{grid-template-columns:190px minmax(0,1fr);gap:13px}
.ring-wrap{width:183px;height:183px;filter:drop-shadow(0 0 13px #7d54ff2b)}
.ring-svg{filter:drop-shadow(0 0 9px #08ccff33)}
.ring-center .count{font-size:47px;text-shadow:0 0 22px #0fdcf73b}
.ring-center .crown{font-size:24px}
.ring-progress{stroke-dashoffset:0;animation:shineIn .85s cubic-bezier(.2,.85,.3,1) both}
@keyframes shineIn{from{opacity:.3;stroke-dashoffset:16}to{opacity:1;stroke-dashoffset:0}}
.task-row{background:linear-gradient(90deg,#0a2343dd,#0b1b3bdd);border-color:#2747718e;border-radius:12px;min-height:41px}
.task-toggle{width:28px;height:28px;border:2px solid #6c92cd;border-radius:9px}
.task-toggle.checked{background:linear-gradient(135deg,#43efbb,#13c69b);box-shadow:0 0 17px #0cf6bd64}
.task-name{font-size:13px}
.add-task{color:#79eafa}
.school{overflow:hidden}
.school-main{margin:6px 0 9px}
.school-value{font-size:61px;text-shadow:0 0 18px #3ca5ff28}
.school-rise{color:#22ffbe;filter:drop-shadow(0 0 8px #00ffaa66)}
.grade-bars{height:161px;gap:8px}
.grade-well{width:min(64px,100%);height:96px;border-radius:15px 15px 10px 10px;background:linear-gradient(180deg,#2340788c,#101f438c);box-shadow:inset 0 1px #8eb6ff20}
.grade-stick{border-radius:11px 11px 6px 6px;background:linear-gradient(180deg,#1bf4ff 0%,#2aabff 45%,#9c56ff 100%);box-shadow:0 0 20px #287aff50,inset 0 1px #f5ffff92}
.grade-unit:nth-child(2) .grade-stick{background:linear-gradient(180deg,#6ebeff,#5269ff)}
.grade-unit:nth-child(5) .grade-stick{background:linear-gradient(180deg,#fb7efc,#9a51ff);box-shadow:0 0 18px #d44dff70}
.grade-unit strong{font-size:17px}
.goal-card{min-height:244px;background:linear-gradient(90deg,#0b1c3df2 0%,#091833ec 50%,#121545a5 100%)}

/* V0.4 polish: preserve the approved Saint Petersburg hero and functional layout. */
:root{--panel-lift:#122a50;--panel-edge:#5b8bd0;--label:#cee0fa}
.card{border-color:#628ad2a3;box-shadow:0 20px 45px #0007,inset 0 1px #f1f8ff2b,0 0 35px #186fff10}
.card:before{left:6%;right:6%;height:1px;background:linear-gradient(90deg,transparent,#77e9ff7d 36%,#a57fff66 78%,transparent)}
.card-heading{position:relative;z-index:2}
.card-heading h2{font-weight:835;text-shadow:0 2px 13px #10244d55}
.go-link{padding:7px 4px 7px 10px;border-radius:9px;transition:background .18s,color .18s,transform .18s}
.go-link:hover{background:#173657a8;transform:translateX(2px)}
.task-row{border:1px solid #31547cba;background:linear-gradient(90deg,#0b2948e8,#0a1835dc);min-height:42px;box-shadow:inset 0 1px #7699c316}
.task-row:has(.task-toggle.checked){background:linear-gradient(90deg,#0b3447cf,#0a263a99);border-color:#1a716f78}
.task-row:focus-within{border-color:#46ccf1}
.task-toggle{border-radius:9px;box-shadow:inset 0 1px #9fb8e62c}
.task-toggle:focus-visible{outline-offset:3px}
.task-toggle.checked .ic{filter:drop-shadow(0 0 4px #dcfffbbd)}
.task-name{color:#f0f6ff;letter-spacing:.02px;font-weight:530}
.task-name.done{color:#b8e5db}
.task-time{color:#bfd0ee}
.add-task{padding:9px 14px;margin:11px 0 0 auto;border-radius:12px;border:1px solid #27648b88;background:linear-gradient(110deg,#0a3c62ab,#1a2458a8);font-size:12px;box-shadow:inset 0 1px #8ddfff16;transition:background .2s,box-shadow .2s,transform .2s}
.add-task:hover{background:linear-gradient(115deg,#0d5e8d,#303379);box-shadow:0 0 19px #19aaf936;transform:translateY(-1px)}
.ring-wrap:after{content:"";position:absolute;inset:29%;border-radius:50%;z-index:-1;background:radial-gradient(circle,#19376888,transparent 70%);filter:blur(10px)}
.ring-center .count{line-height:1.08}
.ring-center .count span{filter:drop-shadow(0 0 8px #26d8ed6e)}
.today .ring-wrap{transform:translateZ(0)}
.school-caption{color:#c1d9fa;font-size:13px}
.school-value{font-weight:865;letter-spacing:-2.8px;background:linear-gradient(180deg,#fff,#d7e8ff);color:transparent;background-clip:text;-webkit-background-clip:text}
.school-rise{display:inline-flex;align-items:center;padding:5px 9px;border:1px solid #1cae8377;border-radius:99px;background:#064d4261;font-size:13px;letter-spacing:.15px}
.grade-well{position:relative;overflow:visible;background:linear-gradient(180deg,#1d3d6ca0,#13234380)}
.grade-well:after{content:"";position:absolute;bottom:0;left:15%;right:15%;height:22px;background:#19bfff3d;filter:blur(13px);z-index:0}
.grade-stick{z-index:1;position:relative;box-shadow:0 0 20px #26aaff70,inset 0 1px 1px #ffffffa3,inset 0 -3px 8px #29164c88}
.grade-stick:before{content:"";position:absolute;inset:1px 35% auto 18%;height:52%;border-radius:10px;background:linear-gradient(#ffffffe0,transparent);opacity:.2;filter:blur(4px)}
.grade-unit strong{font-weight:810}
.grade-unit small{color:#afc5e6}
.goal-card{border-color:#6c80d4ab;background:linear-gradient(115deg,#081d3bf9,#0a1539d9 72%,#101b3eca)}
.goal-art{background-position:right center;background-size:cover;filter:saturate(1.22) contrast(1.07);opacity:.82;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.goal-card .card-body{background:linear-gradient(90deg,#081c3900 45%,#030f2561 100%)}
.goal-copy{position:relative;z-index:2}
.goal-description{color:#c2d8f5;font-size:13px}
.progress-track{height:15px;background:linear-gradient(180deg,#132e58,#162448);border:1px solid #39518066;box-shadow:inset 0 3px 8px #020c1fcc}
.progress-fill{position:relative;width:50%;background:linear-gradient(90deg,#16eeea,#258dfc 53%,#ce68f6);box-shadow:0 0 17px #4c97fe86,inset 0 1px #ffffff88;transition:width .5s ease}
.progress-fill:after{content:"";position:absolute;inset:1px auto auto 8%;width:52%;height:3px;background:#f4feff73;filter:blur(2px);border-radius:8px}
.goal-progress b{font-size:18px;text-shadow:0 2px 8px #101d5696}
.step-chip{color:#cce0fd;font-size:11px;font-weight:550}
.step-chip:not(.complete) i{color:#a0b7dc;background:#10284c9c}
.bottom-button{transition:color .2s,transform .2s}
.bottom-button:active{transform:scale(.95)}
.bottom-button.active:before{content:"";position:absolute;inset:-6px 14% 10px;border-radius:16px;background:radial-gradient(ellipse at top,#097ded42,transparent 70%);z-index:-1;pointer-events:none}
.nav-button.active{border-color:#4381bfa9;box-shadow:inset 3px 0 #22e8fa,0 10px 26px #0054a928,inset 0 1px #80baff32}
.modal{border-color:#66a4e0;box-shadow:0 30px 85px #000b,0 0 35px #0b92ff1c}
.modal input:focus{outline:2px solid #28ccfb;outline-offset:1px}
.primary-btn{transition:transform .2s,filter .2s}
.primary-btn:hover{transform:translateY(-1px);filter:brightness(1.09)}
@media(max-width:680px){
 .card-heading h2{font-size:22px}
 .card-body{padding:16px 15px 18px}
 .task-row{min-height:39px}
 .task-name{font-size:11.5px;line-height:1.27}
 .task-time{font-size:10px}
 .add-task{font-size:11px;min-height:35px;padding:7px 12px}
 .school-rise{font-size:12px;padding:4px 8px}
 .grade-well{box-shadow:inset 0 1px #6c8cf447,0 4px 15px #05193377}
 .goal-title{font-size:23px}
 .goal-art{width:82%;background-position:70% center;opacity:.72}
 .goal-progress{position:relative;z-index:2}
 .goal-steps{position:relative;z-index:2}
 .step-chip{font-size:10px}
 .hero{margin-bottom:-28px}
}
@media(max-width:382px){
 .card-body{padding:14px 12px 16px}
 .task-row{padding:4px 4px;gap:5px;min-height:38px}
 .task-name{font-size:10.4px}
 .task-time{font-size:9px}
 .task-toggle{width:24px;height:24px}
 .add-task{font-size:10.5px;padding:6px 9px}
 .grade-well{padding-left:4px;padding-right:4px}
 .step-chip{font-size:9px}
}
@media(prefers-reduced-motion:reduce){.progress-fill,.go-link,.add-task,.bottom-button,.primary-btn{transition:none!important}}
</style></head><body>
<div class="shell"><aside class="sidebar"><div class="brand"><svg class="brand-mark" viewBox="0 0 60 60"><defs><linearGradient id="logo" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#12eafe"/><stop offset=".52" stop-color="#477aff"/><stop offset="1" stop-color="#d552ef"/></linearGradient></defs><path d="M8 17L30 47L50 10M41 10H50V19" fill="none" stroke="url(#logo)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>ВЕКТОР</span></div><div class="sidebar-sub">ТВОЙ ДЕНЬ<br>ТВОИ ПРАВИЛА<br>ТВОИ БОЛЬШИЕ ЦЕЛИ</div><nav class="side-nav" id="sideNav" aria-label="Меню"></nav><div class="sidebar-bottom"><div class="overline">ТВОЙ МАРШРУТ</div><strong>Больше, чем вчера.</strong><p>Большие результаты начинаются с небольших шагов.</p></div></aside>
<main class="workspace"><header class="topbar"><div class="mobile-brand brand"><svg class="brand-mark" viewBox="0 0 60 60"><path d="M8 17L30 47L50 10M41 10H50V19" fill="none" stroke="#42c5ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>ВЕКТОР</div><div class="chip-date" id="date-chip"></div><div class="top-right"><button class="round-button" id="notify" aria-label="Уведомления"><span class="red-dot"></span><svg class="ic" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 9h18c0-1-3-2-3-9M10 21h4"/></svg></button><button class="avatar" id="avatar" aria-label="Профиль">М</button></div></header><div class="stack" id="view"></div></main></div><nav class="bottom-nav" id="bottomNav" aria-label="Основные разделы"></nav>
<div class="modal-back" id="modalBack" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">Новая задача</h2><p>Один шаг сегодня — ближе к большой цели.</p><form id="taskForm"><label for="taskTitle">Что нужно сделать?</label><input id="taskTitle" placeholder="Например, повторить английский" maxlength="90" required><label for="taskTime">Время (необязательно)</label><input id="taskTime" type="time"><div class="modal-actions"><button type="button" class="quiet-btn" id="cancelTask">Отмена</button><button class="primary-btn" type="submit">Добавить</button></div></form></section></div><div class="toast" id="toast" role="status"></div>
<script>
const icons={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>',cap:'<path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v6c3.8 3.7 8.2 3.7 12 0v-6M22 9v9"/>',target:'<circle cx="11" cy="13" r="9"/><circle cx="11" cy="13" r="5"/><circle cx="11" cy="13" r="1"/><path d="m13 11 8-8"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-7 16-7 16 0"/>',chev:'<path d="m9 5 7 7-7 7"/>',check:'<path d="m5 12 5 5 9-10"/>',plus:'<path d="M12 5v14M5 12h14"/>',spark:'<path d="m4 20 16-16m-9 0h9v9"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',rocket:'<path d="M14 3c4 0 7 3 7 7-3 4-8 8-13 8l-2-2c0-5 4-10 8-13zM9 18l-3 3-1-4-4-1 3-3"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 9h18c0-1-3-2-3-9M10 21h4"/>'};
function icon(name){return `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.spark}</svg>`}
const items=[['home','Главная','home'],['plan','План','calendar'],['study','Учёба','cap'],['goals','Цели','target'],['profile','Профиль','user']];
const defaults=[{id:'t1',title:'Математика (домашняя)',time:'15:00',done:true},{id:'t2',title:'Тренировка (футбол)',time:'18:00',done:true},{id:'t3',title:'Английский (слова)',time:'20:00',done:true},{id:'t4',title:'Прочитать книгу',time:'',done:false},{id:'t5',title:'Разобрать рюкзак',time:'',done:false}];
const storageKey='vector2_design_v02';let data={tasks:defaults.map(x=>({...x}))};try{const saved=JSON.parse(localStorage.getItem(storageKey));if(saved&&Array.isArray(saved.tasks))data=saved}catch(e){}let tab='home';let toastTimer;
function save(){try{localStorage.setItem(storageKey,JSON.stringify(data))}catch(e){toast('Нет доступа к локальному хранилищу')}}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function taskRow(t){return `<li class="task-row"><button class="task-toggle ${t.done?'checked':''}" data-toggle="${escapeHtml(t.id)}" aria-label="${t.done?'Снять отметку':'Отметить выполнение'}: ${escapeHtml(t.title)}">${t.done?icon('check'):''}</button><span class="task-name ${t.done?'done':''}">${escapeHtml(t.title)}</span><span class="task-time">${t.time?'до '+escapeHtml(t.time):'—'}</span></li>`}
function ring(){const done=data.tasks.filter(t=>t.done).length,total=data.tasks.length,p=total?done/total:0,C=502.65;return `<div class="ring-wrap" role="group" aria-label="Прогресс задач"><svg class="ring-svg" viewBox="0 0 200 200" aria-label="Выполнено ${done} из ${total}"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16edfa"/><stop offset=".47" stop-color="#319fff"/><stop offset=".81" stop-color="#765aff"/><stop offset="1" stop-color="#e365f6"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4"/></filter></defs><circle cx="100" cy="100" r="80" fill="none" stroke="#234364" stroke-width="17"/><circle cx="100" cy="100" r="80" fill="none" stroke="#294f7c" stroke-width="13" stroke-dasharray="${C*.42} ${C*.02} ${C*.24} ${C*.02} ${C*.27}" transform="rotate(-90 100 100)" opacity=".72"/><circle cx="100" cy="100" r="80" fill="none" stroke="#30b8ff" stroke-width="23" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 100 100)" opacity=".38" filter="url(#glow)"/><circle cx="100" cy="100" r="80" fill="none" class="ring-progress" stroke="url(#ringGrad)" stroke-width="17" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 100 100)"/><path d="m12 49 2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#51dffc"/><path d="m174 142 2 3 3 2-3 2-2 3-2-3-3-2 3-2z" fill="#67abff"/></svg><div class="ring-center"><span class="crown">♛</span><div class="count"><span>${done}</span>/${total}</div><small>задач<br>сделано</small></div></div>`}
function todayCard(){return `<section class="card today"><div class="card-body"><div class="card-heading"><h2>Мой день</h2><button class="go-link" data-go="plan">Все задачи ${icon('chev')}</button></div><div class="today-inner">${ring()}<div><ul class="task-list">${data.tasks.slice(0,5).map(taskRow).join('')}</ul><button class="add-task" data-add>${icon('plus')} Добавить задачу</button></div></div></div></section>`}
function schoolCard(){const g=[4.8,4.5,4.2,4.7,4.6],labels=['Мат','Рус','Англ','Ист','Инф'];return `<section class="card school"><div class="card-body"><div class="card-heading"><h2>${icon('cap')}Школа</h2><button class="go-link" data-go="study">Все предметы ${icon('chev')}</button></div><div class="school-caption">Средний балл за 2 четверть</div><div class="school-main"><strong class="school-value">4.6</strong><b class="school-rise">↗ +0.3</b></div><div class="grade-bars" role="img" aria-label="Оценки по предметам: математика 4,8; русский 4,5; английский 4,2; история 4,7; информатика 4,6">${g.map((v,i)=>`<div class="grade-unit"><div class="grade-well"><span class="grade-stick" style="--fill:${Math.round((v-3)/2*100)}%"></span></div><strong>${v.toFixed(1)}</strong><small>${labels[i]}</small></div>`).join('')}</div></div></section>`}
function goalCard(){return `<section class="card goal-card"><div class="goal-art" aria-hidden="true"></div><div class="card-body"><div class="card-heading"><h2>${icon('target')}Моя цель</h2><button class="go-link" data-go="goals">Все цели ${icon('chev')}</button></div><div class="goal-copy"><h3 class="goal-title">Поступить в IT-вуз</h3><p class="goal-description">Следующий этап — создать портфолио проектов.</p></div><div class="goal-progress"><div class="progress-track" role="progressbar" aria-label="Этапы цели" aria-valuemin="0" aria-valuemax="4" aria-valuenow="2"><div class="progress-fill"></div></div><b>50%</b></div><div class="goal-steps"><span class="step-chip complete"><i>✓</i> Выбрать направление</span><span class="step-chip complete"><i>✓</i> Английский B2</span><span class="step-chip"><i>○</i> Портфолио</span><span class="step-chip"><i>○</i> Экзамены</span></div></div></section>`}
function mainPage(){return `<section class="hero cinematic-hero" aria-label="Ночной Петербург — иллюстрация и интерфейс"><div class="hero-art" aria-hidden="true"></div><div class="hero-frame" aria-hidden="true"></div><div class="hero-foreground" aria-hidden="true"></div><div class="hero-eyebrow">ТВОЙ ДЕНЬ · ТВОИ ПРАВИЛА</div><h1 class="hero-title">Привет,<br><span class="gradient-word">Матвей!</span></h1><p class="hero-sub">Сегодня ещё один шаг<br>к большим целям.</p><div class="hero-slogan">БОЛЬШЕ<br><b>ЧЕМ ВЧЕРА</b></div><span class="hero-city">САНКТ-ПЕТЕРБУРГ · ТВОЙ МАРШРУТ</span><div class="hero-footer">${icon('spark')}<div><strong>Большие цели начинаются сегодня</strong><small>Твоя история. Твой выбор.</small></div></div></section><div class="cards-grid">${todayCard()}${schoolCard()}</div>${goalCard()}<div class="prototype-footer">ВЕКТОР 2.0 · ДИЗАЙН V0.4 · ОЦЕНКИ И ЦЕЛЬ ПОКА ДЕМОНСТРАЦИОННЫЕ</div>`}
function secondary(){if(tab==='plan'){const done=data.tasks.filter(t=>t.done).length;return `<section class="card secondary"><h1>План на сегодня</h1><p>Задачи работают в демонстрационном режиме. После утверждения главного экрана отдельно спроектируем планирование недели.</p><div class="secondary-stats"><div class="info-tile"><span class="muted">Выполнено</span><strong>${done}/${data.tasks.length}</strong><span class="muted">задач</span></div><div class="info-tile"><span class="muted">Осталось</span><strong>${data.tasks.length-done}</strong><span class="muted">задач</span></div></div><ul class="task-list">${data.tasks.map(taskRow).join('')}</ul><button class="primary-btn" data-add>+ Добавить задачу</button></section>`}
const info={study:['Учёба','Оценки пока представлены демонстрационными значениями. Позже перенесём данные из действующего «Вектора».','4.6','Средний балл','5','Предметов'],goals:['Мои цели','Этот раздел получит отдельный дизайн после согласования главного экрана. Цель и этапы пока демонстрационные.','50%','Прогресс цели','4','Этапа'],profile:['Профиль Матвея','Это независимый дизайн-прототип. Настоящие школьные данные и аккаунт не подключены.','0.4','Версия дизайна','Локально','Хранение задач']};const z=info[tab]||info.profile;return `<section class="card secondary"><h1>${z[0]}</h1><p>${z[1]}</p><div class="secondary-stats"><div class="info-tile"><span class="muted">${z[3]}</span><strong>${z[2]}</strong></div><div class="info-tile"><span class="muted">${z[5]}</span><strong>${z[4]}</strong></div></div><button class="primary-btn" style="margin-top:24px" data-go="home">На главную</button></section>`}
function navigation(){document.getElementById('sideNav').innerHTML=items.map(([id,label,ic])=>`<button class="nav-button ${tab===id?'active':''}" data-go="${id}" ${tab===id?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('');document.getElementById('bottomNav').innerHTML=items.map(([id,label,ic])=>`<button class="bottom-button ${tab===id?'active':''}" data-go="${id}" ${tab===id?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('')}
function render(){navigation();document.getElementById('view').innerHTML=tab==='home'?mainPage():secondary();const d=new Date();document.getElementById('date-chip').textContent=d.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'})}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function openModal(){const el=document.getElementById('modalBack');el.classList.add('open');el.setAttribute('aria-hidden','false');setTimeout(()=>document.getElementById('taskTitle').focus(),0)}
function closeModal(){const el=document.getElementById('modalBack');el.classList.remove('open');el.setAttribute('aria-hidden','true');document.getElementById('taskForm').reset()}
document.addEventListener('click',e=>{const n=e.target.closest('[data-go]');if(n){tab=n.dataset.go;render();window.scrollTo({top:0,behavior:'smooth'});return}const t=e.target.closest('[data-toggle]');if(t){const item=data.tasks.find(x=>x.id===t.dataset.toggle);if(item){item.done=!item.done;save();render();toast(item.done?'Задача выполнена · ещё один шаг!':'Отметка снята')}return}if(e.target.closest('[data-add]'))openModal()});document.getElementById('avatar').addEventListener('click',()=>{tab='profile';render()});document.getElementById('notify').addEventListener('click',()=>toast('Уведомления будут в следующей версии'));document.getElementById('cancelTask').addEventListener('click',closeModal);document.getElementById('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.getElementById('taskForm').addEventListener('submit',e=>{e.preventDefault();const title=document.getElementById('taskTitle').value.trim();const time=document.getElementById('taskTime').value;if(!title)return;data.tasks.unshift({id:`task${Date.now()}`,title,time,done:false});save();closeModal();render();toast('Задача добавлена')});render();
</script></body></html>
