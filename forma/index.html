<body>
<div class="shell"><header class="top"><div class="brand"><div class="mark">F.</div><div><div class="eyebrow">ПЕРСОНАЛЬНЫЙ ТРЕКЕР</div><h1>Форма</h1></div></div><div class="date" id="topDate"></div></header><main id="main"></main></div>
<div class="nav"><div class="navinner" id="nav"></div></div><div id="toast" class="toast hidden" role="status"></div><input type="file" id="importFile" accept="application/json,.json" class="hidden">
<script>
'use strict';
const DB_KEY='forma12_v1';
const DAY_LABEL={A:'А',B:'Б',V:'В',G:'Г'};
const CUES={
 pull:{name:'Подтягивания на турнике',cue:'Тяни локти вниз, к рёбрам и тазу — не подбородок к перекладине.',tech:'Комфортный хват, корпус устойчив, без раскачивания. Плавное опускание.',avoid:'Рывки ногами, плечи у ушей, «половинки».',rest:180},
 row:{name:'Тяга резинки к поясу',cue:'Локти уходят назад, кисти — крючки.',tech:'Зафиксируй петлю безопасно. Тяни к нижним рёбрам без раскачивания корпуса.',avoid:'Резкое отпускание резинки, вытягивание шеи.',rest:100},
 aussie:{name:'Австралийские подтягивания',cue:'Подтягиваю грудную клетку к перекладине как единое целое.',tech:'Корпус прямой, стопы устойчивы, контролируемое опускание.',avoid:'Провисание таза, рывок подбородком.',rest:100},
 push:{name:'Обычные отжимания',cue:'Отталкиваю пол от себя.',tech:'Ладони немного шире плеч, устойчивый корпус, локти под 30–60° к нему.',avoid:'Провисание поясницы, неполная амплитуда.',rest:120},
 bulgar:{name:'Болгарские приседания',cue:'Передней стопой продавливаю землю вниз.',tech:'Задняя стопа на устойчивой опоре, передняя нога несёт основную нагрузку.',avoid:'Толчок задней ногой, колено заваливается внутрь.',rest:120},
 lateral:{name:'Махи в стороны с резинкой',cue:'Локти тянутся в стороны — делаю плечи шире.',tech:'Небольшое сгибание локтей, подъём примерно до уровня плеч.',avoid:'Пожимание плечами, рывки корпусом.',rest:75},
 decline:{name:'Отжимания с ногами на возвышении',cue:'Корпус — жёсткая доска, отталкиваю пол.',tech:'Устойчивая опора примерно 20–30 см, поясница не провисает.',avoid:'Слишком высокая опора, запрокинутая голова.',rest:120},
 squat:{name:'Приседания с резинкой',cue:'Отталкиваю от себя землю всей стопой.',tech:'Петля расположена безопасно, колени следуют за носками.',avoid:'Отрыв пяток, чрезмерный наклон из-за натяжения.',rest:120},
 rdl:{name:'Румынская тяга с резинкой',cue:'Закрываю ягодицами дверь позади себя.',tech:'Колени слегка согнуты, отводи таз назад, удерживай стабильную спину.',avoid:'Округление спины, превращение тяги в присед.',rest:120},
 bridge:{name:'Ягодичный мост',cue:'Продавливаю землю стопами и поднимаю таз ягодицами.',tech:'Стопы на полу, поднимай таз без избыточного прогиба поясницы.',avoid:'Рывки, выгибание поясницы.',rest:90},
 narrow:{name:'Узкие отжимания',cue:'Разгибаю руки, локти движутся вдоль корпуса.',tech:'Ладони на ширине плеч или немного уже, контролируй опускание.',avoid:'Слишком узкие ладони и неудобный изгиб кистей.',rest:120},
 dips:{name:'Отжимания на брусьях',cue:'Продавливаю брусья вниз.',tech:'Устойчивый корпус, комфортная для плеч глубина, без рывка.',avoid:'Провал плеч и болезненно глубокое опускание.',rest:150},
 face:{name:'Face pull с резинкой',cue:'Развожу кисти по сторонам головы.',tech:'Надёжное крепление на уровне лица, тяни к вискам.',avoid:'Пожимание плечами и движение головой к резинке.',rest:75},
 biceps:{name:'Сгибания на бицепс с резинкой',cue:'Сгибаю локоть, а корпус неподвижен.',tech:'Локти возле корпуса, поднимай без раскачивания.',avoid:'Подбрасывание резинки спиной.',rest:75},
 triceps:{name:'Разгибания на трицепс с резинкой',cue:'Двигается предплечье, плечо остаётся на месте.',tech:'Безопасно закрепи резинку, выпрямляй руки за счёт трицепса.',avoid:'Движение всем плечом, рывки.',rest:75},
 ball:{name:'Сгибания ног с фитболом',cue:'Подтягиваю мяч пятками, удерживая таз.',tech:'Пятки на мяче, таз приподнят, сгибай колени под контролем.',avoid:'Провисание таза и болевой прогиб поясницы.',rest:90}
};
// 'perLeg' means one saved set represents the indicated repetitions FOR EACH leg.
const PROGRAM={
 A:{label:'А',title:'Ширина спины + грудь',where:'Турник → домой',summary:'Широчайшие, грудь, ноги, средние дельты',items:[['pull',5,4,6],['row',3,10,20,'aussie',8,15],['push',3,8,15],['bulgar',3,8,12,null,null,null,true],['lateral',3,12,20]]},
 B:{label:'Б',title:'Ноги + задняя цепь',where:'Дома',summary:'Ноги, ягодичные, грудь, верх спины',items:[['decline',3,8,15],['squat',3,10,20],['rdl',3,10,15],['row',3,10,20,'aussie',8,15],['bridge',2,12,20]]},
 V:{label:'В',title:'Спина + плечи + трицепс',where:'Турник → домой',summary:'Второй стимул для широчайших, плеч и груди',items:[['pull',3,4,5],['narrow',3,8,15,'dips',6,12],['bulgar',3,8,12,null,null,null,true],['face',3,12,20],['lateral',3,12,20]]},
 G:{label:'Г',title:'Дополнительная',where:'Дома · по желанию',summary:'Руки, плечи, задняя поверхность бедра',items:[['lateral',2,12,20],['biceps',2,10,20],['triceps',2,10,20],['ball',2,10,15]]}
};
const ICONS={today:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',history:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h3M8 18h5"/>',progress:'<path d="M4 20V12M10 20V7M16 20V10M22 20V3"/>',settings:'<path d="M12 3v3M12 18v3M4.2 7.5l2.6 1.5M17.2 15l2.6 1.5M4.2 16.5 6.8 15M17.2 9l2.6-1.5"/><circle cx="12" cy="12" r="4"/>'};
const EMPTY=()=>({version:1,createdAt:new Date().toISOString(),sessions:[],measures:[],ofpDays:[],active:null});
let db=load();
let ui={tab:'today',chosen:'A',goodWeather:false,chart:'abdomen',showSession:null,drafts:{},toastTimer:null};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function load(){try{let x=JSON.parse(localStorage.getItem(DB_KEY)||'null');if(x&&Array.isArray(x.sessions)&&Array.isArray(x.measures))return {...EMPTY(),...x};}catch(e){}return EMPTY();}
function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(db));return true}catch(e){notify('Не удалось сохранить данные. Экспортируй резервную копию.');return false}}
function nowISO(){return new Date().toISOString()}
function dayKey(t=new Date()){const d=new Date(t);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dateFmt(x,opts={day:'numeric',month:'short'}){return new Date(x).toLocaleDateString('ru-RU',opts)}
function timeFmt(x){return new Date(x).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function hhmm(x){return new Date(x).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function dur(ms){let s=Math.max(0,Math.floor(ms/1000));let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h?`${h} ч ${String(m).padStart(2,'0')} мин`:`${m}:${String(sec).padStart(2,'0')}`}
function exercises(workout,mode){return PROGRAM[workout].items.map((a,i)=>{const [id,n,min,max,replace,rMin,rMax,perLeg]=a;const variant=(mode==='outdoor'&&replace)?replace:id;return {slot:i,id:variant,name:CUES[variant].name,sets:n,min:variant===replace?rMin:min,max:variant===replace?rMax:max,rest:CUES[variant].rest,perLeg:!!perLeg}})}
function nextWorkout(){const arr=db.sessions.filter(s=>s.workout!=='G').sort((a,b)=>Date.parse(a.endedAt)-Date.parse(b.endedAt));const last=arr.at(-1)?.workout;return last==='A'?'B':last==='B'?'V':'A'}
function weekNum(){if(!db.sessions.length && !db.active)return 1;const first=[...db.sessions.map(s=>s.startedAt),db.active?.startedAt].filter(Boolean).sort()[0];return Math.max(1,Math.min(99,Math.floor((new Date()-new Date(first))/604800000)+1))}
function weeklyCount(){const now=new Date(),monday=new Date(now);const weekday=(now.getDay()+6)%7;monday.setHours(0,0,0,0);monday.setDate(now.getDate()-weekday);return db.sessions.filter(s=>new Date(s.startedAt)>=monday&&s.workout!=='G').length}
function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(ui.toastTimer);ui.toastTimer=setTimeout(()=>el.classList.add('hidden'),3300)}
function setTab(t){ui.tab=t;ui.showSession=null;render();scrollTo({top:0,behavior:'instant'})}
function navHTML(){const tabs=[['today','Тренировка'],['history','История'],['progress','Прогресс'],['settings','Данные']];return tabs.map(([id,title])=>`<button data-action="tab" data-val="${id}" class="${ui.tab===id?'active':''}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[id]}</svg>${title}</button>`).join('')}
function render(){document.getElementById('topDate').innerHTML=`${dateFmt(new Date(),{weekday:'long'})}<br>${dateFmt(new Date(),{day:'numeric',month:'long',year:'numeric'})}`;document.getElementById('nav').innerHTML=navHTML();document.getElementById('main').innerHTML=ui.tab==='today'?renderToday():ui.tab==='history'?renderHistory():ui.tab==='progress'?renderProgress():renderSettings();updateClock()}
function renderToday(){if(db.active)return renderActive();const chosen=PROGRAM[ui.chosen];const items=exercises(ui.chosen,ui.goodWeather?'outdoor':'home');return `<section class="card hero"><div class="eyebrow">НЕДЕЛЯ ${weekNum()} ИЗ 12 · ${weeklyCount()}/3 ОСНОВНЫХ</div><h2>Сильнее.<br>Шире. Собраннее.</h2><p>Три основные тренировки в неделю. Отмечай подходы — время и прогресс сохраняются автоматически.</p><span class="pill dark">Следующая по циклу: ${DAY_LABEL[nextWorkout()]}</span></section>
<div class="section">Выбери тренировку<small>А → Б → В. Г — по желанию, начиная примерно с 5-й недели.</small></div><div class="workouts">${Object.keys(PROGRAM).map(id=>`<button class="workout-tile ${ui.chosen===id?'selected':''}" data-action="choose" data-val="${id}"><div class="letter">${PROGRAM[id].label}</div><b>${esc(PROGRAM[id].title)}</b><div class="name">${esc(PROGRAM[id].where)}</div></button>`).join('')}</div>
<div class="card" style="margin-top:13px"><div class="flex"><div><div class="eyebrow">ПЛАН ${chosen.label}</div><h2 style="font-size:20px;margin:6px 0 5px">${chosen.title}</h2><div class="caption">${chosen.summary}</div></div><span class="pill">${items.length} упражнений</span></div>${ui.chosen!=='G'?`<div class="switchrow"><label class="switch"><input id="outdoor" type="checkbox" ${ui.goodWeather?'checked':''}><span class="knob"></span></label><div><strong>Хорошая погода</strong><div class="muted">Использовать брусья и низкую перекладину, где предусмотрено</div></div></div>`:''}<div class="line" style="margin:1px 0 8px"></div>${items.map((e,i)=>`<div class="plan-row"><div class="no">${i+1}</div><div class="plan-details"><b>${esc(e.name)}</b><div class="caption">${esc(CUES[e.id].cue)}</div></div><div class="count">${e.sets}×${e.min===e.max?e.min:e.min+'–'+e.max}${e.perLeg?' / н':''}</div></div>`).join('')}<button class="btn primary full" data-action="start" style="margin-top:14px">Начать тренировку ${chosen.label} →</button><p class="caption">Время начала фиксируется по кнопке. Время первого подхода — при первой отметке. Каждый подход получает собственную временную метку.</p></div>${renderOfp()}`}
function renderOfp(){const today=dayKey();const done=db.ofpDays.includes(today);return `<div class="card soft"><div class="checkrow"><div class="circlecheck">${done?'✓':'＋'}</div><div style="flex:1"><b>Ежедневная ОФП</b><div class="caption">Шея, изометрия в 4 направлениях, лопатки, bird dog / dead bug · 7–10 минут</div></div><button class="btn small ${done?'light':'primary'}" data-action="ofp">${done?'Готово':'Отметить'}</button></div><details class="how"><summary>Показать комплекс ▾</summary><p>1. Chin tuck — 8–10×3 сек.<br>2. Изометрия: лоб, затылок, вправо, влево — по 3×5 сек. с лёгким усилием (20–30%).<br>3. Контроль лопаток — 10 раз.<br>4. Bird dog и dead bug чередуются по дням — 2×6–8 на сторону.<br><strong>Остановись, если появляются боль, онемение или головокружение.</strong></p></details></div>`}
function start(){if(db.active)return notify('Сначала заверши текущую тренировку');db.active={id:'s_'+Date.now(),workout:ui.chosen,mode:ui.goodWeather?'outdoor':'home',startedAt:nowISO(),exercises:exercises(ui.chosen,ui.goodWeather?'outdoor':'home'),logs:[],note:'',rest:null};ui.drafts={};save();render();notify('Тренировка началась. Удачи!')}
function lastSetSuggestion(e,setIndex){const x=db.sessions.slice().reverse().find(s=>s.workout===db.active.workout&&s.logs?.some(z=>z.exId===e.id&&z.slot===e.slot&&z.setNumber===setIndex+1));const r=x?.logs.find(z=>z.exId===e.id&&z.slot===e.slot&&z.setNumber===setIndex+1)?.reps;return typeof r==='number'?r:e.min}
function renderActive(){const s=db.active;const all=s.exercises.reduce((n,e)=>n+e.sets,0),completed=s.logs.length,first=s.logs[0]?.loggedAt;return `<div class="card session-head"><div class="flex"><span class="pill">ИДЁТ ТРЕНИРОВКА ${PROGRAM[s.workout].label}</span><span class="tiny muted" id="clock-live">0:00</span></div><h2>${PROGRAM[s.workout].title}</h2><div class="tiny muted">Начало: ${timeFmt(s.startedAt)} ${first?` · Первая отметка: ${timeFmt(first)}`:''}</div><div class="progress-track" style="margin-top:17px;background:#315148"><div style="width:${Math.round(completed/all*100)}%;background:#8fdbc0"></div></div><div class="tiny muted" style="margin-top:7px">${completed} из ${all} подходов завершено</div></div><div id="restArea">${restHTML(s)}</div><h2 class="section">Подходы <small>Нажимай «Записать» сразу после завершения каждого подхода.</small></h2>${s.exercises.map(e=>renderExercise(e,s)).join('')}<div class="card"><div class="field"><label for="note">Заметка к тренировке (необязательно)</label><textarea id="note" placeholder="Например: хорошая техника, тяжёлая резинка, дискомфорт...">${esc(s.note||'')}</textarea></div><div class="buttons"><button class="btn primary full" data-action="finish">Завершить тренировку · ${completed}/${all}</button><button class="btn ghost danger full" data-action="discard">Отменить тренировку без сохранения</button></div></div>`}
function restHTML(s){const r=s.rest;if(!r||Date.now()>=r.until)return '';return `<div class="timer"><div><div class="eyebrow">ОТДЫХ ПОСЛЕ ПОДХОДА</div><div class="digits" id="rest-count">${dur(r.until-Date.now())}</div><div class="caption">Рекомендуемый отдых · ${Math.round(r.duration/60*10)/10} мин</div></div><div class="buttons" style="margin:0;justify-content:flex-end"><button class="btn small" data-action="more-rest">+30 с</button><button class="btn small light" data-action="skip-rest">Готов</button></div></div>`}
function renderExercise(e,s){const logs=s.logs.filter(x=>x.slot===e.slot),done=logs.length>=e.sets,draft=ui.drafts[e.slot]??lastSetSuggestion(e,logs.length);return `<article class="exercise ${done?'done':''}"><div class="ex-head"><div><div class="eyebrow">УПРАЖНЕНИЕ ${e.slot+1} ИЗ ${s.exercises.length}</div><h3 style="margin-top:4px">${esc(e.name)}</h3><div class="ex-small">План: ${e.sets}×${e.min===e.max?e.min:e.min+'–'+e.max}${e.perLeg?' на каждую ногу':''} · отдых ${Math.round(e.rest/60*10)/10} мин</div></div><span class="pill ${done?'green':''}">${logs.length}/${e.sets}</span></div>${logs.length?`<div class="marks">${logs.map(l=>`<span class="markchip">${l.reps}${e.perLeg?' / н':''} · ${hhmm(l.loggedAt)}</span>`).join('')}</div>`:''}${!done?`<div class="setbar"><div class="stepper"><button data-action="step" data-slot="${e.slot}" data-diff="-1" aria-label="Уменьшить повторы">−</button><input inputmode="numeric" pattern="[0-9]*" type="number" min="1" max="300" class="reps" data-slot="${e.slot}" value="${draft}" aria-label="Повторения"><button data-action="step" data-slot="${e.slot}" data-diff="1" aria-label="Увеличить повторы">+</button></div><button class="btn primary" data-action="log" data-slot="${e.slot}">✓ Записать подход ${logs.length+1}</button></div>`:`<div class="pill green" style="margin-top:10px">✓ Упражнение выполнено</div>`}<details class="how"><summary>Техника и мысленная команда ▾</summary><p><strong>Думай:</strong> ${esc(CUES[e.id].cue)}<br><strong>Как выполнять:</strong> ${esc(CUES[e.id].tech)}<br><strong>Избегай:</strong> ${esc(CUES[e.id].avoid)}</p></details>${logs.length?`<div style="text-align:right;margin-top:5px"><button class="btn ghost small" data-action="undo" data-slot="${e.slot}">Отменить последнюю отметку</button></div>`:''}</article>`}
function logSet(slot){const s=db.active;if(!s)return;const e=s.exercises.find(x=>x.slot===slot);if(!e)return;const logged=s.logs.filter(x=>x.slot===slot);if(logged.length>=e.sets)return;const inp=document.querySelector(`.reps[data-slot="${slot}"]`);const reps=Number(inp?.value??ui.drafts[slot]??e.min);if(!Number.isInteger(reps)||reps<1||reps>300)return notify('Укажи число повторений от 1 до 300');s.logs.push({slot,exId:e.id,exerciseName:e.name,setNumber:logged.length+1,reps,loggedAt:nowISO()});s.rest={until:Date.now()+e.rest*1000,duration:e.rest};ui.drafts[slot]=reps;save();render();notify(`${e.name}: ${reps} повторений записано`)}
function finish(){const s=db.active;if(!s)return;const target=s.exercises.reduce((a,e)=>a+e.sets,0);if(!s.logs.length&&!confirm('Нет ни одной отметки подхода. Сохранить пустую тренировку?'))return;if(s.logs.length<target&&!confirm(`Отмечено ${s.logs.length} из ${target} подходов. Завершить тренировку?`))return;s.note=document.getElementById('note')?.value||s.note;const done={...s,endedAt:nowISO()};delete done.rest;db.sessions.push(done);db.active=null;save();ui.tab='history';ui.showSession=done.id;render();window.scrollTo(0,0);notify(`Тренировка завершена: ${dur(Date.parse(done.endedAt)-Date.parse(done.startedAt))}`)}
function renderHistory(){if(ui.showSession){const s=db.sessions.find(x=>x.id===ui.showSession);if(s)return renderSessionDetail(s);ui.showSession=null}return `<div class="section">История<small>Здесь хранятся точные временные метки и фактические повторения.</small></div>${db.sessions.length?`<div class="card">${db.sessions.slice().reverse().map(s=>`<div class="history-item"><div class="flex"><div><div class="history-title">Тренировка ${DAY_LABEL[s.workout]} · ${esc(dateFmt(s.startedAt,{day:'numeric',month:'long',year:'numeric'}))}</div><div class="caption">${timeFmt(s.startedAt)} → ${timeFmt(s.endedAt)} · ${dur(Date.parse(s.endedAt)-Date.parse(s.startedAt))}</div><div class="selected-facts"><span class="pill">${s.logs.length} подходов</span>${s.mode==='outdoor'?'<span class="pill green">Хорошая погода</span>':''}</div></div><button class="btn small" data-action="view" data-id="${esc(s.id)}">Открыть</button></div></div>`).join('')}</div>`:'<div class="card empty"><div class="big">◷</div>Пока нет завершённых тренировок.<br>После первой здесь появятся время, повторения и длительность.</div>'}`}
function renderSessionDetail(s){const first=s.logs?.[0]?.loggedAt;return `<div class="buttons"><button class="btn ghost" data-action="back-history">← Все тренировки</button></div><div class="card hero"><div class="eyebrow">ТРЕНИРОВКА ${DAY_LABEL[s.workout]} · ${dateFmt(s.startedAt,{day:'numeric',month:'long'})}</div><h2>${dur(Date.parse(s.endedAt)-Date.parse(s.startedAt))}</h2><p>Начало: ${timeFmt(s.startedAt)}<br>Первая отметка: ${first?timeFmt(first):'—'}<br>Завершение: ${timeFmt(s.endedAt)}</p></div><div class="card"><div class="flex"><b>Подходы и отметки</b><span class="pill">${s.logs.length} записей</span></div>${s.exercises.map(e=>{const logs=s.logs.filter(x=>x.slot===e.slot);return `<div class="plan-row"><div class="no">${e.slot+1}</div><div class="plan-details"><b>${esc(e.name)}</b><div class="caption">${logs.length?logs.map(l=>`№${l.setNumber}: ${l.reps}${e.perLeg?' на ногу':''} — ${timeFmt(l.loggedAt)}`).join('<br>'):'Нет отмеченных подходов'}</div></div></div>`}).join('')}${s.note?`<p class="notice">${esc(s.note)}</p>`:''}<div class="buttons"><button class="btn primary full" data-action="copy-session" data-id="${esc(s.id)}">Скопировать отчёт для ChatGPT</button><button class="btn danger ghost full" data-action="delete-session" data-id="${esc(s.id)}">Удалить эту тренировку</button></div></div>`}
function measurePoints(){return db.measures.slice().sort((a,b)=>Date.parse(a.createdAt)-Date.parse(b.createdAt))}
function renderChart(){let pts=[];let unit='';if(ui.chart==='pull'){pts=db.sessions.filter(s=>s.logs.some(l=>l.exId==='pull')).map(s=>({x:new Date(s.startedAt),y:s.logs.filter(l=>l.exId==='pull').reduce((n,l)=>n+l.reps,0)}));unit=' повторений'}else{const key=ui.chart;pts=measurePoints().filter(x=>Number.isFinite(x[key])).map(x=>({x:new Date(x.createdAt),y:Number(x[key])}));unit=' '+(key==='weight'?'кг':'см')}
 if(!pts.length)return '<div class="empty">Добавь измерения или запиши подходы подтягиваний — здесь появится график.</div>';
 const w=600,h=210,m={l:35,r:15,t:23,b:33};let lo=Math.min(...pts.map(p=>p.y)),hi=Math.max(...pts.map(p=>p.y)),spread=Math.max(hi-lo,ui.chart==='pull'?4:1);lo-=spread*.18;hi+=spread*.18;const a=m.l,b=w-m.r;const X=i=>pts.length===1?(a+b)/2:a+(b-a)*i/(pts.length-1);const Y=v=>h-m.b-(v-lo)/(hi-lo)*(h-m.b-m.t);let poly=pts.map((p,i)=>`${X(i).toFixed(2)},${Y(p.y).toFixed(2)}`).join(' ');let guides=[0,1,2].map(i=>{let y=m.t+(h-m.b-m.t)*i/2,value=hi-(hi-lo)*i/2;return `<line x1="${a}" y1="${y}" x2="${b}" y2="${y}" stroke="#e5ecef"/><text x="${a-7}" y="${y+4}" text-anchor="end" font-size="11" fill="#86969f">${value.toFixed(1)}</text>`}).join('');return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="График ${pts.length} измерений">${guides}${pts.length>1?`<polyline fill="none" stroke="#177e67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${poly}"/>`:''}${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="4.5" fill="#177e67" stroke="#fff" stroke-width="2"/>`).join('')}<text x="${a}" y="${h-9}" font-size="11" fill="#81939b">${dateFmt(pts[0].x)}</text><text x="${b}" y="${h-9}" text-anchor="end" font-size="11" fill="#81939b">${dateFmt(pts.at(-1).x)}</text></svg></div><div class="caption">Последнее значение: <b>${pts.at(-1).y}${unit}</b> · точек: ${pts.length}</div>`}
function renderProgress(){const last=measurePoints().at(-1);const lastPull=db.sessions.slice().reverse().find(s=>s.logs.some(l=>l.exId==='pull'));const pullReps=lastPull?lastPull.logs.filter(x=>x.exId==='pull').reduce((a,v)=>a+v.reps,0):0;return `<div class="section">Твой прогресс<small>Изменение состава тела важнее случайных колебаний веса.</small></div><div class="statgrid"><div class="stat"><div class="label">Тренировок</div><div class="value">${db.sessions.length}</div></div><div class="stat"><div class="label">Живот</div><div class="value">${last?.abdomen??'—'}<span class="tiny"> ${last?.abdomen!=null?'см':''}</span></div></div><div class="stat"><div class="label">Подтягивания за занятие</div><div class="value">${pullReps||'—'}</div></div></div><div class="card" style="margin-top:13px"><b>Динамика</b><div class="seg" style="margin-top:12px"><button data-action="chart" data-val="abdomen" class="${ui.chart==='abdomen'?'active':''}">Живот</button><button data-action="chart" data-val="weight" class="${ui.chart==='weight'?'active':''}">Вес</button><button data-action="chart" data-val="pull" class="${ui.chart==='pull'?'active':''}">Подтягивания</button></div>${renderChart()}</div><div class="card"><b>Новое измерение</b><p class="caption">Лучше измеряться утром в одинаковых условиях. Обхват живота — по прежней линии чуть ниже пупка.</p><div class="formgrid"><div class="field"><label for="mweight">Вес, кг</label><input id="mweight" type="number" min="30" max="300" step="0.1" placeholder="72.0" inputmode="decimal"></div><div class="field"><label for="mabdomen">Живот, см</label><input id="mabdomen" type="number" min="40" max="200" step="0.1" placeholder="90.0" inputmode="decimal"></div><div class="field"><label for="mwaist">Талия, см (доп.)</label><input id="mwaist" type="number" min="40" max="200" step="0.1" placeholder="—" inputmode="decimal"></div><div class="field"><label for="msteps">Шаги, среднее (доп.)</label><input id="msteps" type="number" min="0" max="50000" step="1" placeholder="8000" inputmode="numeric"></div></div><button class="btn primary full" data-action="save-measure" style="margin-top:12px">Сохранить измерение</button></div><div class="card"><b>История измерений</b>${db.measures.length?`<div style="margin-top:7px">${measurePoints().slice().reverse().slice(0,12).map(m=>`<div class="history-item flex"><div><b>${dateFmt(m.createdAt,{day:'numeric',month:'short',year:'numeric'})}</b><div class="caption">${m.weight??'—'} кг · живот ${m.abdomen??'—'} см${m.waist!=null?' · талия '+m.waist+' см':''}${m.steps!=null?' · '+m.steps+' шагов':''}</div></div><button class="btn ghost small" data-action="delete-measure" data-id="${esc(m.id)}">Удалить</button></div>`).join('')}</div>`:'<p class="caption">Измерений пока нет.</p>'}</div>`}
function saveMeasure(){const ids={weight:'mweight',abdomen:'mabdomen',waist:'mwaist',steps:'msteps'},m={id:'m_'+Date.now(),createdAt:nowISO()};let n=0;for(let [k,id] of Object.entries(ids)){const val=document.getElementById(id).value.replace(',','.').trim();if(val){const num=Number(val);if(!Number.isFinite(num)||num<=0||num>50000)return notify('Проверь введённые числа');m[k]=num;n++}}if(!n)return notify('Введи хотя бы одно измерение');db.measures.push(m);save();render();notify('Измерение сохранено')}
function renderSettings(){return `<div class="section">Данные и экспорт<small>Все записи хранятся только в этом браузере, на этом устройстве.</small></div><div class="card soft"><div class="eyebrow">ОБМЕН С CHATGPT</div><h2 style="font-size:21px;letter-spacing:-.4px">Отчёт для тренера</h2><p class="small" style="line-height:1.6">Приложение фиксирует начало тренировки, время каждой отметки, завершение и длительность. Чтобы я проанализировал эти данные, скопируй отчёт в чат или прикрепи экспортированный файл.</p><button class="btn primary full" data-action="copy-report">Скопировать полный отчёт для ChatGPT</button></div><div class="card"><b>Резервная копия и таблицы</b><p class="caption">JSON сохраняет все данные и позволяет восстановить их в приложении. CSV удобен для анализа в Excel или Numbers.</p><div class="buttons"><button class="btn full" data-action="export-json">Скачать все данные · JSON</button><button class="btn full" data-action="export-csv">Скачать подходы · CSV</button><button class="btn full" data-action="import">Восстановить из JSON</button></div></div><div class="card"><b>Как хранить данные надёжно</b><p class="caption">При обычном открытии HTML-файла из «Файлов» iPhone сохранение может быть ненадёжным. Для постоянного использования лучше разместить приложение на HTTPS-адресе (например, GitHub Pages) и добавить на экран «Домой». Данные всё равно останутся в браузере этого устройства; регулярно выгружай резервную копию.</p><p class="caption">Данные не синхронизируются между устройствами автоматически и не отправляются в ChatGPT без твоего действия.</p>${location.protocol==='file:'?'<div class="notice warn">Открыта файловая версия. Для долговременного ведения журнала рекомендуем веб-адрес; экспортируй резервные копии особенно часто.</div>':''}</div><div class="card"><b>Обслуживание</b><div class="selected-facts"><span class="pill">${db.sessions.length} тренировок</span><span class="pill">${db.measures.length} измерений</span><span class="pill">${db.ofpDays.length} дней ОФП</span></div><button class="btn danger ghost full" data-action="clear" style="margin-top:14px">Удалить все данные с этого устройства</button></div>`}
function fullText(){let rows=['ФИТНЕС-ДНЕВНИК — отчёт для анализа',`Дата создания отчёта: ${new Date().toLocaleString('ru-RU')}`,`Записано тренировок: ${db.sessions.length}; измерений: ${db.measures.length}; дней ОФП: ${db.ofpDays.length}`,''];for(const s of db.sessions.slice(-16)){rows.push(sessionText(s),'')}rows.push('ИЗМЕРЕНИЯ:');for(const m of db.measures.slice(-24)){rows.push(`${dateFmt(m.createdAt,{day:'numeric',month:'numeric',year:'numeric'})}: вес ${m.weight??'—'} кг; живот ${m.abdomen??'—'} см; талия ${m.waist??'—'} см; шаги ${m.steps??'—'}`)}rows.push('', 'Проанализируй прогрессию упражнений, длительность и паузы, динамику талии и массы, дай конкретные корректировки тренировок и восстановления.');return rows.join('\n')}
function sessionText(s){const first=s.logs?.[0]?.loggedAt;let out=[`ТРЕНИРОВКА ${DAY_LABEL[s.workout]} — ${dateFmt(s.startedAt,{day:'numeric',month:'long',year:'numeric'})}`,`Старт: ${timeFmt(s.startedAt)}; первая отметка: ${first?timeFmt(first):'—'}; конец: ${timeFmt(s.endedAt)}; длительность: ${dur(Date.parse(s.endedAt)-Date.parse(s.startedAt))}`,`Режим: ${s.mode==='outdoor'?'хорошая погода':'обычный'}`];for(const e of s.exercises){const l=s.logs.filter(x=>x.slot===e.slot);out.push(`${e.name}: ${l.length?l.map(x=>x.reps+(e.perLeg?'/н':'')+' ('+timeFmt(x.loggedAt)+')').join(' / '):'без отметок'}`)}if(s.note)out.push(`Заметка: ${s.note}`);return out.join('\n')}
async function copy(txt){try{await navigator.clipboard.writeText(txt);notify('Скопировано. Вставь текст в чат с ChatGPT.')}catch(e){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}t.remove();notify(ok?'Текст скопирован':'Не удалось скопировать; используй экспорт JSON')}}
function download(filename,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);notify('Файл подготовлен')}
function csvEscape(x){let s=String(x==null?'':x);return /[",\r\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCsv(){const cols=['date','workout','start_time','first_mark_time','end_time','duration_minutes','equipment_mode','exercise','set_number','reps','per_leg','logged_at','rest_after_s','note'];let rs=[cols];for(const s of db.sessions){for(const l of s.logs){const e=s.exercises.find(x=>x.slot===l.slot);rs.push([dayKey(s.startedAt),DAY_LABEL[s.workout],s.startedAt,s.logs[0]?.loggedAt||'',s.endedAt,((Date.parse(s.endedAt)-Date.parse(s.startedAt))/60000).toFixed(1),s.mode,l.exerciseName,l.setNumber,l.reps,e?.perLeg?'yes':'no',l.loggedAt,e?.rest||'',s.note||''])}}download('forma-podhody-'+dayKey()+'.csv','\ufeff'+rs.map(r=>r.map(csvEscape).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function handleFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const n=JSON.parse(r.result);if(n.version!==1||!Array.isArray(n.sessions)||!Array.isArray(n.measures)||!Array.isArray(n.ofpDays))throw Error('invalid');if(!confirm('Заменить текущий журнал данными из резервной копии? Это действие перезапишет локальную историю.'))return;db={...EMPTY(),...n};save();ui.tab='today';render();notify('Резервная копия восстановлена')}catch(e){notify('Файл не похож на резервную копию приложения')}};r.readAsText(f)}
function updateClock(){if(db.active){const clock=document.getElementById('clock-live');if(clock)clock.textContent=`Прошло ${dur(Date.now()-Date.parse(db.active.startedAt))}`;const countdown=document.getElementById('rest-count');if(countdown){let ms=db.active.rest?.until-Date.now();if(ms<=0){const place=document.getElementById('restArea');if(place)place.innerHTML='';db.active.rest=null;save();}else countdown.textContent=dur(ms)}}}
setInterval(updateClock,500);
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,val=b.dataset.val,slot=Number(b.dataset.slot);if(a==='tab')return setTab(val);if(a==='choose'){ui.chosen=val;ui.goodWeather=false;return render()}if(a==='start')return start();if(a==='ofp'){const k=dayKey();db.ofpDays=db.ofpDays.includes(k)?db.ofpDays.filter(x=>x!==k):[...db.ofpDays,k];save();return render()}if(a==='step'){const inp=document.querySelector(`.reps[data-slot="${slot}"]`);if(inp){inp.value=Math.max(1,Math.min(300,(Number(inp.value)||1)+Number(b.dataset.diff)));ui.drafts[slot]=Number(inp.value)}return}if(a==='log')return logSet(slot);if(a==='undo'){const s=db.active;const index=s?.logs.map(x=>x.slot).lastIndexOf(slot);if(index>=0){s.logs.splice(index,1);s.rest=null;save();render()}return}if(a==='skip-rest'&&db.active){db.active.rest=null;save();return render()}if(a==='more-rest'&&db.active?.rest){db.active.rest.until+=30000;db.active.rest.duration+=30;save();return render()}if(a==='finish')return finish();if(a==='discard'&&confirm('Отменить тренировку? Все отметки текущего занятия будут потеряны.')){db.active=null;save();return render()}if(a==='view'){ui.showSession=b.dataset.id;return render()}if(a==='back-history'){ui.showSession=null;return render()}if(a==='copy-session'){const s=db.sessions.find(x=>x.id===b.dataset.id);if(s)return copy(sessionText(s))}if(a==='delete-session'&&confirm('Удалить тренировку без возможности восстановления (кроме сохранённого JSON)?')){db.sessions=db.sessions.filter(s=>s.id!==b.dataset.id);ui.showSession=null;save();return render()}if(a==='chart'){ui.chart=val;return render()}if(a==='save-measure')return saveMeasure();if(a==='delete-measure'&&confirm('Удалить это измерение?')){db.measures=db.measures.filter(m=>m.id!==b.dataset.id);save();return render()}if(a==='copy-report')return copy(fullText());if(a==='export-json')return download('forma-backup-'+dayKey()+'.json',JSON.stringify(db,null,2),'application/json');if(a==='export-csv')return exportCsv();if(a==='import')return document.getElementById('importFile').click();if(a==='clear'&&confirm('Точно удалить ВСЕ данные приложения? Рекомендуется сначала скачать JSON.')&&confirm('Подтверди удаление ещё раз.')){db=EMPTY();save();ui.tab='today';return render()}});
document.addEventListener('change',e=>{if(e.target.id==='outdoor'){ui.goodWeather=e.target.checked;render()}if(e.target.id==='importFile'){handleFile(e.target.files[0]);e.target.value=''}});
document.addEventListener('input',e=>{if(e.target.classList.contains('reps'))ui.drafts[Number(e.target.dataset.slot)]=Number(e.target.value);if(e.target.id==='note'&&db.active){db.active.note=e.target.value;save()}});
window.addEventListener('storage',e=>{if(e.key===DB_KEY){db=load();render()}});
if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
ui.chosen=nextWorkout();render();
</script>
</body>
</html>
