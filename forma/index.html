const THEME_KEY='forma_theme';

let themeChoice=readTheme();
function applyTheme(){const dark=themeChoice==='dark'||(themeChoice==='system'&&themeMedia.matches);document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('meta[name="theme-color"]').content=dark?'#0f1115':'#f5f6f8'}
applyTheme();
themeMedia.addEventListener('change',applyTheme);

</script>

 const w=600,h=210,m={l:35,r:15,t:23,b:33};let lo=Math.min(...pts.map(p=>p.y)),hi=Math.max(...pts.map(p=>p.y)),spread=Math.max(hi-lo,ui.chart==='pull'?4:1);lo-=spread*.18;hi+=spread*.18;const a=m.l,b=w-m.r;const tMin=pts[0].x.getTime(),tMax=pts.at(-1).x.getTime();const X=i=>tMin===tMax?(a+b)/2:a+(b-a)*(pts[i].x.getTime()-tMin)/(tMax-tMin);const Y=v=>h-m.b-(v-lo)/(hi-lo)*(h-m.b-m.t);let poly=pts.map((p,i)=>`${X(i).toFixed(2)},${Y(p.y).toFixed(2)}`).join(' ');let guides=[0,1,2].map(i=>{let y=m.t+(h-m.b-m.t)*i/2,value=hi-(hi-lo)*i/2;return `<line x1="${a}" y1="${y}" x2="${b}" y2="${y}" stroke="var(--line)"/><text x="${a-7}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--sub)">${value.toFixed(1)}</text>`}).join('');return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="График ${pts.length} измерений">${guides}${pts.length>1?`<polyline fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${poly}"/>`:''}${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="4.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>`).join('')}<text x="${a}" y="${h-9}" font-size="11" fill="var(--sub)">${dateFmt(pts[0].x)}</text><text x="${b}" y="${h-9}" text-anchor="end" font-size="11" fill="var(--sub)">${dateFmt(pts.at(-1).x)}</text></svg></div><div class="caption">Последнее значение: <b>${pts.at(-1).y}${unit}</b> · точек: ${pts.length}</div>`}
function statWeek(t){const origin=db.programStartedAt||[...db.sessions.map(x=>x.startedAt),db.active?.startedAt].filter(Boolean).sort()[0];return origin?Math.floor((Date.parse(t)-Date.parse(origin))/604800000)+1:null}
function statExercise(id){const result=Array(12).fill(null);for(const s of db.sessions){const w=statWeek(s.startedAt);if(!w||w<1||w>12)continue;const first=new Map();for(const l of s.logs){if(l.exId!==id)continue;const before=first.get(l.slot);if(!before||l.setNumber<before.setNumber)first.set(l.slot,l)}for(const l of first.values())result[w-1]=Math.max(result[w-1]??-Infinity,l.reps)}return result}
function statCounts(){const result=Array(12).fill(0);for(const s of db.sessions){const w=statWeek(s.startedAt);if(w>=1&&w<=12&&s.workout!=='G'&&s.logs.length)result[w-1]++}return result}
function statDiff(data,unit){const a=data.filter(x=>Number.isFinite(x));if(a.length<2)return '—';const d=a.at(-1)-a[0];return(d>0?'+':'')+Number(d.toFixed(2)).toLocaleString('ru-RU')+' '+unit+(a[0]?' ('+(d>0?'+':'')+Math.round(100*d/a[0])+'%)':'')}
function statPlot(a){const good=a.map((y,i)=>({y,i})).filter(p=>Number.isFinite(p.y));if(!good.length)return '<p class="caption">Нет данных</p>';let mn=Math.min(...good.map(x=>x.y)),mx=Math.max(...good.map(x=>x.y)),s=Math.max(1,mx-mn);const X=i=>30+i*540/Math.max(1,a.length-1),Y=y=>155-(y-mn+s*.2)/(s*1.4)*130;let lines=[],part=[];a.forEach((y,i)=>{if(!Number.isFinite(y)){if(part.length>1)lines.push(part.join(' '));part=[]}else part.push(X(i)+','+Y(y))});if(part.length>1)lines.push(part.join(' '));return '<div class="chart-wrap"><svg viewBox="0 0 600 180" role="img" aria-label="График">'+lines.map(p=>'<polyline points="'+p+'" fill="none" stroke="var(--accent)" stroke-width="3"/>').join('')+good.map(p=>'<circle cx="'+X(p.i)+'" cy="'+Y(p.y)+'" r="4" fill="var(--accent)"><title>№'+(p.i+1)+': '+p.y+'</title></circle>').join('')+'</svg></div>'}
function strengthChart(){const defs=[['pull','Подтягивания','#245cdb'],['push','Отжимания','#dd843f'],['squat','Приседания','#24977d']];const d=defs.map(([id,name,color])=>{const raw=statExercise(id),base=raw.find(v=>v!=null&&v>0);return {name,color,raw,pct:raw.map(v=>base&&v!=null?Math.round(100*(v/base-1)):null)}});const a=d.flatMap(z=>z.pct).filter(Number.isFinite);if(!a.length)return '<p class="caption">Нет результатов по базовым упражнениям.</p>';const mn=Math.min(0,...a),mx=Math.max(0,...a),pad=Math.max(10,(mx-mn)*.15),X=i=>40+535*i/11,Y=v=>155-(v-mn+pad)/(mx-mn+2*pad)*135;let marks='';for(const z of d){let seg=[];const flush=()=>{if(seg.length>1)marks+='<polyline fill="none" stroke="'+z.color+'" stroke-width="3" points="'+seg.join(' ')+'"/>';seg=[]};z.pct.forEach((v,i)=>{if(v==null){flush();return}seg.push(X(i)+','+Y(v));marks+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="4" fill="'+z.color+'"><title>'+z.name+' / неделя '+(i+1)+': '+z.raw[i]+' повторений ('+v+'%)</title></circle>'});flush()}const legend=d.map(z=>{const v=z.raw.filter(x=>x!=null);return '<div class="strength-legend"><span style="background:'+z.color+'"></span><div><b>'+z.name+'</b><div class="caption">'+(v.length?v[0]+' → '+v.at(-1)+' повторений · '+statDiff(v,'повт.'):'Нет данных')+'</div></div></div>'}).join('');return '<div class="chart-wrap"><svg viewBox="0 0 600 180" role="img" aria-label="Недельный прогресс базовых упражнений"><line x1="40" x2="575" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="currentColor" opacity=".2"/>'+marks+'<text x="40" y="177" font-size="11" fill="currentColor">1</text><text x="575" y="177" text-anchor="end" font-size="11" fill="currentColor">12 нед.</text></svg></div>'+legend}

function saveMeasure(){const ids={weight:'mweight',abdomen:'mabdomen',waist:'mwaist',steps:'msteps'},m={id:'m_'+Date.now(),createdAt:nowISO()};let n=0;for(let [k,id] of Object.entries(ids)){const val=document.getElementById(id).value.replace(',','.').trim();if(val){const num=Number(val);const limits={weight:[30,300],abdomen:[40,200],waist:[40,200],steps:[0,50000]};if(!Number.isFinite(num)||num<limits[k][0]||num>limits[k][1]||(k==='steps'&&!Number.isInteger(num)))return notify('Проверь введённые числа');m[k]=num;n++}}if(!n)return notify('Введи хотя бы одно измерение');if(!save({...db,measures:[...db.measures,m]}))return;render();notify('Измерение сохранено')}

function fullText(){let rows=['ФИТНЕС-ДНЕВНИК — отчёт для анализа',`Дата создания отчёта: ${new Date().toLocaleString('ru-RU')}`,`Записано тренировок: ${db.sessions.length}; измерений: ${db.measures.length}; дней ОФП: ${db.ofpDays.length}`,''];for(const s of db.sessions){rows.push(sessionText(s),'')}rows.push('ИЗМЕРЕНИЯ:');for(const m of db.measures){rows.push(`${dateFmt(m.createdAt,{day:'numeric',month:'numeric',year:'numeric'})}: вес ${m.weight??'—'} кг; живот ${m.abdomen??'—'} см; талия ${m.waist??'—'} см; шаги ${m.steps??'—'}`)}rows.push('', 'Проанализируй прогрессию упражнений, длительность и паузы, динамику талии и массы, дай конкретные корректировки тренировок и восстановления.');return rows.join('\n')}

function download(filename,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);notify('Файл подготовлен')}
function csvEscape(x){let s=String(x==null?'':x);return /[",\r\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCsv(){const cols=['date','workout','start_time','first_mark_time','end_time','duration_minutes','equipment_mode','exercise','set_number','reps','per_leg','logged_at','planned_rest_after_s','note'];let rs=[cols];for(const s of db.sessions){for(const l of s.logs){const e=s.exercises.find(x=>x.slot===l.slot);rs.push([dayKey(s.startedAt),DAY_LABEL[s.workout],s.startedAt,s.logs[0]?.loggedAt||'',s.endedAt,((Date.parse(s.endedAt)-Date.parse(s.startedAt))/60000).toFixed(1),s.mode,l.exerciseName,l.setNumber,l.reps,e?.perLeg?'yes':'no',l.loggedAt,e?.rest||'',s.note||''])}}download('forma-podhody-'+dayKey()+'.csv','\ufeff'+rs.map(r=>r.map(csvEscape).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function validBackup(n){
if(!n||n.version!==1||!Array.isArray(n.sessions)||!Array.isArray(n.measures)||!Array.isArray(n.ofpDays)||n.sessions.length>10000||n.measures.length>10000)return false;
const date=x=>typeof x==='string'&&Number.isFinite(Date.parse(x));
const str=(x,max=10000)=>typeof x==='string'&&x.length<=max;
const ex=e=>e&&Number.isInteger(e.slot)&&e.slot>=0&&str(e.id,100)&&str(e.name,300)&&Number.isInteger(e.sets)&&e.sets>=0&&e.sets<=100&&Number.isFinite(e.min)&&Number.isFinite(e.max)&&Number.isFinite(e.rest);
const validProgram=p=>p==null||(p&&typeof p==='object'&&!Array.isArray(p)&&Object.keys(p).every(k=>['A','B','V','G'].includes(k)&&Array.isArray(p[k])&&p[k].length>=1&&p[k].length<=30&&p[k].every(a=>Array.isArray(a)&&a.length>=4&&a.length<=8&&!!CUES[a[0]]&&Number.isInteger(a[1])&&a[1]>=1&&a[1]<=12&&Number.isInteger(a[2])&&a[2]>=1&&a[2]<=100&&Number.isInteger(a[3])&&a[3]>=a[2]&&a[3]<=100)));
const session=s=>s&&str(s.id,100)&&['A','B','V','G'].includes(s.workout)&&date(s.startedAt)&&(s.endedAt==null||date(s.endedAt))&&Array.isArray(s.exercises)&&s.exercises.length<=100&&s.exercises.every(ex)&&Array.isArray(s.logs)&&s.logs.length<=1000&&s.logs.every(l=>l&&Number.isInteger(l.slot)&&str(l.exId,100)&&str(l.exerciseName,300)&&Number.isInteger(l.setNumber)&&Number.isInteger(l.reps)&&l.reps>=1&&l.reps<=300&&date(l.loggedAt))&&(s.note==null||str(s.note))&&(!s.rest||(Number.isFinite(s.rest.until)&&Number.isFinite(s.rest.duration)));
return validProgram(n.programOverrides)&&(n.programStartedAt==null||date(n.programStartedAt))&&n.sessions.every(session)&&n.measures.every(m=>m&&str(m.id,100)&&date(m.createdAt)&&['weight','abdomen','waist','steps'].every(k=>m[k]==null||(typeof m[k]==='number'&&Number.isFinite(m[k])&&m[k]>=0&&m[k]<=50000)))&&n.ofpDays.every(d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d))&&(n.active==null||session(n.active));
}
function handleFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const n=JSON.parse(r.result);if(!validBackup(n))throw Error('invalid');if(!confirm('Заменить текущий журнал данными из резервной копии? Это действие перезапишет локальную историю.'))return;if(!save({...EMPTY(),...n}))return;ui.chosen=nextWorkout();ui.tab='today';render();notify('Резервная копия восстановлена')}catch(e){notify('Файл не похож на резервную копию приложения')}};r.readAsText(f)}
function updateClock(){if(db.active){if(db.active.rest&&Date.now()>=db.active.rest.until){const active={...db.active,rest:null};if(save({...db,active})){chime();if(ui.tab==='today')render()}}const clock=document.getElementById('clock-live');if(clock)clock.textContent=`Прошло ${dur(Date.now()-Date.parse(db.active.startedAt))}`;const countdown=document.getElementById('rest-count');if(countdown){let ms=db.active.rest?.until-Date.now();if(ms<=0){const place=document.getElementById('restArea');if(place)place.innerHTML='';save({...db,active:{...db.active,rest:null}});}else countdown.textContent=dur(ms)}}}
setInterval(updateClock,500);
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,val=b.dataset.val,slot=Number(b.dataset.slot);if(a==='theme-set'){themeChoice=val;applyTheme();try{localStorage.setItem(THEME_KEY,val)}catch(_){notify('Тема не сохранена')}return render()}if(a==='tab'){if(ui.tab==='settings'&&val!=='settings'&&ui.editRows){if(!readEditor())return;const original=db.programOverrides?.[ui.editWorkout]||PROGRAM[ui.editWorkout].items;if(JSON.stringify(ui.editRows)!==JSON.stringify(original)&&!confirm('Изменения программы не сохранены. Выйти?'))return;ui.editRows=null}return setTab(val)}if(a==='pick-plan'){if(!readEditor())return;const original=db.programOverrides?.[ui.editWorkout]||PROGRAM[ui.editWorkout].items;if(JSON.stringify(ui.editRows)!==JSON.stringify(original)&&!confirm('Изменения не сохранены. Перейти?'))return;ui.editWorkout=val;ui.editRows=null;return render()}if(a==='plan-move'){if(!readEditor())return;const rows=editRows(),i=Number(b.dataset.index),j=i+Number(b.dataset.diff);if(j>=0&&j<rows.length)[rows[i],rows[j]]=[rows[j],rows[i]];return render()}if(a==='plan-add'){if(!readEditor())return;const used=new Set(editRows().map(x=>x[0])),id=Object.keys(CUES).find(k=>!used.has(k));if(!id)return notify('Все упражнения добавлены');editRows().push([id,3,8,12]);return render()}if(a==='plan-remove'){if(!readEditor())return;if(editRows().length<=1)return notify('Оставь хотя бы одно упражнение');editRows().splice(Number(b.dataset.index),1);return render()}if(a==='plan-save'){if(!readEditor())return;const programOverrides={...db.programOverrides,[ui.editWorkout]:editRows().map(x=>x.slice())};if(save({...db,programOverrides})){ui.editRows=null;render();notify('Новый план сохранён')}return}if(a==='plan-reset'){if(!confirm('Восстановить исходную тренировку '+ui.editWorkout+'?'))return;const programOverrides={...db.programOverrides};delete programOverrides[ui.editWorkout];if(save({...db,programOverrides})){ui.editRows=null;render()}return}if(a==='choose'){ui.chosen=val;ui.goodWeather=false;return render()}if(a==='start')return start();if(a==='ofp'){const k=dayKey();const ofpDays=db.ofpDays.includes(k)?db.ofpDays.filter(x=>x!==k):[...db.ofpDays,k];if(save({...db,ofpDays}))return render()}if(a==='step'){const inp=document.querySelector(`.reps[data-slot="${slot}"]`);if(inp){inp.value=Math.max(1,Math.min(300,(Number(inp.value)||1)+Number(b.dataset.diff)));ui.drafts[slot]=Number(inp.value)}return}if(a==='log')return logSet(slot);if(a==='focus-exercise'&&db.active){ui.focusSlot=slot;return render()}if(a==='exercise-list'){document.getElementById('focus-all')?.setAttribute('open','');return}if(a==='next-exercise'&&db.active){const es=db.active.exercises,at=es.findIndex(x=>x.slot===activeSlot(db.active).slot);ui.focusSlot=es[Math.min(at+1,es.length-1)].slot;return render()}if(a==='undo'){const s=db.active;const index=s?.logs.map(x=>x.slot).lastIndexOf(slot);if(index>=0){const active={...s,logs:s.logs.filter((_,i)=>i!==index),rest:null};if(save({...db,active}))render()}return}if(a==='skip-rest'&&db.active){if(save({...db,active:{...db.active,rest:null}}))return render()}if(a==='more-rest'&&db.active?.rest){const rest={...db.active.rest,until:db.active.rest.until+30000,duration:db.active.rest.duration+30};if(save({...db,active:{...db.active,rest}}))return render()}if(a==='finish')return finish();if(a==='discard'&&confirm('Отменить тренировку? Все отметки текущего занятия будут потеряны.')){if(save({...db,active:null}))return render()}if(a==='view'){ui.showSession=b.dataset.id;return render()}if(a==='back-history'){ui.showSession=null;return render()}if(a==='delete-session'&&confirm('Удалить тренировку без возможности восстановления (кроме сохранённого JSON)?')){if(!save({...db,sessions:db.sessions.filter(s=>s.id!==b.dataset.id)}))return;ui.showSession=null;ui.chosen=nextWorkout();return render()}if(a==='chart'){ui.chart=val;return render()}if(a==='save-measure')return saveMeasure();if(a==='delete-measure'&&confirm('Удалить это измерение?')){if(save({...db,measures:db.measures.filter(m=>m.id!==b.dataset.id)}))return render()}if(a==='export-json')return download('forma-backup-'+dayKey()+'.json',JSON.stringify(db,null,2),'application/json');if(a==='import')return document.getElementById('importFile').click();if(a==='clear'&&confirm('Точно удалить ВСЕ данные приложения? Рекомендуется сначала скачать JSON.')&&confirm('Подтверди удаление ещё раз.')){if(!save(EMPTY()))return;ui.editRows=null;ui.chosen='A';ui.tab='today';return render()}});
document.addEventListener('change',e=>{if(e.target.id==='progressExercise'){ui.exercise=e.target.value;return render()}if(e.target.id==='themeChoice'){themeChoice=e.target.value;applyTheme();try{localStorage.setItem(THEME_KEY,themeChoice)}catch(_){notify('Тема изменена, но браузер не смог сохранить выбор')}return}if(e.target.id==='outdoor'){ui.goodWeather=e.target.checked;render()}if(e.target.id==='importFile'){handleFile(e.target.files[0]);e.target.value=''}});
document.addEventListener('input',e=>{if(e.target.classList.contains('reps'))ui.drafts[Number(e.target.dataset.slot)]=Number(e.target.value);if(e.target.id==='note'&&db.active){save({...db,active:{...db.active,note:e.target.value}})}});
window.addEventListener('storage',e=>{if(e.key===DB_KEY){db=load();render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateClock()});
if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
ui.chosen=nextWorkout();render();
</script>
