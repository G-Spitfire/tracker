const THEME_KEY='forma_theme';
const themeMedia=matchMedia('(prefers-color-scheme: dark)');
function readTheme(){try{const v=localStorage.getItem(THEME_KEY);return ['light','dark'].includes(v)?v:'system'}catch(_){return 'system'}}
let themeChoice=readTheme();
function applyTheme(){const dark=themeChoice==='dark'||(themeChoice==='system'&&themeMedia.matches);document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('meta[name="theme-color"]').content=dark?'#0f1115':'#f5f6f8'}
applyTheme();
themeMedia.addEventListener('change',applyTheme);
window.addEventListener('storage',e=>{if(e.key===THEME_KEY||e.key===null){themeChoice=readTheme();applyTheme();const select=document.getElementById('themeChoice');if(select)select.value=themeChoice}});
</script>

.program-card{padding:16px}.plan-tabs{margin-bottom:14px}

.plan-editor-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:13px}
.plan-unsaved{font-size:12px;color:var(--accent);font-weight:650}

function previousSet(e,setIndex){

  const s=db.sessions[i];if(sameWorkout&&s.workout!==db.active?.workout)continue;

function activeSlot(s){return s.exercises.find(e=>e.slot===ui.focusSlot)||s.exercises.find(e=>s.logs.filter(l=>l.slot===e.slot).length<e.sets)||s.exercises.at(-1)}
function renderActive(){
const s=db.active,e=activeSlot(s),logs=s.logs.filter(x=>x.slot===e.slot),done=logs.length>=e.sets,at=s.exercises.findIndex(x=>x.slot===e.slot),all=s.exercises.reduce((a,x)=>a+x.sets,0),completed=s.logs.length,previous=previousSet(e,logs.length);
const resting=!!s.rest&&(s.rest.slot==null||s.rest.slot===e.slot)&&Date.now()<s.rest.until&&!done,draft=ui.drafts[e.slot]??lastSetSuggestion(e,logs.length);
const head=`<div class="card session-head"><div class="flex"><span class="pill">ТРЕНИРОВКА ${esc(PROGRAM[s.workout].label)} · ИДЁТ</span><span class="tiny" id="clock-live">0:00</span></div><button class="btn ghost small pause-control" data-action="${s.pausedAt?'resume-workout':'pause-workout'}">${s.pausedAt?'▶ Продолжить':'Ⅱ Пауза'}</button></div><div class="card focus-card"><div class="focus-top"><div><div class="eyebrow">УПРАЖНЕНИЕ ${at+1} ИЗ ${s.exercises.length}</div><h2>${esc(e.name)}</h2></div><button class="btn small" data-action="exercise-list">☷ ${at+1}/${s.exercises.length}</button></div><div class="focus-bars">${Array.from({length:e.sets},(_,i)=>`<span class="${i<logs.length?'filled':i===logs.length?'current':''}"></span>`).join('')}</div><div class="flex"><b>Подход ${Math.min(e.sets,logs.length+1)} из ${e.sets}</b><span class="tiny muted">Цель ${e.min===e.max?e.min:e.min+'–'+e.max}${e.perLeg?' на ногу':''}</span></div>`;
let center='';
if(s.pausedAt){center=`<div class="focus-center"><div class="caption">ТРЕНИРОВКА НА ПАУЗЕ</div><div class="focus-value">Ⅱ</div><div class="caption">Таймер и отдых остановлены</div></div><button class="btn primary full" data-action="resume-workout">▶ Продолжить тренировку</button>`}
else if(done){center=`<div class="focus-center"><div class="focus-value">✓</div><b>Упражнение выполнено</b><div class="caption">${logs.reduce((sum,l)=>sum+l.reps,0)} повторений за ${e.sets} подходов</div></div><button class="btn primary full" data-action="${at===s.exercises.length-1?'finish':'next-exercise'}">${at===s.exercises.length-1?'Завершить тренировку':'Следующее упражнение →'}</button>`}
else if(resting){center=`<div class="focus-center"><div class="caption">ОТДЫХ ПОСЛЕ ПОДХОДА</div><div class="focus-value" id="rest-count">${dur(s.rest.until-Date.now())}</div><div class="caption">Записано: ${logs.at(-1)?.reps??'—'} повторений</div></div><div class="focus-buttons"><button class="btn" data-action="more-rest">+30 сек</button><button class="btn primary" data-action="skip-rest">Продолжить →</button></div>`}

function logSet(slot){const s=db.active;if(!s||s.pausedAt)return;const e=s.exercises.find(x=>x.slot===slot);if(!e)return;const logged=s.logs.filter(x=>x.slot===slot);if(logged.length>=e.sets)return;const inp=document.querySelector(`.reps[data-slot="${slot}"]`);const reps=Number(inp?.value??ui.drafts[slot]??e.min);if(!Number.isInteger(reps)||reps<1||reps>300)return notify('Укажи число повторений от 1 до 300');armAudio();const log={slot,exId:e.id,exerciseName:e.name,setNumber:logged.length+1,reps,loggedAt:nowISO()};const active={...s,logs:[...s.logs,log],rest:logged.length+1<e.sets?{until:Date.now()+e.rest*1000,duration:e.rest,slot:e.slot}:null};if(!save({...db,active}))return;ui.drafts[slot]=reps;if(logged.length+1>=e.sets){const next=s.exercises.find(x=>x.slot>e.slot&&s.logs.filter(l=>l.slot===x.slot).length<x.sets);if(next)ui.focusSlot=next.slot}render()}
function workoutElapsed(s,at=Date.now()){
 const end=typeof at==='number'?at:Date.parse(at),start=Date.parse(s.startedAt),paused=Number(s.pausedMs)||0;
 const ongoing=s.pausedAt?Math.max(0,end-Date.parse(s.pausedAt)):0;
 return Math.max(0,end-start-paused-ongoing);
}
function pauseWorkout(){
 const s=db.active;if(!s||s.pausedAt)return;
 if(save({...db,active:{...s,pausedAt:nowISO()}}))render();
}
function resumeWorkout(){
 const s=db.active;if(!s?.pausedAt)return;
 const gap=Math.max(0,Date.now()-Date.parse(s.pausedAt));
 const active={...s,pausedAt:null,pausedMs:(Number(s.pausedMs)||0)+gap,rest:s.rest?{...s.rest,until:s.rest.until+gap}:null};
 if(save({...db,active})){armAudio();render();}
}
function finish(){
 const s=db.active;if(!s)return;
 const target=s.exercises.reduce((a,e)=>a+e.sets,0);
 if(!s.logs.length&&!confirm('Нет ни одной отметки подхода. Сохранить пустую тренировку?'))return;
 if(s.logs.length<target&&!confirm(`Отмечено ${s.logs.length} из ${target} подходов. Завершить тренировку?`))return;
 const note=document.getElementById('note')?.value??s.note,endedAt=nowISO();
 const done={...s,note,endedAt,pausedMs:(Number(s.pausedMs)||0)+(s.pausedAt?Math.max(0,Date.parse(endedAt)-Date.parse(s.pausedAt)):0)};
 delete done.rest;delete done.pausedAt;
 const sinceLast=Date.now()-Date.parse(s.logs.at(-1)?.loggedAt||s.startedAt);
 if(!s.pausedMs&&!s.pausedAt&&workoutElapsed(done,endedAt)>3*3600000&&sinceLast>45*60000){
  if(confirm(`С последнего подхода прошло ${dur(sinceLast)}. Исключить это время из длительности тренировки?`))done.pausedMs+=sinceLast;
 }
 if(!save({...db,sessions:[...db.sessions,done],active:null}))return;
 ui.chosen=nextWorkout();ui.goodWeather=false;ui.tab='history';ui.showSession=done.id;render();window.scrollTo(0,0);
 notify(`Тренировка завершена: ${dur(workoutElapsed(done,endedAt))}`);

const validProgram=p=>p==null||(p&&typeof p==='object'&&!Array.isArray(p)&&Object.keys(p).every(k=>['A','B','V','G'].includes(k)&&Array.isArray(p[k])&&p[k].length>=1&&p[k].length<=30&&p[k].every(a=>Array.isArray(a)&&a.length>=4&&a.length<=9&&!!CUES[a[0]]&&Number.isInteger(a[1])&&a[1]>=1&&a[1]<=12&&Number.isInteger(a[2])&&a[2]>=1&&a[2]<=100&&Number.isInteger(a[3])&&a[3]>=a[2]&&a[3]<=100&&(a[8]==null||(Number.isInteger(a[8])&&a[8]>=15&&a[8]<=900)))));
const session=s=>s&&str(s.id,100)&&['A','B','V','G'].includes(s.workout)&&date(s.startedAt)&&(s.endedAt==null||date(s.endedAt))&&Array.isArray(s.exercises)&&s.exercises.length<=100&&s.exercises.every(ex)&&Array.isArray(s.logs)&&s.logs.length<=1000&&s.logs.every(l=>l&&Number.isInteger(l.slot)&&str(l.exId,100)&&str(l.exerciseName,300)&&Number.isInteger(l.setNumber)&&Number.isInteger(l.reps)&&l.reps>=1&&l.reps<=300&&date(l.loggedAt))&&(s.note==null||str(s.note))&&(!s.rest||(Number.isFinite(s.rest.until)&&Number.isFinite(s.rest.duration)))&&(s.pausedAt==null||date(s.pausedAt))&&(s.pausedMs==null||(Number.isFinite(s.pausedMs)&&s.pausedMs>=0));
return validProgram(n.programOverrides)&&(n.programStartedAt==null||date(n.programStartedAt))&&n.sessions.every(session)&&n.measures.every(m=>m&&str(m.id,100)&&date(m.createdAt)&&['weight','abdomen','waist','steps'].every(k=>m[k]==null||(typeof m[k]==='number'&&Number.isFinite(m[k])&&m[k]>=0&&m[k]<=50000)))&&n.ofpDays.every(d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d))&&(n.active==null||session(n.active));
}
function handleFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const n=JSON.parse(r.result);if(!validBackup(n))throw Error('invalid');if(!confirm('Заменить текущий журнал данными из резервной копии? Это действие перезапишет локальную историю.'))return;if(!save({...EMPTY(),...n}))return;ui.chosen=nextWorkout();ui.tab='today';ui.editRows=null;ui.editSelected=null;ui.planPicker=null;render();notify('Резервная копия восстановлена')}catch(e){notify('Файл не похож на резервную копию приложения')}};r.readAsText(f)}
function updateClock(){
 if(!db.active)return;
 const s=db.active,clock=document.getElementById('clock-live');
 if(clock)clock.textContent=(s.pausedAt?'Пауза · ':'Прошло ')+dur(workoutElapsed(s));
 if(s.pausedAt)return;
 if(s.rest&&Date.now()>=s.rest.until){if(save({...db,active:{...s,rest:null}})){chime();if(ui.tab==='today')render()}return;}
 const countdown=document.getElementById('rest-count');
 if(countdown&&s.rest)countdown.textContent=dur(s.rest.until-Date.now());
}
setInterval(updateClock,500);
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,val=b.dataset.val,slot=Number(b.dataset.slot);
if(a==='theme-set'){
 if(ui.tab==='settings'&&!readEditor())return;
 themeChoice=val;applyTheme();try{localStorage.setItem(THEME_KEY,val)}catch(_){notify('Тема не сохранена')}
 return render();
}
if(a==='tab'){
 if(ui.tab==='settings'&&val!=='settings'){
  if(!readEditor())return;
  if(planDirty()&&!confirm('Есть несохранённые изменения программы. Выйти без сохранения?'))return;
  ui.editRows=null;ui.editSelected=null;ui.planPicker=null;
 }
 return setTab(val);
}
if(a==='edit-plan'){
 ui.editWorkout=ui.chosen;ui.editRows=null;ui.editSelected=null;ui.planPicker=null;
 return setTab('settings');
}
if(a==='pick-plan'){
 if(!readEditor())return;
 if(planDirty()&&!confirm('Изменения не сохранены. Перейти к другой тренировке?'))return;
 ui.editWorkout=val;ui.editRows=null;ui.editSelected=null;ui.planPicker=null;return render();
}
if(a==='plan-select'){
 if(!readEditor())return;
 const i=Number(b.dataset.index);
 if(!Number.isInteger(i)||i<0||i>=editRows().length)return;
 ui.editSelected=ui.editSelected===i?null:i;ui.planPicker=null;return render();
}
if(a==='plan-move'){
 if(!readEditor())return;
 const rows=editRows(),i=ui.editSelected,j=i+Number(b.dataset.diff);
 if(i==null||!Number.isInteger(j)||j<0||j>=rows.length)return;
 [rows[i],rows[j]]=[rows[j],rows[i]];ui.editSelected=j;return render();
}
if(a==='plan-remove'){
 if(!readEditor())return;
 const rows=editRows(),i=ui.editSelected;
 if(i==null||rows.length<=1)return notify('В программе должно быть хотя бы одно упражнение');
 rows.splice(i,1);ui.editSelected=Math.min(i,rows.length-1);ui.planPicker=null;return render();
}
if(a==='plan-add-open'||a==='plan-replace-open'){
 if(!readEditor())return;
 if(a==='plan-replace-open'&&ui.editSelected==null)return;
 ui.planPicker=a==='plan-add-open'?'add':'replace';
 return render();
}
if(a==='plan-close-picker'){if(!readEditor())return;ui.planPicker=null;return render()}
if(a==='plan-add'||a==='plan-replace'){
 if(!readEditor())return;
 if(!CUES[val])return;
 const rows=editRows();
 if(rows.some((x,i)=>x[0]===val&&(a!=='plan-replace'||i!==ui.editSelected)))return notify('Это упражнение уже в плане');
 const next=[val,3,8,12,null,null,null,val==='bulgar'];
 if(a==='plan-replace'){
  if(ui.editSelected==null)return;
  rows[ui.editSelected]=next;
 }else{
  if(rows.length>=30)return notify('Максимум 30 упражнений');
  rows.push(next);ui.editSelected=rows.length-1;
 }
 ui.planPicker=null;return render();
}
if(a==='plan-cancel'){
 ui.editRows=null;ui.editSelected=null;ui.planPicker=null;
 render();return notify('Изменения отменены');
}
if(a==='plan-reset'){
 if(!confirm('Вернуть исходный план? Для применения нажми «Сохранить план».'))return;
 ui.editRows=PROGRAM[ui.editWorkout].items.map(x=>x.slice());
 ui.editSelected=null;ui.planPicker=null;return render();
}
if(a==='plan-save'){
 if(!readEditor())return;
 if(!planDirty())return notify('Изменений нет');
 const rows=editRows();
 const ids=rows.map(x=>x[0]);
 if(new Set(ids).size!==ids.length)return notify('Упражнения не должны повторяться');
 const programOverrides={...db.programOverrides};
 if(JSON.stringify(rows)===JSON.stringify(PROGRAM[ui.editWorkout].items))delete programOverrides[ui.editWorkout];
 else programOverrides[ui.editWorkout]=rows.map(x=>x.slice());
 if(!save({...db,programOverrides}))return;
 ui.editRows=null;ui.editSelected=null;ui.planPicker=null;render();
 return notify('План сохранён');
}
if(a==='choose'){ui.chosen=val;ui.goodWeather=false;return render()}if(a==='start')return start();if(a==='pause-workout')return pauseWorkout();if(a==='resume-workout')return resumeWorkout();if(a==='ofp'){const k=dayKey();const ofpDays=db.ofpDays.includes(k)?db.ofpDays.filter(x=>x!==k):[...db.ofpDays,k];if(save({...db,ofpDays}))return render()}if(a==='step'){const inp=document.querySelector(`.reps[data-slot="${slot}"]`);if(inp){inp.value=Math.max(1,Math.min(300,(Number(inp.value)||1)+Number(b.dataset.diff)));ui.drafts[slot]=Number(inp.value)}return}if(a==='log')return logSet(slot);if(a==='focus-exercise'&&db.active){ui.focusSlot=slot;return render()}if(a==='exercise-list'){document.getElementById('focus-all')?.setAttribute('open','');return}if(a==='next-exercise'&&db.active){const es=db.active.exercises,at=es.findIndex(x=>x.slot===activeSlot(db.active).slot);ui.focusSlot=es[Math.min(at+1,es.length-1)].slot;return render()}if(a==='undo'){const s=db.active;const index=s?.logs.map(x=>x.slot).lastIndexOf(slot);if(index>=0){const active={...s,logs:s.logs.filter((_,i)=>i!==index),rest:null};if(save({...db,active}))render()}return}if(a==='skip-rest'&&db.active){if(save({...db,active:{...db.active,rest:null}}))return render()}if(a==='more-rest'&&db.active?.rest){const rest={...db.active.rest,until:db.active.rest.until+30000,duration:db.active.rest.duration+30};if(save({...db,active:{...db.active,rest}}))return render()}if(a==='finish')return finish();if(a==='discard'&&confirm('Отменить тренировку? Все отметки текущего занятия будут потеряны.')){if(save({...db,active:null}))return render()}if(a==='view'){ui.showSession=b.dataset.id;return render()}if(a==='back-history'){ui.showSession=null;return render()}if(a==='delete-session'&&confirm('Удалить тренировку без возможности восстановления (кроме сохранённого JSON)?')){if(!save({...db,sessions:db.sessions.filter(s=>s.id!==b.dataset.id)}))return;ui.showSession=null;ui.chosen=nextWorkout();return render()}if(a==='chart'){ui.chart=val;return render()}if(a==='save-measure')return saveMeasure();if(a==='delete-measure'&&confirm('Удалить это измерение?')){if(save({...db,measures:db.measures.filter(m=>m.id!==b.dataset.id)}))return render()}if(a==='export-json')return download('forma-backup-'+dayKey()+'.json',JSON.stringify(db,null,2),'application/json');if(a==='import')return document.getElementById('importFile').click();if(a==='clear'&&confirm('Точно удалить ВСЕ данные приложения? Рекомендуется сначала скачать JSON.')&&confirm('Подтверди удаление ещё раз.')){if(!save(EMPTY()))return;ui.editRows=null;ui.editSelected=null;ui.planPicker=null;ui.chosen='A';ui.tab='today';return render()}});
document.addEventListener('change',e=>{if(e.target.id==='themeChoice'){themeChoice=e.target.value;applyTheme();try{localStorage.setItem(THEME_KEY,themeChoice)}catch(_){notify('Тема изменена, но браузер не смог сохранить выбор')}return}if(e.target.id==='outdoor'){ui.goodWeather=e.target.checked;render()}if(e.target.id==='importFile'){handleFile(e.target.files[0]);e.target.value=''}});
document.addEventListener('input',e=>{if(e.target.id==='planSearch'){const q=e.target.value.trim().toLocaleLowerCase('ru');document.querySelectorAll('.plan-choice').forEach(x=>{x.hidden=!x.dataset.search.includes(q)})}if(e.target.classList.contains('reps'))ui.drafts[Number(e.target.dataset.slot)]=Number(e.target.value);if(e.target.id==='note'&&db.active){save({...db,active:{...db.active,note:e.target.value}})}});
window.addEventListener('storage',e=>{if(e.key===DB_KEY){db=load();if(ui.editRows!==null){ui.editRows=null;ui.editSelected=null;ui.planPicker=null;notify('Данные изменены в другой вкладке. Редактор обновлён.')}render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateClock()});
if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
ui.chosen=nextWorkout();render();
</script>
