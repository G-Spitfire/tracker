<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Школа — тест обновлений</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#202735;background:#f6f7fb}body{max-width:520px;margin:0 auto;padding:24px 16px}main{background:white;padding:24px;border-radius:20px}h1{font-size:24px}p{color:#576273;line-height:1.5}button{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:#3156c7;color:white;font-size:16px;font-weight:600;margin:12px 0}button:disabled{opacity:.5}#result{white-space:pre-wrap;line-height:1.55;background:#f0f3f8;border-radius:12px;padding:16px;min-height:90px}.note{font-size:13px}</style></head><body><main><h1>Проверка обновлений «Школы»</h1><p>Нажимай кнопки по порядку. Используются только вымышленные оценки.</p><button data-mode="first">1. Загрузить оценки</button><button data-mode="second">2. Получить обновление</button><button data-mode="local">3. Проверить сохранённые данные</button><div id="result" role="status">Начни с первой кнопки.</div><p class="note">Третья кнопка работает без сетевого запроса, но не доказывает, что сама страница откроется при отключённом интернете.</p></main><script>
const out=document.querySelector('#result'),te=new TextEncoder(),td=new TextDecoder(),storageKey='school-sync-check-v2';
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(e){if(e.format!==1||e.iterations!==250000||e.kdf!=='PBKDF2-SHA256')throw Error('Неподдерживаемый формат');
const material=await crypto.subtle.importKey('raw',te.encode('demo-only-not-for-real-data'),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(e.salt),iterations:e.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
const d=JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(e.iv)},key,decode(e.ciphertext))));
if(d.test!==true||d.source!=='github-fixture'||!Array.isArray(d.grades))throw Error('Неверное содержимое');
return d;}
async function run(mode){
const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);out.textContent='Проверяем…';
try{
let envelope,data;
if(mode==='local'){const raw=localStorage.getItem(storageKey);if(!raw)throw Error('Сохранённой копии нет. Сначала выполни шаг 1');envelope=JSON.parse(raw);data=await decrypt(envelope);out.textContent='✓ Локальная копия расшифрована без запроса к GitHub\nОценки: '+data.grades.join(', ')+'\n\nТеперь можно перезагрузить страницу и повторить шаг 3 при наличии интернета.';return;}
const filename=mode==='first'?'data.enc.json':'data-v2.enc.json';
const response=await fetch('./'+filename+'?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);
envelope=await response.json();data=await decrypt(envelope);
if(mode==='second'&&data.revision!==2)throw Error('Неверная версия обновления');
if(mode==='first'&&data.revision===2)throw Error('Неверная исходная версия');
localStorage.setItem(storageKey,JSON.stringify(envelope));
const reread=await decrypt(JSON.parse(localStorage.getItem(storageKey)));if(JSON.stringify(reread)!==JSON.stringify(data))throw Error('Сохранение не подтверждено');
out.textContent=(mode==='first'?'✓ Исходные данные загружены':'✓ Обновление загружено')+'\n✓ Расшифровка успешна\n✓ Локальная копия сохранена\n\nОценки: '+data.grades.join(', ')+(mode==='second'?'\n\nПоявилась новая пятёрка.':'');
}catch(e){out.textContent='Ошибка: '+e.message}finally{buttons.forEach(b=>b.disabled=false)}}
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>run(b.dataset.mode)));
</script></body></html>
