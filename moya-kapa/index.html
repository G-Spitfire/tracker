<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#147b67"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Моя капа"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="app.css"><title>Моя капа 2.1</title></head><body><main class="app"><header class="head"><h1>Моя капа</h1><button class="header-link" id="historyLink" type="button" aria-label="Открыть календарь">▦</button></header><section id="page-today" class="page"><div class="card hero"><div class="eyebrow">Сегодня носила</div><div class="ring" id="progress" role="progressbar" aria-label="Дневная цель" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="ring-inner"><div class="bigtime" id="todayTime">00:00</div><div class="muted" id="goalLabel">из 20 минут</div><div class="remaining" id="remaining"></div></div></div><button class="primary" id="toggle" type="button">Надела капу</button><div class="muted smalltext" id="timerHint">Можно носить несколько раз в день</div></div><div class="card"><div class="row"><h2 class="sectiontitle">Сеансы сегодня</h2><strong id="sessionTotal"></strong></div><div id="todaySessions" class="list"></div></div><div class="card" id="nightCard" hidden><h2 class="sectiontitle">Прошлая ночь</h2><div class="muted smalltext" id="nightDate"></div><div class="night-buttons"><button class="subtle" data-night="all" type="button">Носила</button><button class="subtle" data-night="none" type="button">Не носила</button></div></div><div class="home-links"><button class="link-card" id="openHistory" type="button">▦ <span>История<small>Календарь ношения</small></span></button><button class="link-card" id="openAwards" type="button">★ <span>Награды<small>Мои достижения</small></span></button></div></section><section id="page-history" class="page" hidden><button class="back" data-back type="button">← На главную</button><h2>История</h2><div class="card"><div class="calendar-head"><button id="prevMonth" aria-label="Предыдущий месяц">‹</button><h3 id="monthTitle"></h3><button id="nextMonth" aria-label="Следующий месяц">›</button></div><div class="calendar" id="calendar"></div><div class="muted smalltext" id="selectedSummary"></div></div></section><section id="page-awards" class="page" hidden><button class="back" data-back type="button">← На главную</button><h2>Мои достижения</h2><div id="awards" class="awards-grid"></div></section><div class="toast" id="toast" role="status" hidden></div></main><script type="module" src="app.js"></script></body></html>
