const TODAY=new Date();TODAY.setHours(12,0,0,0);const iso=d=>{let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};const offset=n=>{let d=new Date(TODAY);d.setDate(d.getDate()+n);return iso(d)};const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const SCHOOL_QUARTERS=[{start:'2026-09-01',end:'2026-10-23'},{start:'2026-11-04',end:'2026-12-30'},{start:'2027-01-11',end:'2027-03-26'},{start:'2027-04-05',end:'2027-05-26'}];
const currentQuarter=()=>{const d=iso(TODAY);const active=SCHOOL_QUARTERS.findIndex(q=>d>=q.start&&d<=q.end);if(active>=0)return String(active+1);let last=-1;for(let i=0;i<SCHOOL_QUARTERS.length;i++){if(d>SCHOOL_QUARTERS[i].end)last=i}return String(last>=0?last+1:1)};

function mapDiaryChild(raw,name){
 const subjectsMap=new Map();
 const ensure=(id,label)=>{const key=String(id||label);if(!subjectsMap.has(key))subjectsMap.set(key,{name:label||'Без названия',grades:[]});return subjectsMap.get(key)};
 (raw.marks||[]).forEach(m=>{const sub=ensure(m.subjectId,m.subject);sub.grades.push({value:Number(m.value),date:m.date,test:/контрольн|проверочн|тест|диктант|самостоятельн/i.test(m.type||''),homework:/домашн/i.test(m.type||''),type:m.type||'',comment:m.comment||null,id:m.id,lessonId:m.lessonId})});
 (raw.lessons||[]).forEach(l=>ensure(l.subjectId,l.subject));
 const schedule=(raw.schedule||[]).filter(l=>l&&l.from&&l.subjectId).slice().sort((a,b)=>a.from.localeCompare(b.from));
 const today=iso(TODAY);
 // Only the latest completed lesson for each subject can supply its current assignment.
 // Older lessons are historical and must not be reassigned to a future lesson.
 const latestBySubject=new Map();
 (raw.lessons||[]).filter(l=>l&&l.from&&l.from.slice(0,10)<=today).forEach(l=>{
  const key=String(l.subjectId||l.subject);
  const previous=latestBySubject.get(key);
  if(!previous||l.from>previous.from)latestBySubject.set(key,l);
 });

 for(const l of latestBySubject.values()){
  const next=schedule.find(x=>String(x.subjectId)===String(l.subjectId)&&x.from.slice(0,10)>today);
  const seen=new Set();
  for(const t of l.tasks||[]){
   const name=String(t.name||'').trim();
   if(!name||/^(?:не задано|домашнее задание(?:\s*:\s*не задано)?)\s*$/i.test(name))continue;

   if(seen.has(key))continue;
   seen.add(key);

}

function noticeData(){const data=readStoredJSON(NOTICE_KEY,null);return data&&Array.isArray(data.events)&&Array.isArray(data.baseline)?data:{events:[],baseline:null,seen:[]}}

 const data=noticeData(),current=noticeCurrent(),today=iso(TODAY),seen=new Set([...(data.seen||[]),...(data.baseline||[])]),values=data.values||{};

function noticeList(){try{return noticeData().events.filter(e=>e.kind==='grade'&&e.child===state.child&&(!e.read||(e.readDay||e.day)>=offset(-6))).sort((a,b)=>b.day.localeCompare(a.day))}catch{return []}}

function noticeRead(child,keys){const data=noticeData();for(const e of data.events)if(e.child===child&&keys.includes(e.noticeId||e.id)){e.read=true;e.readDay=iso(TODAY)}saveSetting(NOTICE_KEY,JSON.stringify(data))}
function homeworkIdentity(task){
 const value=JSON.stringify([task.lessonId||'',task.subject,task.text,task.kind||'']);
 // Two compact checksums keep homework text out of localStorage.
 let h1=2166136261,h2=0x9e3779b9;
 for(let i=0;i<value.length;i++){const c=value.charCodeAt(i);h1=Math.imul(h1^c,16777619);h2=Math.imul(h2^(c+i),2246822519)}
 return (h1>>>0).toString(36)+'-'+(h2>>>0).toString(36)+'-'+value.length;
}
function readStoredJSON(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch{return fallback}}
function trackHomeworkChanges(){
 const today=iso(TODAY);
 const previous=readStoredJSON(HOMEWORK_BASELINE_KEY,null);
 const next=kids.map(k=>k.tasks.map(homeworkIdentity));
 if(previous&&Array.isArray(previous)&&previous.length===2){
  const events=readStoredJSON(HOMEWORK_EVENTS_KEY,[]);
  const retained=Array.isArray(events)?events.filter(e=>e&&e.day===today&&[0,1].includes(e.child)):[];
  for(let child=0;child<2;child++){
   const old=new Set(Array.isArray(previous[child])?previous[child]:[]);
   for(const task of kids[child].tasks){
    const id=homeworkIdentity(task);
    if(!old.has(id)&&!retained.some(e=>e.child===child&&e.id===id)){
     retained.push({child,id,day:today});
    }
   }
  }
  saveSetting(HOMEWORK_EVENTS_KEY,JSON.stringify(retained.slice(-100)));
 }else{
  saveSetting(HOMEWORK_EVENTS_KEY,JSON.stringify([]));

}
function recentUpdates(){

 const byId=new Map(kids[state.child].tasks.map(task=>[homeworkIdentity(task),task]));

function applyDiary(data,source='network'){
 if(!data||data.schemaVersion!==1||!data.children?.polina||!data.children?.matvey)throw new Error('Неполный набор данных дневника');
 kids[0]=mapDiaryChild(data.children.polina,'Полина');kids[1]=mapDiaryChild(data.children.matvey,'Матвей');
 if(source==='network')trackHomeworkChanges();
 dataSource=source==='cache'?'cached':'live';diaryUpdatedAt=data.generatedAt||null;syncWarning=null;

function weeklyDynamics(subjects, today=TODAY){
 const dateAt=offset=>{const d=new Date(today);d.setDate(d.getDate()+offset);return iso(d)};
 const first=dateAt(-13),cutoff=dateAt(-7),last=dateAt(0);
 const pairs=subjects.map(s=>{
  const previous=s.grades.filter(g=>g.date>=first&&g.date<=cutoff);
  const current=s.grades.filter(g=>g.date>cutoff&&g.date<=last);
  return previous.length&&current.length?[mean(previous.map(g=>g.value)),mean(current.map(g=>g.value))]:null;
 }).filter(Boolean);
 if(!pairs.length)return null;
 const previous=mean(pairs.map(p=>p[0])),current=mean(pairs.map(p=>p[1]));
 const delta=Math.round((current-previous+Number.EPSILON)*100)/100;
 return {previous,current,cutoff,delta,direction:delta>0?'positive':delta<0?'negative':'zero'};
}

let state={tab:'home',child:readSetting('school-active-child','0')==='1'?1:0,gradesView:'grades',quarter:currentQuarter(),testsOnly:false,twosOnly:false,chart:'line',hw:'tomorrow',date:iso(TODAY),week:0,theme:readSetting('school-theme','system'),accent:readSetting('school-accent','#4c8bf5'),returnTab:'home'};
const main=document.querySelector('#main'),nav=document.querySelector('#nav');const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;const fmt=n=>n.toFixed(2).replace('.',',');const gradeData=()=>kids[state.child].subjects.flatMap(s=>s.grades).filter(g=>inQuarter(g.date));
const quarterRange=q=>SCHOOL_QUARTERS[Number(q)-1];const inQuarter=date=>{const q=quarterRange(state.quarter);return !!q&&date>=q.start&&date<=q.end};const score=()=>SchoolAnalytics.overallAverage(kids[state.child].subjects,state.quarter,SCHOOL_QUARTERS);const setTab=t=>{if(state.tab===t)return;state.tab=t;render();window.scrollTo({top:0,left:0,behavior:'instant'})};const btns=(items,current,handler)=>'<div class="seg">'+items.map(([v,l])=>'<button data-action="'+handler+'" data-value="'+v+'" class="'+(v===current?'active':'')+'">'+l+'</button>').join('')+'</div>';
// Every December the fifth KPI temporarily displays a New Year countdown.
function holidayInfo(){const now=new Date();return now.getMonth()===11?{days:31-now.getDate()}:null;}
function completedCleanStreak(kid,today){
 const dates=[...new Set([...(kid.lessons||[]),...(kid.schedule||[])].map(l=>String(l?.from||'').slice(0,10)).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&d<today&&inQuarter(d)))].sort().reverse();
 const bad=new Set(kid.subjects.flatMap(s=>s.grades.filter(g=>g.value===2||g.value===3).map(g=>g.date)));

}
function home(){
 const all=gradeData(),counts=[5,4,3,2].map(n=>all.filter(g=>g.value===n).length),colors=['#31ad81','#538fe0','#e8ac45','#e36565'];
 const today=iso(TODAY),weekly=weeklyDynamics(kids[state.child].subjects);

 let out='<section class="home-screen"><div class="stats-grid">'+

 tile('Доля пятёрок',fiveShare+'%','От всех оценок','star')+

 '</div>'+'<div class="home-switch">'+btns([['line','Линейный'],['ring','Кольцевой']],state.chart,'chart')+'</div><div class="home-visual">';

  out+='<div class="home-ring-layout"><svg class="home-ring" viewBox="0 0 200 200" aria-label="Распределение оценок"><circle cx="100" cy="100" r="72" stroke="var(--soft)" stroke-width="25" fill="none"/>'+counts.map((n,i)=>{let part='<circle cx="100" cy="100" r="72" fill="none" stroke="'+colors[i]+'" stroke-width="25" stroke-dasharray="'+(n/all.length*circumference)+' '+circumference+'" stroke-dashoffset="'+(-cum/all.length*circumference)+'" transform="rotate(-90 100 100)"/>';cum+=n;return part}).join('')+'<text x="100" y="99" text-anchor="middle" fill="var(--fg)" font-size="37" font-weight="700">'+all.length+'</text><text x="100" y="119" text-anchor="middle" fill="var(--muted)" font-size="12">оценок</text></svg><div class="home-legend">'+counts.map((n,i)=>'<div class="home-legend-item"><span class="home-dot" style="background:'+colors[i]+'"></span><span>'+['Пятёрки','Четвёрки','Тройки','Двойки'][i]+'</span><b>'+n+'</b></div>').join('')+'</div></div>';
 }else{
  let sorted=all.slice().sort((a,b)=>a.date.localeCompare(b.date)),dates=[...new Set(sorted.map(g=>g.date))],history=dates.map(d=>mean(kids[state.child].subjects.map(s=>s.grades.filter(g=>inQuarter(g.date)&&g.date<=d)).filter(g=>g.length).map(g=>mean(g.map(x=>x.value))))),low=history.some(v=>v<2)?1:2,base=154+(2-low)*47,points=history.map((v,i)=>[24+(i/Math.max(1,history.length-1))*318,base-(v-low)*47]);

 }
 return out+'</div></section>';
}
const subjectTrend=grades=>{const ordered=grades.map((g,i)=>({...g,_order:i})).sort((a,b)=>a.date.localeCompare(b.date)||a._order-b._order);const count=ordered.length;if(count<3)return '<span class="subject-trend neutral" aria-label="Недостаточно оценок для динамики">—</span>';const size=count>=6?3:count>=4?2:1;const previous=mean(ordered.slice(-2*size,-size).map(g=>g.value));const current=mean(ordered.slice(-size).map(g=>g.value));const delta=current-previous;const rounded=Math.round(Math.abs(delta)*10)/10;if(rounded===0)return '<span class="subject-trend neutral" aria-label="Без изменений">—</span>';const up=delta>0;return '<span class="subject-trend '+(up?'up':'down')+'" aria-label="'+(up?'Рост':'Снижение')+' среднего последних '+size+' оценок на '+rounded.toFixed(1).replace('.',',')+'">'+(up?'↗ +':'↘ −')+rounded.toFixed(1).replace('.',',')+'</span>'};
function grades(){
 const tabs='<div class="grades-tabs">'+btns([['grades','Оценки'],['forecast','Прогноз']],state.gradesView,'grades-view')+'</div>';
 const period='';

function homework(){

let checkingVersion=false;
async function checkForUpdate(){
 if(checkingVersion||!navigator.onLine)return;
 checkingVersion=true;
 try{
  const response=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});
  if(!response.ok)return;
  const data=await response.json();
  if(!data||typeof data.version!=='string'||!/^\d+\.\d+(?:\.\d+)?$/.test(data.version)||data.version===APP_VERSION)return;
  const target=new URL(location.href);
  const currentParam=target.searchParams.get('v');
  const targetParam=data.version.replace(/\./g,'');
  if(currentParam===targetParam)return;
  const attemptKey='school-update-attempt-'+data.version;
  if(sessionStorage.getItem(attemptKey)==='1')return;
  sessionStorage.setItem(attemptKey,'1');
  target.searchParams.set('v',targetParam);
  location.replace(target.href);
 }catch(e){/* Offline or unavailable version endpoint: keep the current app usable. */}
 finally{checkingVersion=false}
}

async function loadDiarySnapshot(fromDialog=false,background=false){

  applyDiary(result.data,result.source);if(result.source==='network')noticeTrack();
