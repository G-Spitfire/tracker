function home(){

function grades(){return '<div class="row" style="margin-bottom:7px">'+btns([['all','Все'],['tests','Контрольные']],state.filter,'filter')+'<span class="sub"><span class="dot" style="background:var(--accent)"></span>Новые</span></div>'+kids[state.child].subjects.map(s=>{let visible=s.grades.filter(g=>state.filter==='all'||g.test);if(!visible.length)return '';return '<section class="subject"><div class="row"><strong>'+escapeHTML(s.name)+'</strong><strong>'+fmt(mean(s.grades.map(g=>g.value)))+'</strong></div><div class="marks">'+visible.map(g=>'<button class="mark '+(g.date>=offset(-1)&&g.date<=iso(TODAY)?'new':'')+'" data-action="grade" data-value="'+encodeURIComponent(JSON.stringify({subject:s.name,...g}))+'" aria-label="Оценка '+g.value+' за '+g.date+'">'+g.value+'</button>').join('')+'</div></section>'}).join('')}

function profile(){return '<div class="heading">Ученик</div><div class="seg">'+kids.map((k,i)=>'<button data-action="child" data-value="'+i+'" class="'+(i===state.child?'active':'')+'">'+escapeHTML(k.name)+'</button>').join('')+'</div><h3 class="heading">Оформление</h3><div class="sub" style="margin-bottom:7px">Тема</div>'+btns([['system','Системная'],['light','Светлая'],['dark','Тёмная']],state.theme,'theme')+'<div class="sub" style="margin-top:15px">Акцентный цвет</div><div class="swatches">'+[['#4c8bf5','Синий'],['#22a77a','Зелёный'],['#9168de','Фиолетовый'],['#e68b39','Оранжевый']].map(([c,name])=>'<button class="swatch" style="background:'+c+'" data-action="accent" data-value="'+c+'" aria-label="'+name+'">'+(state.accent===c?'✓':'')+'</button>').join('')+'</div><h3 class="heading">Электронный дневник</h3><div class="sub">Петербургское образование</div><p class="notice">Подключение электронного дневника — в разработке. Сейчас используются только демонстрационные данные.</p>'}
function render(){document.documentElement.dataset.theme=state.theme;document.documentElement.style.setProperty('--accent',state.accent);document.querySelector('#title').textContent=({home:'Главная',grades:'Оценки',schedule:'Расписание',homework:'Домашка',profile:'Профиль'})[state.tab];document.querySelector('#profile').innerHTML=ico(state.tab==='profile'?'close':'profile');main.innerHTML=({home,grades,schedule,homework,profile})[state.tab]();nav.innerHTML=[['home','home','Главная'],['grades','grades','Оценки'],['schedule','schedule','Расписание'],['homework','homework','Домашка']].map(([id,icon,name])=>'<button data-action="tab" data-value="'+id+'" class="'+(state.tab===id?'active':'')+'"><span class="symbol">'+ico(icon)+'</span>'+name+'</button>').join('')}
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})}document.querySelector('#profile').addEventListener('click',()=>{if(state.tab==='profile')setTab(state.returnTab);else{state.returnTab=state.tab;setTab('profile')}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){fetch('./version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{if(v&&v.version!=='1.10'&&!sessionStorage.getItem('school-reload-'+v.version)){sessionStorage.setItem('school-reload-'+v.version,'1');location.reload()}}).catch(()=>{})}});document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,v=b.dataset.value;switch(a){case'tab':setTab(v);return;case'grade':{let g=JSON.parse(decodeURIComponent(v));let overlay=document.createElement('div');overlay.className='detail-overlay';overlay.innerHTML='<div class="detail-box"><h3>'+escapeHTML(g.subject)+'</h3><p>Оценка: <b>'+g.value+'</b></p><p>Дата: '+new Date(g.date+'T12:00:00').toLocaleDateString('ru-RU')+'</p><p>Тип работы: '+(g.test?'Контрольная':'Обычная')+'</p><button class="icon" data-action="close-detail">Закрыть</button></div>';document.body.appendChild(overlay);overlay.addEventListener('click',ev=>{if(ev.target===overlay||ev.target.closest('[data-action="close-detail"]'))overlay.remove()});return}case'close-detail':b.closest('.detail-overlay')?.remove();return;case'filter':state.filter=v;break;case'chart':state.chart=v;break;case'hw':state.hw=v;break;case'child':state.child=+v;break;case'theme':state.theme=v;localStorage.setItem('school-theme',v);break;case'accent':state.accent=v;localStorage.setItem('school-accent',v);break;case'date':state.date=v;break;case'week':state.week+=+v;{let d=new Date(state.date+'T12:00:00');d.setDate(d.getDate()+7*(+v));state.date=iso(d)}break;}render()});render();
</script></body></html>
