<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fb"><title>Школа</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}:root{--bg:#f7f8fb;--surface:#fff;--fg:#202734;--muted:#788393;--line:#e9edf3;--soft:#f0f3f8;--accent:#4c8bf5;--on:#fff}html[data-theme=dark]{--bg:#111720;--surface:#1c2430;--fg:#f3f5fa;--muted:#9ba9bb;--line:#313c4b;--soft:#293443} @media(prefers-color-scheme:dark){html[data-theme=system]{--bg:#111720;--surface:#1c2430;--fg:#f3f5fa;--muted:#9ba9bb;--line:#313c4b;--soft:#293443}}
.app{max-width:550px;margin:auto;min-height:100dvh;background:var(--surface);padding:12px 13px 88px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.head h1{font-size:20px;margin:0}.icon{background:var(--soft);border:0;border-radius:11px;padding:8px 11px;color:var(--fg);font-size:18px}.sub{color:var(--muted);font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.seg{display:flex;background:var(--soft);padding:3px;border-radius:10px;gap:2px}.seg button{flex:1;border:0;background:none;border-radius:8px;color:var(--muted);padding:8px 7px;font:inherit;white-space:nowrap}.seg button.active{background:var(--surface);color:var(--fg);font-weight:650;box-shadow:0 1px 4px #0001}.subject{padding:10px 2px;border-bottom:1px solid var(--line)}.subject:last-child{border:0}.subject strong{font-weight:600}.marks{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.mark{width:29px;height:29px;background:var(--soft);border-radius:6px;display:grid;place-items:center;font-weight:550}.mark.new{background:var(--accent);color:#fff}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:550px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}.bottom button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;gap:3px;align-items:center;font-size:10px;padding:7px 0}.bottom button.active{color:var(--accent);font-weight:700}.bottom .symbol{font-size:19px}.metric{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.big{font-size:31px;font-weight:750}.delta{font-size:20px;font-weight:700}.chart{width:100%;max-height:240px}.donutwrap{display:flex;align-items:center;gap:8px}.donutwrap svg{width:52%;max-width:210px}.legend{display:grid;gap:11px;font-size:13px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.calendar button{background:none;border:0;border-radius:9px;padding:10px 0;color:var(--fg)}.calendar button.active{background:var(--accent);color:#fff}.lesson{display:flex;gap:12px;padding:11px 3px;border-bottom:1px solid var(--line)}.task{padding:11px 2px;border-bottom:1px solid var(--line)}.task p{margin:5px 0 0}.field{display:grid;gap:5px;margin:12px 0}.field input,.field select{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:9px;color:var(--fg);padding:12px;font:inherit}.swatches{display:flex;gap:13px;margin:11px 0 18px}.swatch{width:39px;height:39px;border:0;border-radius:50%;color:white;font-size:19px}.notice{font-size:12px;color:var(--muted);margin-top:14px}.heading{font-size:15px;margin:16px 0 10px}.empty{color:var(--muted);padding:24px 4px;text-align:center}
</style></head><body><div class="app"><header class="head"><h1 id="title">Главная</h1><button class="icon" id="profile" aria-label="Профиль">♙</button></header><main id="main"></main></div><nav class="bottom" id="nav"></nav>
<script>
const TODAY=new Date();TODAY.setHours(12,0,0,0);const iso=d=>{let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};const offset=n=>{let d=new Date(TODAY);d.setDate(d.getDate()+n);return iso(d)};const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sample=(name,shift)=>({name,subjects:['Математика','Русский язык','Литература','Английский','История','Биология','География'].map((subject,i)=>({name:subject,grades:[-19,-13,-8,-4,-1,0].filter((_,j)=>(i+j+shift)%5!==0).map((d,j)=>({value:[5,4,5,3,4,5,5][(i+j+shift)%7],date:offset(d),test:(i+j+shift)%3===0}))})),lessons:['Русский язык','Математика','Английский язык','История','Литература','Физкультура'],tasks:[{subject:'Математика',text:'№ 245–248, стр. 76',due:offset(1)},{subject:'Русский язык',text:'Упр. 132, правило',due:offset(1)},{subject:'Английский',text:'Слова, стр. 42',due:offset(2)},{subject:'История',text:'§ 12',due:offset(5)},{subject:'Биология',text:'Подготовить сообщение',due:offset(7)}]});
const kids=[sample('Полина',0),sample('Матвей',2)];let state={tab:'home',child:0,filter:'all',chart:'ring',hw:'tomorrow',date:iso(TODAY),week:0,theme:localStorage.getItem('school-theme')||'system',accent:localStorage.getItem('school-accent')||'#4c8bf5',returnTab:'home'};
const main=document.querySelector('#main'),nav=document.querySelector('#nav');const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;const fmt=n=>n.toFixed(2).replace('.',',');const gradeData=()=>kids[state.child].subjects.flatMap(s=>s.grades);const score=()=>mean(gradeData().map(g=>g.value));const setTab=t=>{state.tab=t;render()};const btns=(items,current,handler)=>'<div class="seg">'+items.map(([v,l])=>'<button data-action="'+handler+'" data-value="'+v+'" class="'+(v===current?'active':'')+'">'+l+'</button>').join('')+'</div>';
function home(){let all=gradeData(),counts=[5,4,3,2].map(n=>all.filter(g=>g.value===n).length),colors=['#31ad81','#538fe0','#e8ac45','#e36565'];let schoolDates=[...new Set(all.map(g=>g.date))].sort().slice(-3),recent=all.filter(g=>schoolDates.includes(g.date)),delta=mean(recent.map(g=>g.value))-score();let out='<div class="metric"><div><div class="sub">Средний балл</div><div class="big">'+fmt(score())+'</div><div style="text-align:right"><div class="sub">Динамика · 3 учебных дня</div><div class="delta" style="color:'+(delta>0?'#31ad81':delta<0?'#d76a6a':'var(--fg)')+'">'+(delta>0?'+':'')+fmt(delta)+'</div></div></div>'+btns([['line','Линейный'],['ring','Кольцевой']],state.chart,'chart');
if(state.chart==='ring'){let circumference=2*Math.PI*72,cum=0;out+='<div class="donutwrap"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="72" stroke="var(--soft)" stroke-width="26" fill="none"/>'+counts.map((n,i)=>{let segment='<circle cx="100" cy="100" r="72" fill="none" stroke="'+colors[i]+'" stroke-width="26" stroke-dasharray="'+(n/all.length*circumference)+' '+circumference+'" stroke-dashoffset="'+(-cum/all.length*circumference)+'" transform="rotate(-90 100 100)"/>';cum+=n;return segment}).join('')+'<text x="100" y="99" text-anchor="middle" fill="var(--fg)" font-size="37" font-weight="700">'+all.length+'</text><text x="100" y="119" text-anchor="middle" fill="var(--muted)" font-size="12">оценок</text></svg><div class="legend">'+counts.map((n,i)=>'<div><span class="dot" style="background:'+colors[i]+'"></span>'+['Пятёрки','Четвёрки','Тройки','Двойки'][i]+': <b>'+n+'</b></div>').join('')+'</div></div>'}else{let sorted=all.slice().sort((a,b)=>a.date.localeCompare(b.date));let dates=[...new Set(sorted.map(g=>g.date))],history=dates.map(d=>mean(sorted.filter(g=>g.date<=d).map(g=>g.value)));let points=history.map((v,i)=>[36+(i/Math.max(1,history.length-1))*288,175-(v-2)*55]);let trend=history.length>1?history.at(-1)-history[0]:0;out+='<svg class="chart" viewBox="0 0 350 205">'+[3,4,5].map(n=>'<line x1="36" x2="327" y1="'+(175-(n-2)*55)+'" y2="'+(175-(n-2)*55)+'" stroke="var(--line)"/><text x="27" y="'+(180-(n-2)*55)+'" font-size="11" text-anchor="end" fill="var(--muted)">'+n+'</text>').join('')+'<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="'+points.map(p=>p.join(',')).join(' ')+'"/><line x1="36" y1="'+points[0][1]+'" x2="324" y2="'+points.at(-1)[1]+'" stroke="'+(trend>=0?'#31ad81':'#d76a6a')+'" stroke-dasharray="4 5" stroke-width="1" opacity=".6"/>'+points.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.6" fill="var(--accent)"/>').join('')+'<text x="36" y="198" font-size="11" fill="var(--muted)">'+dates[0].slice(5)+'</text><text x="324" y="198" text-anchor="end" font-size="11" fill="var(--muted)">'+dates.at(-1).slice(5)+'</text></svg>'}return out}
function grades(){return '<div class="row" style="margin-bottom:7px">'+btns([['all','Все'],['tests','Контрольные']],state.filter,'filter')+'<span class="sub"><span class="dot" style="background:var(--accent)"></span>Новые</span></div>'+kids[state.child].subjects.map(s=>{let visible=s.grades.filter(g=>state.filter==='all'||g.test);if(!visible.length)return '';return '<section class="subject"><div class="row"><strong>'+escapeHTML(s.name)+'</strong><strong>'+fmt(mean(s.grades.map(g=>g.value)))+'</strong></div><div class="marks">'+visible.map(g=>'<span class="mark '+(g.date>=offset(-1)&&g.date<=iso(TODAY)?'new':'')+'" title="'+g.date+(g.test?' · Контрольная':'')+'">'+g.value+'</span>').join('')+'</div></section>'}).join('')}
function schedule(){let d=new Date(TODAY);d.setDate(d.getDate()+state.week*7);let monday=new Date(d);monday.setDate(d.getDate()-(d.getDay()+6)%7);let days=Array.from({length:7},(_,i)=>{let x=new Date(monday);x.setDate(x.getDate()+i);return x});let selected=new Date(state.date+'T12:00:00');let weekend=[0,6].includes(selected.getDay());return '<div class="row"><button class="icon" data-action="week" data-value="-1">‹</button><b>'+d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+'</b><button class="icon" data-action="week" data-value="1">›</button></div><div class="calendar" style="margin-top:9px">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>'<span class="sub">'+x+'</span>').join('')+days.map(x=>'<button class="'+(iso(x)===state.date?'active':'')+'" data-action="date" data-value="'+iso(x)+'">'+x.getDate()+'</button>').join('')+'</div><h3 class="heading">'+selected.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'long'})+'</h3>'+(weekend?'<div class="empty">Нет уроков</div>':kids[state.child].lessons.map((l,i)=>'<div class="lesson"><span class="sub">'+(i+1)+'</span>'+escapeHTML(l)+'</div>').join(''))}
function homework(){let next=new Date(TODAY);next.setDate(next.getDate()+1);while([0,6].includes(next.getDay()))next.setDate(next.getDate()+1);let end=new Date(TODAY);end.setDate(end.getDate()+7);let list=kids[state.child].tasks.filter(t=>t.due>=iso(TODAY)&&(state.hw==='all'||(state.hw==='tomorrow'?t.due===iso(next):t.due<=iso(end))));return btns([['tomorrow','На завтра'],['week','На неделю'],['all','Всё']],state.hw,'hw')+(list.length?list.map(t=>'<div class="task"><div class="row"><strong>'+escapeHTML(t.subject)+'</strong><span class="sub">'+t.due.slice(8)+'.'+t.due.slice(5,7)+'</span></div><p>'+escapeHTML(t.text)+'</p></div>').join(''):'<div class="empty">Нет актуальных заданий</div>')}
function profile(){return '<div class="heading">Ученик</div><div class="seg">'+kids.map((k,i)=>'<button data-action="child" data-value="'+i+'" class="'+(i===state.child?'active':'')+'">'+escapeHTML(k.name)+'</button>').join('')+'</div><h3 class="heading">Оформление</h3><div class="sub" style="margin-bottom:7px">Тема</div>'+btns([['system','Системная'],['light','Светлая'],['dark','Тёмная']],state.theme,'theme')+'<div class="sub" style="margin-top:15px">Акцентный цвет</div><div class="swatches">'+[['#4c8bf5','Синий'],['#22a77a','Зелёный'],['#9168de','Фиолетовый'],['#e68b39','Оранжевый']].map(([c,name])=>'<button class="swatch" style="background:'+c+'" data-action="accent" data-value="'+c+'" aria-label="'+name+'">'+(state.accent===c?'✓':'')+'</button>').join('')+'</div><h3 class="heading">Электронный дневник</h3><div class="sub">Петербургское образование</div><label class="field">Логин<input placeholder="Логин" autocomplete="off"></label><label class="field">Пароль<input placeholder="Пароль" type="password" autocomplete="off"></label><button class="seg" disabled style="padding:11px;opacity:.5;width:100%;justify-content:center">Подключить дневник</button><p class="notice">Демонстрационная версия. Подключение недоступно; введённые данные не сохраняются.</p>'}
function render(){document.documentElement.dataset.theme=state.theme;document.documentElement.style.setProperty('--accent',state.accent);document.querySelector('#title').textContent=({home:'Главная',grades:'Оценки',schedule:'Расписание',homework:'Домашка',profile:'Профиль'})[state.tab];document.querySelector('#profile').textContent=state.tab==='profile'?'×':'♙';main.innerHTML=({home,grades,schedule,homework,profile})[state.tab]();nav.innerHTML=[['home','⌂','Главная'],['grades','▥','Оценки'],['schedule','▦','Расписание'],['homework','▤','Домашка']].map(([id,icon,name])=>'<button data-action="tab" data-value="'+id+'" class="'+(state.tab===id?'active':'')+'"><span class="symbol">'+icon+'</span>'+name+'</button>').join('')}
document.querySelector('#profile').addEventListener('click',()=>{if(state.tab==='profile')setTab(state.returnTab);else{state.returnTab=state.tab;setTab('profile')}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,v=b.dataset.value;switch(a){case'tab':setTab(v);return;case'filter':state.filter=v;break;case'chart':state.chart=v;break;case'hw':state.hw=v;break;case'child':state.child=+v;break;case'theme':state.theme=v;localStorage.setItem('school-theme',v);break;case'accent':state.accent=v;localStorage.setItem('school-accent',v);break;case'date':state.date=v;break;case'week':state.week+=+v;break;}render()});render();
</script></body></html>
