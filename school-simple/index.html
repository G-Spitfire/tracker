 tile('Динамика',arrow+' '+(delta>0?'+':'')+fmt(delta),'За сегодня','trend',delta>0?'#31ad81':delta<0?'#d76a6a':null)+
 tile('Доля пятёрок',fiveShare+'%','От всех оценок','star')+
 tile('Под риском',String(riskCount),'Предмета · средний < 3,60','alert')+
 tile('Без троек и двоек',String(cleanStreak),'Дней с оценками подряд','flame')+
 tile('Средний за домашки',hwAverage,'За четверть','homework')+
 '</div><div class="home-switch">'+btns([['line','Линейный'],['ring','Кольцевой']],state.chart,'chart')+'</div><div class="home-visual">';
 if(state.chart==='ring'){
  const circumference=2*Math.PI*72;let cum=0;
  out+='<div class="home-ring-layout"><svg class="home-ring" viewBox="0 0 200 200" aria-label="Распределение оценок"><circle cx="100" cy="100" r="72" stroke="var(--soft)" stroke-width="25" fill="none"/>'+counts.map((n,i)=>{let part='<circle cx="100" cy="100" r="72" fill="none" stroke="'+colors[i]+'" stroke-width="25" stroke-dasharray="'+(n/all.length*circumference)+' '+circumference+'" stroke-dashoffset="'+(-cum/all.length*circumference)+'" transform="rotate(-90 100 100)"/>';cum+=n;return part}).join('')+'<text x="100" y="99" text-anchor="middle" fill="var(--fg)" font-size="37" font-weight="700">'+all.length+'</text><text x="100" y="119" text-anchor="middle" fill="var(--muted)" font-size="12">оценок</text></svg><div class="home-legend">'+counts.map((n,i)=>'<div class="home-legend-item"><span class="home-dot" style="background:'+colors[i]+'"></span><span>'+['Пятёрки','Четвёрки','Тройки','Двойки'][i]+'</span><b>'+n+'</b></div>').join('')+'</div></div>';
 }else{
  let sorted=all.slice().sort((a,b)=>a.date.localeCompare(b.date)),dates=[...new Set(sorted.map(g=>g.date))],history=dates.map(d=>mean(sorted.filter(g=>g.date<=d).map(g=>g.value))),points=history.map((v,i)=>[38+(i/Math.max(1,history.length-1))*286,172-(v-2)*53]),trend=history.length>1?history.at(-1)-history[0]:0;
  out+='<svg class="home-line" viewBox="0 0 350 210" aria-label="Динамика среднего балла">'+[3,4,5].map(n=>'<line x1="38" x2="324" y1="'+(172-(n-2)*53)+'" y2="'+(172-(n-2)*53)+'" stroke="var(--line)"/><text x="29" y="'+(177-(n-2)*53)+'" font-size="11" text-anchor="end" fill="var(--muted)">'+n+'</text>').join('')+'<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="'+points.map(p=>p.join(',')).join(' ')+'"/><line x1="38" y1="'+points[0][1]+'" x2="324" y2="'+points.at(-1)[1]+'" stroke="'+(trend>=0?'#31ad81':'#d76a6a')+'" stroke-dasharray="4 5" stroke-width="1" opacity=".6"/>'+points.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.6" fill="var(--accent)"/>').join('')+'<text x="38" y="200" font-size="11" fill="var(--muted)">'+dates[0].slice(5)+'</text><text x="324" y="200" text-anchor="end" font-size="11" fill="var(--muted)">'+dates.at(-1).slice(5)+'</text></svg>';
 }
 return out+'</div></section>';
}
function grades(){return '<div class="row" style="margin-bottom:7px">'+btns([['all','Все'],['tests','Контрольные']],state.filter,'filter')+'<span class="sub"><span class="dot" style="background:var(--accent)"></span>Новые</span></div>'+kids[state.child].subjects.map(s=>{let visible=s.grades.filter(g=>state.filter==='all'||g.test);if(!visible.length)return '';return '<section class="subject"><div class="row"><strong>'+escapeHTML(s.name)+'</strong><strong>'+fmt(mean(s.grades.map(g=>g.value)))+'</strong></div><div class="marks">'+visible.map(g=>'<button class="mark '+(g.date>=offset(-1)&&g.date<=iso(TODAY)?'new':'')+'" data-action="grade" data-value="'+encodeURIComponent(JSON.stringify({subject:s.name,...g}))+'" aria-label="Оценка '+g.value+' за '+g.date+'">'+g.value+'</button>').join('')+'</div></section>'}).join('')}
function schedule(){let d=new Date(TODAY);d.setDate(d.getDate()+state.week*7);let monday=new Date(d);monday.setDate(d.getDate()-(d.getDay()+6)%7);let days=Array.from({length:7},(_,i)=>{let x=new Date(monday);x.setDate(x.getDate()+i);return x});let selected=new Date(state.date+'T12:00:00');let weekend=[0,6].includes(selected.getDay());let dayLessons=[['Русский язык','Математика','Литература','Физкультура','История'],['Математика','Английский язык','География','Русский язык','Биология'],['Русский язык','Математика','Английский язык','История','Литература','Физкультура'],['Биология','Русский язык','Математика','География','Английский язык'],['Литература','История','Математика','Физкультура','Русский язык']];let lessons=dayLessons[(selected.getDay()+6)%7].slice();if(state.child===1)lessons.reverse();return '<div class="row"><button class="icon" data-action="week" data-value="-1">'+ico('left')+'</button><b>'+days[0].toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+' — '+days[6].toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'})+'</b><button class="icon" data-action="week" data-value="1">'+ico('right')+'</button></div><div class="calendar" style="margin-top:9px">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>'<span class="sub">'+x+'</span>').join('')+days.map(x=>'<button class="'+(iso(x)===state.date?'active':'')+'" data-action="date" data-value="'+iso(x)+'">'+x.getDate()+'</button>').join('')+'</div><h3 class="heading">'+selected.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'long'})+'</h3>'+(weekend?'<div class="empty">Нет уроков</div>':lessons.map((l,i)=>'<div class="lesson"><span class="sub">'+(i+1)+'</span>'+escapeHTML(l)+'</div>').join(''))}
function homework(){let next=new Date(TODAY);next.setDate(next.getDate()+1);while([0,6].includes(next.getDay()))next.setDate(next.getDate()+1);let end=new Date(TODAY);end.setDate(end.getDate()+7);let list=kids[state.child].tasks.filter(t=>t.due>=iso(TODAY)&&(state.hw==='all'||(state.hw==='tomorrow'?t.due===iso(next):t.due<=iso(end))));return btns([['tomorrow','На завтра'],['week','На неделю'],['all','Всё']],state.hw,'hw')+(list.length?list.map(t=>'<div class="task"><div class="row"><strong>'+escapeHTML(t.subject)+'</strong><span class="sub">'+t.due.slice(8)+'.'+t.due.slice(5,7)+'</span></div><p>'+escapeHTML(t.text)+'</p></div>').join(''):'<div class="empty">Нет актуальных заданий</div>')}
function profile(){return '<div class="heading">Ученик</div><div class="seg">'+kids.map((k,i)=>'<button data-action="child" data-value="'+i+'" class="'+(i===state.child?'active':'')+'">'+escapeHTML(k.name)+'</button>').join('')+'</div><h3 class="heading">Оформление</h3><div class="sub" style="margin-bottom:7px">Тема</div>'+btns([['system','Системная'],['light','Светлая'],['dark','Тёмная']],state.theme,'theme')+'<div class="sub" style="margin-top:15px">Акцентный цвет</div><div class="swatches">'+[['#4c8bf5','Синий'],['#22a77a','Зелёный'],['#9168de','Фиолетовый'],['#e68b39','Оранжевый']].map(([c,name])=>'<button class="swatch" style="background:'+c+'" data-action="accent" data-value="'+c+'" aria-label="'+name+'">'+(state.accent===c?'✓':'')+'</button>').join('')+'</div><h3 class="heading">Электронный дневник</h3><div class="sub">Петербургское образование</div><p class="notice">Подключение электронного дневника — в разработке. Сейчас используются только демонстрационные данные.</p>'}
function render(){document.documentElement.dataset.theme=state.theme;const dark=state.theme==='dark'||(state.theme==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.querySelector('meta[name="theme-color"]').setAttribute('content',dark?'#1c2430':'#ffffff');document.documentElement.style.setProperty('--accent',state.accent);document.querySelector('#title').textContent=({home:'Главная',grades:'Оценки',schedule:'Расписание',homework:'Домашка',profile:'Профиль'})[state.tab];document.querySelector('#profile').innerHTML=ico(state.tab==='profile'?'close':'profile');main.innerHTML=({home,grades,schedule,homework,profile})[state.tab]();nav.innerHTML=[['home','home','Главная'],['grades','grades','Оценки'],['schedule','schedule','Расписание'],['homework','homework','Домашка']].map(([id,icon,name])=>'<button data-action="tab" data-value="'+id+'" class="'+(state.tab===id?'active':'')+'"><span class="symbol">'+ico(icon,state.tab===id)+'</span>'+name+'</button>').join('')}
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})}document.querySelector('#profile').addEventListener('click',()=>{if(state.tab==='profile')setTab(state.returnTab);else{state.returnTab=state.tab;setTab('profile')}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){fetch('./version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{if(v&&v.version!=='1.17'&&!sessionStorage.getItem('school-reload-'+v.version)){sessionStorage.setItem('school-reload-'+v.version,'1');location.reload()}}).catch(()=>{})}});document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,v=b.dataset.value;switch(a){case'tab':setTab(v);return;case'grade':{let g=JSON.parse(decodeURIComponent(v));let overlay=document.createElement('div');overlay.className='detail-overlay';overlay.innerHTML='<div class="detail-box"><h3>'+escapeHTML(g.subject)+'</h3><p>Оценка: <b>'+g.value+'</b></p><p>Дата: '+new Date(g.date+'T12:00:00').toLocaleDateString('ru-RU')+'</p><p>Тип работы: '+(g.test?'Контрольная':'Обычная')+'</p><button class="icon" data-action="close-detail">Закрыть</button></div>';document.body.appendChild(overlay);overlay.addEventListener('click',ev=>{if(ev.target===overlay||ev.target.closest('[data-action="close-detail"]'))overlay.remove()});return}case'close-detail':b.closest('.detail-overlay')?.remove();return;case'filter':state.filter=v;break;case'chart':state.chart=v;break;case'hw':state.hw=v;break;case'child':state.child=+v;break;case'theme':state.theme=v;localStorage.setItem('school-theme',v);break;case'accent':state.accent=v;localStorage.setItem('school-accent',v);break;case'date':state.date=v;break;case'week':state.week+=+v;{let d=new Date(state.date+'T12:00:00');d.setDate(d.getDate()+7*(+v));state.date=iso(d)}break;}render()});render();
</script></body></html>
