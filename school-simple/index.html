const TODAY=new Date();TODAY.setHours(12,0,0,0);const iso=d=>{let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};const offset=n=>{let d=new Date(TODAY);d.setDate(d.getDate()+n);return iso(d)};const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const SCHOOL_QUARTERS=[{start:'2026-09-01',end:'2026-10-23'},{start:'2026-11-04',end:'2026-12-30'},{start:'2027-01-11',end:'2027-03-26'},{start:'2027-04-05',end:'2027-05-26'}];
const currentQuarter=()=>{const d=iso(TODAY);const active=SCHOOL_QUARTERS.findIndex(q=>d>=q.start&&d<=q.end);if(active>=0)return String(active+1);let last=-1;for(let i=0;i<SCHOOL_QUARTERS.length;i++){if(d>SCHOOL_QUARTERS[i].end)last=i}return String(last>=0?last+1:1)};
const readSetting=(key,fallback)=>{try{return localStorage.getItem(key)||fallback}catch{return fallback}};
const saveSetting=(key,value)=>{try{localStorage.setItem(key,value)}catch{}};
const kids=[{name:'Полина',subjects:[],lessons:[],schedule:[],tasks:[]},{name:'Матвей',subjects:[],lessons:[],schedule:[],tasks:[]}];
let dataSource='loading',diaryUpdatedAt=null,syncWarning=null,syncInProgress=false,syncError=false;let lastSyncAt=Number(readSetting('school-last-successful-sync','0'))||0;
function mapDiaryChild(raw,name){
 const subjectsMap=new Map();
 const ensure=(id,label)=>{const key=String(id||label);if(!subjectsMap.has(key))subjectsMap.set(key,{name:label||'Без названия',grades:[]});return subjectsMap.get(key)};
 (raw.marks||[]).forEach(m=>{const sub=ensure(m.subjectId,m.subject);sub.grades.push({value:Number(m.value),date:m.date,test:/контрольн|проверочн|тест|диктант|самостоятельн/i.test(m.type||''),homework:/домашн/i.test(m.type||''),type:m.type||'',comment:m.comment||null,id:m.id,lessonId:m.lessonId})});
 (raw.lessons||[]).forEach(l=>ensure(l.subjectId,l.subject));
 const schedule=(raw.schedule||[]).filter(l=>l&&l.from&&l.subjectId).slice().sort((a,b)=>a.from.localeCompare(b.from));
 const today=iso(TODAY);
 // Only the latest completed lesson for each subject can supply its current assignment.
 // Older lessons are historical and must not be reassigned to a future lesson.
 const latestBySubject=new Map();
 (raw.lessons||[]).filter(l=>l&&l.from&&l.from.slice(0,10)<=today).forEach(l=>{
  const key=String(l.subjectId||l.subject);
  const previous=latestBySubject.get(key);
  if(!previous||l.from>previous.from)latestBySubject.set(key,l);
 });
 const tasks=[];
 for(const l of latestBySubject.values()){
  const next=schedule.find(x=>String(x.subjectId)===String(l.subjectId)&&x.from.slice(0,10)>today);
  const seen=new Set();
  for(const t of l.tasks||[]){
   const name=String(t.name||'').trim();
   if(!name||/^(?:не задано|домашнее задание(?:\s*:\s*не задано)?)\s*$/i.test(name))continue;
   const key=name.toLocaleLowerCase('ru')+'|'+String(t.kind||'');
   if(seen.has(key))continue;
   seen.add(key);
   tasks.push({subject:l.subject,text:name,lessonDate:l.from.slice(0,10),nextLessonDate:next?next.from.slice(0,10):null,kind:t.kind,files:t.files||[],lessonId:l.id});
  }
 }
 return {name,subjects:[...subjectsMap.values()].sort((a,b)=>a.name.localeCompare(b.name,'ru')),lessons:raw.lessons||[],schedule,tasks};
}
// Snapshot-based homework discovery. First successful network snapshot establishes a baseline.
const HOMEWORK_EVENTS_KEY='school-homework-events-v2';
const HOMEWORK_BASELINE_KEY='school-homework-baseline-v2';
const HOME_UPDATES_OPEN_KEY='school-home-updates-open-v1';
let homeUpdatesOpen=readSetting(HOME_UPDATES_OPEN_KEY,'0')==='1';
function homeworkIdentity(task){
 const value=JSON.stringify([task.lessonId||'',task.subject,task.text,task.kind||'']);
 // Two compact checksums keep homework text out of localStorage.
 let h1=2166136261,h2=0x9e3779b9;
 for(let i=0;i<value.length;i++){const c=value.charCodeAt(i);h1=Math.imul(h1^c,16777619);h2=Math.imul(h2^(c+i),2246822519)}
 return (h1>>>0).toString(36)+'-'+(h2>>>0).toString(36)+'-'+value.length;
}
function readStoredJSON(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch{return fallback}}
function trackHomeworkChanges(){
 const today=iso(TODAY);
 const previous=readStoredJSON(HOMEWORK_BASELINE_KEY,null);
 const next=kids.map(k=>k.tasks.map(homeworkIdentity));
 if(previous&&Array.isArray(previous)&&previous.length===2){
  const events=readStoredJSON(HOMEWORK_EVENTS_KEY,[]);
  const retained=Array.isArray(events)?events.filter(e=>e&&e.day===today&&[0,1].includes(e.child)):[];
  for(let child=0;child<2;child++){
   const old=new Set(Array.isArray(previous[child])?previous[child]:[]);
   for(const task of kids[child].tasks){
    const id=homeworkIdentity(task);
    if(!old.has(id)&&!retained.some(e=>e.child===child&&e.id===id)){
     retained.push({child,id,day:today});
    }
   }
  }
  saveSetting(HOMEWORK_EVENTS_KEY,JSON.stringify(retained.slice(-100)));
 }else{
  saveSetting(HOMEWORK_EVENTS_KEY,JSON.stringify([]));
 }
 saveSetting(HOMEWORK_BASELINE_KEY,JSON.stringify(next));
}
function recentUpdates(){
 const today=iso(TODAY),yesterday=offset(-1);
 const grades=kids[state.child].subjects.flatMap(subject=>subject.grades.filter(g=>g.date===today||g.date===yesterday).map(g=>({kind:'grade',day:g.date,subject:subject.name,grade:g})));
 const stored=readStoredJSON(HOMEWORK_EVENTS_KEY,[]);
 const byId=new Map(kids[state.child].tasks.map(task=>[homeworkIdentity(task),task]));
 const homework=(Array.isArray(stored)?stored:[]).filter(e=>e.child===state.child&&e.day===today&&byId.has(e.id)).map(e=>{const task=byId.get(e.id);return {kind:'homework',day:today,subject:task.subject,text:task.text,nextLessonDate:task.nextLessonDate};});
 return grades.concat(homework).sort((a,b)=>b.day.localeCompare(a.day)||(a.kind==='grade'?-1:1));
}
function recentUpdatesPanel(){
 const events=recentUpdates(),today=iso(TODAY);
 const eventHTML=e=>e.kind==='grade'
 ?'<button class="update-event" data-action="grade" data-value="'+encodeURIComponent(JSON.stringify({subject:e.subject,...e.grade}))+'"><span class="mark">'+e.grade.value+'</span><span class="update-event-text"><strong>'+escapeHTML(e.subject)+'</strong><small>'+escapeHTML(e.grade.type||'Оценка')+'</small></span><span aria-hidden="true">›</span></button>'
 :'<button class="update-event" data-action="homework-detail" data-value="'+encodeURIComponent(JSON.stringify(e))+'"><span class="update-book" aria-hidden="true">▤</span><span class="update-event-text"><strong>'+escapeHTML(e.subject)+'</strong><small>Новое домашнее задание</small></span><span aria-hidden="true">›</span></button>';
 let html='<section class="updates-panel"><button class="updates-toggle" data-action="toggle-updates" aria-expanded="'+homeUpdatesOpen+'"><span class="updates-title">Последние обновления</span><span class="updates-count">'+events.length+' '+(events.length===1?'событие':'событий')+'</span><span aria-hidden="true">'+(homeUpdatesOpen?'⌃':'⌄')+'</span></button>';
 if(homeUpdatesOpen){
  if(!events.length)html+='<div class="updates-empty">Новых событий за сегодня и вчера нет</div>';
  else for(const day of [today,offset(-1)]){
   const group=events.filter(e=>e.day===day);
   if(group.length)html+='<div class="updates-day"><div class="updates-day-label">'+(day===today?'Сегодня':'Вчера')+'</div>'+group.map(eventHTML).join('')+'</div>';
  }
 }
 return html+'</section>';
}
function applyDiary(data,source='network'){
 if(!data||data.schemaVersion!==1||!data.children?.polina||!data.children?.matvey)throw new Error('Неполный набор данных дневника');
 kids[0]=mapDiaryChild(data.children.polina,'Полина');kids[1]=mapDiaryChild(data.children.matvey,'Матвей');
 if(source==='network')trackHomeworkChanges();
 dataSource=source==='cache'?'cached':'live';diaryUpdatedAt=data.generatedAt||null;syncWarning=null;
 checkMatveyAchievement();
}

const EGG_KEY='school-matvey-first-positive-v1';
function matveyTrend(){
 const q=SCHOOL_QUARTERS[Number(currentQuarter())-1];
 const marks=kids[1].subjects.map(s=>s.grades.filter(g=>g.date>=q.start&&g.date<=q.end));
 const current=marks.filter(g=>g.length);
 const weekAgo=new Date(TODAY);weekAgo.setDate(weekAgo.getDate()-7);
 const cutoff=iso(weekAgo);
 const before=marks.map(g=>g.filter(x=>x.date<=cutoff)).filter(g=>g.length);
 if(!current.length||!before.length)return null;
 const previous=mean(before.map(g=>mean(g.map(x=>x.value))));
 const currentScore=mean(current.map(g=>mean(g.map(x=>x.value))));
 const delta=Math.round(((currentScore-previous)+Number.EPSILON)*100)/100;
 return {direction:delta>0?'positive':delta<0?'negative':'zero',delta};
}
function eggState(){try{return JSON.parse(localStorage.getItem(EGG_KEY)||'null')}catch{return null}}
function checkMatveyAchievement(){
 if(dataSource!=='cached'&&dataSource!=='live')return;
 const old=eggState();
 if(old?.seen)return;
 if(old?.pending){showMatveyAchievement();return}
 const result=matveyTrend();
 if(result===null)return;
 const trend=result.direction;
 // Initial positive reading is not a transition.
 if((old?.last==='zero'||old?.last==='negative')&&trend==='positive'){
  saveSetting(EGG_KEY,JSON.stringify({last:trend,pending:true,delta:result.delta}));
  showMatveyAchievement();
 }else if(old?.last!==trend){
  saveSetting(EGG_KEY,JSON.stringify({last:trend}));
 }
}
function showMatveyAchievement(){
 if(state.child!==1||document.getElementById('matvey-easter-egg'))return;
 const dark=state.theme==='dark'||(state.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
 const achievement=eggState();
 const savedDelta=Number(achievement?.delta);
 const deltaText=achievement?.delta!=null&&Number.isFinite(savedDelta)&&savedDelta>0?'+'+fmt(savedDelta):'—';
 const overlay=document.createElement('div');
 overlay.id='matvey-easter-egg';overlay.className='egg-screen'+(dark?' egg-dark':'');
 overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','Секретное достижение Матвея');
 overlay.innerHTML='<div class="egg-label">★ СЕКРЕТНОЕ ДОСТИЖЕНИЕ</div><div class="egg-head">ААААААА!<div class="egg-accent">КРАСАВЧЕГ!!!</div></div><div class="egg-progress"><div class="egg-progress-title">ТВОЙ СРЕДНИЙ БАЛЛ ВЫРОС!</div><div class="egg-progress-value">'+deltaText+'</div><div class="egg-progress-note">По сравнению с прошлой неделей</div></div><img class="egg-runner" src="./caveman-run-'+(dark?'dark':'light')+'.webp" alt="Неандерталец радостно бежит с дубиной"><div class="egg-lines"><strong>ТЫ СДЕЛАЛ ЭТО!</strong><span>ТЫ СМОГ! ТЫ ПОБЕДИЛ!</span><strong class="egg-accent">ТЫ СТАЛ ЛУЧШЕ!</strong></div><button type="button" class="egg-button">АААА! Я КРАСАВЧЕГ!</button>';
 document.body.appendChild(overlay);
 overlay.querySelector('button').addEventListener('click',()=>{saveSetting(EGG_KEY,JSON.stringify({seen:true}));overlay.remove()});
 overlay.querySelector('button').focus();
}

let state={tab:'home',child:readSetting('school-active-child','0')==='1'?1:0,gradesView:'grades',quarter:currentQuarter(),filter:'all',chart:'line',hw:'tomorrow',date:iso(TODAY),week:0,theme:readSetting('school-theme','system'),accent:readSetting('school-accent','#4c8bf5'),returnTab:'home'};
const main=document.querySelector('#main'),nav=document.querySelector('#nav');const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;const fmt=n=>n.toFixed(2).replace('.',',');const gradeData=()=>kids[state.child].subjects.flatMap(s=>s.grades).filter(g=>inQuarter(g.date));
const quarterRange=q=>SCHOOL_QUARTERS[Number(q)-1];const inQuarter=date=>{const q=quarterRange(state.quarter);return !!q&&date>=q.start&&date<=q.end};const score=()=>SchoolAnalytics.overallAverage(kids[state.child].subjects,state.quarter,SCHOOL_QUARTERS);const setTab=t=>{if(state.tab===t)return;state.tab=t;render();window.scrollTo({top:0,left:0,behavior:'instant'})};const btns=(items,current,handler)=>'<div class="seg">'+items.map(([v,l])=>'<button data-action="'+handler+'" data-value="'+v+'" class="'+(v===current?'active':'')+'">'+l+'</button>').join('')+'</div>';
// Every December the fifth KPI temporarily displays a New Year countdown.
function holidayInfo(){const now=new Date();return now.getMonth()===11?{days:31-now.getDate()}:null;}
function home(){
 const all=gradeData(),counts=[5,4,3,2].map(n=>all.filter(g=>g.value===n).length),colors=['#31ad81','#538fe0','#e8ac45','#e36565'];
 const today=iso(TODAY),weekAgo=new Date(TODAY);weekAgo.setDate(weekAgo.getDate()-7);
 const cutoff=iso(weekAgo);
 const baselineSubjects=kids[state.child].subjects.map(s=>s.grades.filter(g=>inQuarter(g.date)&&g.date<=cutoff)).filter(g=>g.length);
 const hasBaseline=baselineSubjects.length>0&&all.length>0;
 const previousScore=hasBaseline?mean(baselineSubjects.map(g=>mean(g.map(x=>x.value)))):0;
 const rawDelta=hasBaseline?score()-previousScore:0;
 const delta=Math.round((rawDelta+Number.EPSILON)*100)/100;
 const direction=!hasBaseline?'none':delta>0.000001?'up':delta< -0.000001?'down':'flat';
 const arrow=direction==='up'?'↑':direction==='down'?'↓':direction==='none'?'—':'→';
 const fiveShare=all.length?Math.round(counts[0]/all.length*100):0;
 const riskCount=kids[state.child].subjects.filter(s=>{const q=s.grades.filter(g=>inQuarter(g.date));return q.length&&mean(q.map(g=>g.value))<3.6}).length;
 const hwGrades=all.filter(g=>g.homework),hwAverage=hwGrades.length?fmt(mean(hwGrades.map(g=>g.value))):'—';
 const schoolDates=[...new Set(kids[state.child].lessons.map(l=>(l.from||'').slice(0,10)).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&d<=today))].sort().reverse();
 let cleanStreak=0;for(const date of schoolDates){if(all.some(g=>g.date===date&&g.value<=3))break;cleanStreak++}
 const tile=(label,value,hint,icon,color)=>'<div class="stat-tile"><div class="stat-top"><span>'+label+'</span><span class="stat-icon">'+kpiIcon(icon)+'</span></div><strong class="stat-value"'+(color?' style="color:'+color+'"':'')+'>'+value+'</strong><span class="stat-hint">'+hint+'</span></div>';
 let out='<section class="home-screen"><div class="stats-grid">'+
 tile('Средний балл',fmt(score()),'За четверть','average')+
 tile('Динамика',hasBaseline?arrow+' '+(delta>0?'+':'')+fmt(delta):'—','За 7 дней','trend',delta>0?'#31ad81':delta<0?'#d76a6a':null)+
 tile('Доля пятёрок',fiveShare+'%','От всех оценок','star')+
 tile('Под риском',String(riskCount),'Предмета · средний < 3,60','alert')+
 (holidayInfo()?tile('До Нового года',String(holidayInfo().days),'Дней до праздника','tree'):tile('Без троек и двоек',String(cleanStreak),'Учебных дней подряд','flame'))+
 tile('Средний за домашки',hwAverage,'За четверть','homework')+
 '</div>'+recentUpdatesPanel()+'<div class="home-switch">'+btns([['line','Линейный'],['ring','Кольцевой']],state.chart,'chart')+'</div><div class="home-visual">';
 if(!all.length){out+='<div class="empty">Пока нет оценок за эту четверть</div>';}else if(state.chart==='ring'){
  const circumference=2*Math.PI*72;let cum=0;
  out+='<div class="home-ring-layout"><svg class="home-ring" viewBox="0 0 200 200" aria-label="Распределение оценок"><circle cx="100" cy="100" r="72" stroke="var(--soft)" stroke-width="25" fill="none"/>'+counts.map((n,i)=>{let part='<circle cx="100" cy="100" r="72" fill="none" stroke="'+colors[i]+'" stroke-width="25" stroke-dasharray="'+(n/all.length*circumference)+' '+circumference+'" stroke-dashoffset="'+(-cum/all.length*circumference)+'" transform="rotate(-90 100 100)"/>';cum+=n;return part}).join('')+'<text x="100" y="99" text-anchor="middle" fill="var(--fg)" font-size="37" font-weight="700">'+all.length+'</text><text x="100" y="119" text-anchor="middle" fill="var(--muted)" font-size="12">оценок</text></svg><div class="home-legend">'+counts.map((n,i)=>'<div class="home-legend-item"><span class="home-dot" style="background:'+colors[i]+'"></span><span>'+['Пятёрки','Четвёрки','Тройки','Двойки'][i]+'</span><b>'+n+'</b></div>').join('')+'</div></div>';
 }else{
  let sorted=all.slice().sort((a,b)=>a.date.localeCompare(b.date)),dates=[...new Set(sorted.map(g=>g.date))],history=dates.map(d=>mean(kids[state.child].subjects.map(s=>s.grades.filter(g=>inQuarter(g.date)&&g.date<=d)).filter(g=>g.length).map(g=>mean(g.map(x=>x.value))))),points=history.map((v,i)=>[38+(i/Math.max(1,history.length-1))*286,172-(v-2)*53]);
  out+='<svg class="home-line" viewBox="0 0 350 210" aria-label="Динамика среднего балла">'+[3,4,5].map(n=>'<line x1="38" x2="324" y1="'+(172-(n-2)*53)+'" y2="'+(172-(n-2)*53)+'" stroke="var(--line)"/><text x="29" y="'+(177-(n-2)*53)+'" font-size="11" text-anchor="end" fill="var(--muted)">'+n+'</text>').join('')+(()=>{if(points.length<3)return '';const n=history.length,avgX=(n-1)/2,avgY=history.reduce((a,b)=>a+b,0)/n;const slope=history.reduce((sum,y,i)=>sum+(i-avgX)*(y-avgY),0)/history.reduce((sum,_,i)=>sum+(i-avgX)**2,0);const start=avgY-slope*avgX,dx=286/(n-1),endIndex=298/dx;const yAt=i=>172-(start+slope*i-2)*53;const color=Math.abs(slope*(n-1))<0.08?'#8995a5':slope>0?'#16a34a':'#ef4444';return '<line x1="38" y1="'+yAt(0)+'" x2="336" y2="'+yAt(endIndex)+'" stroke="'+color+'" stroke-width="1.7" stroke-dasharray="5 5"/>'})()+'<polyline fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="'+points.map(p=>p.join(',')).join(' ')+'"/>'+points.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="var(--accent)"/>').join('')+(dates.length===1?'<text x="38" y="200" font-size="11" fill="var(--muted)">'+dates[0].slice(5)+'</text>':'<text x="38" y="200" font-size="11" fill="var(--muted)">'+dates[0].slice(5)+'</text><text x="324" y="200" text-anchor="end" font-size="11" fill="var(--muted)">'+dates.at(-1).slice(5)+'</text>')+'</svg>';
 }
 return out+'</div></section>';
}
function grades(){
 const tabs='<div class="grades-tabs">'+btns([['grades','Оценки'],['forecast','Прогноз']],state.gradesView,'grades-view')+'</div>';
 const period='';
 const subjects=kids[state.child].subjects.map(s=>({...s,grades:s.grades.filter(g=>inQuarter(g.date)),avg:mean(s.grades.filter(g=>inQuarter(g.date)).map(g=>g.value))}));
 const note='Оценки загружены из электронного дневника.';const performanceColor=n=>n>=4.6?'#16a34a':n>=3.6?'#eab308':n>=2.6?'#f97316':'#ef4444';
 if(state.gradesView==='grades')return tabs+period+'<div class="grades-filter-row"><label class="grades-filter-check"><input type="checkbox" id="tests-toggle" '+(state.filter==='tests'?'checked':'')+'>Только контрольные</label></div><div class="content-after-controls">'+subjects.map(s=>{let visible=s.grades.filter(g=>state.filter==='all'||g.test);if(!visible.length)return '';return '<section class="subject"><div class="row"><strong>'+escapeHTML(s.name)+'</strong><strong class="subject-average">'+fmt(s.avg)+'</strong></div><div class="marks">'+visible.map(g=>'<button class="mark '+(g.date>=offset(-1)&&g.date<=iso(TODAY)?'new':'')+'" data-action="grade" data-value="'+encodeURIComponent(JSON.stringify({subject:s.name,...g}))+'" aria-label="Оценка '+g.value+' за '+g.date+'">'+g.value+'</button>').join('')+'</div></section>'}).join('')+'<p class="grades-footnote">'+note+'</p></div>';

function lessonGradeButtons(lesson,lessons,index,kid,date){

 const matched=grades.filter(g=>g.lessonId!=null&&lesson.id!=null&&String(g.lessonId)===String(lesson.id));
 const first=lessons.findIndex(l=>String(l.subject||'').trim().toLocaleLowerCase('ru')===subjectKey)===index;
 const fallback=first?grades.filter(g=>g.lessonId==null||!lessons.some(l=>l.id!=null&&String(l.id)===String(g.lessonId))):[];
 return matched.concat(fallback).map(g=>'<button class="mark lesson-mark lesson-mark-'+(g.value>=2&&g.value<=5?g.value:'other')+'" data-action="grade" data-value="'+encodeURIComponent(JSON.stringify(g))+'" aria-label="Оценка '+g.value+' по предмету '+escapeHTML(g.subject)+'">'+g.value+'</button>').join('');
}
function schedule(){
 let d=new Date(TODAY);d.setDate(d.getDate()+state.week*7);

 const kid=kids[state.child];
 const planned=(kid.schedule||[]).filter(l=>l.from.slice(0,10)===state.date);

 let lessons=planned.length?planned:completed;
 lessons.sort((a,b)=>(a.from||'').localeCompare(b.from||'')||(Number(a.number)||0)-(Number(b.number)||0));
 let sameMonth=days[0].getMonth()===days[6].getMonth();

}
function homework(){
 const kid=kids[state.child],today=iso(TODAY),nextDay=new Date(TODAY);nextDay.setDate(nextDay.getDate()+1);const calendarTomorrow=iso(nextDay);
 const nextSchoolDay=[...new Set(kid.schedule.map(l=>(l.from||'').slice(0,10)).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&d>today))].sort()[0]||calendarTomorrow;
 const upcomingDays=[...new Set(kid.schedule.map(l=>(l.from||'').slice(0,10)).filter(d=>d.length===10&&d>today))].sort().slice(0,5);
 const weekDays=new Set(upcomingDays);
 const list=kid.tasks.filter(t=>state.hw==='tomorrow'?t.nextLessonDate===nextSchoolDay:state.hw==='week'?!!t.nextLessonDate&&weekDays.has(t.nextLessonDate):true).slice().sort((a,b)=>(a.nextLessonDate||'9999').localeCompare(b.nextLessonDate||'9999')||a.subject.localeCompare(b.subject,'ru'));
 const dateLabel=d=>d?new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'long'}):'Дата следующего урока не определена';
 const dates=state.hw==='tomorrow'?[nextSchoolDay]:state.hw==='week'?upcomingDays:[...new Set(list.map(t=>t.nextLessonDate||''))];
 const grouped=dates.map(d=>{
  const tasks=list.filter(t=>(t.nextLessonDate||'')===d);
  const scheduled=kid.schedule.some(l=>(l.from||'').slice(0,10)===d);
  const noLessons=!scheduled;
  const scheduleKnown=scheduled||kid.schedule.some(l=>(l.from||'').slice(0,10)>d);
  const body=tasks.length?tasks.map(t=>'<div class="task"><div class="row"><strong>'+escapeHTML(t.subject)+'</strong></div><p>'+escapeHTML(t.text)+'</p></div>').join(''):!scheduleKnown?'<div class="homework-unknown">Расписание на этот день пока неизвестно. Проверьте синхронизацию дневника.</div>':'<div class="homework-celebration"><strong>'+(noLessons?'Свободный день!':'Домашних заданий пока нет')+'</strong><span>'+(noLessons?'Уроков по расписанию нет.':'На выбранный день задания не обнаружены.')+'</span></div>';
  return '<section class="homework-day"><h3 class="homework-day-title">'+escapeHTML(dateLabel(d))+'</h3><div class="homework-day-body">'+body+'</div></section>';
 }).join('');
 const stale=snapshotAgeMs()>150*60000?'<p class="sync-warning-text" role="status">Данные могли устареть. Проверьте время последней синхронизации.</p>':'';
 const note='<p class="grades-footnote">Задания привязаны к следующему уроку предмета. Официальная дата сдачи в источнике не предоставляется.</p>';
 return btns([['tomorrow','Ближайший день'],['week','На неделю'],['all','Всё']],state.hw,'hw')+'<div class="content-after-controls">'+(grouped||'<div class="empty">Нет заданий на выбранный период</div>')+stale+note+'</div>';
}
function snapshotAgeMs(){const timestamp=Date.parse(diaryUpdatedAt||'');return Number.isFinite(timestamp)?Math.max(0,Date.now()-timestamp):Infinity}
function syncIndicatorState(){return syncInProgress?'loading':dataSource==='error'?'error':snapshotAgeMs()<150*60000?'fresh':'stale'}
function syncTime(){return lastSyncAt?new Date(lastSyncAt).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'Ещё не выполнялась'}
function openModal(title,body,actions){document.querySelector('.detail-overlay')?.remove();const o=document.createElement('div');o.className='detail-overlay';o.innerHTML='<section class="detail-box" role="dialog" aria-modal="true" aria-label="'+escapeHTML(title)+'"><h3>'+escapeHTML(title)+'</h3><div class="modal-body">'+body+'</div><div class="modal-actions">'+actions+'</div></section>';document.body.appendChild(o);o.addEventListener('click',e=>{if(e.target===o||e.target.closest('[data-action="close-detail"]'))o.remove()});o.addEventListener('keydown',e=>{if(e.key==='Escape')o.remove()});o.querySelector('button')?.focus();return o}

function syncStatus(){const cached=dataSource==='cached',failed=dataSource==='error',symbol=failed?'×':cached?'!':'✓',label=failed?'Ошибка синхронизации':cached?(syncWarning?'Нет связи · сохранены данные':'Сохранённые данные'):'Синхронизировано';return '<div class="sync-status '+(failed?'sync-error':cached?'sync-cached':'sync-ok')+'"><span class="sync-status-icon">'+symbol+'</span><span>'+label+'</span></div>'}
function profile(){return '<div class="heading">Ученик</div><div class="seg">'+kids.map((k,i)=>'<button data-action="child" data-value="'+i+'" class="'+(i===state.child?'active':'')+'">'+escapeHTML(k.name)+'</button>').join('')+'</div><h3 class="heading">Оформление</h3><div class="sub profile-theme-label">Тема</div>'+btns([['system','Системная'],['light','Светлая'],['dark','Тёмная']],state.theme,'theme')+'<div class="sub profile-accent-label">Акцентный цвет</div><div class="swatches">'+[['#4c8bf5','Синий'],['#16a34a','Зелёный'],['#8b5cf6','Фиолетовый'],['#f97316','Оранжевый'],['#ef4444','Красный'],['#ec4899','Розовый']].map(([c,name])=>'<button class="swatch" style="background:'+c+'" data-action="accent" data-value="'+c+'" aria-label="'+name+'">'+(state.accent===c?'✓':'')+'</button>').join('')+'</div><footer class="profile-footer">Spitfire Studio<div>Версия 1.33.6</div></footer>'}
function render({preserveScroll=false}={}){const previousScroll=preserveScroll?window.scrollY:null;document.body.classList.toggle('is-loading',dataSource==='loading');document.body.classList.toggle('is-profile',state.tab==='profile');document.documentElement.dataset.theme=state.theme;const dark=state.theme==='dark'||(state.theme==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.querySelector('meta[name="theme-color"]').setAttribute('content',dark?'#09090b':'#ffffff');document.documentElement.style.setProperty('--accent',state.accent);document.querySelector('#brand-mark').innerHTML=state.tab==='home'?'<img src="./brand-mark.svg" width="30" height="30" alt="" decoding="async">':'';document.querySelector('#brand-mark').style.display=state.tab==='home'?'inline-flex':'none';document.querySelector('#header-quarter')?.remove();document.querySelector('#sync-indicator')?.remove();if(state.tab==='home'){const b=document.createElement('button');b.id='sync-indicator';b.className='icon sync-indicator';b.type='button';b.setAttribute('aria-label','Состояние синхронизации дневника');b.dataset.syncState=syncIndicatorState();b.innerHTML=ico('refresh');document.querySelector('#profile').before(b)}if(state.tab==='grades'){const q=document.createElement('select');q.id='header-quarter';q.setAttribute('aria-label','Учебная четверть');q.className='header-quarter';q.innerHTML=[1,2,3,4].map(n=>'<option value="'+n+'"'+(state.quarter===String(n)?' selected':'')+'>'+['I','II','III','IV'][n-1]+'</option>').join('');document.querySelector('#profile').before(q)}document.querySelector('#title').textContent=state.tab==='home'?kids[state.child].name:({grades:'Оценки',schedule:'Расписание',homework:'Домашка',profile:'Профиль'})[state.tab];document.querySelector('#profile').innerHTML=ico(state.tab==='profile'?'close':'profile');main.innerHTML=(dataSource==='live'||dataSource==='cached')?({home,grades,schedule,homework,profile})[state.tab]():(dataSource==='loading'?'<div class="school-loading" role="status" aria-live="polite"><img src="./brand-mark.svg" width="96" height="96" alt=""><div class="school-loading-title">Школа</div><div class="school-loading-spinner" aria-hidden="true"></div><span class="sr-only">Загружаем электронный дневник</span></div>':'<div class="empty sync-error-panel"><h3>Не удалось загрузить данные</h3><p>'+escapeHTML(syncWarning||'Проверьте подключение к интернету.')+'</p><button class="icon sync-retry-button" data-action="retry-sync">Повторить</button></div>');const nextNav=[['home','home','Главная'],['grades','grades','Оценки'],['schedule','schedule','Расписание'],['homework','homework','Домашка']].map(([id,icon,name])=>'<button data-action="tab" data-value="'+id+'" class="'+(state.tab===id?'active':'')+'"><span class="symbol">'+ico(icon,state.tab===id)+'</span>'+name+'</button>').join('');if(nav.dataset.activeTab!==state.tab){nav.innerHTML=nextNav;nav.dataset.activeTab=state.tab;}if(previousScroll!==null)window.scrollTo({top:previousScroll,left:0,behavior:'instant'})}
const APP_VERSION='1.33.7';
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).catch(()=>{});
}
let checkingVersion=false;
async function checkForUpdate(){
 if(checkingVersion||!navigator.onLine)return;
 checkingVersion=true;
 try{
  const response=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});
  if(!response.ok)return;
  const data=await response.json();
  if(!data||typeof data.version!=='string'||!/^\d+\.\d+(?:\.\d+)?$/.test(data.version)||data.version===APP_VERSION)return;
  const target=new URL(location.href);
  const currentParam=target.searchParams.get('v');
  const targetParam=data.version.replace(/\./g,'');
  if(currentParam===targetParam)return;
  const attemptKey='school-update-attempt-'+data.version;
  if(sessionStorage.getItem(attemptKey)==='1')return;
  sessionStorage.setItem(attemptKey,'1');
  target.searchParams.set('v',targetParam);
  location.replace(target.href);
 }catch(e){/* Offline or unavailable version endpoint: keep the current app usable. */}
 finally{checkingVersion=false}
}
// Reopen the app on a new calendar day so all date-based views and homework are recalculated.
function refreshOnNewDay(){
 if(iso(new Date())!==iso(TODAY)){location.reload();return true}
 return false;
}

document.addEventListener('change',e=>{if(e.target.matches('#quarter-select, #header-quarter')){state.quarter=e.target.value;render({preserveScroll:true})}else if(e.target.matches('#tests-toggle')){state.filter=e.target.checked?'tests':'all';render({preserveScroll:true})}});document.querySelector('#profile').parentElement.addEventListener('click',e=>{if(e.target.closest('#sync-indicator'))showSyncDialog()});document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,v=b.dataset.value;switch(a){case'toggle-updates':homeUpdatesOpen=!homeUpdatesOpen;saveSetting(HOME_UPDATES_OPEN_KEY,homeUpdatesOpen?'1':'0');render({preserveScroll:true});return;case'homework-detail':{const t=JSON.parse(decodeURIComponent(v));openModal(t.subject,'<div class="modal-row"><span class="modal-label">Задание</span><span>'+escapeHTML(t.text)+'</span></div>'+(t.nextLessonDate?'<div class="modal-row"><span class="modal-label">Следующий урок</span><span>'+escapeHTML(t.nextLessonDate)+'</span></div>':''),'<button class="modal-button" data-action="close-detail">Закрыть</button>');return;} case'retry-sync':loadDiarySnapshot();return;case'refresh-diary':if(!syncInProgress){loadDiarySnapshot(true)}return;case'tab':setTab(v);return;case'grade':{let g=JSON.parse(decodeURIComponent(v));openModal(g.subject,'<div class="modal-row"><span class="modal-label">Оценка</span><strong>'+g.value+'</strong></div><div class="modal-row"><span class="modal-label">Дата</span><span>'+new Date(g.date+'T12:00:00').toLocaleDateString('ru-RU')+'</span></div><div class="modal-row"><span class="modal-label">Тип работы</span><span>'+escapeHTML(g.type||(g.test?'Контрольная':'Обычная'))+'</span></div>','<button class="modal-button" data-action="close-detail">Закрыть</button>');return}case'close-detail':b.closest('.detail-overlay')?.remove();return;case'grades-view':state.gradesView=v;break;case'chart':state.chart=v;break;case'hw':state.hw=v;break;case'child':state.child=+v;saveSetting('school-active-child',String(state.child));if(state.child===1&&eggState()?.pending)queueMicrotask(showMatveyAchievement);break;case'theme':state.theme=v;saveSetting('school-theme',v);break;case'accent':state.accent=v;saveSetting('school-accent',v);break;case'date':state.date=v;break;case'week':state.week+=+v;{let d=new Date(state.date+'T12:00:00');d.setDate(d.getDate()+7*(+v));state.date=iso(d)}break;}render({preserveScroll:true})});render();
async function loadDiarySnapshot(fromDialog=false){
 if(syncInProgress)return;syncInProgress=true;syncError=false;if(fromDialog)showSyncDialog();else if(state.tab==='home')render({preserveScroll:true});
 if(!window.SchoolSync){dataSource='error';syncWarning='Модуль синхронизации недоступен';syncError=true;syncInProgress=false;render();if(fromDialog)showSyncDialog();return;}
 if(dataSource!=='live'){dataSource='loading';syncWarning=null;render();}
 try{
  const cached=await window.SchoolSync.readCached();
  if(cached){applyDiary(cached.data,'cache');render({preserveScroll:true});}
  const result=await window.SchoolSync.sync();
  applyDiary(result.data,result.source);
  syncWarning=result.warning||null;syncError=!!result.warning;if(result.source==='network'){lastSyncAt=Date.now();saveSetting('school-last-successful-sync',String(lastSyncAt))}
  render({preserveScroll:true});
 }catch(error){
  if(dataSource!=='live'&&dataSource!=='cached')dataSource='error';
  syncWarning=error.message;syncError=true;
  render({preserveScroll:true});
 }finally{syncInProgress=false;if(state.tab==='home')render({preserveScroll:true});if(fromDialog)showSyncDialog()}
}
loadDiarySnapshot();
checkForUpdate();
setInterval(()=>{if(state.tab==='home'&&!syncInProgress)render({preserveScroll:true})},60000);
