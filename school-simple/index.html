function home(){
 const all=gradeData(),counts=[5,4,3,2].map(n=>all.filter(g=>g.value===n).length),colors=['#31ad81','#538fe0','#e8ac45','#e36565'];
 const today=iso(TODAY),before=all.filter(g=>g.date<today),todayGrades=all.filter(g=>g.date===today);
 const rawDelta=todayGrades.length&&before.length?score()-mean(before.map(g=>g.value)):0;
 const delta=Math.round((rawDelta+Number.EPSILON)*100)/100;
 const direction=delta>0.000001?'up':delta< -0.000001?'down':'flat';
 const arrow=direction==='up'?'↑':direction==='down'?'↓':'→';
 const fiveShare=all.length?Math.round(counts[0]/all.length*100):0;
 const riskCount=kids[state.child].subjects.filter(s=>{const q=s.grades.filter(g=>inQuarter(g.date));return q.length&&mean(q.map(g=>g.value))<3.6}).length;
 const hwGrades=all.filter(g=>g.homework),hwAverage=hwGrades.length?fmt(mean(hwGrades.map(g=>g.value))):'—';

 let cleanStreak=0;for(const date of activeDates){if(all.some(g=>g.date===date&&g.value<=3))break;cleanStreak++}
 const tile=(label,value,hint,icon,color)=>'<div class="stat-tile"><div class="stat-top"><span>'+label+'</span><span class="stat-icon">'+kpiIcon(icon)+'</span></div><strong class="stat-value"'+(color?' style="color:'+color+'"':'')+'>'+value+'</strong><span class="stat-hint">'+hint+'</span></div>';
 let out='<section class="home-screen"><div class="stats-grid">'+
 tile('Средний балл',fmt(score()),'За четверть','average')+
 tile('Динамика',arrow+' '+(delta>0?'+':'')+fmt(delta),'За сегодня','trend',delta>0?'#31ad81':delta<0?'#d76a6a':null)+
 tile('Доля пятёрок',fiveShare+'%','От всех оценок','star')+
 tile('Под риском',String(riskCount),'Предмета · средний < 3,60','alert')+
 tile('Без троек и двоек',String(cleanStreak),'Дней с оценками подряд','flame')+
 tile('Средний за домашки',hwAverage,'За четверть','homework')+
 '</div><div class="home-switch">'+btns([['line','Линейный'],['ring','Кольцевой']],state.chart,'chart')+'</div><div class="home-visual">';
 if(!all.length){out+='<div class="empty">Пока нет оценок за эту четверть</div>';}else if(state.chart==='ring'){
  const circumference=2*Math.PI*72;let cum=0;
  out+='<div class="home-ring-layout"><svg class="home-ring" viewBox="0 0 200 200" aria-label="Распределение оценок"><circle cx="100" cy="100" r="72" stroke="var(--soft)" stroke-width="25" fill="none"/>'+counts.map((n,i)=>{let part='<circle cx="100" cy="100" r="72" fill="none" stroke="'+colors[i]+'" stroke-width="25" stroke-dasharray="'+(n/all.length*circumference)+' '+circumference+'" stroke-dashoffset="'+(-cum/all.length*circumference)+'" transform="rotate(-90 100 100)"/>';cum+=n;return part}).join('')+'<text x="100" y="99" text-anchor="middle" fill="var(--fg)" font-size="37" font-weight="700">'+all.length+'</text><text x="100" y="119" text-anchor="middle" fill="var(--muted)" font-size="12">оценок</text></svg><div class="home-legend">'+counts.map((n,i)=>'<div class="home-legend-item"><span class="home-dot" style="background:'+colors[i]+'"></span><span>'+['Пятёрки','Четвёрки','Тройки','Двойки'][i]+'</span><b>'+n+'</b></div>').join('')+'</div></div>';
 }else{
  let sorted=all.slice().sort((a,b)=>a.date.localeCompare(b.date)),dates=[...new Set(sorted.map(g=>g.date))],history=dates.map(d=>mean(sorted.filter(g=>g.date<=d).map(g=>g.value))),points=history.map((v,i)=>[38+(i/Math.max(1,history.length-1))*286,172-(v-2)*53]);
  out+='<svg class="home-line" viewBox="0 0 350 210" aria-label="Динамика среднего балла">'+[3,4,5].map(n=>'<line x1="38" x2="324" y1="'+(172-(n-2)*53)+'" y2="'+(172-(n-2)*53)+'" stroke="var(--line)"/><text x="29" y="'+(177-(n-2)*53)+'" font-size="11" text-anchor="end" fill="var(--muted)">'+n+'</text>').join('')+'<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="'+points.map(p=>p.join(',')).join(' ')+'"/>'+points.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.6" fill="var(--accent)"/>').join('')+'<text x="38" y="200" font-size="11" fill="var(--muted)">'+dates[0].slice(5)+'</text><text x="324" y="200" text-anchor="end" font-size="11" fill="var(--muted)">'+dates.at(-1).slice(5)+'</text></svg>';

 for(let offset=1;upcomingDays.length<5&&offset<=14;offset++){
  const date=iso(new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()+offset));

let checkingVersion=false;
async function checkForUpdate(){
 if(checkingVersion||!navigator.onLine)return;
 checkingVersion=true;
 try{
  const response=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});
  if(!response.ok)return;
  const data=await response.json();
  if(!data||typeof data.version!=='string'||!/^\d+\.\d+(?:\.\d+)?$/.test(data.version)||data.version===APP_VERSION)return;
  const target=new URL(location.href);
  const currentParam=target.searchParams.get('v');
  const targetParam=data.version.replace(/\./g,'');
  if(currentParam===targetParam)return;
  const attemptKey='school-update-attempt-'+data.version;
  if(sessionStorage.getItem(attemptKey)==='1')return;
  sessionStorage.setItem(attemptKey,'1');
  target.searchParams.set('v',targetParam);
  location.replace(target.href);
 }catch(e){/* Offline or unavailable version endpoint: keep the current app usable. */}
 finally{checkingVersion=false}
}
