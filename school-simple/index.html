function render({preserveScroll=false}={}){const previousScroll=preserveScroll?window.scrollY:null;document.body.classList.toggle('is-loading',dataSource==='loading');document.body.classList.toggle('is-profile',state.tab==='profile');document.documentElement.dataset.theme=state.theme;const dark=state.theme==='dark'||(state.theme==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.querySelector('meta[name="theme-color"]').setAttribute('content',dark?'#1c2430':'#ffffff');document.documentElement.style.setProperty('--accent',state.accent);document.querySelector('#brand-mark').innerHTML=state.tab==='home'?'<img src="./brand-mark.svg" width="30" height="30" alt="" decoding="async">':'';document.querySelector('#brand-mark').style.display=state.tab==='home'?'inline-flex':'none';document.querySelector('#header-quarter')?.remove();if(state.tab==='grades'){const q=document.createElement('select');q.id='header-quarter';q.setAttribute('aria-label','Учебная четверть');q.className='header-quarter';q.innerHTML=[1,2,3,4].map(n=>'<option value="'+n+'"'+(state.quarter===String(n)?' selected':'')+'>'+['I','II','III','IV'][n-1]+'</option>').join('');document.querySelector('#profile').before(q)}document.querySelector('#title').textContent=state.tab==='home'?kids[state.child].name:({grades:'Оценки',schedule:'Расписание',homework:'Домашка',profile:'Профиль'})[state.tab];document.querySelector('#profile').innerHTML=ico(state.tab==='profile'?'close':'profile');main.innerHTML=(dataSource==='live'||dataSource==='cached')?({home,grades,schedule,homework,profile})[state.tab]():(dataSource==='loading'?'<div class="school-loading" role="status" aria-live="polite"><img src="./brand-mark.svg" width="96" height="96" alt=""><div class="school-loading-title">Школа</div><div class="school-loading-spinner" aria-hidden="true"></div><span class="sr-only">Загружаем электронный дневник</span></div>':'<div class="empty sync-error-panel"><h3>Не удалось загрузить данные</h3><p>'+escapeHTML(syncWarning||'Проверьте подключение к интернету.')+'</p><button class="icon sync-retry-button" data-action="retry-sync">Повторить</button></div>');const nextNav=[['home','home','Главная'],['grades','grades','Оценки'],['schedule','schedule','Расписание'],['homework','homework','Домашка']].map(([id,icon,name])=>'<button data-action="tab" data-value="'+id+'" class="'+(state.tab===id?'active':'')+'"><span class="symbol">'+ico(icon,state.tab===id)+'</span>'+name+'</button>').join('');if(nav.dataset.activeTab!==state.tab){nav.innerHTML=nextNav;nav.dataset.activeTab=state.tab;}if(previousScroll!==null)window.scrollTo({top:previousScroll,left:0,behavior:'instant'})}
const APP_VERSION='1.33.0';
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).catch(()=>{});
}
let checkingVersion=false;
async function checkForUpdate(){
 if(checkingVersion||!navigator.onLine)return;
 checkingVersion=true;
 try{
  const response=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});
  if(!response.ok)return;
  const data=await response.json();
  if(!data||typeof data.version!=='string'||!/^\d+\.\d+(?:\.\d+)?$/.test(data.version)||data.version===APP_VERSION)return;
  const target=new URL(location.href);
  const currentParam=target.searchParams.get('v');
  const targetParam=data.version.replace(/\./g,'');
  if(currentParam===targetParam)return;
  const attemptKey='school-update-attempt-'+data.version;
  if(sessionStorage.getItem(attemptKey)==='1')return;
  sessionStorage.setItem(attemptKey,'1');
  target.searchParams.set('v',targetParam);
  location.replace(target.href);
 }catch(e){/* Offline or unavailable version endpoint: keep the current app usable. */}
 finally{checkingVersion=false}
}
// Reopen the app on a new calendar day so all date-based views and homework are recalculated.
function refreshOnNewDay(){
 if(iso(new Date())!==iso(TODAY)){location.reload();return true}
 return false;
}

async function loadDiarySnapshot(){
 if(!window.SchoolSync){dataSource='error';syncWarning='Модуль синхронизации недоступен';render();return;}
 if(dataSource!=='live'){dataSource='loading';syncWarning=null;render();}
 try{
  const cached=await window.SchoolSync.readCached();
  if(cached){applyDiary(cached.data,'cache');render({preserveScroll:true});}
  const result=await window.SchoolSync.sync();
  applyDiary(result.data,result.source);
  syncWarning=result.warning||null;
  render({preserveScroll:true});
 }catch(error){
  if(dataSource!=='live'&&dataSource!=='cached')dataSource='error';
  syncWarning=error.message;
  render({preserveScroll:true});
 }
}
loadDiarySnapshot();
checkForUpdate();
