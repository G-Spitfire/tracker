const EGG_KEY='school-matvey-first-positive-v1';
function matveyTrend(){
 const q=SCHOOL_QUARTERS[Number(currentQuarter())-1];
 const marks=kids[1].subjects.map(s=>s.grades.filter(g=>g.date>=q.start&&g.date<=q.end));
 const current=marks.filter(g=>g.length);
 const weekAgo=new Date(TODAY);weekAgo.setDate(weekAgo.getDate()-7);
 const cutoff=iso(weekAgo);
 const before=marks.map(g=>g.filter(x=>x.date<=cutoff)).filter(g=>g.length);
 if(!current.length||!before.length)return null;
 const previous=mean(before.map(g=>mean(g.map(x=>x.value))));
 const currentScore=mean(current.map(g=>mean(g.map(x=>x.value))));
 const delta=Math.round(((currentScore-previous)+Number.EPSILON)*100)/100;
 return {direction:delta>0?'positive':delta<0?'negative':'zero',delta};
}
function eggState(){try{return JSON.parse(localStorage.getItem(EGG_KEY)||'null')}catch{return null}}
function checkMatveyAchievement(){

 if(old?.seen)return;

 const result=matveyTrend();
 if(result===null)return;
 const trend=result.direction;
 // Initial positive reading is not a transition.
 if((old?.last==='zero'||old?.last==='negative')&&trend==='positive'){
  saveSetting(EGG_KEY,JSON.stringify({last:trend,pending:true,delta:result.delta}));

 }else if(old?.last!==trend){
  saveSetting(EGG_KEY,JSON.stringify({last:trend}));

}

function render({preserveScroll=false}={}){const previousScroll=preserveScroll?window.scrollY:null;document.body.classList.toggle('is-loading',dataSource==='loading');document.body.classList.toggle('is-profile',state.tab==='profile');document.documentElement.dataset.theme=state.theme;const dark=state.theme==='dark'||(state.theme==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.querySelector('meta[name="theme-color"]').setAttribute('content',dark?'#1c2430':'#ffffff');document.documentElement.style.setProperty('--accent',state.accent);document.querySelector('#brand-mark').innerHTML=state.tab==='home'?'<img src="./brand-mark.svg" width="30" height="30" alt="" decoding="async">':'';document.querySelector('#brand-mark').style.display=state.tab==='home'?'inline-flex':'none';document.querySelector('#header-quarter')?.remove();document.querySelector('#sync-indicator')?.remove();if(state.tab==='home'){const b=document.createElement('button');b.id='sync-indicator';b.className='icon sync-indicator';b.type='button';b.setAttribute('aria-label','Состояние синхронизации дневника');b.dataset.syncState=syncIndicatorState();b.innerHTML=ico('refresh');document.querySelector('#profile').before(b)}if(state.tab==='grades'){const q=document.createElement('select');q.id='header-quarter';q.setAttribute('aria-label','Учебная четверть');q.className='header-quarter';q.innerHTML=[1,2,3,4].map(n=>'<option value="'+n+'"'+(state.quarter===String(n)?' selected':'')+'>'+['I','II','III','IV'][n-1]+'</option>').join('');document.querySelector('#profile').before(q)}document.querySelector('#title').textContent=state.tab==='home'?kids[state.child].name:({grades:'Оценки',schedule:'Расписание',homework:'Домашка',profile:'Профиль'})[state.tab];document.querySelector('#profile').innerHTML=ico(state.tab==='profile'?'close':'profile');main.innerHTML=(dataSource==='live'||dataSource==='cached')?({home,grades,schedule,homework,profile})[state.tab]():(dataSource==='loading'?'<div class="school-loading" role="status" aria-live="polite"><img src="./brand-mark.svg" width="96" height="96" alt=""><div class="school-loading-title">Школа</div><div class="school-loading-spinner" aria-hidden="true"></div><span class="sr-only">Загружаем электронный дневник</span></div>':'<div class="empty sync-error-panel"><h3>Не удалось загрузить данные</h3><p>'+escapeHTML(syncWarning||'Проверьте подключение к интернету.')+'</p><button class="icon sync-retry-button" data-action="retry-sync">Повторить</button></div>');const nextNav=[['home','home','Главная'],['grades','grades','Оценки'],['schedule','schedule','Расписание'],['homework','homework','Домашка']].map(([id,icon,name])=>'<button data-action="tab" data-value="'+id+'" class="'+(state.tab===id?'active':'')+'"><span class="symbol">'+ico(icon,state.tab===id)+'</span>'+name+'</button>').join('');if(nav.dataset.activeTab!==state.tab){nav.innerHTML=nextNav;nav.dataset.activeTab=state.tab;}if(previousScroll!==null)window.scrollTo({top:previousScroll,left:0,behavior:'instant'})}
const APP_VERSION='1.33.4';
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).catch(()=>{});
}
let checkingVersion=false;
async function checkForUpdate(){
 if(checkingVersion||!navigator.onLine)return;
 checkingVersion=true;
 try{
  const response=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});
  if(!response.ok)return;
  const data=await response.json();
  if(!data||typeof data.version!=='string'||!/^\d+\.\d+(?:\.\d+)?$/.test(data.version)||data.version===APP_VERSION)return;
  const target=new URL(location.href);
  const currentParam=target.searchParams.get('v');
  const targetParam=data.version.replace(/\./g,'');
  if(currentParam===targetParam)return;
  const attemptKey='school-update-attempt-'+data.version;
  if(sessionStorage.getItem(attemptKey)==='1')return;
  sessionStorage.setItem(attemptKey,'1');
  target.searchParams.set('v',targetParam);
  location.replace(target.href);
 }catch(e){/* Offline or unavailable version endpoint: keep the current app usable. */}
 finally{checkingVersion=false}
}
// Reopen the app on a new calendar day so all date-based views and homework are recalculated.
function refreshOnNewDay(){
 if(iso(new Date())!==iso(TODAY)){location.reload();return true}
 return false;
}
window.addEventListener('focus',()=>{if(!refreshOnNewDay())checkForUpdate()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!refreshOnNewDay())checkForUpdate()});document.querySelector('#profile').addEventListener('click',()=>{if(state.tab==='profile')setTab(state.returnTab);else{state.returnTab=state.tab;setTab('profile')}});
document.addEventListener('change',e=>{if(e.target.matches('#quarter-select, #header-quarter')){state.quarter=e.target.value;render({preserveScroll:true})}else if(e.target.matches('#tests-toggle')){state.filter=e.target.checked?'tests':'all';render({preserveScroll:true})}});document.querySelector('#profile').parentElement.addEventListener('click',e=>{if(e.target.closest('#sync-indicator'))showSyncDialog()});document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,v=b.dataset.value;switch(a){case'retry-sync':loadDiarySnapshot();return;case'refresh-diary':if(!syncInProgress){loadDiarySnapshot(true)}return;case'tab':setTab(v);return;case'grade':{let g=JSON.parse(decodeURIComponent(v));openModal(g.subject,'<div class="modal-row"><span class="modal-label">Оценка</span><strong>'+g.value+'</strong></div><div class="modal-row"><span class="modal-label">Дата</span><span>'+new Date(g.date+'T12:00:00').toLocaleDateString('ru-RU')+'</span></div><div class="modal-row"><span class="modal-label">Тип работы</span><span>'+escapeHTML(g.type||(g.test?'Контрольная':'Обычная'))+'</span></div>','<button class="modal-button" data-action="close-detail">Закрыть</button>');return}case'close-detail':b.closest('.detail-overlay')?.remove();return;case'grades-view':state.gradesView=v;break;case'chart':state.chart=v;break;case'hw':state.hw=v;break;case'child':state.child=+v;saveSetting('school-active-child',String(state.child));if(state.child===1&&eggState()?.pending)queueMicrotask(showMatveyAchievement);break;case'theme':state.theme=v;saveSetting('school-theme',v);break;case'accent':state.accent=v;saveSetting('school-accent',v);break;case'date':state.date=v;break;case'week':state.week+=+v;{let d=new Date(state.date+'T12:00:00');d.setDate(d.getDate()+7*(+v));state.date=iso(d)}break;}render({preserveScroll:true})});render();
async function loadDiarySnapshot(fromDialog=false){
 if(syncInProgress)return;syncInProgress=true;syncError=false;if(fromDialog)showSyncDialog();else if(state.tab==='home')render({preserveScroll:true});
 if(!window.SchoolSync){dataSource='error';syncWarning='Модуль синхронизации недоступен';syncError=true;syncInProgress=false;render();if(fromDialog)showSyncDialog();return;}
 if(dataSource!=='live'){dataSource='loading';syncWarning=null;render();}
 try{
  const cached=await window.SchoolSync.readCached();
  if(cached){applyDiary(cached.data,'cache');render({preserveScroll:true});}
  const result=await window.SchoolSync.sync();
  applyDiary(result.data,result.source);
  syncWarning=result.warning||null;syncError=!!result.warning;if(result.source==='network'){lastSyncAt=Date.now();saveSetting('school-last-successful-sync',String(lastSyncAt))}
  render({preserveScroll:true});
 }catch(error){
  if(dataSource!=='live'&&dataSource!=='cached')dataSource='error';
  syncWarning=error.message;syncError=true;
  render({preserveScroll:true});
 }finally{syncInProgress=false;if(state.tab==='home')render({preserveScroll:true});if(fromDialog)showSyncDialog()}
}
loadDiarySnapshot();
checkForUpdate();
setInterval(()=>{if(state.tab==='home'&&!syncInProgress)render({preserveScroll:true})},60000);
