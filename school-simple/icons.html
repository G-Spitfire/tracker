<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Библиотека иконок — Школа</title><style>:root{color-scheme:light;--fg:#182231;--muted:#8490a0;--surface:#fff;--line:#e6e9ef}html.dark{color-scheme:dark;--fg:#edf1f7;--muted:#9099a8;--surface:#111720;--line:#354052}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--fg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:900px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}button{background:transparent;color:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}h2{margin:32px 0 12px}p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}.item{border:1px solid var(--line);border-radius:14px;min-height:115px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}.item span{font-size:12px;color:var(--muted)}.item svg{width:24px;height:24px}.item.doodle img{width:78px;height:78px;object-fit:contain}html.dark .item.doodle img{filter:brightness(0) invert(1)}.item.doodle{min-height:150px}</style></head><body><main><header><h1>Иконки «Школы»</h1><button id="theme">Сменить тему</button></header><p>Soft Minimal, 28 × 28 px для навигации. Активное состояние выделяется цветом, без заливки.</p><h2>Навигация и управление</h2><div class="grid" id="line"></div><h2>Активные состояния (цвет)</h2><div class="grid" id="filled"></div><h2>Показатели главного экрана</h2><div class="grid" id="kpi"></div><h2>Иллюстрации домашки — Полина и Матвей</h2><div class="grid" id="illustrations"></div></main><script src="./assets/icons.js"></script><script>const add=(id,names,fn,cls='')=>{document.getElementById(id).innerHTML=names.map(n=>'<div class="item '+cls+'">'+fn(n)+'<span>'+n+'</span></div>').join('')};add('line',['home','grades','schedule','homework','refresh','profile','close','left','right'],n=>ico(n));add('filled',['home','grades','schedule','homework','profile'],n=>ico(n,true));add('kpi',['average','trend','star','alert','tree','flame','homework'],n=>kpiIcon(n));add('illustrations',['pencil','dance','clay','tv','console','ball','phone','book'],n=>'<img src="./assets/empty-states/'+n+'.png" alt="'+n+'">','doodle');document.getElementById('theme').onclick=()=>document.documentElement.classList.toggle('dark');</script></body></html>
