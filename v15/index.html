<script>
window.onerror=(m,u,l)=>{if(!l)return;const b=document.createElement('div');b.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:30;background:#ff5a4d;color:#111;padding:10px;border-radius:8px;font-size:13px';b.textContent='Ошибка: '+m+' (строка '+l+'). Нажми, чтобы закрыть.';b.onclick=()=>b.remove();document.body.appendChild(b)};
const VER=15;
(function(){fetch(location.pathname+'?'+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/const VER=(\d+)/);if(m&&+m[1]!==VER){const n=Date.now();let l=0;try{l=+localStorage.getItem('mtr')||0}catch(e){}if(n-l>60000){try{localStorage.setItem('mtr',n)}catch(e){}location.replace(location.pathname+'?u='+n)}}}).catch(()=>{})})();
const NAMES=['Английский','Литература','География','История','Информатика','Биология','Физра','Алгебра','Химия','Русский','Физика','Труд','Геометрия','ОБЖ'];
const SEED=[[2,4,2,5],[5,2,3,5,3,3],[5,5,2],[4],[4,5],[5],[5,5],[3,3,3,5,3,3,3],[5,4],[3,2],[3,3],[4,5],[5,4,4],[]];
const GOAL=4+1/3,KEY='mt15preview';
let S,tab='d',dayOffset=0,profilePage='home';
const endD=()=>new Date((S.end||'2026-10-26')+'T00:00:00'),fd=()=>endD().toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const TASKS=()=>[{i:'hw',t:'Сделать уроки'},{i:'rd',t:'Прочитать главы',u:'глав'},{i:'pu',t:'Отжался',u:'раз'},{i:'pw',t:'Подтянулся',u:'раз'},{i:'ho',t:'Помощь по дому'}];
function def(){let n=0;return{g:Object.fromEntries(NAMES.map((k,i)=>[k,SEED[i].map(v=>({i:++n,v}))])),t:TASKS(),d:{},c:{},h:{},p:{dn:[]},v:4,n}}
function mig(o){if(!(o.v>=4)){o.t=TASKS();o.c=o.c||{};o.h=o.h||{};o.p=o.p||{dn:[]}}if(!(o.v>=5)&&!o.g['ОБЖ'])o.g['ОБЖ']=[];if(!o.x)o.x={};o.v=5;if(!o.hl)o.hl=Object.keys(o.h||{}).sort().map(d=>({d,f:o.h[d],e:null}));if(!Array.isArray(o.todos))o.todos=[];if(!Array.isArray(o.t))o.t=TASKS();o.t.forEach(t=>{if(!t.days)t.days=[1,2,3,4,5,6,0];if(t.active===undefined)t.active=true;if(!t.target)t.target=t.i==='rd'?3:t.i==='pu'?30:t.i==='pw'?5:1});o.v=14;return o}
try{S=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('mt14preview')||localStorage.getItem('mt1'))}catch(e){}
if(!S||!S.g)S=def();S=mig(S);syncN();
const ACT=()=>NAMES.filter(k=>S.g[k].length);
const finAvg=()=>sum(ACT().map(k=>fin(avg(k))))/(ACT().length||1);
const exAvg=()=>sum(ACT().map(k=>avg(k)))/(ACT().length||1);
const save=()=>{const f=+finAvg().toFixed(3),e=+exAvg().toFixed(3),l=S.hl[S.hl.length-1];if(!l||l.f!=f||l.e!=e){S.hl.push({d:iso(new Date()),f,e});if(S.hl.length>150)S.hl.shift()}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}};
const esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const f2=x=>x.toFixed(2),sum=a=>a.reduce((x,y)=>x+y,0);
const fin=a=>a<2.6?2:a<3.6?3:a<4.6?4:5;
const vals=k=>S.g[k].map(x=>x.v),avg=k=>sum(vals(k))/vals(k).length;
const pl=n=>{const a=n%100,b=n%10;return a>10&&a<15?'дней':b==1?'день':b>1&&b<5?'дня':'дней'};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function plan(a){const n=a.length,s=sum(a);for(let k=1;k<600;k++)if((s+5*k)/(n+k)>=3.6-1e-9)return{k,x:(s+5*k)/(n+k),t:`получить ${k}× «5» подряд`};return{k:9999,x:3.6,t:'получить очень много «5» подряд'}}
function calc(){const bad=[],good=[];
 ACT().forEach(k=>{const a=vals(k),av=avg(k);
  if(av<3.6)bad.push({k,av,p:plan(a),f:fin(av)});
  else{const x=(sum(a)+3)/(a.length+1);good.push({k,av,x:x<3.6?x:null})}});
 bad.sort((a,b)=>(a.f-b.f)||(a.p.k-b.p.k)||(a.av-b.av));return{bad,good}}
function scen(k){const a=vals(k),s=sum(a),n=a.length,c=avg(k);return[5,4,3].map(v=>{const x=(s+v)/(n+1);return`<span>${v} → <b class="${x>=3.6?'ok':x>=c?'warn':'bad'}">${f2(x)}</b></span>`}).join('')}
function streak(){let c=0,d=new Date();if(!(S.d[iso(d)]||[]).includes('hw'))d.setDate(d.getDate()-1);
 while((S.d[iso(d)]||[]).includes('hw')){c++;d.setDate(d.getDate()-1)}return c}
function chart(){const L=S.hl.slice(-40),n=L.length;if(!n)return'';
 const vs=L.map(p=>p.f).concat(L.filter(p=>p.e!=null).map(p=>p.e),GOAL),lo=Math.floor((Math.min(...vs)-.1)*10)/10,hi=Math.ceil((Math.max(...vs)+.1)*10)/10,W=320,H=130,P=28;
 const x=i=>n>1?P+i*(W-P-8)/(n-1):W/2,y=v=>H-18-(v-lo)/(hi-lo)*(H-30),lb=p=>p.d.slice(8)+'.'+p.d.slice(5,7);

 document.getElementById('m').innerHTML='<div class="hd"><button class="avb" onclick="openProfile()" aria-label="Профиль">'+(S.av?`<img src="${S.av}" alt="">`:'Mt')+'</button><div><h1 style="font-size:25px">Матвей · личный прогресс</h1><div class="mu sm">'+({d:'Дела и привычки',g:'Учёба и оценки',r:'Учебные цели',p:'Профиль'}[tab])+'</div></div></div>'+{r:road,g:grades,d:today,p:profile}[tab]();}
document.querySelector('.bar').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;if(t==='p')profilePage='home';render();document.getElementById('sc').scrollTop=0}};

const cs=()=>sheet('');
let hc={s:[]};
function oH(){const e=((S.x[iso(new Date())]||{}).hw||{s:[]});hc={s:e.s.slice()};rH()}
function rH(){const ok=(S.d[iso(new Date())]||[]).includes('hw');sheet(`<h2 style="margin-top:0">Какие уроки делал?</h2><div class="chips" style="margin-top:0">${NAMES.map((k,j)=>`<button class="sj ${hc.s.includes(k)?'on':''}" onclick="tH(${j})">${k}</button>`).join('')}</div><div class="mu sm" style="margin:10px 0">Можно выбрать несколько.</div><div class="row" style="gap:10px"><button class="btn" onclick="sH()">Готово</button>${ok?'<button class="btn g" onclick="rmH()">Убрать отметку</button>':''}</div>`)}
function tH(j){const k=NAMES[j],x=hc.s.indexOf(k);x<0?hc.s.push(k):hc.s.splice(x,1);rH()}
function sH(){const d=iso(new Date());(S.x[d]||(S.x[d]={})).hw={s:hc.s};cs();chk(()=>{const a=S.d[d]||(S.d[d]=[]);if(!a.includes('hw'))a.push('hw')})}
function rmH(){const d=iso(new Date());cs();chk(()=>{const a=S.d[d]||[],x=a.indexOf('hw');if(x>=0)a.splice(x,1);if(S.x[d])delete S.x[d].hw})}
function syncN(){NAMES.length=0;NAMES.push(...Object.keys(S.g))}
const cn=v=>v.replace(/['"`\\<>&]/g,'').replace(/\s+/g,' ').trim().slice(0,30);
function oSub(){sheet(`<h2 style="margin-top:0">Предметы и четверть</h2>${NAMES.map((k,j)=>`<div class="row" style="padding:6px 0;align-items:center"><span>${k}<span class="mu sm"> · оценок: ${S.g[k].length}</span></span><button onclick="rmSub(${j})" style="background:none;border:0;color:var(--bad);font-size:16px;padding:8px">Убрать</button></div>`).join('')}<input id="ns" maxlength="30" placeholder="Новый предмет" style="margin-top:12px"><button class="btn" style="margin-top:10px;width:100%" onclick="addSub()">Добавить предмет</button><div class="mu sm" style="margin-top:18px">Конец четверти</div><input type="date" id="qe" value="${S.end||'2026-10-26'}" onchange="S.end=this.value||S.end;save();render()" style="margin-top:6px"><button class="btn g" style="margin-top:18px;width:100%" onclick="cs()">Готово</button>`)}

function rmSub(j){const k=NAMES[j],n=S.g[k].length;if(NAMES.length<2){toast('Нужен хотя бы один предмет');return}if(n&&!confirm('Убрать «'+k+'» вместе с оценками ('+n+')?'))return;delete S.g[k];syncN();save();render();oSub()}
function toast(m){const e=document.getElementById('tt');e.textContent=m;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',3000)}
function chk(f){const d=iso(new Date()),b=ach(d);f();const a=ach(d),m=[];if(!b.all&&a.all)m.push('Все дела за день закрыты!');if(!b.ex&&a.ex)m.push('Сверхрезультат: 50+ раз за день!');if(!b.rd&&a.rd)m.push('3+ главы за день!');save();render();if(m.length)toast('★ '+m.join(' '))}
function tg(i){if(i=='hw')return oH();chk(()=>{const d=iso(new Date()),a=S.d[d]||(S.d[d]=[]),x=a.indexOf(i);x<0?a.push(i):a.splice(x,1)})}
function oN(k){sheet(`<h2 style="margin-top:0">${k}</h2><div class="mu sm">Новая оценка</div><div class="chips">${[2,3,4,5].map(v=>`<button class="chip c${v}" onclick="aN('${k}',${v})">${v}</button>`).join('')}</div>`)}
function aN(k,v){S.g[k].push({i:++S.n,v});save();cs();render()}
function oG(k,i){const x=S.g[k].find(y=>y.i==i);sheet(`<h2 style="margin-top:0">${k}: ${x.v}</h2><div class="mu sm">Пересдал? Выбери новую оценку, старая заменится.</div><div class="chips">${[2,3,4,5].map(v=>`<button class="chip c${v}" onclick="rG('${k}',${i},${v})">${v}</button>`).join('')}</div><p><button class="btn g" onclick="dG('${k}',${i})">Удалить оценку</button></p>`)}
function oAv(){sheet(`<h2 style="margin-top:0">Аватар</h2><div class="mu sm">Выбери своё фото или картинку из галереи.</div><p><button class="btn" onclick="document.getElementById('af').click()">Выбрать фото</button></p><p><button class="btn g" onclick="S.av=null;save();cs();render()">Вернуть значок</button></p>`)}
function setAv(i){const f=i.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const c=document.createElement('canvas'),m=Math.min(im.width,im.height);c.width=c.height=160;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);S.av=c.toDataURL('image/jpeg',.8);URL.revokeObjectURL(u);save();cs();render()};im.onerror=()=>alert('Не получилось открыть фото');im.src=u;i.value=''}
function rG(k,i,v){S.g[k].find(y=>y.i==i).v=v;save();cs();render()}
function dG(k,i){if(!confirm('Удалить оценку?'))return;S.g[k]=S.g[k].filter(y=>y.i!=i);save();cs();render()}
function exp(){const e=document.getElementById('bk');e.value=JSON.stringify(S);e.select();try{navigator.clipboard.writeText(e.value)}catch(x){}}
function imp(){try{const o=JSON.parse(document.getElementById('bk').value);if(!o.g||!o.t||!Object.keys(o.g).length||!Object.values(o.g).every(Array.isArray))throw 0;if(!confirm('Заменить все текущие данные содержимым копии?'))return;S=mig(o);syncN();save();render();alert('Данные восстановлены')}catch(e){alert('Не получилось: вставь в поле текст копии целиком')}}
save();render();
