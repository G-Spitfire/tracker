function updateList(){const q=wordQuery.toLowerCase().trim();const list=words.map((w,i)=>({w,i,p:record(i)})).filter(({w,p})=>inTopic(w)&&(!q||w.en.toLowerCase().includes(q)||w.ru.toLowerCase().includes(q))&&(wordIssue==='all'||wordIssue==='writing'&&W.needs(p)||wordIssue==='oral'&&oralNeeds(p))&&(wordFilter==='all'||wordFilter==='trained'&&p.trained||wordFilter==='learning'&&p.started&&!p.trained||wordFilter==='fresh'&&!p.started&&!p.trained));const total=words.filter(w=>inTopic(w)).length;$('word-count').textContent=`Показано: ${list.length} из ${total}${wordTopic==='all'?' слов':' слов темы'}`;$('writing-practice').innerHTML=wordIssue==='writing'&&list.length?btn('Повторить написание · '+Math.min(15,list.length),`startWritingPractice([${list.map(x=>x.i).join(',')}])`,'secondary wide'):'';$('word-list').innerHTML=list.length?list.map(({w,i,p})=>`<button class="word-row" onclick="openWord(${i})"><span class="row-heading"><span><strong>${w.en}</strong><span class="row-translation">${w.ru}</span></span><span class="status ${p.trained?'studied':''}">${R.label(p)}</span></span><span class="metrics"><span><b>${p.attempts||'—'}</b>Ответы</span><span><b>${p.attempts?p.errors:'—'}</b>Ошибки</span><span class="writing-metric"><b>${writingLabel(p)}</b>Написание</span></span></button>`).join(''):'<p class="empty">По этим фильтрам слов нет.</p>'}

function openWord(i){screen='word';const w=words[i],p=record(i);shell(`<section class="app-screen"><div class="topline">${btn('← Мои слова','myWords()','quiet')}<span class="pill">${R.label(p)}</span></div><div class="word-heading"><div><h1>${w.en}</h1><p class="translation">${w.ru} <small class="phonetic">${w.ipa}</small></p></div></div>${pronounceButton(i)}<div class="scene-box">${illustration(w.en)}<p>${w.scene}</p><span class="cue">Созвучие: ${w.cue}</span></div><div class="word-themes">${T.forWord(w.en).map(id=>`<button onclick="openTopic('${id}')">${T.topics.find(t=>t.id===id).name}</button>`).join('')}</div>${W.needs(p)?btn('Повторить написание',`startWritingPractice([${i}])`,'secondary wide'):''}<h2>Статистика слова</h2><div class="stats-detail"><p>Статус <b>${R.label(p)}</b></p><p>Ответы · устные <b>${p.attempts}</b></p><p>Ошибки · устные <b>${p.errors}</b></p><p>Написание <b>${writingLabel(p)}</b></p></div><p class="note">После ошибки написание проверяется ещё два раза. Если оба дополнительных ответа правильные, отметка «Нужно повторить» снимается. Письменные проверки не меняют устные ошибки и интервалы. Введённый текст не сохраняется.</p>${p.legacy?'<p class="note">Слово учили в старой версии; устные счётчики показывают только известные результаты.</p>':''}<p class="note">Просмотр карточки не засчитывается как обучение.</p></section>`)}
function help(){screen='help';shell(`<section class="app-screen"><div class="topline">${btn('← Главная','home()','quiet')}</div><h1 class="page-title">Как заниматься</h1><div class="prose"><h2>1. Представь</h2><p>Рассмотри картинку и прочитай историю. Нажми «Произнести», чтобы услышать английское слово, и повтори его три раза. Затем спрячь картинку и представь историю ещё раз.</p><h2>2. Вспомни</h2><p>Сначала увидишь русский перевод, потом — английское слово. Отвечай вслух до того, как откроешь ответ. В каждом направлении будет минимум три прохода.</p><h2>3. Сравни</h2><p>Нажми «Показать ответ». Если вспомнил без подсказки — «Верно». Если не вспомнил или ошибся — «Не получилось». Ошибаться можно: приложение напомнит историю.</p><h2>4. Напиши</h2><p>В конце новой подборки напиши каждое слово. Если не помнишь, так и нажми — покажем правильное написание. Ошибочные слова проверим ещё два раза, после первого прохода. Если других слов не осталось, между проходами будет пауза без ответа на экране.</p><h2>Отдохнуть можно в любой момент</h2><p>Нажми «Пауза». Место сохранится. При следующем открытии нажми «Продолжить».</p><p>В другие дни приложение сначала предложит знакомые слова. Обычное повторение — устное. Ошибки написания можно отдельно повторить в словаре.</p><p class="note">Кнопка «Произнести» включает системное английское произношение на устройстве. Приложение не слушает и не оценивает твою речь. Если голос недоступен или звучит странно, попроси взрослого помочь. «Сигналы» — это звуки ответов, а не озвучка слов.</p></div>${btn('На главную','home()','primary')}</section>`)}
function parents(){screen='parents';shell(`<section class="app-screen"><div class="topline">${btn('← Главная','home()','quiet')}</div><h1 class="page-title">Для родителей</h1><div class="prose"><h2>Знакомство с новым словом</h2><p>Ребёнок рассматривает готовую ассоциацию, представляет сцену и в этот момент произносит английское слово три раза. Затем скрывает рисунок и восстанавливает сцену самостоятельно.</p><h2>Отработка пятёрки</h2><p>Сначала вспоминаем с русского на английский, затем обратно. В каждом направлении — минимум три прохода; два последних должны быть без ошибок. Скорость ответа не влияет на число проходов. Если после пяти проходов ещё есть ошибки, можно передохнуть и продолжить с сохранённого места. Это правила тренажёра, а не заявленный норматив автора методики.</p><h2>Повторение</h2><p>За подход берём до 15 знакомых слов и спрашиваем их в обе стороны. После ошибки показываем сцену и возвращаем карточку ещё раз. Дальше можно начать следующий подход. Число подходов не ограничено.</p><p>Приложение само составляет обязательную очередь: недавние ошибки, ежедневное закрепление, затем знакомые слова с наступившей проверкой. Очередь выдаётся по 15 слов. Новые открываются только после неё. Закончить и отдохнуть можно после любой порции или на паузе.</p><h2>Закрепление в разные дни</h2><p>Первое изучение не заменяет завтрашнюю проверку. Нужны семь отдельных дней повторения и два последних дня без ошибок в обе стороны. Потом интервалы растут: 3, 7, 14, 30 дней. Ошибка у знакомого слова возвращает ежедневные проверки до двух дней без ошибок; затем снова начинаем с трёх дней. Пропуски не обнуляют результат. Дополнительное повторение в день изучения предлагается через полчаса и не блокирует новые слова.</p><p>Старые слова и статистика сохранены. Если точной истории по дням раньше не было, учёт начинается с первой новой проверки; прошлые дни не придумываются. Интервалы — правила нашего тренажёра на основе обсуждённого подхода, а не точная авторская схема.</p><h2>Словарь</h2><p>500 слов с историями и иллюстрациями. 364 слова входят в нашу рабочую базу Spotlight 2–4, 124 добавлены из «1000 английских слов», ещё 12 сохранены из первоначального набора. Это подборка для обучения через ассоциации; фразы, особые формы и слова без готовой ассоциации оставлены для следующего этапа.</p><h2>Регулярность</h2><p>День засчитывается после завершённой новой подборки или повторения пяти разных слов в обе стороны, включая возвраты после ошибок. Если изученных слов меньше пяти, достаточно повторить все. Ошибки не мешают засчитать день. Можно заниматься частями. Отметка даётся один раз за календарный день на телефоне. После пропуска текущая серия начинается заново, лучшая серия и общее число дней сохраняются. Учёт регулярности начинается с этой версии, прошлые дни не придумываются.</p><h2>Статистика</h2><p>Каждый оценённый ответ и ошибка сохраняются сразу. Повторение засчитывается отдельно каждому слову после проверки в обе стороны и возврата карточек с ошибками. Незавершённая часть подхода сохраняется. В списке слов показываем статус, число устных ответов и ошибок, и состояние написания: правильно или нужно повторить. Подходы и время из отображения убраны; прежние данные сохранены.</p><p>После открытия ответа ребёнок выбирает «Верно» или «Не получилось». Микрофон не используется. Созвучия приблизительные и не заменяют правильного произношения. После устных проходов новой подборки ребёнок пишет каждое английское слово по русскому переводу. Приложение проверяет ответ и показывает правильное написание. Можно нажать «Не помню». После первого прохода каждое ошибочное слово проверяется ещё два раза. Для снятия отметки ошибки нужны оба правильных ответа. Бесконечных проходов нет; незакреплённые слова доступны для отдельного повторения из словаря. Устные интервалы не меняются. Сохраняются отметка необходимости повторения и последний результат слова: «Правильно», «Неправильно», «Не помню», «Не проверяли». Введённый текст не сохраняется. Результаты двух дополнительных проверок хранятся в текущем занятии. В обычном устном повторении ввод текста не нужен. Отдельный повтор написания доступен из словаря.</p><p>Прогресс хранится в этом браузере. На другом устройстве он не появится автоматически. Старые отметки изученных слов переносятся; недоступную старую статистику не придумываем.</p><p>Независимый тренажёр с ассоциациями и активным вспоминанием по описанию подхода Николая Ягодкина. Готовые истории всё равно нужно представить самостоятельно.</p><p class="note">Новые векторные сцены составлены из объектов Twemoji (Twitter и участники проекта), CC BY 4.0. <a href="./ATTRIBUTION.md">Источники и лицензии</a>.</p></div></section>`)}
